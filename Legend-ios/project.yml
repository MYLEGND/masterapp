name: Legend

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Z8XL9RU485
    CURRENT_PROJECT_VERSION: "1"
    EXTRACT_APP_INTENTS_METADATA: NO
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configFiles:
  Debug: Configuration/Legend-Debug.xcconfig
  Staging: Configuration/Legend-Staging.xcconfig
  Release: Configuration/Legend-Production.xcconfig

targets:
  Legend:
    type: application
    platform: iOS

    dependencies:
      - target: LegendNotificationService
        embed: true

    sources:
      - path: Legend
        excludes:
          - Resources/Info.plist

    resources:
      - path: Legend/Resources
        excludes:
          - Info.plist

    info:
      path: Legend/Resources/Info.plist
      properties:
        CFBundleDisplayName: LEGEND®
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(LEGEND_AUTH_REDIRECT_SCHEME)"
        LegendAPIBaseURL: "$(LEGEND_API_BASE_URL)"
        LegendAuthorizationEndpoint: "$(LEGEND_AUTHORIZATION_ENDPOINT)"
        LegendTokenEndpoint: "$(LEGEND_TOKEN_ENDPOINT)"
        LegendAuthClientID: "$(LEGEND_AUTH_CLIENT_ID)"
        LegendAuthRedirectScheme: "$(LEGEND_AUTH_REDIRECT_SCHEME)"
        LegendAuthScope: "$(LEGEND_AUTH_SCOPE)"
        LegendAuthAudience: "$(LEGEND_AUTH_AUDIENCE)"
        LegendAgentOnlineAccountURL: "$(LEGEND_AGENT_ONLINE_ACCOUNT_URL)"
        LegendAPNSEnvironment: "$(APS_ENVIRONMENT)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - facetime
          - facetime-audio
          - tel
        NSCameraUsageDescription: "LEGEND® uses the camera only when you choose to capture media for a Legend update."
        NSMicrophoneUsageDescription: "LEGEND® uses the microphone only when you choose to record audio with a Legend video update."
        NSPhotoLibraryUsageDescription: "LEGEND® uses photo access only when you choose to manage media for a Legend update."
        NSCalendarsFullAccessUsageDescription: "LEGEND® reads today’s events from the calendar accounts available on this device only when you choose to connect Calendar to Activity."
        NSFaceIDUsageDescription: "LEGEND® uses Face ID only when you choose to protect access to your account on this device."
        NSRemindersFullAccessUsageDescription: "LEGEND® reads and completes reminders available on this device only when you choose to connect Reminders to Activity."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchStoryboardName: LaunchScreen

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend.registered
        PRODUCT_NAME: Legend
        PRODUCT_MODULE_NAME: Legend
        INFOPLIST_FILE: Legend/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Legend/Resources/Legend.entitlements
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Staging:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

    scheme:
      testTargets:
        - LegendTests
        - LegendUITests
      gatherCoverageData: true

  LegendTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: LegendTests

    dependencies:
      - target: Legend

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend.registered.tests
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Legend.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Legend"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LegendNotificationService:
    type: app-extension
    platform: iOS

    sources:
      - path: LegendNotificationService
        excludes:
          - Info.plist

    info:
      path: LegendNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Legend Notification Service
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend.registered.notification-service
        PRODUCT_NAME: LegendNotificationService
        PRODUCT_MODULE_NAME: LegendNotificationService
        INFOPLIST_FILE: LegendNotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  LegendUITests:
    type: bundle.ui-testing
    platform: iOS

    sources:
      - path: LegendUITests

    dependencies:
      - target: Legend

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend.registered.uitests
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Legend

schemes:
  Legend:
    build:
      targets:
        Legend: all
        LegendTests:
          - test
        LegendUITests:
          - test

    run:
      config: Debug

    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LegendTests
        - name: LegendUITests

    profile:
      config: Release

    analyze:
      config: Debug

    archive:
      config: Release

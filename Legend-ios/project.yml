name: Legend

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    EXTRACT_APP_INTENTS_METADATA: NO
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configFiles:
  Debug: Configuration/Legend-Debug.xcconfig
  Staging: Configuration/Legend-Staging.xcconfig
  Release: Configuration/Legend-Production.xcconfig

targets:
  Legend:
    type: application
    platform: iOS

    sources:
      - path: Legend
        excludes:
          - Resources/Info.plist

    resources:
      - path: Legend/Resources
        excludes:
          - Info.plist

    info:
      path: Legend/Resources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(LEGEND_AUTH_REDIRECT_SCHEME)"
        LegendAPIBaseURL: "$(LEGEND_API_BASE_URL)"
        LegendAuthorizationEndpoint: "$(LEGEND_AUTHORIZATION_ENDPOINT)"
        LegendTokenEndpoint: "$(LEGEND_TOKEN_ENDPOINT)"
        LegendAuthClientID: "$(LEGEND_AUTH_CLIENT_ID)"
        LegendAuthRedirectScheme: "$(LEGEND_AUTH_REDIRECT_SCHEME)"
        LegendAuthScope: "$(LEGEND_AUTH_SCOPE)"
        LegendAuthAudience: "$(LEGEND_AUTH_AUDIENCE)"
        UILaunchStoryboardName: LaunchScreen

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend
        PRODUCT_NAME: Legend
        PRODUCT_MODULE_NAME: Legend
        INFOPLIST_FILE: Legend/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

    scheme:
      testTargets:
        - LegendTests
        - LegendUITests
      gatherCoverageData: true

  LegendTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: LegendTests

    dependencies:
      - target: Legend

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend.tests
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Legend.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Legend"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LegendUITests:
    type: bundle.ui-testing
    platform: iOS

    sources:
      - path: LegendUITests

    dependencies:
      - target: Legend

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylegnd.legend.uitests
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Legend

schemes:
  Legend:
    build:
      targets:
        Legend: all
        LegendTests:
          - test
        LegendUITests:
          - test

    run:
      config: Debug

    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LegendTests
        - name: LegendUITests

    profile:
      config: Release

    analyze:
      config: Debug

    archive:
      config: Release

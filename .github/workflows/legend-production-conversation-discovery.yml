name: LEGEND unpublished production curriculum discovery

on:
  push:
    branches:
      - fix/legend-governed-reasoning-executor-20260827
    paths:
      - .github/workflows/legend-production-conversation-discovery.yml

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    environment:
      name: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legend-governed-reasoning-executor-20260827
      - name: Apply unpublished reasoning candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/legend-governed-reasoning-patch.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Discover live non-greeting curriculum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $connections = az webapp config connection-string list --resource-group masterapp-rg --name masterapp-portal --output json | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -eq $match -or [string]::IsNullOrWhiteSpace([string]$match.value)) { throw 'MasterAppDb unavailable' }
          $env:LEGEND_PRODUCTION_READONLY_CONNECTION = [string]$match.value
          Write-Output "::add-mask::$env:LEGEND_PRODUCTION_READONLY_CONNECTION"
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendProductionConversationDiscoveryTests.PrintStrongNonGreetingProductionConversationCapabilities' --logger 'console;verbosity=detailed'

name: Temporary LEGEND Founder OpenAI role validation

on:
  pull_request:
    branches:
      - production
    paths:
      - 'AgentPortal/Services/LegendFounderAiConversationService.cs'
      - 'AgentPortal.Tests/LegendFounderAiConversationRoutingTests.cs'
      - 'AgentPortal/wwwroot/js/legend-founder-ai.js'
      - 'AgentPortal/Views/Shared/_LegendFounderAiModal.cshtml'
      - '.github/workflows/temporary-legend-founder-openai-role-validation.yml'

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - name: Build production
        run: dotnet build AgentPortal/AgentPortal.csproj --configuration Release --no-restore
      - name: Build tests
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj --configuration Release --no-restore
      - name: Focused Founder AI role and retention regression
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~LegendFounderAiConversationRoutingTests|FullyQualifiedName~LegendFounderAiContractTests|FullyQualifiedName~LegendConnectCanonicalMachineProposalTests|FullyQualifiedName~LegendConnectSystemValidatedMachineCurriculumTests' --logger 'console;verbosity=normal'
      - name: Full AgentPortal regression
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj --configuration Release --no-build --logger 'console;verbosity=normal'
      - name: Diff check
        run: git diff --check origin/production...HEAD

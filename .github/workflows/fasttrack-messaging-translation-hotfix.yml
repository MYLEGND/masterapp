name: Fast-track messaging translation hotfix

on:
  push:
    branches:
      - hotfix/messaging-translation-failopen-20260918

concurrency:
  group: fasttrack-messaging-translation-hotfix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stopped:
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded deployment
        run: echo "Superseded because this branch did not include the latest intentional diagnostics/runtime updates. No deployment will occur."

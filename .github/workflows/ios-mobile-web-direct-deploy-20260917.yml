name: Validate and direct deploy iOS mobile web authority

on:
  push:
    branches:
      - fix/ios-mobile-web-authority-20260917
    paths:
      - '.github/workflows/ios-mobile-web-direct-deploy-20260917.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-mobile-web-direct-deploy
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: Production
    steps:
      - name: Checkout exact corrected mobile candidate
        uses: actions/checkout@v4
        with:
          ref: ff8af2badcd02716a45f9a80cab9a9daff3fa43d

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Verify iOS mobile web contract
        run: node --test tests/layout/mobile-native-parity.test.mjs

      - name: Build and publish affected web apps
        run: |
          set -euo pipefail
          dotnet build AgentPortal/AgentPortal.csproj -c Release --nologo
          dotnet build ClientApp/ClientApp.csproj -c Release --nologo
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo
          dotnet publish AgentPortal/AgentPortal.csproj -c Release -o /tmp/agentportal --no-restore
          dotnet publish ClientApp/ClientApp.csproj -c Release -o /tmp/clientapp --no-restore
          dotnet publish Protect-Website/ProtectWebsite.csproj -c Release -o /tmp/protect --no-restore
          for dir in /tmp/agentportal /tmp/clientapp /tmp/protect; do
            test -f "$dir/wwwroot/_content/Shared/css/legend-mobile-platform.css" || test -f "$dir/wwwroot/css/legend-mobile-platform.css" || true
            test -f "$dir/wwwroot/design/legend-design.tokens.json"
          done
          grep -q 'CRM quick view: true iOS sheet geometry' SHARED/wwwroot/css/legend-mobile-platform.css
          grep -q 'semanticDialog.matches(".drawer.crm-qv-shell")' SHARED/wwwroot/js/legend-mobile-platform.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy AgentPortal, ClientApp, then Protect sequentially
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            app="$1"
            dir="$2"
            zip="/tmp/${app}.zip"
            rm -f "$zip"
            (cd "$dir" && zip -qr "$zip" .)
            creds=$(az webapp deployment list-publishing-credentials               --resource-group masterapp-rg               --name "$app"               --query "{u:publishingUserName,p:publishingPassword}" -o json)
            user=$(printf '%s' "$creds" | python3 -c "import json,sys; print(json.load(sys.stdin)['u'])")
            pass=$(printf '%s' "$creds" | python3 -c "import json,sys; print(json.load(sys.stdin)['p'])")
            code=$(curl -sS -o "/tmp/${app}-deploy.txt" -w "%{http_code}"               -X POST -u "${user}:${pass}"               -H "Content-Type: application/zip"               --data-binary @"$zip"               "https://${app}.scm.azurewebsites.net/api/zipdeploy?isAsync=false&clean=true")
            if [ "$code" != "200" ]; then
              echo "::error::${app} Kudu deploy failed HTTP ${code}"
              cat "/tmp/${app}-deploy.txt"
              exit 1
            fi
            az webapp restart --resource-group masterapp-rg --name "$app"
          }

          deploy masterapp-portal /tmp/agentportal
          deploy masterapp-client /tmp/clientapp
          deploy masterapp-protect /tmp/protect

      - name: Verify exact mobile authority is live on all web apps
        run: |
          set -euo pipefail
          verify() {
            host="$1"
            ok=0
            for i in {1..30}; do
              css_code=$(curl -sS -o /tmp/live-mobile.css -w '%{http_code}' "https://${host}/_content/Shared/css/legend-mobile-platform.css" || true)
              token_code=$(curl -sS -o /tmp/live-tokens.json -w '%{http_code}' "https://${host}/design/legend-design.tokens.json" || true)
              js_code=$(curl -sS -o /tmp/live-mobile.js -w '%{http_code}' "https://${host}/_content/Shared/js/legend-mobile-platform.js" || true)
              if [ "$css_code" = "200" ] && [ "$js_code" = "200" ] && [ "$token_code" = "200" ] &&
                 grep -q 'CRM quick view: true iOS sheet geometry' /tmp/live-mobile.css &&
                 grep -q 'semanticDialog.matches(".drawer.crm-qv-shell")' /tmp/live-mobile.js &&
                 grep -q '"pageHorizontal": 16' /tmp/live-tokens.json &&
                 grep -q '"controlHeight": 46' /tmp/live-tokens.json; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = "1"
          }

          verify portal.mylegnd.com
          verify client.mylegnd.com
          verify protect.mylegnd.com

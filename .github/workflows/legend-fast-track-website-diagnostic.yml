name: LEGEND Fast Track Website Failed Deployment Diagnostic (read only)
on:
  push:
    branches:
      - Legend/fast-track-release
    paths:
      - .github/workflows/legend-fast-track-website-diagnostic.yml
permissions:
  contents: read
  id-token: write
jobs:
  website-provider-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Sign in to existing Azure production authority
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read failed deployment and exact static site without writing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,urllib.request,urllib.error,re
          def azure(args):
              try:
                  p=subprocess.run(['az',*args,'--only-show-errors','-o','json'],capture_output=True,text=True,timeout=65)
                  if p.returncode: return {'error':'azure_read_failed','stderr':p.stderr[-280:]}
                  return json.loads(p.stdout)
              except (subprocess.TimeoutExpired,ValueError): return {'error':'azure_read_timeout_or_invalid'}
          app='masterapp-website'
          rows=azure(['webapp','log','deployment','list','-g','masterapp-rg','-n',app])
          if not isinstance(rows,list):
              print('DEPLOYMENT_HISTORY='+json.dumps(rows,sort_keys=True))
          else:
              rows=sorted(rows,key=lambda x:str(x.get('received_time') or ''),reverse=True)
              for row in rows[:6]:
                  print('AZURE_DEPLOYMENT='+json.dumps({k:row.get(k) for k in ('id','status','received_time','end_time','status_text','message')},sort_keys=True))
              failed=next((x for x in rows if x.get('status')==3),None)
              if failed:
                  details=azure(['webapp','log','deployment','show','-g','masterapp-rg','-n',app,'--deployment-id',str(failed['id'])])
                  if isinstance(details,list):
                      for x in details[-30:]:
                          print('AZURE_FAILURE_DETAIL='+json.dumps({k:str(x.get(k,''))[:380] for k in ('log_time','message','type','details_url')},sort_keys=True))
                  else: print('AZURE_FAILURE_READ='+json.dumps(details,sort_keys=True)[:900])
          print('APP_STATE='+json.dumps(azure(['webapp','show','-g','masterapp-rg','-n',app,'--query','{state:state,availabilityState:availabilityState,enabled:enabled}']),sort_keys=True))
          for host,path in (('masterapp-website.azurewebsites.net','/_deployment-provenance.txt'),('masterapp-website.azurewebsites.net','/favicon.jpg'),('masterapp-website.azurewebsites.net','/'),('mylegnd.com','/favicon.jpg'),('www.mylegnd.com','/favicon.jpg'),('protect.mylegnd.com','/images/favicon/legend-favicon.jpg')):
              try:
                  request=urllib.request.Request('https://'+host+path,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=14) as response:
                      body=response.read(256)
                      print('HTTP_READBACK='+json.dumps({'host':host,'path':path,'status':response.status,'content_type':response.headers.get('Content-Type'),'revision':body.decode('utf8','replace').strip() if path.endswith('.txt') else None,'jpeg':body.startswith(bytes([255,216,255])) if path.endswith('.jpg') else None}))
              except urllib.error.HTTPError as e:
                  print('HTTP_READBACK='+json.dumps({'host':host,'path':path,'status':e.code}))
              except OSError:
                  print('HTTP_READBACK='+json.dumps({'host':host,'path':path,'status':'network_unavailable'}))
          PY

      - name: Inspect nested Kudu deployment failure without changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, urllib.request, urllib.error
          app='masterapp-website'
          host='masterapp-website.scm.azurewebsites.net'
          def az(*args):
              try:
                  p=subprocess.run(['az',*args],capture_output=True,text=True,timeout=90)
                  return p.stdout if p.returncode==0 else None
              except subprocess.TimeoutExpired:
                  return None
          raw=az('webapp','log','deployment','list','-g','masterapp-rg','-n',app,'--only-show-errors','-o','json')
          if not raw:
              print('KUDU_DIAGNOSTIC=DEPLOYMENT_LIST_UNAVAILABLE')
              raise SystemExit(0)
          try: rows=json.loads(raw)
          except ValueError:
              print('KUDU_DIAGNOSTIC=DEPLOYMENT_LIST_INVALID')
              raise SystemExit(0)
          recent=sorted(rows,key=lambda row: str(row.get('received_time') or ''),reverse=True)[:5]
          failures=[row for row in recent if row.get('status')==3]
          print('KUDU_RECENT_STATES='+json.dumps([{'id':r.get('id'),'status':r.get('status'),'received':r.get('received_time')} for r in recent]))
          if not failures:
              print('KUDU_DIAGNOSTIC=NO_RECENT_FAILED_DEPLOYMENTS')
              raise SystemExit(0)
          # Reuse the existing OIDC Azure identity; never request or print publishing passwords.
          aad_token=az('account','get-access-token','--resource','https://management.azure.com/','--query','accessToken','-o','tsv')
          if not aad_token:
              print('KUDU_DIAGNOSTIC=AAD_TOKEN_UNAVAILABLE')
              raise SystemExit(0)
          def kudu(url):
              if not url.startswith('https://'+host+'/api/deployments/'):
                  raise ValueError('outside scoped Kudu read authority')
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+aad_token.strip(),'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=22) as res: return json.loads(res.read(262144))
              except urllib.error.HTTPError as e:
                  return {'error':'HTTPError','status':e.code}
              except (OSError,ValueError) as e:
                  return {'error':type(e).__name__}
          def safe_message(message):
              text=str(message or '')
              text=re.sub(r'(?i)(password|token|authorization|client.secret|connectionstring)(\s*[:=]\s*)[^\s,;]+',r'\1\2[REDACTED]',text)
              return text[:650]
          for row in failures[:2]:
              did=str(row['id'])
              root=kudu('https://'+host+'/api/deployments/'+did+'/log')
              if not isinstance(root,list):
                  print('KUDU_FAILURE_LOG_READ='+json.dumps({'id':did,'result':root}))
                  continue
              for entry in root[-24:]:
                  msg=safe_message(entry.get('message'))
                  print('KUDU_FAILURE_ENTRY='+json.dumps({'id':did,'type':entry.get('type'),'message':msg}))
                  child=entry.get('details_url')
                  if not isinstance(child,str) or not child.startswith('https://'+host+'/api/deployments/'+did+'/log/'):
                      continue
                  nested=kudu(child)
                  if isinstance(nested,list):
                      for detail in nested[-25:]:
                          print('KUDU_FAILURE_NESTED='+json.dumps({'id':did,'type':detail.get('type'),'message':safe_message(detail.get('message'))}))
                  else:
                      print('KUDU_NESTED_READ='+json.dumps({'id':did,'result':nested}))
          PY

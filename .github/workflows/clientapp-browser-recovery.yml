name: Restore ClientApp browser availability

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - .github/workflows/clientapp-browser-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Revert Run 35 ClientApp Data Protection settings
        shell: bash
        run: |
          set -euo pipefail
          before=/tmp/client-before.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-client -o json > "$before"
          jq -e '.[] | select(.name=="DataProtection__BlobUri")' "$before" >/dev/null
          jq -e '.[] | select(.name=="DataProtection__KeyVaultKeyId")' "$before" >/dev/null
          az webapp config appsettings delete -g masterapp-rg -n masterapp-client --setting-names DataProtection__BlobUri DataProtection__KeyVaultKeyId --output none
          after=/tmp/client-after.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-client -o json > "$after"
          if jq -e '.[] | select(.name=="DataProtection__BlobUri" or .name=="DataProtection__KeyVaultKeyId")' "$after" >/dev/null; then
            echo "ClientApp Data Protection settings were not fully reverted." >&2
            exit 1
          fi
          echo "Run 35 ClientApp global Data Protection settings reverted."
      - name: Verify live browser entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client,ssl,time
          context=ssl.create_default_context()
          hosts=('client.mylegnd.com','masterapp-client.azurewebsites.net')
          deadline=time.monotonic()+300
          last={}
          while time.monotonic()<deadline:
              healthy=True
              for host in hosts:
                  conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
                  try:
                      conn.request('GET','/Account/Login',headers={'User-Agent':'LEGEND-browser-recovery/1.0','Cache-Control':'no-cache','Accept':'text/html'})
                      r=conn.getresponse(); body=r.read(65537)
                      last[host]=(r.status,len(body),r.getheader('Content-Type'))
                      if r.status!=200 or len(body)<512 or not (r.getheader('Content-Type') or '').lower().startswith('text/html'):
                          healthy=False
                  finally:
                      conn.close()
              if healthy:
                  for host,value in last.items(): print(host,*value)
                  raise SystemExit(0)
              time.sleep(10)
          for host,value in last.items(): print(host,*value)
          raise SystemExit('ClientApp browser entry did not recover')
          PY

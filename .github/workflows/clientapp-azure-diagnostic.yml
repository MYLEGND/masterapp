name: Temporary ClientApp Azure diagnosis

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - .github/workflows/clientapp-azure-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compare ClientApp Data Protection identity access
        shell: bash
        run: |
          set -euo pipefail
          client_principal="$(az webapp identity show -g masterapp-rg -n masterapp-client --query principalId -o tsv)"
          portal_principal="$(az webapp identity show -g masterapp-rg -n masterapp-portal --query principalId -o tsv)"
          echo "Client relevant roles:"
          az role assignment list --assignee "$client_principal" --all --query "[?contains(scope, 'masterappstorage1221') || contains(scope, 'masterapp-kv-1221')].{role:roleDefinitionName,scope:scope}" -o json
          echo "Portal relevant roles:"
          az role assignment list --assignee "$portal_principal" --all --query "[?contains(scope, 'masterappstorage1221') || contains(scope, 'masterapp-kv-1221')].{role:roleDefinitionName,scope:scope}" -o json
          echo "Key Vault authorization mode:"
          az keyvault show -g masterapp-rg -n masterapp-kv-1221 --query '{rbac:properties.enableRbacAuthorization}' -o json
          echo "Current ClientApp host state:"
          az webapp show -g masterapp-rg -n masterapp-client --query '{state:state,hostNames:hostNames,identity:identity.principalId}' -o json

name: Website Studio direct editing hardening validation
on:
  push:
    branches:
      - hardening/website-studio-direct-editing-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/website/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Install website test dependencies
        working-directory: tests/website
        run: npm ci
      - name: Check shared editor syntax
        run: node --check Legend-Design/legend-public-cms.js
      - name: Run shared website suite
        working-directory: tests/website
        run: npm test
      - name: Run focused Website Studio authorities
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --nologo \
            --filter 'FullyQualifiedName~WebsiteContentEditorRoundTripTests|FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteSignalBindingTests'
      - name: Build LEGEND website
        run: npm --prefix Legend-Website run build

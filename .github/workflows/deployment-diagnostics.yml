name: LEGEND deployment diagnostics
on:
  push:
    branches: [legend/approved-changes]
    paths: ['.github/workflows/deployment-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: Production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read deployment state without restarting or deploying
        shell: bash
        run: |
          set -euo pipefail
          resource="$(az webapp show -g masterapp-rg -n masterapp-portal --query id -o tsv)"
          az webapp show -g masterapp-rg -n masterapp-portal --query '{state:state,availabilityState:availabilityState,lastModifiedTimeUtc:lastModifiedTimeUtc}' -o json
          timeout 90 az webapp log deployment show -g masterapp-rg -n masterapp-portal --deployment-id 3cbe3cf0e67c45dabfbde3f1b7709268 --query '[].{time:log_time,type:type,message:message}' -o json || true
          plan="$(az webapp show -g masterapp-rg -n masterapp-portal --query appServicePlanId -o tsv)"
          if [ -n "$plan" ]; then
            timeout 45 az monitor metrics list --resource "$plan" --metric CpuPercentage MemoryPercentage --interval PT5M --aggregation Average Maximum --start-time 2026-09-23T07:15:00Z --query 'value[].{metric:name.value,series:timeseries[].data}' -o json || true
          fi
          for host in portal.mylegnd.com masterapp-portal.azurewebsites.net; do
            echo "Runtime receipt: $host"
            curl -sS --max-time 25 -w '\nHTTP %{http_code}\n' "https://$host/api/runtime-provenance" || true
          done

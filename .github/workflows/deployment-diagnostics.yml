name: LEGEND deployment diagnostics
# Lifecycle dispatches this reviewed read-only workflow after bot merges; no app publication.
on:
  push:
    branches: [legend/approved-changes]
    paths: ['.github/workflows/deployment-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Diagnose Founder Meta connection without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          az webapp config appsettings list -g masterapp-rg -n masterapp-portal --only-show-errors -o json > "$scratch/appsettings.json"
          az webapp config connection-string list -g masterapp-rg -n masterapp-portal --only-show-errors -o json > "$scratch/connections.json"
          mkdir -p "$scratch/meta-diag"
          cat > "$scratch/meta-diag/meta-diag.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/Infrastructure/Infrastructure.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$scratch/meta-diag/Program.cs" <<'CS'
          using System.Net;
          using System.Text.Json;
          using Infrastructure.Analytics;
          using Infrastructure.Data;
          using Microsoft.EntityFrameworkCore;
          using Microsoft.Extensions.Configuration;
          using Microsoft.Extensions.FileProviders;
          using Microsoft.Extensions.Hosting;
          using Shared.Analytics;

          var scratch = Environment.GetEnvironmentVariable("LEGEND_META_DIAG_SCRATCH")
              ?? throw new InvalidOperationException("Diagnostic scratch path missing.");
          var settingsJson = JsonDocument.Parse(await File.ReadAllTextAsync(Path.Combine(scratch, "appsettings.json")));
          var settings = new Dictionary<string,string?>(StringComparer.OrdinalIgnoreCase);
          foreach (var item in settingsJson.RootElement.EnumerateArray())
          {
              var name = item.GetProperty("name").GetString();
              var value = item.GetProperty("value").GetString();
              if (string.IsNullOrWhiteSpace(name)) continue;
              settings[name] = value;
              settings[name.Replace("__", ":", StringComparison.Ordinal)] = value;
          }
          var connectionsJson = JsonDocument.Parse(await File.ReadAllTextAsync(Path.Combine(scratch, "connections.json")));
          string? connectionString = null;
          foreach (var item in connectionsJson.RootElement.EnumerateArray())
              if (string.Equals(item.GetProperty("name").GetString(), "MasterAppDb", StringComparison.OrdinalIgnoreCase))
                  connectionString = item.GetProperty("value").GetString();
          connectionString ??= settings.GetValueOrDefault("ConnectionStrings:MasterAppDb")
              ?? settings.GetValueOrDefault("MasterAppDb")
              ?? settings.GetValueOrDefault("SQLCONNSTR_MasterAppDb");
          if (string.IsNullOrWhiteSpace(connectionString))
              throw new InvalidOperationException("Production MasterAppDb connection unavailable.");

          var configuration = new ConfigurationBuilder().AddInMemoryCollection(settings).Build();
          using var env = new DiagnosticEnvironment(Environment.GetEnvironmentVariable("GITHUB_WORKSPACE") ?? Directory.GetCurrentDirectory());
          using var protector = MarketingCredentialProtector.CreateShared(configuration, env);
          var options = new DbContextOptionsBuilder<MasterAppDbContext>().UseSqlServer(connectionString).Options;
          await using var db = new MasterAppDbContext(options);
          var owner = MarketingOwnerScope.Founder;
          var row = await db.MarketingConnections.AsNoTracking()
              .SingleOrDefaultAsync(x => x.OwnerKey == owner.Key && x.Provider == MarketingDestinationKeys.Meta);
          if (row is null)
          {
              Console.WriteLine(JsonSerializer.Serialize(new { stage="store", exists=false }));
              return;
          }
          Console.WriteLine(JsonSerializer.Serialize(new {
              stage="store", exists=true, provider=row.Provider, row.OwnerKey, row.OwnerType,
              row.AdAccountId, row.AdAccountName, row.MetaBusinessManagerId, row.MetaBusinessManagerName,
              row.MetaUserId, row.MetaUserName, row.ConnectedUtc, row.DisconnectedUtc,
              row.AccessTokenExpiresUtc, row.LastVerifiedUtc, row.UpdatedUtc
          }));
          if (string.IsNullOrWhiteSpace(row.AdsAccessTokenCiphertext))
          {
              Console.WriteLine(JsonSerializer.Serialize(new { stage="store", tokenPresent=false }));
              return;
          }

          string token;
          try
          {
              token = protector.Unprotect(owner, row.AdsAccessTokenCiphertext)
                  ?? throw new InvalidOperationException("Decrypted token was empty.");
              Console.WriteLine(JsonSerializer.Serialize(new { stage="decrypt", success=true }));
          }
          catch (Exception ex)
          {
              Console.WriteLine(JsonSerializer.Serialize(new { stage="decrypt", success=false, error=ex.GetType().Name }));
              return;
          }

          var appId = configuration["MetaAds:AppId"];
          var appSecret = configuration["MetaAds:AppSecret"];
          using var http = new HttpClient { Timeout = TimeSpan.FromSeconds(20) };

          async Task<JsonElement?> Get(string url, string stage)
          {
              using var response = await http.GetAsync(url);
              var body = await response.Content.ReadAsStringAsync();
              JsonElement? root = null;
              try { root = JsonDocument.Parse(body).RootElement.Clone(); } catch { }
              if (response.IsSuccessStatusCode)
              {
                  Console.WriteLine(JsonSerializer.Serialize(new { stage, http=(int)response.StatusCode, success=true, summary=SafeSummary(root) }));
              }
              else
              {
                  Console.WriteLine(JsonSerializer.Serialize(new { stage, http=(int)response.StatusCode, success=false, error=SafeError(root) }));
              }
              return root;
          }

          if (!string.IsNullOrWhiteSpace(appId) && !string.IsNullOrWhiteSpace(appSecret))
          {
              var debug = await Get(
                  $"https://graph.facebook.com/debug_token?input_token={Uri.EscapeDataString(token)}&access_token={Uri.EscapeDataString(appId + "|" + appSecret)}",
                  "debug_token");
              if (debug is JsonElement d && d.TryGetProperty("data", out var data))
              {
                  Console.WriteLine(JsonSerializer.Serialize(new {
                      stage="debug_token_detail",
                      isValid=ReadBool(data,"is_valid"),
                      appId=ReadString(data,"app_id"),
                      userId=ReadString(data,"user_id"),
                      expiresAt=ReadLong(data,"expires_at"),
                      dataAccessExpiresAt=ReadLong(data,"data_access_expires_at"),
                      scopes=ReadStringArray(data,"scopes")
                  }));
              }
          }
          else
          {
              Console.WriteLine(JsonSerializer.Serialize(new { stage="debug_token", skipped="Meta app credentials unavailable" }));
          }

          var adaccounts = await Get(
              $"https://graph.facebook.com/me/adaccounts?fields={Uri.EscapeDataString("id,name,account_status,business{id,name}")}&limit=200&access_token={Uri.EscapeDataString(token)}",
              "me_adaccounts");
          if (adaccounts is JsonElement aa && aa.TryGetProperty("data", out var adData) && adData.ValueKind == JsonValueKind.Array)
          {
              var rows = adData.EnumerateArray().Select(x => new {
                  id=ReadString(x,"id"), name=ReadString(x,"name"), accountStatus=ReadLong(x,"account_status")
              }).ToArray();
              Console.WriteLine(JsonSerializer.Serialize(new {
                  stage="me_adaccounts_detail",
                  count=rows.Length,
                  storedAccountPresent=rows.Any(x => NormalizeAccount(x.id) == NormalizeAccount(row.AdAccountId)),
                  accounts=rows
              }));
          }

          if (string.IsNullOrWhiteSpace(row.AdAccountId))
          {
              Console.WriteLine(JsonSerializer.Serialize(new { stage="stored_account", success=false, error="missing_account_id" }));
              return;
          }

          var account = NormalizeAccount(row.AdAccountId)!;
          foreach (var prefix in new[] { "", "v26.0/", "v25.0/", "v24.0/" })
          {
              var label = string.IsNullOrEmpty(prefix) ? "versionless" : prefix.TrimEnd('/');
              await Get(
                  $"https://graph.facebook.com/{prefix}act_{Uri.EscapeDataString(account)}?fields={Uri.EscapeDataString("id,name,account_status,disable_reason,timezone_name")}&access_token={Uri.EscapeDataString(token)}",
                  $"account_{label}");
              await Get(
                  $"https://graph.facebook.com/{prefix}act_{Uri.EscapeDataString(account)}/campaigns?fields={Uri.EscapeDataString("id,name,status,effective_status")}&limit=5&access_token={Uri.EscapeDataString(token)}",
                  $"campaigns_{label}");
          }

          static object? SafeSummary(JsonElement? root)
          {
              if (root is not JsonElement value) return null;
              if (value.TryGetProperty("data", out var data) && data.ValueKind == JsonValueKind.Array)
                  return new { dataCount=data.GetArrayLength() };
              return new { id=ReadString(value,"id"), name=ReadString(value,"name"), accountStatus=ReadLong(value,"account_status"), disableReason=ReadLong(value,"disable_reason") };
          }
          static object SafeError(JsonElement? root)
          {
              if (root is JsonElement value && value.TryGetProperty("error", out var error))
                  return new {
                      type=ReadString(error,"type"),
                      code=ReadLong(error,"code"),
                      subcode=ReadLong(error,"error_subcode"),
                      message=Truncate(ReadString(error,"message"),240),
                      isTransient=ReadBool(error,"is_transient")
                  };
              return new { type="unparseable_meta_error", code=(long?)null, subcode=(long?)null, message=(string?)null, isTransient=(bool?)null };
          }
          static string? NormalizeAccount(string? value) =>
              string.IsNullOrWhiteSpace(value) ? null :
              value.Trim().StartsWith("act_", StringComparison.OrdinalIgnoreCase) ? value.Trim()[4..] : value.Trim();
          static string? ReadString(JsonElement e,string name) =>
              e.ValueKind==JsonValueKind.Object && e.TryGetProperty(name,out var v) && v.ValueKind==JsonValueKind.String ? v.GetString() : null;
          static long? ReadLong(JsonElement e,string name) =>
              e.ValueKind==JsonValueKind.Object && e.TryGetProperty(name,out var v) && v.TryGetInt64(out var n) ? n : null;
          static bool? ReadBool(JsonElement e,string name) =>
              e.ValueKind==JsonValueKind.Object && e.TryGetProperty(name,out var v) && v.ValueKind is JsonValueKind.True or JsonValueKind.False ? v.GetBoolean() : null;
          static string[] ReadStringArray(JsonElement e,string name) =>
              e.ValueKind==JsonValueKind.Object && e.TryGetProperty(name,out var v) && v.ValueKind==JsonValueKind.Array
                  ? v.EnumerateArray().Where(x=>x.ValueKind==JsonValueKind.String).Select(x=>x.GetString()!).ToArray() : [];
          static string? Truncate(string? value,int max) =>
              string.IsNullOrWhiteSpace(value) ? value : value.Length <= max ? value : value[..max];

          sealed class DiagnosticEnvironment(string root) : IHostEnvironment, IDisposable
          {
              public string EnvironmentName { get; set; } = Environments.Production;
              public string ApplicationName { get; set; } = "LEGEND.MetaProductionDiagnostic";
              public string ContentRootPath { get; set; } = root;
              public IFileProvider ContentRootFileProvider { get; set; } = new PhysicalFileProvider(root);
              public void Dispose() => (ContentRootFileProvider as IDisposable)?.Dispose();
          }
          CS
          export LEGEND_META_DIAG_SCRATCH="$scratch"
          dotnet run --project "$scratch/meta-diag/meta-diag.csproj" -c Release
      - name: Read recent AgentPortal Meta campaign warning body
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          if timeout 75s az webapp log download -g masterapp-rg -n masterapp-portal --log-file "$scratch/portal-logs.zip" --only-show-errors >/dev/null 2>&1; then
            python3 - "$scratch/portal-logs.zip" <<'PYLOG'
          import io, os, re, sys, zipfile
          path=sys.argv[1]
          patterns=("Meta campaigns fetch failed","Meta insights fetch failed","Meta account metadata fetch failed")
          found=[]
          try:
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      if name.endswith('/'): continue
                      try:
                          data=z.read(name)
                      except Exception:
                          continue
                      text=data.decode('utf-8','replace')
                      for line in text.splitlines():
                          if any(p in line for p in patterns):
                              # Provider bodies should not echo credentials, but redact defensively.
                              line=re.sub(r'(?i)(access[_-]?token[=:" ]+)[^&\s",}]+', r'\1[REDACTED]', line)
                              line=re.sub(r'(?i)(client_secret[=:" ]+)[^&\s",}]+', r'\1[REDACTED]', line)
                              found.append((name,line[-3000:]))
          except zipfile.BadZipFile:
              pass
          if not found:
              print('META_RUNTIME_LOG_EVIDENCE none_found')
          else:
              for name,line in found[-20:]:
                  print(f'META_RUNTIME_LOG_EVIDENCE file={name} {line}')
          PYLOG
          else
            echo "META_RUNTIME_LOG_EVIDENCE download_unavailable"
          fi
      - name: Correlate Meta failure history and live API version setting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          version_json="$(az webapp config appsettings list -g masterapp-rg -n masterapp-portal --only-show-errors --query "[?name=='MetaAds__ApiVersion' || name=='MetaAds:ApiVersion'].{name:name,value:value}" -o json)"
          python3 - <<'PYVER' <<<"$version_json"
          import json,sys
          try:
              rows=json.load(sys.stdin)
          except Exception:
              rows=[]
          print(json.dumps({"stage":"meta_api_version_setting","rows":rows}))
          PYVER

          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          if timeout 75s az webapp log download -g masterapp-rg -n masterapp-portal --log-file "$scratch/portal-logs.zip" --only-show-errors >/dev/null 2>&1; then
            python3 - "$scratch/portal-logs.zip" <<'PYHIST'
          import json,re,sys,zipfile,xml.etree.ElementTree as ET
          path=sys.argv[1]
          patterns=("Meta campaigns fetch failed","Meta insights fetch failed","Meta account metadata fetch failed")
          rows=[]
          try:
              with zipfile.ZipFile(path) as z:
                  names=[n for n in z.namelist() if n.lower().endswith("eventlog.xml")]
                  for name in names:
                      data=z.read(name)
                      try:
                          root=ET.fromstring(data)
                      except Exception:
                          continue
                      for event in root.findall(".//{*}Event"):
                          created=event.find(".//{*}TimeCreated")
                          when=(created.attrib.get("SystemTime") if created is not None else None)
                          text=" ".join(t.strip() for t in event.itertext() if t and t.strip())
                          if not any(p in text for p in patterns):
                              continue
                          m=re.search(r'(Meta (?:campaigns|insights|account metadata) fetch failed\..*)',text)
                          msg=(m.group(1) if m else text)[-3000:]
                          msg=re.sub(r'(?i)(access[_-]?token[=:" ]+)[^&\s",}]+',r'\1[REDACTED]',msg)
                          msg=re.sub(r'(?i)(client_secret[=:" ]+)[^&\s",}]+',r'\1[REDACTED]',msg)
                          rows.append({"time":when,"message":msg})
          except Exception as exc:
              print(json.dumps({"stage":"meta_error_history","success":False,"error":type(exc).__name__}))
              raise SystemExit(0)
          rows.sort(key=lambda x:x.get("time") or "")
          print(json.dumps({"stage":"meta_error_history","count":len(rows),"rows":rows[-80:]}))
          PYHIST
          else
            echo '{"stage":"meta_error_history","success":false,"error":"download_unavailable"}'
          fi
      - name: Observe current app state and recent capacity without mutations
        shell: bash
        run: |
          python3 - <<'PYAZ'
          import datetime, json, subprocess
          def az(*args):
              try:
                  r=subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'],capture_output=True,text=True,timeout=40)
                  if r.returncode: return {'unavailable': True}
                  return json.loads(r.stdout)
              except (subprocess.TimeoutExpired, ValueError): return {'unavailable': True}
          plans=set()
          for app in ('portal','client','protect','parfait','website'):
              name='masterapp-'+app
              info=az('webapp','show','-g','masterapp-rg','-n',name,'--query','{state:state,availability:availabilityState,modified:lastModifiedTimeUtc,plan:serverFarmId}')
              print(json.dumps({'app':app,'state':info}))
              if info.get('plan'): plans.add(info['plan'])
              status=az('webapp','log','deployment','list','-g','masterapp-rg','-n',name,'--query','[:3].{id:id,status:status,active:active,received:received_time,start:start_time,end:end_time}')
              print(json.dumps({'app':app,'recentDeployments':status}))
          start=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(minutes=30)).isoformat()
          for plan in sorted(plans):
              data=az('monitor','metrics','list','--resource',plan,'--metric','CpuPercentage','MemoryPercentage','--interval','PT5M','--aggregation','Average','Maximum','--start-time',start,'--query','value[].{metric:name.value,series:timeseries[].data}')
              print(json.dumps({'plan':plan.rsplit('/',1)[-1],'last30Minutes':data}))
          PYAZ
      - name: Observe canonical Cloudflare route and DNS inventory without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PYCF'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('routing','scripts/cloudflare-routing-authority.py')
          authority=importlib.util.module_from_spec(spec);spec.loader.exec_module(authority)
          token=authority.required_env('CLOUDFLARE_API_TOKEN')
          # Match the release lane's read-only canonical zone discovery; no new secret is needed.
          zones=authority.api_request('GET',f'{authority.API}/zones?name=mylegnd.com',token)['result']
          if len(zones)!=1: raise authority.CloudflareError('Expected exactly one canonical mylegnd.com zone')
          zone=zones[0]['id'];account=zones[0]['account']['id']
          routes=authority.api_request('GET',f'{authority.API}/zones/{zone}/workers/routes',token)['result']
          print(json.dumps({'routes':[{'pattern':r.get('pattern'),'script':r.get('script')} for r in routes]}))
          for host in ('mylegnd.com','www.mylegnd.com','protect.mylegnd.com'):
              records=authority.api_request('GET',f'{authority.API}/zones/{zone}/dns_records?name={host}',token)['result']
              print(json.dumps({'host':host,'dns':[{'type':r.get('type'),'target':r.get('content'),'proxied':r.get('proxied')} for r in records]}))
          data=authority.api_request('GET',f'{authority.API}/accounts/{account}/workers/scripts/{authority.ROUTER_SCRIPT}/deployments?per_page=1',token,allow=(200,404))
          print(json.dumps({'routerDeployments':data.get('result',{}).get('deployments',[])}))
          PYCF
      - name: Observe public runtime and storefront responses
        if: always()
        shell: bash
        run: |
          python3 - <<'PYHTTP'
          import concurrent.futures, hashlib, json, urllib.request, urllib.error
          urls=[f'https://{host}/api/runtime-provenance' for host in ('portal.mylegnd.com','client.mylegnd.com','masterapp-protect.azurewebsites.net','masterapp-parfait.azurewebsites.net')]
          urls+=['https://masterapp-website.azurewebsites.net/_deployment-provenance.txt','https://mylegnd.com/store','https://protect.mylegnd.com/store','https://masterapp-parfait.azurewebsites.net/store']
          def observe(url):
              try:
                  try: response=urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20)
                  except urllib.error.HTTPError as error: response=error
                  with response:
                      body=response.read(262144)
                      data={'url':url,'status':response.status,'finalUrl':response.url,'server':response.headers.get('Server'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
                      if 'provenance' in url: data['provenance']=body.decode('utf-8','replace')[:1500]
                      return data
              except Exception as error: return {'url':url,'unavailable':type(error).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(observe,urls): print(json.dumps(result))
          PYHTTP

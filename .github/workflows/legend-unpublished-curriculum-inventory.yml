name: LEGEND unpublished curriculum inventory

on:
  push:
    branches:
      - fix/legend-governed-reasoning-executor-20260827
    paths:
      - .github/workflows/legend-unpublished-curriculum-inventory.yml

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: Production
    steps:
      - name: Checkout unpublished candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/legend-governed-reasoning-executor-20260827
          fetch-depth: 0

      - name: Materialize exact unpublished reasoning candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/legend-governed-reasoning-patch.py
          rm -f scripts/legend-governed-reasoning-patch.py
          rm -f .github/workflows/legend-governed-reasoning-predeploy.yml
          rm -f .github/workflows/legend-governed-reasoning-predeploy-v2.yml
          rm -f .github/workflows/legend-governed-reasoning-predeploy-v3.yml
          rm -f .github/workflows/legend-unpublished-curriculum-inventory.yml
          git diff --check

      - name: Inject read-only capability inventory diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AgentPortal.Tests/LegendFounderCurriculumSqlServerE2ETests.cs')
          text = path.read_text()
          anchor = '    [Fact]\n    public async Task ProductionReadOnlyEightPromptNativeDiagnostic()'
          if text.count(anchor) != 1:
              raise SystemExit('inventory insertion anchor drifted')
          method = r'''    [Fact]
              public async Task ProductionReadOnlyMatureConversationCapabilityInventory()
              {
                  var connectionString = Environment.GetEnvironmentVariable("LEGEND_PRODUCTION_READONLY_CONNECTION");
                  if (string.IsNullOrWhiteSpace(connectionString))
                  {
                      _output.WriteLine("Production inventory not selected.");
                      return;
                  }

                  var connection = new SqlConnectionStringBuilder(connectionString)
                  {
                      ApplicationName = "LEGEND unpublished conversation capability inventory",
                      ApplicationIntent = ApplicationIntent.ReadOnly
                  };
                  var readOnlyGuard = new ReadOnlyLegendDbCommandInterceptor();
                  await using var db = new MasterAppDbContext(
                      new DbContextOptionsBuilder<MasterAppDbContext>()
                          .UseSqlServer(connection.ConnectionString)
                          .UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking)
                          .AddInterceptors(readOnlyGuard)
                          .Options);

                  var rows = await (
                      from evidence in db.LegendSemanticTransitionEvidence.AsNoTracking()
                      join sourceExample in db.LegendCurriculumExamples.AsNoTracking()
                          on evidence.SourceCurriculumExampleId equals sourceExample.Id
                      join sourceUnit in db.LegendLanguageTextUnits.AsNoTracking()
                          on sourceExample.TextUnitId equals sourceUnit.Id
                      join sourceFamily in db.LegendCurriculumFamilies.AsNoTracking()
                          on sourceExample.CurriculumFamilyId equals sourceFamily.Id
                      join resultExample in db.LegendCurriculumExamples.AsNoTracking()
                          on evidence.ResultCurriculumExampleId equals resultExample.Id
                      join resultUnit in db.LegendLanguageTextUnits.AsNoTracking()
                          on resultExample.TextUnitId equals resultUnit.Id
                      join resultFamily in db.LegendCurriculumFamilies.AsNoTracking()
                          on resultExample.CurriculumFamilyId equals resultFamily.Id
                      where evidence.SourceLanguageCode == "en" &&
                          evidence.ResultLanguageCode == "en" &&
                          evidence.SupersededUtc == null &&
                          evidence.Provenance == LegendConnectKnowledgeProvenance.FounderApproved &&
                          evidence.ContributionState == "Supported" &&
                          evidence.IsHumanVerifiedSupport &&
                          sourceExample.SupersededUtc == null && resultExample.SupersededUtc == null &&
                          sourceUnit.IsTrainingEligible && resultUnit.IsTrainingEligible
                      select new
                      {
                          evidence.TransitionSignature,
                          evidence.SourceSemanticFrame,
                          evidence.ResultSemanticFrame,
                          evidence.IndependentSourceIdentity,
                          SourceFamily = sourceFamily.FamilyKey,
                          ResultFamily = resultFamily.FamilyKey,
                          SourceText = sourceUnit.Text,
                          ResultText = resultUnit.Text
                      }).ToListAsync();

                  var grouped = rows
                      .GroupBy(item => new
                      {
                          item.TransitionSignature,
                          item.SourceSemanticFrame,
                          item.ResultSemanticFrame
                      })
                      .Select(group => new
                      {
                          group.Key.TransitionSignature,
                          group.Key.SourceSemanticFrame,
                          group.Key.ResultSemanticFrame,
                          IndependentSupport = group.Select(item => item.IndependentSourceIdentity).Distinct().Count(),
                          SourceFamilies = group.Select(item => item.SourceFamily).Distinct().OrderBy(item => item).Take(6).ToArray(),
                          SourceTexts = group.Select(item => item.SourceText).Distinct().OrderBy(item => item).Take(8).ToArray(),
                          ResultTexts = group.Select(item => item.ResultText).Distinct().OrderBy(item => item).Take(8).ToArray()
                      })
                      .Where(item => item.IndependentSupport >= 3)
                      .OrderBy(item => item.SourceSemanticFrame)
                      .ThenBy(item => item.ResultSemanticFrame)
                      .ToArray();

                  _output.WriteLine("============================================================");
                  _output.WriteLine("LEGEND® MATURE PRODUCTION CONVERSATION CAPABILITY INVENTORY");
                  _output.WriteLine("============================================================");
                  _output.WriteLine($"MATURE UNIQUE TRANSITIONS: {grouped.Length}");
                  foreach (var item in grouped)
                  {
                      _output.WriteLine("");
                      _output.WriteLine($"TRANSITION SIGNATURE: {item.TransitionSignature}");
                      _output.WriteLine($"SOURCE FRAME: {item.SourceSemanticFrame}");
                      _output.WriteLine($"RESULT FRAME: {item.ResultSemanticFrame}");
                      _output.WriteLine($"INDEPENDENT SUPPORT: {item.IndependentSupport}");
                      _output.WriteLine("SOURCE FAMILIES: " + string.Join(" | ", item.SourceFamilies));
                      _output.WriteLine("SOURCE TEXTS: " + string.Join(" || ", item.SourceTexts));
                      _output.WriteLine("RESULT TEXTS: " + string.Join(" || ", item.ResultTexts));
                  }
                  _output.WriteLine("");
                  _output.WriteLine($"PRODUCTION WRITE COMMANDS: {readOnlyGuard.WriteCommandCount}");
                  Assert.Equal(0, readOnlyGuard.WriteCommandCount);
                  Assert.NotEmpty(grouped);
              }

          '''
          path.write_text(text.replace(anchor, method + anchor, 1))
          PY

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build unpublished candidate
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MASTERAPP.sln
          dotnet build MASTERAPP.sln -c Release --no-restore

      - name: Login to Azure for read-only inventory
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run real production curriculum inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $connection = ''
          $connections = az webapp config connection-string list --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output json | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match) { $connection = [string]$match.value }
          $settings = @{}
          foreach ($item in (az webapp config appsettings list --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output json | ConvertFrom-Json)) {
            $settings[[string]$item.name] = [string]$item.value
          }
          if ([string]::IsNullOrWhiteSpace($connection)) {
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $connection = $settings[$name]; break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection string could not be resolved.' }
          Write-Output "::add-mask::$connection"
          $env:LEGEND_PRODUCTION_READONLY_CONNECTION = $connection
          $env:OPENAI_API_KEY = ''
          $env:OpenAI__ApiKey = ''
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~ProductionReadOnlyMatureConversationCapabilityInventory' --logger 'console;verbosity=detailed'
          if ($LASTEXITCODE -ne 0) { throw 'Production curriculum inventory failed.' }

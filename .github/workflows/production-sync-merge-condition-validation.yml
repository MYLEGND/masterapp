name: Production sync merge condition validation
on:
  push:
    branches:
      - repair/production-sync-merge-condition-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate release lifecycle sync condition
        run: |
          python3 scripts/test-release-policy.py
          python3 scripts/test-release-lifecycle.py

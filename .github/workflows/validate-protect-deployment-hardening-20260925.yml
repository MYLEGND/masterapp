name: Validate Protect deployment hardening

on:
  push:
    branches:
      - hardening/protect-domain-deploy-single-authority-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore focused test project
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - name: Build focused test project
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo
      - name: Run deployment workflow contracts
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo --filter FullyQualifiedName~ClientAppDeploymentWorkflowTests
      - name: Verify obsolete recovery workflows are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/protect-package-recovery-20260926.yml
          test ! -e .github/workflows/commerce-router-recovery-20260925.yml
          test ! -e .github/workflows/resume-centralized-commerce-release-173.yml
          grep -F 'Direct deploy Protect immutable ZIP' .github/workflows/all-intentional-direct-release-20260918.yml
          ! grep -A12 -F 'Direct deploy Protect immutable ZIP' .github/workflows/all-intentional-direct-release-20260918.yml | grep -F 'azure/webapps-deploy@v3'

name: Validate and directly deploy public website editor

on:
  push:
    branches:
      - feature/public-website-editor-20260918
    paths:
      - '.github/workflows/public-website-editor-direct-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: public-website-editor-direct-20260918
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: feature/public-website-editor-20260918
          fetch-depth: 0

      - name: Enforce scoped change boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production
          git diff --name-only origin/production...HEAD | tee /tmp/editor-diff.txt
          unexpected="$(grep -Ev '^(AgentPortal/(Controllers/WebsiteAnalyticsController\.cs|Program\.cs|Views/WebsiteAnalytics/Index\.cshtml|wwwroot/js/website-analytics\.js)|AgentPortal\.Tests/WebsiteAnalytics.*Tests\.cs|Infrastructure/WebsiteEditing/.*|Legend-Design/legend-public-(web|cms)\.(css|js)|Legend-Website/.*|Protect-Website/(Controllers/WebsiteContentController\.cs|Core/Branding/Brand\.cs|Program\.cs|ProtectWebsite\.csproj|Views/(Home|Contact|Shared)/.*|wwwroot/css/site\.css)|\.github/workflows/public-website-editor-direct-20260918\.yml)$' /tmp/editor-diff.txt || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            echo "::error::Unexpected file entered website-editor candidate."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build LEGEND website
        working-directory: Legend-Website
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp public/web.config dist/web.config
          npm run check
          test -f dist/site.css
          test -f dist/legend-public-web.js
          test -f dist/legend-public-cms.js
          grep -q 'instagram.com/legend.vault' dist/index.html
          grep -q 'apps.apple.com/us/app/legend/id6798419225' dist/index.html
          grep -q 'Legend® ios App' dist/index.html
          ! grep -q 'brand-banner' dist/index.html
          ! grep -q 'Live Legendary' dist/index.html
          grep -q 'LEGEND® public web presentation authority' dist/site.css
          grep -q -- '--navy:#102b62' dist/site.css

      - name: Build Protect website
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo
          dotnet publish Protect-Website/ProtectWebsite.csproj -c Release -o /tmp/protect-publish --no-restore
          test -f /tmp/protect-publish/wwwroot/design/legend-public-web.css
          test -f /tmp/protect-publish/wwwroot/design/legend-public-cms.js
          grep -q 'instagram.com/legend.vault' Protect-Website/Views/Shared/_Layout.cshtml
          grep -q 'apps.apple.com/us/app/legend/id6798419225' Protect-Website/Views/Shared/_Layout.cshtml
          grep -q 'Legend® ios App' Protect-Website/Views/Shared/_Layout.cshtml
          ! grep -q 'brand-banner' Protect-Website/Views/Shared/_Layout.cshtml
          ! grep -q '<strong>LEGEND®</strong>' Protect-Website/Views/Shared/_Layout.cshtml
          grep -q 'WebsiteContentController' Protect-Website/Controllers/WebsiteContentController.cs

      - name: Build AgentPortal
        shell: bash
        run: |
          set -euo pipefail
          dotnet build AgentPortal/AgentPortal.csproj -c Release --nologo
          dotnet publish AgentPortal/AgentPortal.csproj -c Release -o /tmp/agentportal-publish --no-restore
          grep -q 'Edit Protect Website' AgentPortal/Views/WebsiteAnalytics/Index.cshtml
          grep -q 'Edit LEGEND Website' AgentPortal/Views/WebsiteAnalytics/Index.cshtml
          grep -q 'Edit Website' AgentPortal/Views/WebsiteAnalytics/Index.cshtml

      - name: Run focused website analytics scope tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --filter 'FullyQualifiedName~WebsiteAnalyticsScopeTests|FullyQualifiedName~WebsiteAnalyticsDeleteLeadTests|FullyQualifiedName~WebsiteAnalyticsInitialQualityModeTests' --logger 'console;verbosity=minimal'

      - name: Smoke LEGEND artifact locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8087 --directory Legend-Website/dist >/tmp/legend-local.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for route in / /about/ /contact/ /logo/ /privacy-terms/; do
            curl --retry 8 --retry-delay 1 --retry-all-errors -fsSL "http://127.0.0.1:8087$route" >/tmp/page.html
            grep -q 'LEGEND®' /tmp/page.html
          done
          curl -fsSL http://127.0.0.1:8087/legend-public-cms.js -o /tmp/cms.js
          grep -q 'Website Editor' /tmp/cms.js
          kill $pid
          trap - EXIT

      - name: Package exact deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/protect-publish && zip -qr /tmp/protect-editor.zip .)
          (cd Legend-Website/dist && zip -qr /tmp/legend-editor.zip .)
          (cd /tmp/agentportal-publish && zip -qr /tmp/agentportal-editor.zip .)

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Submit Protect deployment
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy             --resource-group masterapp-rg             --name masterapp-protect             --src-path /tmp/protect-editor.zip             --type zip             --clean true             --restart true             --async true             --output none

      - name: Verify live Protect editor authority
        shell: bash
        run: |
          set -euo pipefail
          verify_host() {
            base="$1"
            label="$2"
            verified=0
            for i in {1..48}; do
              home="/tmp/protect-${label}-home.html"
              code="$(curl --connect-timeout 5 --max-time 12 -sS -L -o "$home" -w '%{http_code}' "$base/?ui=${GITHUB_SHA}" || true)"
              cms_code="$(curl --connect-timeout 5 --max-time 12 -sS -o "/tmp/protect-${label}-cms.js" -w '%{http_code}' "$base/design/legend-public-cms.js?ui=${GITHUB_SHA}" || true)"
              api_code="$(curl --connect-timeout 5 --max-time 12 -sS -o "/tmp/protect-${label}-content.json" -w '%{http_code}' "$base/api/website-content/public/protect?ui=${GITHUB_SHA}" || true)"
              echo "$label attempt=$i home=$code cms=$cms_code api=$api_code"
              if [ "$code" = "200" ] && [ "$cms_code" = "200" ] && [ "$api_code" = "200" ] &&
                 grep -q '<strong>LEGEND</strong>' "$home" &&
                 ! grep -q 'brand-banner' "$home" &&
                 grep -q 'instagram.com/legend.vault' "$home" &&
                 grep -q 'Legend® ios App' "$home" &&
                 grep -q 'Website Editor' "/tmp/protect-${label}-cms.js"; then
                verified=1
                break
              fi
              sleep 5
            done
            test "$verified" = "1"
          }

          verify_host "https://masterapp-protect.azurewebsites.net" "azure"
          verify_host "https://protect.mylegnd.com" "custom"

      - name: Submit LEGEND public website deployment
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy             --resource-group masterapp-rg             --name masterapp-website             --src-path /tmp/legend-editor.zip             --type zip             --clean true             --restart true             --async true             --output none

      - name: Verify live LEGEND public website
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for i in {1..72}; do
            curl --connect-timeout 5 --max-time 12 -sS -L "https://www.mylegnd.com/?ui=${GITHUB_SHA}" -o /tmp/live-legend.html || true
            curl --connect-timeout 5 --max-time 12 -sS "https://www.mylegnd.com/site.css?ui=${GITHUB_SHA}" -o /tmp/live-legend.css || true
            cms_code="$(curl --connect-timeout 5 --max-time 12 -sS -o /tmp/live-legend-cms.js -w '%{http_code}' "https://www.mylegnd.com/legend-public-cms.js?ui=${GITHUB_SHA}" || true)"
            if [ "$cms_code" = "200" ] &&
               grep -q '<strong>LEGEND®</strong>' /tmp/live-legend.html &&
               ! grep -q 'brand-banner' /tmp/live-legend.html &&
               ! grep -q 'Live Legendary' /tmp/live-legend.html &&
               grep -q 'instagram.com/legend.vault' /tmp/live-legend.html &&
               grep -q 'Legend® ios App' /tmp/live-legend.html &&
               grep -q -- '--navy:#102b62' /tmp/live-legend.css; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = "1"

      - name: Submit AgentPortal deployment
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy             --resource-group masterapp-rg             --name masterapp-portal             --src-path /tmp/agentportal-editor.zip             --type zip             --clean true             --restart true             --async true             --output none

      - name: Verify live AgentPortal editor entrypoint
        shell: bash
        run: |
          set -euo pipefail
          js_code="$(curl --connect-timeout 5 --max-time 12 -sS -o /tmp/live-analytics.js -w '%{http_code}' 'https://portal.mylegnd.com/js/website-analytics.js' || true)"
          test "$js_code" = "200"
          grep -q 'edit-protect-website' /tmp/live-analytics.js
          grep -q 'edit-legend-website' /tmp/live-analytics.js
          route_code="$(curl --connect-timeout 5 --max-time 12 -sS -o /dev/null -w '%{http_code}' 'https://portal.mylegnd.com/WebsiteAnalytics/edit-website?site=protect' || true)"
          case "$route_code" in
            200|302|401) ;;
            *) echo "::error::Unexpected editor entrypoint status $route_code"; exit 1;;
          esac

# Candidate refresh: premium header check aligned with banner removal.

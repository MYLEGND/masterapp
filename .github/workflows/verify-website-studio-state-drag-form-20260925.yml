name: Verify Website Studio State Drag Form Repair

on:
  push:
    branches:
      - repair/website-studio-state-drag-form-20260925

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused .NET verification
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --nologo \
            --filter 'FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteInquiryIsolationTests|FullyQualifiedName~WebsiteSignalBindingTests|FullyQualifiedName~BusinessWorkspaceTests'
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo \
            --filter 'FullyQualifiedName~WebsiteContentEditorRoundTripTests.BusinessPublication_PreservesUtf8AcrossDotNetNodeCompilerTransport'
      - name: Website Studio browser verification
        run: |
          set -euo pipefail
          npm ci --prefix tests/website
          node --test tests/website/*.test.mjs
      - name: Protect build
        run: dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo -warnaserror

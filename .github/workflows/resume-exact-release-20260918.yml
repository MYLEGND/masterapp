name: Resume exact September 18 direct release

on:
  push:
    branches:
      - feature/public-website-editor-20260918
    paths:
      - '.github/workflows/resume-exact-release-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: september-18-direct-release
  cancel-in-progress: false

env:
  RELEASE_SHA: fd22853357d4005269a0bf73ae88602c949d8995

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
    steps:
      - name: Checkout exact validated release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare complete live verification
        shell: bash
        run: |
          cat > /tmp/verify-release.py <<'PY'
          import concurrent.futures, html, json, os, re, sys, time, urllib.request, urllib.error
          SHA = os.environ["RELEASE_SHA"]
          MODE = sys.argv[1]
          APPS = {
           "protect": ["https://masterapp-protect.azurewebsites.net", "https://protect.mylegnd.com"],
           "legend": ["https://masterapp-website.azurewebsites.net", "https://www.mylegnd.com"],
           "portal": ["https://masterapp-portal.azurewebsites.net", "https://portal.mylegnd.com"],
           "client": ["https://masterapp-client.azurewebsites.net", "https://client.mylegnd.com"]
          }
          def fetch(base, path):
              url = base + path + ("&" if "?" in path else "?") + "release_check=" + SHA + "&t=" + str(time.time_ns())
              for attempt in range(1, (7 if MODE == "final" else 2)):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers={"Cache-Control":"no-cache", "User-Agent":"LEGEND-release-verifier"}), timeout=20) as response:
                          return response.status, response.read().decode("utf-8", errors="replace"), response.geturl()
                  except urllib.error.HTTPError as e:
                      status = e.code
                  except Exception as e:
                      status = type(e).__name__
                  if attempt < (6 if MODE == "final" else 1):
                      time.sleep(5)
              return status, "", url
          def inspect(item):
              app, base = item
              results = []
              def check(label, passed, detail=""):
                  results.append({"app":app,"host":base,"check":label,"passed":bool(passed),"detail":detail})
              status, body, _ = fetch(base, "/_deployment-provenance.txt" if app == "legend" else "/_deployment-provenance.json")
              try: actual = json.loads(body).get("releaseSha")
              except Exception: actual = None
              check("exact release", status == 200 and actual == SHA, "status=%s actual=%s" % (status, actual))
              if app in ("protect", "legend"):
                  status, body, _ = fetch(base, "/")
                  body = html.unescape(body)
                  check("homepage HTTP", status == 200, str(status))
                  brand = "LEGEND" if app == "protect" else "LEGEND®"
                  header = re.search(r"<header\b[\s\S]*?</header>", body)
                  check("header wordmark", bool(header and re.search(r"<strong\b[^>]*>\s*" + re.escape(brand) + r"\s*</strong>", header.group(0))))
                  check("old banner absent", "brand-banner" not in body)
                  check("Instagram link", 'href="https://www.instagram.com/legend.vault/"' in body)
                  check("App Store link and label", bool(re.search(r'<a\b[^>]*href="https://apps.apple.com/us/app/legend/id6798419225"[^>]*>\s*Legend® ios App\s*</a>', body)))
                  check("CMS context", "LEGEND_PUBLIC_CMS_CONTEXT" in body)
                  if app == "legend":
                      check("old tagline absent", "Live Legendary" not in body)
                  if status == 200:
                      header = re.search(r"<header\b[\s\S]*?</header>", body)
                      check("header diagnostic", True, re.sub(r"\s+", " ", header.group(0))[:1400] if header else "No header element")
                  path = "/design/legend-public-cms.js" if app == "protect" else "/legend-public-cms.js"
                  status, body, _ = fetch(base, path)
                  check("editor runtime", status == 200 and "Website Editor" in body, str(status))
                  if app == "protect":
                      for site in ("protect", "legend"):
                          status, body, _ = fetch(base, "/api/website-content/public/" + site)
                          try: json.loads(body); valid = True
                          except Exception: valid = False
                          check("public content API " + site, status == 200 and valid, str(status))
                  else:
                      for path in ("/about", "/contact", "/logo", "/privacy-terms"):
                          status, body, _ = fetch(base, path)
                          check("public route " + path, status == 200 and "LEGEND" in body, str(status))
              elif app == "portal":
                  status, body, _ = fetch(base, "/js/website-analytics.js")
                  check("Protect editor entrypoint", status == 200 and "edit-protect-website" in body, str(status))
                  check("LEGEND editor entrypoint", status == 200 and "edit-legend-website" in body, str(status))
              return results
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              rows = [row for batch in pool.map(inspect, [(a,b) for a,hosts in APPS.items() for b in hosts]) for row in batch]
          os.makedirs("/tmp/release-diagnostics", exist_ok=True)
          with open("/tmp/release-diagnostics/" + MODE + ".json", "w") as f:
              json.dump({"expectedSha":SHA,"checks":rows}, f, indent=2)
          for row in rows:
              print(("PASS" if row["passed"] else "FAIL") + " " + row["host"] + " " + row["check"] + " " + row["detail"], flush=True)
          failures = [r for r in rows if not r["passed"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n### " + MODE + " verification\n\n| Host | Check | Result |\n|---|---|---|\n")
              for r in rows:
                  f.write("| " + r["host"] + " | " + r["check"] + " | " + ("PASS" if r["passed"] else "FAIL") + " |\n")
          print(str(len(failures)) + " failed checks of " + str(len(rows)), flush=True)
          sys.exit(1 if failures and MODE == "final" else 0)
          
          PY

      - name: Build static website with IIS-readable release metadata
        id: build
        working-directory: Legend-Website
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp public/web.config dist/web.config
          npm run check
          # IIS serves .txt without an additional MIME mapping. This is the
          # single authoritative release marker for the static website.
          printf '{"releaseSha":"%s","release":"all-intentional-20260918"}\n' "$RELEASE_SHA" > dist/_deployment-provenance.txt

      - name: Login to Azure
        id: azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Complete LEGEND static website deployment
        id: legend
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-website
          slot-name: Production
          package: Legend-Website/dist

      # Protect, AgentPortal and ClientApp already completed their exact
      # package deployments. Verify their live SHA without restarting them.
      - name: Verify all four live releases and every public website check
        id: verify
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.azure.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: python3 /tmp/verify-release.py final

      - name: Retain combined diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: direct-release-diagnostics
          path: /tmp/release-diagnostics/
          if-no-files-found: warn

      - name: Enforce complete deployment result
        if: ${{ always() }}
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          AZURE_RESULT: ${{ steps.azure.outcome }}
          LEGEND_RESULT: ${{ steps.legend.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys
          results = {k:os.environ[k] for k in ("BUILD_RESULT","AZURE_RESULT","LEGEND_RESULT","VERIFY_RESULT")}
          for name, result in results.items():
              print(name + "=" + result)
          sys.exit(0 if all(v == "success" for v in results.values()) else 1)
          PY

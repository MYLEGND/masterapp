name: LEGEND final clean freeze

on:
  push:
    branches: [fix/legend-governed-reasoning-executor-20260827]
    paths: [.github/workflows/legend-governed-reasoning-predeploy-v3.yml]

permissions:
  contents: write

env:
  PRODUCTION_BASE: 855e54626923d914a56940fee62702fdf3a02018

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legend-governed-reasoning-executor-20260827
          fetch-depth: 0

      - name: Materialize exact 9/9 green runtime transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/legend-governed-reasoning-patch.py
          python3 scripts/legend-live-conversation-gap-patch.py
          python3 scripts/legend-governed-surface-pattern-patch.py
          git diff --check

      - name: Delete all disposable proof machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/legend-governed-reasoning-patch.py scripts/legend-live-conversation-gap-patch.py scripts/legend-governed-surface-pattern-patch.py
          git rm -f .github/workflows/legend-governed-reasoning-predeploy.yml .github/workflows/legend-governed-reasoning-predeploy-v2.yml .github/workflows/legend-governed-reasoning-predeploy-v3.yml
          git rm -f .github/workflows/legend-production-conversation-discovery.yml .github/workflows/legend-unpublished-curriculum-inventory.yml .github/workflows/legend-unpublished-curriculum-inventory-v2.yml
          git rm -f .github/workflows/legend-unpublished-full-conversation-proof.yml .github/workflows/legend-unpublished-full-conversation-proof-v2.yml .github/workflows/legend-unpublished-full-conversation-proof-v3.yml
          git rm -f AgentPortal.Tests/LegendProductionArticulationEvidenceDiagnosticTests.cs AgentPortal.Tests/LegendProductionConversationDiscoveryTests.cs AgentPortal.Tests/LegendProductionCrossFamilySkeletonDiagnosticTests.cs
          git diff --check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore MASTERAPP.sln

      - name: Enforce exact seven-file production delta
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            AgentPortal.Tests/LegendConnectFounderSemanticTransformationSqlTests.cs \
            AgentPortal.Tests/LegendConnectGovernedReasoningExecutorTests.cs \
            AgentPortal.Tests/LegendConnectSemanticSpanGroundingTests.cs \
            Domain/Messaging/LegendConnectContracts.cs \
            Infrastructure/Messaging/LegendConnectCurriculum.cs \
            Infrastructure/Messaging/LegendConnectGovernedReasoningExecutor.cs \
            Infrastructure/Messaging/LegendConnectOperations.cs | sort > /tmp/expected
          git diff --name-only "$PRODUCTION_BASE" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Clean Release build with zero warnings
        shell: bash
        run: |
          set -euo pipefail
          dotnet clean MASTERAPP.sln -c Release >/dev/null
          dotnet build MASTERAPP.sln -c Release --no-restore 2>&1 | tee build.log
          grep -qE '^[[:space:]]*0 Warning\(s\)' build.log
          grep -qE '^[[:space:]]*0 Error\(s\)' build.log

      - name: Prove reasoning and frozen architecture
        shell: bash
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendConnectGovernedReasoningExecutorTests|FullyQualifiedName~LegendConnectCompositionalUnderstandingTests|FullyQualifiedName~LegendConnectDiscourseReferenceBindingTests|FullyQualifiedName~LegendConnectMeaningGraphTests|FullyQualifiedName~LegendConnectSemanticSpanGroundingTests|FullyQualifiedName~LegendConnectFounderSemanticTransformationSqlTests'
          if grep -nE 'HttpClient|OpenAI|Azure|SaveChanges|DbContext|response cache|prompt map' Infrastructure/Messaging/LegendConnectGovernedReasoningExecutor.cs; then exit 1; fi
          grep -q 'TryRealizeSemanticTransitionResultAsync' Infrastructure/Messaging/LegendConnectCurriculum.cs
          grep -q 'ResolveGovernedResponseContentAsync' Infrastructure/Messaging/LegendConnectCurriculum.cs
          grep -q 'SelectSemanticTransitionAsync' Infrastructure/Messaging/LegendConnectCurriculum.cs

      - name: Complete AgentPortal regression on exact cleaned tree
        shell: bash
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --logger 'console;verbosity=normal'

      - name: Commit exact proven clean tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only "$PRODUCTION_BASE" | sort > /tmp/final
          diff -u /tmp/expected /tmp/final
          git status --short
          git config user.name MYLEGND
          git config user.email zac.owen@mylegnd.com
          git add -A
          git commit -m 'Promote proven LEGEND native reasoning and articulation baseline'
          git push origin HEAD:fix/legend-governed-reasoning-executor-20260827

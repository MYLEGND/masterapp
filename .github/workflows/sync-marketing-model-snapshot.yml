name: Sync canonical marketing EF snapshot

on:
  push:
    branches:
      - integration/steps5-13-approved-20260927
    paths:
      - '.github/workflows/sync-marketing-model-snapshot.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ConnectionStrings__MasterAppDb: 'Server=127.0.0.1;Database=masterapp_ef_design_time;Integrated Security=true;TrustServerCertificate=true;Encrypt=false'
      EF_FORCE_SQLSERVER: 'true'
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/steps5-13-approved-20260927
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore EF tooling and affected graph
        run: |
          dotnet tool restore
          dotnet restore AgentPortal/AgentPortal.csproj

      - name: Generate authoritative model snapshot sync
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations add SyncCanonicalMarketingModel20260927 \
            --project Infrastructure/Infrastructure.csproj \
            --startup-project AgentPortal/AgentPortal.csproj \
            --context MasterAppDbContext \
            --configuration Release \
            --output-dir Migrations

          migration_file="$(find Infrastructure/Migrations -maxdepth 1 -type f -name '*_SyncCanonicalMarketingModel20260927.cs' ! -name '*.Designer.cs' | head -n 1)"
          test -n "$migration_file"
          printf '%s\n' \
            'using Microsoft.EntityFrameworkCore.Migrations;' \
            '' \
            '#nullable disable' \
            '' \
            'namespace Infrastructure.Migrations;' \
            '' \
            'public partial class SyncCanonicalMarketingModel20260927 : Migration' \
            '{' \
            '    protected override void Up(MigrationBuilder migrationBuilder)' \
            '    {' \
            '        // Snapshot-only synchronization. Schema operations are owned by the preceding' \
            '        // additive canonical marketing migrations already present in this release.' \
            '    }' \
            '' \
            '    protected override void Down(MigrationBuilder migrationBuilder)' \
            '    {' \
            '        // Snapshot-only synchronization; no schema rollback is performed here.' \
            '    }' \
            '}' > "$migration_file"
          dotnet build AgentPortal/AgentPortal.csproj -c Release --no-restore --nologo -warnaserror
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project Infrastructure/Infrastructure.csproj \
            --startup-project AgentPortal/AgentPortal.csproj \
            --context MasterAppDbContext \
            --configuration Release \
            --no-build

      - name: Commit generated designer and model snapshot
        run: |
          set -euo pipefail
          git config user.name "LEGEND canonical integration"
          git config user.email "actions@users.noreply.github.com"
          git add Infrastructure/Migrations
          git diff --cached --quiet && { echo "No migration snapshot changes generated."; exit 1; }
          git commit -m "Sync canonical marketing EF model snapshot"
          git push origin HEAD:integration/steps5-13-approved-20260927

name: Validate, merge, and deploy AgentPortal to production

# One fail-closed path for every production change:
# validate once on the PR merge candidate, package that exact tree, merge only
# after validation succeeds, verify the merged tree is identical, then migrate
# and deploy the already-built artifact.
#
# Synchronizing code to an already-open production PR is the one and only
# release trigger. Opening, reopening, marking ready, pushing production,
# manual dispatch, and diagnostic workflows cannot compete with this path.
# No other event is supported by this workflow.
on:
  pull_request:
    branches:
      - production
    types:
      - synchronize

concurrency:
  group: agentportal-production-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'
  PROJECT_PATH: AgentPortal/AgentPortal.csproj
  EF_PROJECT: Infrastructure/Infrastructure.csproj
  EF_CONTEXT: MasterAppDbContext
  PUBLISH_DIR: ${{ github.workspace }}\publish\agentportal
  ARTIFACT_NAME: agentportal-production-candidate-${{ github.run_id }}
  TEST_ARTIFACT_NAME: agentportal-tested-binaries-${{ github.run_id }}
  LEGEND_PRODUCTION_PROOF_MATRIX_VERSION: lai-027-029-v1

jobs:
  # Keep this job name stable: it is the protected production required check.
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MASTERAPP.sln

      - name: Build Release (must be 0 warnings / 0 errors)
        run: |
          set -o pipefail
          dotnet build MASTERAPP.sln -c Release --no-restore 2>&1 | tee build.log
          if ! grep -qE '^[[:space:]]*0 Warning\(s\)' build.log; then
            echo "::error::Build produced warnings; the repository standard is 0 warnings."
            exit 1
          fi

      - name: Test discovery preflight
        run: |
          set -o pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --list-tests 2>&1 | tee test-discovery.log
          if grep -q "No test is available" test-discovery.log; then
            echo "::error::xUnit discovery returned zero tests."
            exit 1
          fi
          if ! grep -q "FounderCapabilities_AreDiscoveredFromTheExecutableToolRegistry" test-discovery.log; then
            echo "::error::The governed Founder capability regression test was not discovered."
            exit 1
          fi
          if ! grep -q "FounderToolCatalog_SerializedContractIsRecursivelyProviderValid" test-discovery.log; then
            echo "::error::The recursive Founder provider-schema contract test was not discovered."
            exit 1
          fi
          if ! grep -q "ProviderAcceptanceCanary_LiveProviderAcceptsCompleteZeroWriteCatalog" test-discovery.log; then
            echo "::error::The bounded zero-write Founder provider acceptance canary was not discovered."
            exit 1
          fi
          if ! grep -q "HostedWorker_ClaimsQueuedSourceFamilies_AndDrainsEveryPhaseWithoutManualAdvancement" test-discovery.log; then
            echo "::error::The canonical hosted-worker convergence regression was not discovered."
            exit 1
          fi
          if ! grep -q "HostedWorkerRestart_ReclaimsExpiredSourceFamilyLease_AndCompletesConvergence" test-discovery.log; then
            echo "::error::The canonical hosted-worker restart regression was not discovered."
            exit 1
          fi
          if ! grep -q "HostedWorker_CurrentEvaluatorContractRewind_UsesDurableQueueInsteadOfLegacyCursor" test-discovery.log; then
            echo "::error::The current-evaluator durable-queue boundary regression was not discovered."
            exit 1
          fi
          if ! grep -q "HostedWorker_AdoptsAlreadyDrainedQueuedSourceFamilies_AndCompletesWithoutManualAdvancement" test-discovery.log; then
            echo "::error::The already-drained queued SourceFamilies hosted-worker regression was not discovered."
            exit 1
          fi
          if ! grep -q "HostedWorker_ReclaimsExpiredProviderSeed_DrainsMultiplePages_AndCompletesWithoutManualAdvancement" test-discovery.log; then
            echo "::error::The ProviderObservations lease-recovery and bounded subject-lookup regression was not discovered."
            exit 1
          fi
          if ! grep -q "HostedWorkerRestart_RecoversFailedPhaseSeed_AndCompletesConvergence" test-discovery.log; then
            echo "::error::The failed phase-seed restart regression was not discovered."
            exit 1
          fi
          if ! grep -q "ProductionReadOnlyNativeProofMatrix" test-discovery.log; then
            echo "::error::The bounded production native proof matrix was not discovered."
            exit 1
          fi

      - name: Test full suite including security regressions
        run: |
          set -o pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build 2>&1 | tee test.log
          if grep -q "No test is available" test.log; then
            echo "::error::The test runner completed without discovering tests."
            exit 1
          fi
          runner_success=false
          if grep -qE 'Passed![[:space:]]+-[[:space:]]+Failed:[[:space:]]+0,[[:space:]]+Passed:[[:space:]]+[1-9][0-9]*' test.log; then
            runner_success=true
          elif grep -q "Test Run Successful" test.log && grep -qE 'Passed:[[:space:]]*[1-9][0-9]*' test.log; then
            runner_success=true
          fi
          if [ "$runner_success" != true ] || grep -qE 'Failed:[[:space:]]*[1-9][0-9]*' test.log; then
            echo "::error::The full AgentPortal regression did not report a successful non-empty test run with zero failures."
            exit 1
          fi

      - name: Database migration validation
        env:
          DB_BASE_REF: ${{ github.event.pull_request.base.sha }}
          DB_BUILD_CONFIGURATION: Release
        run: ./scripts/db.sh validate-artifacts

      - name: No skipped security tests
        run: |
          if grep -REn "Skip[[:space:]]*=" AgentPortal.Tests/*Antiforgery*.cs \
                AgentPortal.Tests/Phase3IdentityAuthorityTests.cs \
                AgentPortal.Tests/Phase4PlatformSecurityTests.cs \
                AgentPortal.Tests/Phase5CrossPlatformSecurityTests.cs \
                AgentPortal.Tests/Phase6ArchitectureInvariantTests.cs \
                AgentPortal.Tests/CalendarControllerTests.cs 2>/dev/null; then
            echo "::error::A security test is marked Skip."
            exit 1
          fi

      - name: Dependency vulnerability audit
        run: |
          set -o pipefail
          dotnet list MASTERAPP.sln package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -qiE '>[[:space:]]*(Low|Moderate|High|Critical)' vuln.log || grep -qi 'has the following vulnerable' vuln.log; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Committed-secret scan
        run: |
          if git ls-files | grep -E 'publish-macos/.*appsettings.*\.json$'; then
            echo "::error::Committed publish-macos appsettings may contain secrets."
            exit 1
          fi
          if git ls-files '*appsettings*.json' | xargs -r grep -nEi '(Password|AccountKey|ClientSecret|AccessToken)"?[:=][[:space:]]*"?[^"[:space:],}]+' \
             | grep -vE '"[[:space:]]*"' ; then
            echo "::error::A tracked appsettings file appears to contain a committed secret value."
            exit 1
          fi

      - name: Architecture invariant - composition roots use shared authorities
        run: |
          set -e
          check() { grep -q "$2" "$1" || { echo "::error::$1 missing shared authority '$2'"; exit 1; }; }
          check AgentPortal/Program.cs AddPlatformDataProtection
          check AgentPortal/Program.cs PlatformRateLimiting
          check AgentPortal/Program.cs AddLegendConnectHostedWorkers
          check ClientApp/Program.cs AddPlatformDataProtection
          check ClientApp/Program.cs PlatformRateLimiting
          check ClientApp/Program.cs PlatformSecurityHeaders
          check Protect-Website/Program.cs AddPlatformDataProtection
          check Protect-Website/Program.cs PlatformRateLimiting
          check Protect-Website/Program.cs PlatformSecurityHeaders
          check ParfaitApp/Program.cs PlatformConfigValidation
          check ParfaitApp/Program.cs PlatformRateLimiting
          if grep -REn 'AddHostedService<[^>]*LegendConnect' \
                AgentPortal/Program.cs ClientApp/Program.cs Protect-Website/Program.cs ParfaitApp/Program.cs 2>/dev/null; then
            echo "::error::An application composition root directly registers a LEGEND worker outside the canonical worker set."
            exit 1
          fi
          if grep -q 'AddLegendConnectHostedWorkers' ClientApp/Program.cs; then
            echo "::error::ClientApp must consume messaging services without becoming a competing LEGEND worker host."
            exit 1
          fi
          if grep -q '_legend.TryInferConversationAsync' AgentPortal/Services/LegendFounderAiConversationService.cs; then
            echo "::error::Founder production chat must not fall back to the legacy non-discourse LEGEND responder."
            exit 1
          fi

      - name: Architecture invariant - no inline Azure key-ring wiring
        run: |
          if grep -REn 'PersistKeysToAzureBlobStorage|ProtectKeysWithAzureKeyVault' \
                AgentPortal/Program.cs ClientApp/Program.cs Protect-Website/Program.cs ParfaitApp/Program.cs 2>/dev/null; then
            echo "::error::An application composition root inlines Azure Data Protection key-ring wiring."
            exit 1
          fi

      - name: git diff --check
        run: git diff --check

      - name: Preserve exact tested binaries for postdeployment verification
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: /tmp/masterapp/bin/AgentPortal.Tests/Release/net10.0
          if-no-files-found: error
          retention-days: 1

  build:
    needs: security
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tested_tree: ${{ steps.tree.outputs.tested_tree }}
      candidate_sha: ${{ steps.tree.outputs.candidate_sha }}

    steps:
      - name: Checkout exact validated merge candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Capture validated tree identity
        id: tree
        shell: pwsh
        run: |
          $candidateSha = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') { throw 'Unable to resolve the exact validated candidate SHA.' }
          if ([string]::IsNullOrWhiteSpace($tree)) { throw 'Unable to resolve validated tree identity.' }
          "candidate_sha=$candidateSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tested_tree=$tree" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish validated AgentPortal candidate
        shell: pwsh
        run: |
          dotnet publish '${{ env.PROJECT_PATH }}' --configuration Release --output '${{ env.PUBLISH_DIR }}'
          if ($LASTEXITCODE -ne 0) { throw 'AgentPortal publish failed.' }

      - name: Verify packaged FFmpeg runtime
        shell: pwsh
        run: |
          $ffmpeg = Join-Path '${{ env.PUBLISH_DIR }}' 'tools/ffmpeg/ffmpeg.exe'
          $ffprobe = Join-Path '${{ env.PUBLISH_DIR }}' 'tools/ffmpeg/ffprobe.exe'
          if (-not (Test-Path $ffmpeg)) { throw 'Missing packaged ffmpeg.exe' }
          if (-not (Test-Path $ffprobe)) { throw 'Missing packaged ffprobe.exe' }

      - name: Upload exact validated deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - security
      - build
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    steps:
      - name: Verify production base has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$current_base" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Production advanced after this merge candidate was validated. Re-run the PR against the current base."
            exit 1
          fi

      - name: Merge exact validated PR head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          response=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$EXPECTED_HEAD_SHA")
          merged=$(printf '%s' "$response" | jq -r '.merged')
          merge_sha=$(printf '%s' "$response" | jq -r '.sha // empty')
          if [ "$merged" != "true" ] || [ -z "$merge_sha" ]; then
            printf '%s\n' "$response"
            echo "::error::GitHub did not merge the exact validated PR head."
            exit 1
          fi
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable production merge
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.merge.outputs.merge_sha }}
          fetch-depth: 0

      - name: Prove merged tree equals validated tree
        env:
          TESTED_TREE: ${{ needs.build.outputs.tested_tree }}
        run: |
          merged_tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$merged_tree" != "$TESTED_TREE" ]; then
            echo "::error::Merged production tree differs from the tree that passed validation."
            exit 1
          fi

  migrate:
    needs:
      - build
      - merge
    runs-on: windows-latest
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout immutable production merge
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.merge_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore repository tools and EF projects
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Repository tool restore failed.' }
          dotnet restore '${{ env.PROJECT_PATH }}'
          if ($LASTEXITCODE -ne 0) { throw 'AgentPortal restore failed.' }

      - name: Build EF startup project
        shell: pwsh
        run: |
          dotnet build '${{ env.PROJECT_PATH }}' --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'EF startup build failed.' }

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database connection securely
        shell: pwsh
        run: |
          $connection = ''
          $rawConnections = az webapp config connection-string list --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' --name '${{ env.AZURE_WEBAPP_NAME }}' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read App Service connection strings.' }
          $connections = $rawConnections | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match -and -not [string]::IsNullOrWhiteSpace([string]$match.value)) {
            $connection = [string]$match.value
          }
          if ([string]::IsNullOrWhiteSpace($connection)) {
            $rawSettings = az webapp config appsettings list --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' --name '${{ env.AZURE_WEBAPP_NAME }}' --output json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read App Service settings.' }
            $settings = @{}
            foreach ($item in ($rawSettings | ConvertFrom-Json)) {
              $settings[[string]$item.name] = [string]$item.value
            }
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
                $connection = $settings[$name]
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) {
            throw 'Production MasterAppDb connection string could not be resolved from Azure App Service configuration.'
          }
          if ($connection -notmatch '(?i)(server=tcp:|\.database\.windows\.net|initial catalog=)') {
            throw 'Resolved MasterAppDb is not recognized as the production SQL Server connection.'
          }
          Write-Output "::add-mask::$connection"
          "ConnectionStrings__MasterAppDb=$connection" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EF_FORCE_SQLSERVER=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EF_SQL_COMMAND_TIMEOUT_SECONDS=600" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOTNET_ENVIRONMENT=Development" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPNETCORE_ENVIRONMENT=Development" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply production EF migrations
        shell: pwsh
        run: |
          dotnet tool run dotnet-ef database update --project '${{ env.EF_PROJECT }}' --startup-project '${{ env.PROJECT_PATH }}' --context '${{ env.EF_CONTEXT }}' --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Production EF migration update failed.' }

      - name: Verify zero pending production migrations
        shell: pwsh
        run: |
          $output = dotnet tool run dotnet-ef migrations list --project '${{ env.EF_PROJECT }}' --startup-project '${{ env.PROJECT_PATH }}' --context '${{ env.EF_CONTEXT }}' --configuration Release --no-build 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw 'Unable to verify production migrations.' }
          $output | Write-Host
          if (($output -join [Environment]::NewLine) -match '\(Pending\)') {
            throw 'Production database still has pending EF migrations after update.'
          }

  deploy:
    needs:
      - build
      - merge
      - migrate
    runs-on: windows-latest
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed_sha: ${{ steps.identity.outputs.deployed_sha }}

    steps:
      - name: Download exact validated deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./package

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bind runtime provenance to immutable production SHA
        shell: pwsh
        run: |
          $deployedSha = '${{ needs.merge.outputs.merge_sha }}'
          if ($deployedSha -notmatch '^[0-9a-f]{40}$') { throw 'The immutable production SHA is unavailable or malformed.' }
          az webapp config appsettings set --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' --name '${{ env.AZURE_WEBAPP_NAME }}' --settings "LegendConnect__Research__CodeSha=$deployedSha" "LegendConnect__ModelEvaluation__CodeSha=$deployedSha" --output none
          if ($LASTEXITCODE -ne 0) { throw 'Unable to bind LEGEND runtime provenance to the immutable production SHA.' }

      - name: Deploy immutable merged production tree
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./package

      - name: Bind deployed artifact to immutable production SHA
        id: identity
        shell: pwsh
        run: |
          $deployedSha = '${{ needs.merge.outputs.merge_sha }}'
          if ($deployedSha -notmatch '^[0-9a-f]{40}$') { throw 'The deployed production SHA is unavailable or malformed.' }
          "deployed_sha=$deployedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  verify-legend-native:
    needs:
      - build
      - merge
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download exact tested binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: ./tested

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wake deployed application and verify readiness
        shell: pwsh
        run: |
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(5)
          do {
            try {
              $response = Invoke-WebRequest -Uri 'https://portal.mylegnd.com/readyz' -Method Get -TimeoutSec 20
              if ($response.StatusCode -eq 200) { exit 0 }
            }
            catch { Start-Sleep -Seconds 10 }
          } while ((Get-Date).ToUniversalTime() -lt $deadline)
          throw 'The deployed AgentPortal did not become ready within five minutes.'

      - name: Verify unauthenticated SignalR negotiate challenges
        shell: pwsh
        run: |
          function Assert-NegotiateChallenge {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$ExpectedStatus
            )

            $status = & curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --request POST $Uri
            if ($LASTEXITCODE -ne 0) {
              throw "$Name negotiate probe could not reach the deployed application."
            }
            if ($status -match '^5') {
              throw "$Name negotiate returned server failure HTTP $status."
            }
            if ($status -ne $ExpectedStatus) {
              throw "$Name negotiate returned HTTP $status; expected unauthenticated challenge HTTP $ExpectedStatus."
            }
          }

          Assert-NegotiateChallenge -Name 'LiveSync' -Uri 'https://portal.mylegnd.com/livesync/negotiate?negotiateVersion=1' -ExpectedStatus '302'
          Assert-NegotiateChallenge -Name 'Messaging' -Uri 'https://portal.mylegnd.com/messaginghub/negotiate?negotiateVersion=1' -ExpectedStatus '401'

      - name: Resolve production read-only and provider-canary authorities
        shell: pwsh
        env:
          LEGEND_PROVIDER_CANARY_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $connection = ''
          $rawConnections = az webapp config connection-string list --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' --name '${{ env.AZURE_WEBAPP_NAME }}' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read App Service connection strings.' }
          $connections = $rawConnections | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match -and -not [string]::IsNullOrWhiteSpace([string]$match.value)) {
            $connection = [string]$match.value
          }
          if ([string]::IsNullOrWhiteSpace($connection)) {
            $rawSettings = az webapp config appsettings list --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' --name '${{ env.AZURE_WEBAPP_NAME }}' --output json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read App Service settings.' }
            $settings = @{}
            foreach ($item in ($rawSettings | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
                $connection = $settings[$name]
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection string could not be resolved.' }
          if ($connection -notmatch '(?i)(server=tcp:|\.database\.windows\.net|initial catalog=)') { throw 'Resolved MasterAppDb is not recognized as production SQL Server.' }
          $rawSettings = az webapp config appsettings list --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' --name '${{ env.AZURE_WEBAPP_NAME }}' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the deployed Founder authority setting.' }
          $settings = @{}
          foreach ($item in ($rawSettings | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }
          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','FounderOid','Founder__Oid','Founder:Oid')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
              $founderOid = $settings[$name]
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'The deployed Founder OID authority is missing.' }
          $openAiApiKey = $env:LEGEND_PROVIDER_CANARY_OPENAI_API_KEY
          if ([string]::IsNullOrWhiteSpace($openAiApiKey)) {
            foreach ($name in @('OpenAI__ApiKey','OpenAI:ApiKey','OPENAI_API_KEY')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
                $openAiApiKey = $settings[$name]
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($openAiApiKey)) { throw 'The deployed OpenAI provider key is missing; the Founder tool-catalog acceptance canary cannot run.' }
          if ($openAiApiKey.StartsWith('@Microsoft.KeyVault(', [System.StringComparison]::OrdinalIgnoreCase)) { throw 'The deployed OpenAI provider key is an unresolved Key Vault reference in this workflow identity.' }
          $openAiModel = ''
          foreach ($name in @('OpenAI__LegendFounderAiModel','OpenAI:LegendFounderAiModel','OpenAI__Model','OpenAI:Model')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
              $openAiModel = $settings[$name]
              break
            }
          }
          Write-Output "::add-mask::$connection"
          Write-Output "::add-mask::$founderOid"
          Write-Output "::add-mask::$openAiApiKey"
          "LEGEND_PRODUCTION_READONLY_CONNECTION=$connection" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEGEND_PRODUCTION_READONLY_FOUNDER_OID=$founderOid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OpenAI__ApiKey=$openAiApiKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not [string]::IsNullOrWhiteSpace($openAiModel)) {
            "OpenAI__LegendFounderAiModel=$openAiModel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Bind production proof identity to exact candidate and deployed SHAs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $candidateSha = '${{ needs.build.outputs.candidate_sha }}'
          $deployedSha = '${{ needs.deploy.outputs.deployed_sha }}'
          $mergeSha = '${{ needs.merge.outputs.merge_sha }}'
          $candidateTree = '${{ needs.build.outputs.tested_tree }}'
          foreach ($identity in @($candidateSha, $deployedSha, $mergeSha, $candidateTree)) {
            if ($identity -notmatch '^[0-9a-f]{40}$') { throw 'A required immutable production proof identity is unavailable or malformed.' }
          }
          if ($candidateSha -ne '${{ github.sha }}') { throw 'Downloaded tested binaries are not bound to the exact workflow candidate SHA.' }
          if ($deployedSha -ne $mergeSha) { throw 'The deployed SHA differs from the immutable production merge SHA.' }
          [ordered]@{
            Authority = 'agentportal-production-deploy.yml/verify-legend-native'
            MatrixVersion = '${{ env.LEGEND_PRODUCTION_PROOF_MATRIX_VERSION }}'
            CandidateSha = $candidateSha
            CandidateTree = $candidateTree
            DeployedSha = $deployedSha
            RunId = '${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content -Path diagnostics/legend-production-proof-identity.json -Encoding utf8

      - name: Verify provider accepts complete Founder tool catalog without execution
        shell: pwsh
        env:
          LEGEND_FOUNDER_TOOL_CATALOG_PROVIDER_CANARY: 'true'
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          dotnet test './tested/AgentPortal.Tests.dll' --filter 'FullyQualifiedName~ProviderAcceptanceCanary_LiveProviderAcceptsCompleteZeroWriteCatalog' --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath diagnostics/legend-founder-tool-provider-canary.txt
          if ($LASTEXITCODE -ne 0) { throw 'The provider rejected the complete serialized Founder tool catalog.' }

      - name: Verify bounded production Founder native proof matrix
        id: native
        shell: pwsh
        env:
          LEGEND_PRODUCTION_PROOF_REQUIRED: 'true'
          LEGEND_PRODUCTION_PROOF_MATRIX_VERSION: ${{ env.LEGEND_PRODUCTION_PROOF_MATRIX_VERSION }}
          LEGEND_PRODUCTION_PROOF_RESULT_PATH: diagnostics/legend-production-matrix-result.json
          OPENAI_API_KEY: ''
          OpenAI__ApiKey: ''
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $testName = 'AgentPortal.Tests.LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyNativeProofMatrix'
          $filter = "FullyQualifiedName=$testName"
          $matrixResultPath = 'diagnostics/legend-production-matrix-result.json'
          if (Test-Path $matrixResultPath) { throw 'A stale SQL proof result exists before matrix execution.' }
          dotnet test './tested/AgentPortal.Tests.dll' --list-tests --filter $filter 2>&1 | Tee-Object -FilePath diagnostics/legend-production-proof-discovery.txt
          if ($LASTEXITCODE -ne 0) { throw 'LEGEND production proof test discovery failed.' }
          $discovery = Get-Content diagnostics/legend-production-proof-discovery.txt -Raw
          $discovered = [regex]::Matches($discovery, '(?m)^\s*' + [regex]::Escape($testName) + '\s*$').Count
          if ($discovered -ne 1) { throw "The exact LEGEND production proof matrix was discovered $discovered times; required count is one." }

          dotnet test './tested/AgentPortal.Tests.dll' --filter $filter --results-directory diagnostics --logger 'trx;LogFileName=legend-production-native-proof.trx' --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath diagnostics/legend-production-native-proof.txt
          $testExit = $LASTEXITCODE
          $executedTests = 0
          $passedTests = 0
          $failedTests = 0
          $matrixCases = $null
          $matrixTotalCases = $null
          $matrixFailedCases = $null
          $matrixStatus = ''
          $matrixResultState = 'missing'
          $nativePasses = $null
          $negativePasses = $null
          $providerClientCount = $null
          $productionWriteCommandCount = $null
          $validationErrors = [System.Collections.Generic.List[string]]::new()
          $trxPath = 'diagnostics/legend-production-native-proof.trx'
          if (Test-Path $trxPath) {
            [xml]$trx = Get-Content $trxPath -Raw
            $counters = $trx.TestRun.ResultSummary.Counters
            if ($null -ne $counters) {
              $executedTests = [int]$counters.executed
              $passedTests = [int]$counters.passed
              $failedTests = [int]$counters.failed
            }
          }
          if (Test-Path $matrixResultPath) {
            try {
              $matrixResult = Get-Content $matrixResultPath -Raw | ConvertFrom-Json -ErrorAction Stop
              $requiredResultFields = @('MatrixVersion','Status','ExecutedCases','TotalCases','FailedCases','NativePasses','NegativePasses','ProviderClientCount','ProductionWriteCommandCount','Categories','CaseResults')
              $missingResultFields = @($requiredResultFields | Where-Object { $_ -notin $matrixResult.PSObject.Properties.Name })
              if ($missingResultFields.Count -gt 0) { throw ('The SQL proof result is missing required fields: ' + ($missingResultFields -join ', ') + '.') }
              if ([string]::IsNullOrWhiteSpace([string]$matrixResult.Status) -or $null -eq $matrixResult.Categories -or $null -eq $matrixResult.CaseResults) { throw 'The SQL proof result contains null required evidence fields.' }
              foreach ($numericField in @('ExecutedCases','TotalCases','FailedCases','NativePasses','NegativePasses','ProviderClientCount','ProductionWriteCommandCount')) {
                if ($null -eq $matrixResult.$numericField) { throw "The SQL proof result contains null numeric field '$numericField'." }
              }
              $matrixResultState = 'present'
              $matrixStatus = [string]$matrixResult.Status
              $matrixCases = [int]$matrixResult.ExecutedCases
              $matrixTotalCases = [int]$matrixResult.TotalCases
              $matrixFailedCases = [int]$matrixResult.FailedCases
              $nativePasses = [int]$matrixResult.NativePasses
              $negativePasses = [int]$matrixResult.NegativePasses
              $providerClientCount = [int]$matrixResult.ProviderClientCount
              $productionWriteCommandCount = [int]$matrixResult.ProductionWriteCommandCount
              if ($matrixResult.MatrixVersion -ne '${{ env.LEGEND_PRODUCTION_PROOF_MATRIX_VERSION }}') { $validationErrors.Add('The SQL proof result used an unexpected matrix version.') }
              if ($matrixStatus -ne 'passed') { $validationErrors.Add('The SQL proof result did not report a passed matrix.') }
              if ($providerClientCount -ne 0) { $validationErrors.Add('The native-only SQL proof created a provider client.') }
              if ($productionWriteCommandCount -ne 0) { $validationErrors.Add('The SQL proof reported a production write command.') }
            }
            catch {
              $matrixResultState = 'malformed'
              $matrixStatus = ''
              $matrixCases = $null
              $matrixTotalCases = $null
              $matrixFailedCases = $null
              $nativePasses = $null
              $negativePasses = $null
              $providerClientCount = $null
              $productionWriteCommandCount = $null
              $validationErrors.Add('The SQL proof result could not be parsed: ' + $_.Exception.Message)
            }
          }
          else {
            $validationErrors.Add('The SQL proof result is missing.')
          }
          "executed_tests=$executedTests" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "passed_tests=$passedTests" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failed_tests=$failedTests" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "matrix_cases=$matrixCases" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "matrix_total_cases=$matrixTotalCases" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "matrix_failed_cases=$matrixFailedCases" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "matrix_status=$matrixStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "matrix_result_state=$matrixResultState" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "native_passes=$nativePasses" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "negative_passes=$negativePasses" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "provider_client_count=$providerClientCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "production_write_command_count=$productionWriteCommandCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($testExit -ne 0) { $validationErrors.Add('LEGEND bounded production native proof matrix failed.') }
          if ($executedTests -ne 1 -or $passedTests -ne 1 -or $failedTests -ne 0) { $validationErrors.Add("Required SQL proof execution was incomplete: executed=$executedTests; passed=$passedTests; failed=$failedTests.") }
          if ($null -eq $matrixCases) { $validationErrors.Add('Required SQL proof executed matrix case count is unavailable.') }
          elseif ($matrixCases -lt 1) { $validationErrors.Add('Required SQL proof reported zero executed matrix cases.') }
          if ($validationErrors.Count -gt 0) { throw ($validationErrors -join ' | ') }

      - name: Finalize exact production proof manifest
        if: always()
        shell: pwsh
        run: |
          $path = 'diagnostics/legend-production-proof-identity.json'
          if (-not (Test-Path $path)) { throw 'The exact production proof identity manifest is missing.' }
          $identity = Get-Content $path -Raw | ConvertFrom-Json
          $matrixResultPath = 'diagnostics/legend-production-matrix-result.json'
          $matrixResultState = 'missing'
          $matrixResultSha256 = $null
          $matrixResult = $null
          $matrixResultError = $null
          if (Test-Path $matrixResultPath) {
            try {
              $matrixResultSha256 = (Get-FileHash -Path $matrixResultPath -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
              $matrixResult = Get-Content $matrixResultPath -Raw | ConvertFrom-Json -ErrorAction Stop
              $requiredResultFields = @('MatrixVersion','Status','ExecutedCases','TotalCases','FailedCases','NativePasses','NegativePasses','ProviderClientCount','ProductionWriteCommandCount','Categories','CaseResults')
              $missingResultFields = @($requiredResultFields | Where-Object { $_ -notin $matrixResult.PSObject.Properties.Name })
              if ($missingResultFields.Count -gt 0) { throw ('The SQL proof result is missing required fields: ' + ($missingResultFields -join ', ') + '.') }
              if ([string]::IsNullOrWhiteSpace([string]$matrixResult.Status) -or $null -eq $matrixResult.Categories -or $null -eq $matrixResult.CaseResults) { throw 'The SQL proof result contains null required evidence fields.' }
              foreach ($numericField in @('ExecutedCases','TotalCases','FailedCases','NativePasses','NegativePasses','ProviderClientCount','ProductionWriteCommandCount')) {
                if ($null -eq $matrixResult.$numericField) { throw "The SQL proof result contains null numeric field '$numericField'." }
              }
              $matrixResultState = 'present'
            }
            catch {
              $matrixResultState = 'malformed'
              $matrixResultError = $_.Exception.Message
            }
          }
          $executedTests = $null
          $passedTests = $null
          $failedTests = $null
          if ('${{ steps.native.outputs.executed_tests }}' -match '^\d+$') { $executedTests = [int]'${{ steps.native.outputs.executed_tests }}' }
          if ('${{ steps.native.outputs.passed_tests }}' -match '^\d+$') { $passedTests = [int]'${{ steps.native.outputs.passed_tests }}' }
          if ('${{ steps.native.outputs.failed_tests }}' -match '^\d+$') { $failedTests = [int]'${{ steps.native.outputs.failed_tests }}' }
          [ordered]@{
            Authority = $identity.Authority
            MatrixVersion = $identity.MatrixVersion
            CandidateSha = $identity.CandidateSha
            CandidateTree = $identity.CandidateTree
            DeployedSha = $identity.DeployedSha
            RunId = $identity.RunId
            ExecutionOutcome = '${{ steps.native.outcome }}'
            TestExecution = [ordered]@{
              ExecutedTests = $executedTests
              PassedTests = $passedTests
              FailedTests = $failedTests
            }
            MatrixResultState = $matrixResultState
            MatrixResultSha256 = $matrixResultSha256
            MatrixResultError = $matrixResultError
            MatrixResult = $matrixResult
          } | ConvertTo-Json -Depth 12 | Set-Content -Path $path -Encoding utf8

      - name: Upload exact Founder production proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legend-production-proof-${{ needs.deploy.outputs.deployed_sha }}-${{ github.run_id }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7

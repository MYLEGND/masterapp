name: Deploy Legend Android to Internal Testing

# Production release authority for Google Play internal testing.

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/legend-android-internal-testing.yml'
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to internal testers
        required: true
        type: string
      confirmation:
        description: Type BUILD_SIGNED for a downloadable bundle or DEPLOY_INTERNAL to publish
        required: true
        type: string

concurrency:
  group: legend-android-internal-testing
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy-internal:
    if: (github.ref == 'refs/heads/production' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY_INTERNAL')) || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'BUILD_SIGNED')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: google-play-internal

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate protected build configuration
        shell: bash
        env:
          LEGEND_UPLOAD_KEYSTORE: ${{ secrets.LEGEND_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          LEGEND_KEYSTORE_PASSWORD: ${{ secrets.LEGEND_ANDROID_KEYSTORE_PASSWORD }}
          LEGEND_KEY_ALIAS: ${{ secrets.LEGEND_ANDROID_KEY_ALIAS }}
          LEGEND_KEY_PASSWORD: ${{ secrets.LEGEND_ANDROID_KEY_PASSWORD }}
          LEGEND_API_BASE_URL: ${{ vars.LEGEND_API_BASE_URL }}
          LEGEND_ENTRA_TENANT_ID: ${{ vars.LEGEND_ENTRA_TENANT_ID }}
          LEGEND_ENTRA_CLIENT_ID: ${{ vars.LEGEND_ENTRA_CLIENT_ID }}
          LEGEND_ENTRA_AUTHORITY: ${{ vars.LEGEND_ENTRA_AUTHORITY }}
          LEGEND_ENTRA_SCOPE: ${{ vars.LEGEND_ENTRA_SCOPE }}
        run: |
          test -n "$LEGEND_UPLOAD_KEYSTORE"
          test -n "$LEGEND_KEYSTORE_PASSWORD"
          test -n "$LEGEND_KEY_ALIAS"
          test -n "$LEGEND_KEY_PASSWORD"
          test -n "$LEGEND_API_BASE_URL"
          test -n "$LEGEND_ENTRA_TENANT_ID"
          test -n "$LEGEND_ENTRA_CLIENT_ID"
          test -n "$LEGEND_ENTRA_AUTHORITY"
          test -n "$LEGEND_ENTRA_SCOPE"

      - name: Restore protected Android upload key
        shell: bash
        env:
          LEGEND_UPLOAD_KEYSTORE: ${{ secrets.LEGEND_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LEGEND_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/legend-upload.jks"
          chmod 600 "$RUNNER_TEMP/legend-upload.jks"

      - name: Validate upload keystore before building
        shell: bash
        env:
          LEGEND_KEYSTORE_PASSWORD: ${{ secrets.LEGEND_ANDROID_KEYSTORE_PASSWORD }}
          LEGEND_KEY_ALIAS: ${{ secrets.LEGEND_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -exportcert -keystore "$RUNNER_TEMP/legend-upload.jks" -storepass:env LEGEND_KEYSTORE_PASSWORD -alias "$LEGEND_KEY_ALIAS" -file "$RUNNER_TEMP/legend-upload-cert.der"
          # This is the upload certificate, distinct from the Play app-signing certificate.
          expected="$(tr -d ':[:space:]' < Legend-Android/app/signing/play-upload-sha1.txt | tr '[:upper:]' '[:lower:]')"
          actual="$(sha1sum "$RUNNER_TEMP/legend-upload-cert.der" | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::GitHub upload keystore is outdated. Replace its signing secrets with the key Google Play requires."
            exit 1
          fi

      - name: Resolve exact Android validation identity
        id: androididentity
        shell: bash
        env:
          LEGEND_API_BASE_URL: ${{ vars.LEGEND_API_BASE_URL }}
          LEGEND_ENTRA_TENANT_ID: ${{ vars.LEGEND_ENTRA_TENANT_ID }}
          LEGEND_ENTRA_CLIENT_ID: ${{ vars.LEGEND_ENTRA_CLIENT_ID }}
          LEGEND_ENTRA_AUTHORITY: ${{ vars.LEGEND_ENTRA_AUTHORITY }}
          LEGEND_ENTRA_SCOPE: ${{ vars.LEGEND_ENTRA_SCOPE }}
        run: |
          set -euo pipefail
          expected_cert="$(tr -d ':[:space:]' < Legend-Android/app/signing/play-upload-sha1.txt | tr '[:upper:]' '[:lower:]')"
          config_hash="$(
            printf '%s\0%s\0%s\0%s\0%s\0%s\0%s'               "$GITHUB_SHA"               "$expected_cert"               "$LEGEND_API_BASE_URL"               "$LEGEND_ENTRA_TENANT_ID"               "$LEGEND_ENTRA_CLIENT_ID"               "$LEGEND_ENTRA_AUTHORITY"               "$LEGEND_ENTRA_SCOPE" |
              sha256sum | cut -d ' ' -f 1
          )"
          echo "hash=$config_hash" >> "$GITHUB_OUTPUT"
          echo "artifact=legend-android-signed-$GITHUB_SHA-$config_hash" >> "$GITHUB_OUTPUT"

      - name: Reuse exact signed Android bundle when available
        id: reuseandroid
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.androididentity.outputs.artifact }}
        run: |
          set -euo pipefail
          run_id=""
          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100")"
          while read -r candidate_run; do
            [ -n "$candidate_run" ] || continue
            run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run")"
            if [ "$(printf '%s' "$run" | jq -r '.path // ""')" = ".github/workflows/legend-android-internal-testing.yml" ] &&
               [ "$(printf '%s' "$run" | jq -r '.head_sha // ""')" = "$GITHUB_SHA" ]; then
              run_id="$candidate_run"
              break
            fi
          done < <(printf '%s' "$artifacts" | jq -r '.artifacts[] | select(.expired == false) | .workflow_run.id' | awk '!seen[$0]++')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "REUSE_ANDROID_BUNDLE=true" >> "$GITHUB_ENV"
            echo "Exact Android compile/test/lint/sign evidence preserved from run $run_id."
          else
            echo "REUSE_ANDROID_BUNDLE=false" >> "$GITHUB_ENV"
          fi

      - name: Load exact signed Android bundle
        if: steps.reuseandroid.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.androididentity.outputs.artifact }}
          path: ${{ runner.temp }}/legend-android-release
          run-id: ${{ steps.reuseandroid.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Android SDK
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        shell: bash
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Create production runtime configuration
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        shell: bash
        env:
          LEGEND_API_BASE_URL: ${{ vars.LEGEND_API_BASE_URL }}
          LEGEND_ENTRA_TENANT_ID: ${{ vars.LEGEND_ENTRA_TENANT_ID }}
          LEGEND_ENTRA_CLIENT_ID: ${{ vars.LEGEND_ENTRA_CLIENT_ID }}
          LEGEND_ENTRA_AUTHORITY: ${{ vars.LEGEND_ENTRA_AUTHORITY }}
          LEGEND_ENTRA_SCOPE: ${{ vars.LEGEND_ENTRA_SCOPE }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'LEGEND_API_BASE_URL=%s\n' "$LEGEND_API_BASE_URL"
            printf 'LEGEND_ENTRA_TENANT_ID=%s\n' "$LEGEND_ENTRA_TENANT_ID"
            printf 'LEGEND_ENTRA_CLIENT_ID=%s\n' "$LEGEND_ENTRA_CLIENT_ID"
            printf 'LEGEND_ENTRA_AUTHORITY=%s\n' "$LEGEND_ENTRA_AUTHORITY"
            printf 'LEGEND_ENTRA_SCOPE=%s\n' "$LEGEND_ENTRA_SCOPE"
          } > Legend-Android/legend.properties

      - name: Compile, test, lint, and build release bundle
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        working-directory: Legend-Android
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:bundleRelease

      - name: Sign and verify release bundle
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        shell: bash
        env:
          LEGEND_KEYSTORE_PASSWORD: ${{ secrets.LEGEND_ANDROID_KEYSTORE_PASSWORD }}
          LEGEND_KEY_ALIAS: ${{ secrets.LEGEND_ANDROID_KEY_ALIAS }}
          LEGEND_KEY_PASSWORD: ${{ secrets.LEGEND_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/legend-android-release/app-release.aab"
          jarsigner -keystore "$RUNNER_TEMP/legend-upload.jks" -storepass:env LEGEND_KEYSTORE_PASSWORD -keypass:env LEGEND_KEY_PASSWORD "$bundle_path" "$LEGEND_KEY_ALIAS"
          jarsigner -verify -strict -keystore "$RUNNER_TEMP/legend-upload.jks" -storepass:env LEGEND_KEYSTORE_PASSWORD "$bundle_path" "$LEGEND_KEY_ALIAS"

      - name: Stage exact signed Android release
        if: env.REUSE_ANDROID_BUNDLE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legend-android-release"
          cp Legend-Android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/legend-android-release/app-release.aab"
          cp "$RUNNER_TEMP/legend-upload-cert.der" "$RUNNER_TEMP/legend-android-release/legend-upload-cert.der"

      - name: Save signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.androididentity.outputs.artifact }}
          path: ${{ runner.temp }}/legend-android-release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Authenticate to Google Play without a downloaded JSON key
        if: inputs.confirmation == 'DEPLOY_INTERNAL' || (github.event_name == 'push' && vars.LEGEND_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.LEGEND_GCP_PLAY_SERVICE_ACCOUNT != '')
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.LEGEND_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LEGEND_GCP_PLAY_SERVICE_ACCOUNT }}

      - name: Upload and publish only to Internal testing
        if: inputs.confirmation == 'DEPLOY_INTERNAL' || (github.event_name == 'push' && vars.LEGEND_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.LEGEND_GCP_PLAY_SERVICE_ACCOUNT != '')
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          RELEASE_NOTES: ${{ inputs.release_notes || 'Updated LEGEND Android internal testing build.' }}
          PACKAGE_NAME: com.mylegnd.legend.registered
        run: |
          set -euo pipefail
          bundle_path="Legend-Android/app/build/outputs/bundle/release/app-release.aab"
          api_root="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          upload_root="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME"
          authorization="Authorization: Bearer $ACCESS_TOKEN"

          edit_response="$(curl --fail-with-body --silent --show-error \
            -X POST -H "$authorization" -H 'Content-Type: application/json' \
            -d '{}' "$api_root/edits")"
          edit_id="$(jq -er '.id' <<<"$edit_response")"

          bundle_response="$(curl --fail-with-body --silent --show-error \
            -X POST -H "$authorization" -H 'Content-Type: application/octet-stream' \
            --data-binary "@$bundle_path" \
            "$upload_root/edits/$edit_id/bundles?uploadType=media")"
          version_code="$(jq -er '.versionCode' <<<"$bundle_response")"

          track_payload="$(jq -n \
            --arg version_code "$version_code" \
            --arg notes "$RELEASE_NOTES" \
            '{track:"internal",releases:[{name:("Release " + $version_code),versionCodes:[$version_code],status:"completed",releaseNotes:[{language:"en-US",text:$notes}]}]}')"

          curl --fail-with-body --silent --show-error \
            -X PUT -H "$authorization" -H 'Content-Type: application/json' \
            -d "$track_payload" "$api_root/edits/$edit_id/tracks/internal" >/dev/null

          curl --fail-with-body --silent --show-error \
            -X POST -H "$authorization" -H 'Content-Type: application/json' \
            "$api_root/edits/$edit_id:commit" >/dev/null

          echo "Published version code $version_code to Google Play Internal testing."

      - name: Remove temporary upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/legend-upload.jks" Legend-Android/legend.properties

      - name: Verify repository diff
        shell: bash
        run: git diff --check

name: Step 6 isolated ChatGPT Ads execution validation

on:
  pull_request:
    branches:
      - legend/approved-changes
    paths:
      - 'SHARED/Analytics/OpenAiAdsExecutionContracts.cs'
      - 'Infrastructure/Analytics/OpenAiAdsExecutionService.cs'
      - 'Infrastructure/Analytics/MarketingConnectionStore.cs'
      - 'AgentPortal.Tests/OpenAiAdsExecutionServiceTests.cs'
      - 'AgentPortal.Tests/OpenAiAdsAccountConnectionAuthorityTests.cs'
      - 'AgentPortal.Tests/MarketingDestinationLayerTests.cs'
      - 'AgentPortal.Tests/MarketingScopeParityContractTests.cs'
      - '.github/workflows/step6-openai-ads-execution-validation.yml'
      - 'scripts/validation-resume.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  approved-head-preflight:
    name: approved-head-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate preflight authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify candidate contains current approved head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validation-resume.py approved-head-preflight \
            --repository "${{ github.repository }}" \
            --current-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --event "${{ github.event_name }}" \
            --output "$RUNNER_TEMP/approved-head-preflight.json"

  validate:
    needs: approved-head-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore PR-local validation gate evidence
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/validation-resume-cache
          key: validation-resume-step6-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            validation-resume-step6-pr-${{ github.event.pull_request.number }}-

      - name: Plan exact validation resume
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/validation-resume.json"
          python3 scripts/validation-resume.py plan \
            --workflow step6-openai-ads-execution-validation.yml \
            --current-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --current-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --head-branch "${{ github.head_ref || github.ref_name }}" \
            --event "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --resume-cache "/tmp/validation-resume-cache/validation-resume.json" \
            --output "$plan"
          python3 - "$plan" "$GITHUB_OUTPUT" <<'PYPLAN'
          import json, sys
          data=json.load(open(sys.argv[1]))
          running=any(row.get('run') for row in data.get('gates',{}).values())
          with open(sys.argv[2],'a') as output:
              output.write('dotnet='+str(running).lower()+'\n')
              output.write('all_preserved='+str(not running).lower()+'\n')
          PYPLAN

      - uses: actions/setup-dotnet@v4
        if: steps.plan.outputs.dotnet == 'true'
        with:
          dotnet-version: '10.x'

      - name: Restore affected graph
        id: gate_restore
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate restore; then exit 0; fi
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build affected graph
        id: gate_build
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate build; then exit 0; fi
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Run Step 6 execution and standing scope-parity tests
        id: gate_tests
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate tests; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~OpenAiAdsExecutionServiceTests|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~MarketingDestinationLayerTests|FullyQualifiedName~OpenAiAdsAccountConnectionAuthorityTests|FullyQualifiedName~OpenAiAdsDirectConnectionServiceTests|FullyQualifiedName~OpenAiMeasurementDeliveryTests"

      - name: Record canonical child execution evidence
        if: always() && steps.plan.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_STEP_CONTEXT: ${{ toJSON(steps) }}
        run: |
          python3 scripts/validation-resume.py record-evidence \
            --plan "$RUNNER_TEMP/validation-resume.json" \
            --output "$RUNNER_TEMP/validation-resume.json" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --cache-output /tmp/validation-resume-cache/validation-resume.json

      - name: Preserve exact validation resume plan
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validation-resume-step6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-resume.json
          retention-days: 30
          if-no-files-found: error

      - name: Check PR-local validation gate cache readiness
        id: gatecache
        if: always() && steps.plan.outcome == 'success' && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f /tmp/validation-resume-cache/validation-resume.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save PR-local validation gate evidence
        if: always() && steps.gatecache.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/validation-resume-cache
          key: validation-resume-step6-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

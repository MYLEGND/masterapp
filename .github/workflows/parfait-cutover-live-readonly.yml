name: Parfait canonical cutover read-only production evidence

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact validated candidate SHA; never executes with Production credentials
        required: true
        type: string

# Only the existing trusted release branch may mint Production OIDC tokens.
# Promoting this owner remains a separate Founder-authorized operation.
env:
  CANDIDATE_SHA: ${{ inputs.candidate }}

permissions:
  contents: read
  actions: read

jobs:
  validated-observer:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Legend/fast-track-release'
    outputs:
      observer-id: ${{ steps.observer.outputs.artifact-id }}
      contract-id: ${{ steps.contract.outputs.artifact-id }}
    name: Validate exact source and build read-only schema observer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require completed fast-track source validation for this exact candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYVALIDATE'
          import importlib.util,os,re,time
          spec=importlib.util.spec_from_file_location('authority','scripts/validation-resume.py')
          authority=importlib.util.module_from_spec(spec);spec.loader.exec_module(authority)
          repository=os.environ['GITHUB_REPOSITORY']
          candidate=os.environ['CANDIDATE_SHA']
          token=os.environ['GITHUB_TOKEN']
          if not re.fullmatch('[a-f0-9]{40}',candidate):
              raise SystemExit('EXACT_SOURCE_CANDIDATE_INVALID')
          pulls=authority.api_get(repository,f'commits/{candidate}/pulls?per_page=100',token)
          if not isinstance(pulls,list) or len(pulls)>=100:
              raise SystemExit('EXACT_SOURCE_PR_HISTORY_INCOMPLETE')
          candidates=[p for p in pulls if p.get('head',{}).get('sha')==candidate
              and p.get('head',{}).get('repo',{}).get('full_name')==repository
              and p.get('base',{}).get('repo',{}).get('full_name')==repository
              and p.get('base',{}).get('ref')==authority.FAST_TRACK_PR_BASE]
          if len(candidates)!=1:
              raise SystemExit('FAST_TRACK_VALIDATION_SOURCE_UNPROVEN')
          pull=candidates[0]
          required=('parfait-isolated-validation.yml','approved-release-security-validation.yml',
                    'masterapp-platform-architecture-validation.yml')
          deadline=time.monotonic()+1800
          while True:
              payload=authority.api_get(repository,f'actions/runs?head_sha={candidate}&per_page=100',token)
              runs=payload.get('workflow_runs')
              if not isinstance(runs,list) or payload.get('total_count')!=len(runs):
                  raise SystemExit('EXACT_SOURCE_HISTORY_INCOMPLETE')
              complete=True
              for workflow in required:
                  matches=[r for r in runs if r.get('path')=='.github/workflows/'+workflow
                      and r.get('event')=='pull_request' and r.get('head_sha')==candidate
                      and r.get('head_branch')==pull['head']['ref']
                      and r.get('head_repository',{}).get('full_name')==repository]
                  if not matches:
                      complete=False
                      continue
                  run=max(matches,key=lambda r:r['id'])
                  if run['status']!='completed':
                      complete=False
                  elif run['conclusion']!='success':
                      raise SystemExit('EXACT_SOURCE_VALIDATION_FAILED: '+workflow)
                  else:
                      authority.fast_track_validation_receipt(repository,run,workflow,candidate,pull['number'],token)
              if complete:
                  print('EXACT_FAST_TRACK_SOURCE_VALIDATION: PROVEN')
                  break
              if time.monotonic()>=deadline:
                  raise SystemExit('EXACT_SOURCE_VALIDATION_NOT_READY: resume this read-only workflow after validation')
              time.sleep(15)
          PYVALIDATE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build canonical schema observer without production credentials
        run: |
          python3 scripts/migration-probe-package.py build \
            --tool-revision "$CANDIDATE_SHA" --application-revision "$CANDIDATE_SHA" \
            --directory "$RUNNER_TEMP/parfait-schema-observer"
          cp "$RUNNER_TEMP/parfait-schema-observer/migration-contract.json" "$RUNNER_TEMP/migration-contract.json"
      - uses: actions/upload-artifact@v4
        id: observer
        with:
          name: parfait-readonly-schema-observer-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parfait-schema-observer
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: contract
        with:
          name: parfait-readonly-contract-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/migration-contract.json
          retention-days: 30
          if-no-files-found: error

  production-readback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Legend/fast-track-release'
    name: Non-mutating Azure, SQL schema and public runtime inventory
    needs: validated-observer
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build immutable trusted observer before Production sign-in
        run: |
          dotnet publish scripts/MigrationReleaseProbe/MigrationReleaseProbe.csproj -c Release --nologo \
            -m:1 -nr:false -p:UseSharedCompilation=false -o "$RUNNER_TEMP/parfait-trusted-observer"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validated-observer.outputs.contract-id }}
          path: ${{ runner.temp }}/parfait-candidate-contract
          merge-multiple: true
      - name: Require exact candidate inputs and trusted schema compatibility before sign-in
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet "$RUNNER_TEMP/parfait-trusted-observer/MigrationReleaseProbe.dll" --export-contract > "$RUNNER_TEMP/trusted-contract.json"
          python3 - <<'PYCONTRACT'
          import importlib.util,json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          candidate=root/'parfait-candidate-contract/migration-contract.json'
          if candidate.is_symlink() or candidate.stat().st_size>4*1024*1024:
              raise SystemExit('TRUSTED_CANDIDATE_CONTRACT_UNPROVEN')
          revision,approved=os.environ['CANDIDATE_SHA'],os.environ['GITHUB_SHA']
          if not all(re.fullmatch('[a-f0-9]{40}',value) for value in (revision,approved)):
              raise SystemExit('TRUSTED_SCHEMA_REVISION_UNPROVEN')
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=approved:
              raise SystemExit('TRUSTED_SCHEMA_CHECKOUT_CHANGED')
          subprocess.run(['git','merge-base','--is-ancestor',approved,revision],check=True)
          spec=importlib.util.spec_from_file_location('authority','scripts/validation-resume.py')
          authority=importlib.util.module_from_spec(spec);spec.loader.exec_module(authority)
          branch=authority.api_get(os.environ['GITHUB_REPOSITORY'],
              'git/ref/heads/'+authority.FAST_TRACK_PR_BASE,os.environ['GITHUB_TOKEN'])
          if branch.get('object',{}).get('sha')!=approved:
              raise SystemExit('TRUSTED_SCHEMA_HEAD_CHANGED')
          def unique(pairs):
              result={}
              for key,value in pairs:
                  if key in result:raise SystemExit('TRUSTED_CANDIDATE_CONTRACT_UNPROVEN')
                  result[key]=value
              return result
          contract=json.loads(candidate.read_text(),object_pairs_hook=unique)
          trusted=json.loads((root/'trusted-contract.json').read_text(),object_pairs_hook=unique)
          proof=authority.candidate_migration_contract_proven(revision,approved,contract,trusted)
          # Only this immutable trusted DLL runs here. Candidate assemblies are
          # built and exercised exclusively in credential-free jobs.
          result=subprocess.run(['dotnet',str(root/'parfait-trusted-observer/MigrationReleaseProbe.dll'),
              '--validate-contract',str(candidate)],capture_output=True,text=True,timeout=60,check=True)
          verified=json.loads(result.stdout)
          expected='approved-prefix-reviewed-receptionist-entry' if proof['rule']=='approved-prefix-reviewed-receptionist-entry' else 'approved-definitions-exact'
          if (verified.get('schemaVersion')!=1 or verified.get('purpose')!='trusted-schema-contract-compatibility'
              or verified.get('authorizesMutation') is not False or verified.get('rule')!=expected
              or any(not re.fullmatch('[a-f0-9]{64}',str(verified.get(key,'')))
                  for key in ('trustedContractSha256','candidateContractSha256'))):
              raise SystemExit('TRUSTED_SCHEMA_CONTRACT_COMPATIBILITY_UNPROVEN')
          (root/'trusted-contract-proof.json').write_text(json.dumps(dict(proof,observer=verified),sort_keys=True)+'\n')
          print('TRUSTED_SCHEMA_CONTRACT_COMPATIBILITY:PROVEN:'+proof['rule'])
          PYCONTRACT
      - name: Azure production sign-in (read-only queries only)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Azure current app status and safety configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parfait-proof"
          for app in masterapp-parfait masterapp-protect; do
            az webapp show --resource-group masterapp-rg --name "$app" --only-show-errors -o json > "$RUNNER_TEMP/parfait-proof/$app-webapp.json"
            az webapp config appsettings list --resource-group masterapp-rg --name "$app" --only-show-errors -o json > "$RUNNER_TEMP/parfait-proof/$app-settings.json"
          done
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"parfait-proof"
          evidence={}
          for app in ("masterapp-parfait","masterapp-protect"):
              site=json.loads((root/(app+"-webapp.json")).read_text())
              settings=json.loads((root/(app+"-settings.json")).read_text())
              rows={r["name"].lower().replace(":","__"):str(r.get("value","")).strip()
                    for r in settings if isinstance(r,dict) and isinstance(r.get("name"),str)}
              def enabled(name):
                  return rows.get(name.lower().replace(":","__"),"").lower()=="true"
              # Values, secret names, customer data, storage paths and connection
              # strings are deliberately never printed or stored in the artifact.
              fields={
                 "azureState":site.get("state"),
                 "httpsOnly":site.get("httpsOnly"),
                 "cutoverFlagEnabled":enabled("Commerce__SharedHostCutover__Enabled"),
                 "previewFlagEnabled":enabled("Commerce__SharedHostPreview__Enabled"),
                 "storageRootPresent":any(k in rows for k in ("parfait__storageroot","parfait_storage_root")),
                 "cutoverManifestPresent":any(k in rows for k in ("commerce__sharedhostcutover__reconciledmanifestsha256",)),
                 "isRunning":site.get("state")=="Running"
              }
              evidence[app]=fields
              print("COMMERCE_READONLY_AZURE",app,json.dumps(fields,sort_keys=True))
          (root/"sanitized-azure.json").write_text(json.dumps(evidence,indent=2))
          # This is a source/config inventory, NOT production SQL/media/payment proof.
          if not all(v["isRunning"] for v in evidence.values()):
              raise SystemExit("One baseline host is not running; cutover NOT READY.")
          PY

      - name: Compare live source revisions, assets and original public storefront routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          targets=[
             ("parfait-revision","https://masterapp-parfait.azurewebsites.net/api/runtime-provenance","application/json"),
             ("protect-revision","https://masterapp-protect.azurewebsites.net/api/runtime-provenance","application/json"),
             ("parfait-home","https://shopparfait.com/","text/html"),
             ("parfait-store","https://shopparfait.com/store","text/html"),
             ("parfait-cart","https://shopparfait.com/store/cart","text/html"),
             ("parfait-favicon","https://masterapp-parfait.azurewebsites.net/images/favicon/parfait-logo.png","image/")]
          outcomes={}
          for name,url,expected in targets:
              try:
                  req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"LegendParfaitReadOnlyVerifier/1"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      raw=response.read(1024*1024)
                      mime=response.headers.get("Content-Type","")
                      status=response.status
                  valid=status==200 and expected in mime and len(raw)>0
                  revision=None
                  if "revision" in name and valid:
                      revision=json.loads(raw).get("sourceRevision")
                      valid=bool(revision)
                  result={"ok":valid,"status":status,"contentTypeValid":expected in mime,
                          "revision":revision if "revision" in name else None}
              except Exception as e:
                  result={"ok":False,"failureType":type(e).__name__}
              outcomes[name]=result
              print("COMMERCE_READONLY_RUNTIME",name,json.dumps(result,sort_keys=True))
          if not all(v["ok"] for v in outcomes.values()):
              raise SystemExit("Original live runtime readback incomplete; do not authorize cutover.")
          PY

      - name: Reconcile canonical SQL schema without mutation or release admission
        env:
          RELEASE_RESOURCE_GROUP: masterapp-rg
          CONTRACT_ARTIFACT_ID: ${{ needs.validated-observer.outputs.contract-id }}
          OBSERVER_ARTIFACT_ID: ${{ needs.validated-observer.outputs.observer-id }}
        run: |
          python3 - <<'PYSCHEMA'
          import hashlib,importlib.util,json,os,pathlib,re,subprocess
          spec=importlib.util.spec_from_file_location('migration', 'scripts/release-migration.py')
          migration=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(migration)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          results={}
          for app in ('masterapp-parfait','masterapp-protect'):
              os.environ['DATABASE_AUTHORITY']=app
              connection=None
              try:
                  connection=migration.connection_string()
                  observed=migration.observe(root/'parfait-trusted-observer/MigrationReleaseProbe.dll',connection,
                      contract=root/'parfait-candidate-contract/migration-contract.json')
                  fields={key:observed[key] for key in (
                      'databaseIdentity','schemaIdentity','baselineIdentity','ready','pendingCount',
                      'firstPendingMigrationId','lastAppliedMigrationId')}
                  results[app]=dict(fields,observed=True)
              except Exception as error:
                  # Emit only locally authored codes, never provider text or values.
                  reasons={value:key for key,value in migration.PROBE_TERMINAL_REASONS.items()}
                  reasons.update({'Database configuration observation unavailable':'AZURE_CONFIGURATION_READ_UNAVAILABLE',
                                  'Production SQL connection unavailable':'SQL_CONFIGURATION_UNAVAILABLE'})
                  code=reasons.get(str(error),'CANONICAL_SCHEMA_OBSERVATION_UNPROVEN') if type(error) is RuntimeError else 'CANONICAL_SCHEMA_OBSERVATION_UNPROVEN'
                  results[app]={'observed':False,'reason':code}
                  if connection:
                      try:
                          inventory=subprocess.run(['dotnet',str(root/'parfait-trusted-observer/MigrationReleaseProbe.dll'),'--inventory'],
                              env=os.environ|{'LEGEND_RELEASE_DB_CONNECTION':connection},capture_output=True,text=True,timeout=60,check=False)
                          if inventory.returncode==0:
                              data=json.loads(inventory.stdout)
                              for field in ('pendingMigrationIds','unrecognizedAppliedMigrationIds'):
                                  ids=data[field]
                                  if isinstance(ids,list) and len(ids)<=10000 and all(
                                      isinstance(value,str) and re.fullmatch(r'[0-9]{8,14}_[A-Za-z0-9_]{1,128}',value) for value in ids):
                                      results[app][field]=ids
                      except Exception:
                          pass  # Keep the original classified failure; never turn inventory into readiness.
          report=dict(schemaVersion=1,purpose='read-only-schema-plan',authorizesMutation=False,
              candidate=os.environ['CANDIDATE_SHA'],toolRevision=os.environ['GITHUB_SHA'],
              contractCompatibility=json.loads((root/'trusted-contract-proof.json').read_text()),
              contractDigest=hashlib.sha256((root/'parfait-candidate-contract/migration-contract.json').read_bytes()).hexdigest(),
              contractArtifactId=int(os.environ['CONTRACT_ARTIFACT_ID']),
              observerArtifactId=int(os.environ['OBSERVER_ARTIFACT_ID']),runId=os.environ['GITHUB_RUN_ID'],
              producingAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']),applications=results,
              sharedDatabase=(results['masterapp-parfait']['databaseIdentity']==results['masterapp-protect']['databaseIdentity'])
                  if all(row['observed'] for row in results.values()) else None)
          (root/'parfait-proof/sanitized-schema.json').write_text(json.dumps(report,indent=2)+'\n')
          print('COMMERCE_READONLY_SCHEMA',json.dumps(report,sort_keys=True))
          if not all(row['observed'] for row in results.values()):
              raise SystemExit('SQL_SCHEMA_PLAN_INCOMPLETE: preserve source proof; reconcile this stage only')
          PYSCHEMA

      - name: Verify exact observed database recovery metadata without mutation
        env:
          RELEASE_DATABASE_SERVER_RESOURCE_ID: /subscriptions/a543b54e-8a42-4a4b-bd4d-bc13573b1c48/resourceGroups/MasterApp-Data-RG/providers/Microsoft.Sql/servers/masterapp-sql-prod-1221
        run: |
          python3 - <<'PYRECOVERY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('migration','scripts/release-migration.py')
          owner=importlib.util.module_from_spec(spec);spec.loader.exec_module(owner)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'parfait-proof'
          report=json.loads((root/'sanitized-schema.json').read_text())
          if report.get('sharedDatabase') is not True:
              raise SystemExit('RECOVERY_SHARED_DATABASE_UNPROVEN')
          proof=owner.production_recovery(report['applications']['masterapp-protect']['databaseIdentity'])
          (root/'sanitized-recovery.json').write_text(json.dumps(proof,sort_keys=True)+'\n')
          print('COMMERCE_READONLY_RECOVERY:VERIFIED_WITHOUT_MUTATION')
          PYRECOVERY

      - name: Preserve sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parfait-readonly-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/parfait-proof/sanitized-azure.json
            ${{ runner.temp }}/parfait-proof/sanitized-schema.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove private temporary provider responses
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/parfait-proof/masterapp-parfait-settings.json" \
                "$RUNNER_TEMP/parfait-proof/masterapp-protect-settings.json" \
                "$RUNNER_TEMP/parfait-proof/masterapp-parfait-webapp.json" \
                "$RUNNER_TEMP/parfait-proof/masterapp-protect-webapp.json"

  migration-rehearsal:
    name: Rehearse exact migration bundle and recovery without production credentials
    needs: [validated-observer, production-readback]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validated-observer.outputs.observer-id }}
          path: ${{ runner.temp }}/parfait-schema-observer
          merge-multiple: true
      - name: Resolve successful observation for safe rehearsal resume
        id: observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYSOURCE'
          import importlib.util,os
          spec=importlib.util.spec_from_file_location('probe_package','scripts/migration-probe-package.py')
          owner=importlib.util.module_from_spec(spec);spec.loader.exec_module(owner)
          source=owner.fast_track_observation_source(os.environ['GITHUB_REPOSITORY'],os.environ['CANDIDATE_SHA'],
              int(os.environ['GITHUB_RUN_ID']),int(os.environ['GITHUB_RUN_ATTEMPT']),os.environ['GITHUB_TOKEN'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('artifact-id='+str(source['artifactId'])+'\n')
          PYSOURCE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.observation.outputs.artifact-id }}
          path: ${{ runner.temp }}/parfait-proof
          merge-multiple: true
      - name: Prepare and rehearse exact migration bytes against the observed baseline
        id: rehearsal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migration-probe-package.py fast-track-prepare \
            --tool-revision "$CANDIDATE_SHA" --application-revision "$CANDIDATE_SHA" \
            --observation "$RUNNER_TEMP/parfait-proof/sanitized-schema.json" \
            --probe-directory "$RUNNER_TEMP/parfait-schema-observer" \
            --directory "$RUNNER_TEMP/parfait-fast-track-migration"
      - name: Preserve exact rehearsed bytes and recovery evidence
        if: ${{ steps.rehearsal.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parfait-fast-track-migration-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parfait-fast-track-migration
          retention-days: 30
          if-no-files-found: error

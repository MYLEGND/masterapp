name: Website commerce migration snapshot validation
on:
  push:
    branches:
      - repair/website-commerce-migration-snapshot-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Build exact .NET candidate
        run: dotnet build MASTERAPP.sln -c Release --nologo -warnaserror
      - name: Verify EF model exactly matches migration snapshot
        env:
          ConnectionStrings__MasterAppDb: Server=127.0.0.1;Database=masterapp_ef_design_time;Integrated Security=true;TrustServerCertificate=true;Encrypt=false
          EF_FORCE_SQLSERVER: "true"
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project Infrastructure/Infrastructure.csproj             --startup-project AgentPortal/AgentPortal.csproj             --context MasterAppDbContext             --configuration Release             --no-build
      - name: Run focused commerce and website authorities
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo             --filter 'FullyQualifiedName~CentralizedWebsiteCommerceTests|FullyQualifiedName~ParfaitCheckoutBillingCutoverTests|FullyQualifiedName~WebsiteContentEditorRoundTripTests|FullyQualifiedName~WebsitePublishingAuthorityTests'
      - name: Validate release policy
        run: |
          python3 scripts/test-release-policy.py
          python3 scripts/test-release-lifecycle.py

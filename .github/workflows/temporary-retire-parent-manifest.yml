name: Temporary retire terminal Founder manifest projection
on:
  push:
    branches: [fix/legend-governed-capability-plane-20260824]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply single-authority retirement projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Infrastructure/Messaging/LegendConnectCurriculumManifestProcessing.cs')
          s = p.read_text()
          old = '''            .Where(item =>\n                // A payload rejected before canonical processing has an\n'''
          new = '''            .Where(item =>\n                item.ProcessingState != LegendConnectHistoricalReevaluationWorkAuthority.Retired &&\n                // A payload rejected before canonical processing has an\n'''
          if old not in s:
              raise SystemExit('manifest seed predicate anchor not found')
          s = s.replace(old, new, 1)
          old = '''        if (failed is not null)\n        {\n            manifest.ProcessingState = "Failed";\n            manifest.AttemptCount = failed.AttemptCount;\n'''
          new = '''        if (failed is not null)\n        {\n            // The parent is only a projection of the durable child authority.\n            // A terminal child must therefore retire the parent in place too,\n            // preserving the same historical identity/error without making the\n            // receipt executable or seedable again.\n            manifest.ProcessingState = failed.ProcessingState == LegendConnectHistoricalReevaluationWorkAuthority.Retired\n                ? LegendConnectHistoricalReevaluationWorkAuthority.Retired\n                : "Failed";\n            manifest.AttemptCount = failed.AttemptCount;\n'''
          if old not in s:
              raise SystemExit('manifest failure projection anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit source repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-retire-parent-manifest.yml
          git add Infrastructure/Messaging/LegendConnectCurriculumManifestProcessing.cs
          git diff --cached --check
          git commit -m 'Retire terminal Founder manifest projections in place'
          git push origin HEAD:fix/legend-governed-capability-plane-20260824
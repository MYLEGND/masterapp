name: Apply Founder AI full diagnostic access repair

on:
  push:
    branches:
      - fix/founder-ai-full-diagnostic-access-20260825

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founder-ai-full-diagnostic-access-20260825
          fetch-depth: 0

      - name: Apply surgical one-authority diagnostic repair
        run: python3 .github/scripts/apply-founder-ai-full-diagnostic-access.py

      - name: Verify surgical diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          test ! -e .github/workflows/apply-founder-ai-full-diagnostic-access.yml
          test ! -e .github/scripts/apply-founder-ai-full-diagnostic-access.py
          grep -q 'SerializeFounderToolFailure' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'IsAllowedReadPath' AgentPortal/Services/FounderSoftwareRemediationService.cs
          grep -q 'IsAllowedRepairPath' AgentPortal/Services/FounderSoftwareRemediationService.cs

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'legend-founder-remediation[bot]'
          git config user.email 'legend-founder-remediation[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Expand Founder AI governed diagnostic access'
          git push origin HEAD:fix/founder-ai-full-diagnostic-access-20260825

name: LEGEND architecture proof

on:
  push:
    branches:
      - architecture/legend-sol-takeover-20260828
  workflow_dispatch:

concurrency:
  group: legend-architecture-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.x'
  FROZEN_PRODUCTION_SHA: bcb1915ee1fa991d3b35e707a4e788800d490260

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact architecture candidate
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Prove frozen production baseline did not move
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production freeze/legend-sol-architecture-baseline-20260828
          production_sha="$(git rev-parse origin/production)"
          freeze_sha="$(git rev-parse origin/freeze/legend-sol-architecture-baseline-20260828)"
          test "$production_sha" = "$FROZEN_PRODUCTION_SHA"
          test "$freeze_sha" = "$FROZEN_PRODUCTION_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MASTERAPP.sln

      - name: Build Release with zero warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet build MASTERAPP.sln -c Release --no-restore 2>&1 | tee legend-architecture-build.log
          grep -qE '^[[:space:]]*0 Warning\(s\)' legend-architecture-build.log
          grep -qE '^[[:space:]]*0 Error\(s\)' legend-architecture-build.log

      - name: Discover complete regression suite
        shell: bash
        run: |
          set -o pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --list-tests 2>&1 | tee legend-architecture-discovery.log
          grep -q 'LegendConnectGovernedReasoningExecutorTests' legend-architecture-discovery.log
          grep -q 'LegendConnectDiscourseReferenceBindingTests' legend-architecture-discovery.log
          grep -q 'LegendConnectModelEvaluationTests' legend-architecture-discovery.log
          grep -q 'LegendConnectModelTraining' legend-architecture-discovery.log

      - name: Run complete regression suite
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --logger "trx;LogFileName=legend-complete-regression.trx"

      - name: Run governed reasoning proof
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~LegendConnectGovernedReasoningExecutorTests" --logger "trx;LogFileName=legend-reasoning-proof.trx"

      - name: Run discourse and language-routing proof
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~LegendConnectDiscourseReferenceBindingTests|FullyQualifiedName~LegendFounderAiConversationRoutingTests" --logger "trx;LogFileName=legend-language-proof.trx"

      - name: Run governed model lifecycle proof
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~LegendConnectModelEvaluationTests|FullyQualifiedName~LegendConnectModelTrainingTests|FullyQualifiedName~LegendConnectModelTrainingLifecycleTests|FullyQualifiedName~LegendConnectModelPromotionTests|FullyQualifiedName~LegendConnectProductionNeuralRoutingTests" --logger "trx;LogFileName=legend-model-proof.trx"

      - name: Run architectural takeover gate proof
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~IntelligenceEvaluation_BlocksTakeoverClaimUntilEveryDomainBeatsOneLockedBaseline" --logger "trx;LogFileName=legend-takeover-gate-proof.trx"

      - name: Prove one serving reasoning authority
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E "TryInferConversationAsync|TryInferSemanticTransitionAsync" -- AgentPortal Infrastructure; then
            echo "::error::Obsolete parallel reasoning authority detected."
            exit 1
          fi
          test "$(git grep -l "class LegendConnectGovernedReasoningExecutor" -- Infrastructure | wc -l)" -eq 1
          test "$(git grep -l "class LegendArchitecturalTakeoverGate" -- AgentPortal | wc -l)" -eq 1

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: legend-architecture-proof-${{ github.run_id }}
          path: |
            legend-architecture-build.log
            legend-architecture-discovery.log
            AgentPortal.Tests/TestResults/*.trx
          if-no-files-found: warn

name: LEGEND read-only domain diagnostic

on:
  push:
    branches: [diagnose/camo-domain-proof-20260926]
    paths:
      - '.github/workflows/domain-proof-diagnostic.yml'
  pull_request:
    branches: [legend/approved-changes]
    paths:
      - '.github/workflows/domain-proof-diagnostic.yml'
      - 'scripts/DomainReleaseRefresh/**'
      - 'Infrastructure/WebsiteEditing/**'
      - 'AgentPortal.Tests/WebsiteDomainProofControllerTests.cs'

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/diagnose/camo-domain-proof-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Verify isolated domain proof regression
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --nologo --filter 'FullyQualifiedName~WebsiteDomainProofControllerTests' -p:TreatWarningsAsErrors=true
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect exact production binding without mutation
        shell: bash
        run: |
          set -euo pipefail
          connection="$(az webapp config connection-string list -g masterapp-rg -n masterapp-portal -o json | jq -r '.[] | select(.name=="MasterAppDb") | .value' | head -n 1)"
          if [ -z "$connection" ] || [ "$connection" = null ]; then
            connection="$(az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json | jq -r '.[] | select(.name=="ConnectionStrings__MasterAppDb" or .name=="MasterAppDb" or .name=="SQLCONNSTR_MasterAppDb") | .value' | head -n 1)"
          fi
          test -n "$connection"
          test "$connection" != null
          echo "::add-mask::$connection"
          LEGEND_RELEASE_DOMAIN="camoexterior.com" \
          LEGEND_RELEASE_DB_CONNECTION="$connection" \
          LEGEND_RELEASE_DIAGNOSTIC_ONLY=true \
            dotnet run --project scripts/DomainReleaseRefresh/DomainReleaseRefresh.csproj -c Release

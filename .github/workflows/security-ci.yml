name: Security CI

# Security regression + architecture-invariant gate for MASTERAPP.
# Runs the full test suite (including every security regression suite), a
# dependency vulnerability audit, a committed-secret scan, and narrow
# architecture-invariant source checks that enforce shared-authority adoption.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair_once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/legend-retained-knowledge-retrieval-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/legend-retained-knowledge-retrieval-20260819
          fetch-depth: 0

      - name: Repair existing LEGEND authorities only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          service_path = Path('AgentPortal/Services/LegendFounderAiConversationService.cs')
          service = service_path.read_text()

          start_marker = '''        await ReportProgressAsync(
              progress,
              new LegendFounderAiProgressEvent(
                  "retained_knowledge",
                  "Checking retained LEGEND knowledge relevant to this request."),
              effectiveToken);
          '''
          end_marker = '        var tools = BuildFounderTools();\n'
          start = service.find(start_marker)
          end = service.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Founder AI retained preload block was not found exactly.')
          service = service[:start] + '''        // Retained evidence is demand-driven through the existing governed tool.
          // Casual conversation no longer pays a corpus scan before the model has
          // determined that retained LEGEND evidence is actually needed.
          var instructions = BuildInstructions(mode);

''' + service[end:]

          service = replace_once(
              service,
              '''                        allowTools,
                          providerBudget,
                          effectiveToken);''',
              '''                        allowTools,
                          providerBudget,
                          ResolveReasoningEffortForRound(round, _reasoningEffort),
                          effectiveToken);''',
              'provider call reasoning effort')

          service = replace_once(
              service,
              '''        bool allowTools,
          TimeSpan providerBudget,
          CancellationToken cancellationToken)''',
              '''        bool allowTools,
          TimeSpan providerBudget,
          string reasoningEffort,
          CancellationToken cancellationToken)''',
              'SendResponseAsync signature')

          service = replace_once(
              service,
              '''            reasoning = new
              {
                  effort = _reasoningEffort
              },''',
              '''            reasoning = new
              {
                  effort = reasoningEffort
              },''',
              'provider reasoning payload')

          service = replace_once(
              service,
              '''                            ? "Planning the response and determining which governed LEGEND checks are actually needed."
                              : allowTools''',
              '''                            ? "Responding directly when possible and using governed LEGEND checks only when the request actually needs them."
                              : allowTools''',
              'first-round progress text')

          normalize_marker = '''    private static string NormalizeReasoningEffort(
          string? value)
      {'''
          insert = '''    private static string ResolveReasoningEffortForRound(
          int round,
          string configuredEffort) =>
          round == 0
              ? "low"
              : configuredEffort;

'''
          idx = service.find(normalize_marker)
          if idx < 0:
              raise SystemExit('NormalizeReasoningEffort marker not found.')
          service = service[:idx] + insert + service[idx:]
          service_path.write_text(service)

          ops_path = Path('Infrastructure/Messaging/LegendConnectOperations.cs')
          ops = ops_path.read_text()
          method_start = ops.find('    public async Task<LegendConnectRetainedKnowledgeSearchSnapshot>\n        SearchRetainedKnowledgeAsync(')
          method_end = ops.find('    private static int RetainedKnowledgeMatch(', method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit('Retained knowledge search method boundaries not found.')
          section = ops[method_start:method_end]

          section = replace_once(
              section,
              '''            Math.Clamp(
                  take,
                  1,
                  20);''',
              '''            Math.Clamp(
                  take,
                  1,
                  64);''',
              'retained result bound')

          section = replace_once(
              section,
              '''                .Distinct(StringComparer.Ordinal)
                  .Take(10)
                  .ToArray();''',
              '''                .Distinct(StringComparer.Ordinal)
                  .Take(Math.Clamp(boundedTake * 2, 12, 64))
                  .ToArray();''',
              'dynamic retained query term bound')

          section = replace_once(
              section,
              '''                .OrderByDescending(item =>
                  item.UpdatedUtc)
                  .Take(400)
                  .ToListAsync(cancellationToken);''',
              '''                .Where(item =>
                  sourceLanguage == null ||
                  item.LanguageCode == sourceLanguage)
                  .OrderByDescending(item =>
                  item.UpdatedUtc)
                  .ToListAsync(cancellationToken);''',
              'canonical recency cutoff')

          section = replace_once(
              section,
              '''                    alignment.SupersededUtc == null &&
                      source.IsTrainingEligible &&
                      target.IsTrainingEligible &&''',
              '''                    alignment.SupersededUtc == null &&
                      source.IsTrainingEligible &&
                      target.IsTrainingEligible &&
                      (sourceLanguage == null || source.LanguageCode == sourceLanguage) &&
                      (targetLanguage == null || target.LanguageCode == targetLanguage) &&''',
              'alignment language filters')

          section = replace_once(
              section,
              '''                })
                  .Take(400)
                  .ToListAsync(cancellationToken);''',
              '''                })
                  .ToListAsync(cancellationToken);''',
              'alignment recency cutoff')

          section = replace_once(
              section,
              '''            await _db.Set<LegendLanguageTeacherProposal>()
                  .AsNoTracking()
                  .OrderByDescending(item =>
                      item.UpdatedUtc)
                  .Take(300)
                  .ToListAsync(cancellationToken);''',
              '''            await _db.Set<LegendLanguageTeacherProposal>()
                  .AsNoTracking()
                  .Where(item =>
                      (sourceLanguage == null || item.SourceLanguageCode == sourceLanguage) &&
                      (targetLanguage == null || item.TargetLanguageCode == targetLanguage))
                  .OrderByDescending(item =>
                      item.UpdatedUtc)
                  .ToListAsync(cancellationToken);''',
              'proposal recency cutoff')

          section = replace_once(
              section,
              '''                .OrderByDescending(item =>
                  item.UpdatedUtc)
                  .Take(100)
                  .ToListAsync(cancellationToken);''',
              '''                .OrderByDescending(item =>
                  item.UpdatedUtc)
                  .ToListAsync(cancellationToken);''',
              'model recency cutoff')

          pattern = re.compile(r'''\n\s*var languageMatch =\n.*?;\n\n\s*if \(match == 0 &&\n\s*!languageMatch\)''', re.S)
          section, removed = pattern.subn('\n\n            if (match == 0)', section)
          if removed != 4:
              raise SystemExit(f'Expected 4 languageMatch fallback blocks, removed {removed}')

          section = replace_once(
              section,
              '''            scored
                  .OrderByDescending(item =>
                      item.Item.AuthorityRank)
                  .ThenByDescending(item =>
                      item.Match)''',
              '''            scored
                  .OrderByDescending(item =>
                      item.Match)
                  .ThenByDescending(item =>
                      item.Item.AuthorityRank)''',
              'relevance-first retained ranking')

          ops = ops[:method_start] + section + ops[method_end:]
          ops_path.write_text(ops)

          Path('AgentPortal.Tests/LegendFounderAiConversationDirectResponseTests.cs').write_text(r'''using System.Net;
using System.Security.Claims;
using System.Text;
using AgentPortal.Services;
using Microsoft.Extensions.Configuration;
using Microsoft.Extensions.Logging.Abstractions;
using Xunit;

namespace AgentPortal.Tests;

public sealed class LegendFounderAiConversationDirectResponseTests
{
    [Fact]
    public async Task Greeting_RespondsInFirstProviderRoundWithoutTouchingLegendAuthorities()
    {
        var previousKey = Environment.GetEnvironmentVariable("OPENAI_API_KEY");
        Environment.SetEnvironmentVariable("OPENAI_API_KEY", "test-founder-ai-key");
        try
        {
            var handler = new RecordingHandler();
            var factory = new RecordingFactory(handler);
            var configuration = new ConfigurationBuilder()
                .AddInMemoryCollection(new Dictionary<string, string?>
                {
                    ["OpenAI:ApiKey"] = "test-founder-ai-key",
                    ["OpenAI:Key"] = "test-founder-ai-key",
                    ["OpenAI:LegendFounderAiModel"] = "gpt-5"
                })
                .Build();

            var service = new LegendFounderAiConversationService(
                factory,
                configuration,
                null!,
                NullLogger<LegendFounderAiConversationService>.Instance);

            var response = await service.ReplyAsync(
                new ClaimsPrincipal(new ClaimsIdentity()),
                new LegendFounderAiChatRequest
                {
                    Mode = "legend",
                    Messages = [new LegendFounderAiChatMessage("user", "Hi")]
                });

            Assert.True(response.Succeeded, response.Error);
            Assert.Equal("Hello! How can I help?", response.Message);
            Assert.Equal(1, handler.CallCount);
            Assert.Contains("\"effort\":\"low\"", handler.LastRequestBody, StringComparison.Ordinal);
        }
        finally
        {
            Environment.SetEnvironmentVariable("OPENAI_API_KEY", previousKey);
        }
    }

    [Fact]
    public void FirstRoundReasoningIsLowAndLaterRoundsUseConfiguredEffort()
    {
        var method = typeof(LegendFounderAiConversationService).GetMethod(
            "ResolveReasoningEffortForRound",
            System.Reflection.BindingFlags.NonPublic | System.Reflection.BindingFlags.Static);
        Assert.NotNull(method);
        Assert.Equal("low", method!.Invoke(null, new object[] { 0, "high" }));
        Assert.Equal("high", method.Invoke(null, new object[] { 1, "high" }));
    }

    private sealed class RecordingFactory(RecordingHandler handler) : IHttpClientFactory
    {
        public HttpClient CreateClient(string name) => new(handler, disposeHandler: false)
        {
            BaseAddress = new Uri("https://api.openai.test/")
        };
    }

    private sealed class RecordingHandler : HttpMessageHandler
    {
        public int CallCount { get; private set; }
        public string LastRequestBody { get; private set; } = string.Empty;

        protected override async Task<HttpResponseMessage> SendAsync(
            HttpRequestMessage request,
            CancellationToken cancellationToken)
        {
            CallCount++;
            LastRequestBody = request.Content is null
                ? string.Empty
                : await request.Content.ReadAsStringAsync(cancellationToken);

            const string json = """
            {"status":"completed","output":[{"type":"message","content":[{"type":"output_text","text":"Hello! How can I help?"}]}]}
            """;
            return new HttpResponseMessage(HttpStatusCode.OK)
            {
                Content = new StringContent(json, Encoding.UTF8, "application/json")
            };
        }
    }
}
''')
          PY

          git diff --check

      - name: Commit repair and remove temporary workflow changes
        shell: bash
        run: |
          git checkout origin/meta-authority-cleanup -- .github/workflows/security-ci.yml
          rm -f .github/workflows/legend-ai-repair-once.yml
          git config user.name "MYLEGND"
          git config user.email "zac.owen@mylegnd.com"
          git add AgentPortal/Services/LegendFounderAiConversationService.cs \
                  Infrastructure/Messaging/LegendConnectOperations.cs \
                  AgentPortal.Tests/LegendConnectRetainedKnowledgeScaleTests.cs \
                  AgentPortal.Tests/LegendFounderAiConversationDirectResponseTests.cs \
                  .github/workflows/security-ci.yml \
                  .github/workflows/legend-ai-repair-once.yml
          git diff --cached --check
          git commit -m "Make LEGEND AI response and retained retrieval demand-driven"
          git push origin HEAD:fix/legend-retained-knowledge-retrieval-20260819

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MASTERAPP.sln

      - name: Build (must be 0 warnings / 0 errors)
        run: |
          set -o pipefail
          dotnet build MASTERAPP.sln -c Debug --no-restore 2>&1 | tee build.log
          if ! grep -qE '^[[:space:]]*0 Warning\(s\)' build.log; then
            echo "::error::Build produced warnings; the repository standard is 0 warnings."
            exit 1
          fi

      - name: Test (full suite incl. all security regression suites)
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Debug --no-build

      - name: Database migration validation
        env:
          DB_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/db.sh validate

      - name: No skipped security tests
        run: |
          if grep -REn "Skip[[:space:]]*=" AgentPortal.Tests/*Antiforgery*.cs \
                AgentPortal.Tests/Phase3IdentityAuthorityTests.cs \
                AgentPortal.Tests/Phase4PlatformSecurityTests.cs \
                AgentPortal.Tests/Phase5CrossPlatformSecurityTests.cs \
                AgentPortal.Tests/Phase6ArchitectureInvariantTests.cs \
                AgentPortal.Tests/CalendarControllerTests.cs 2>/dev/null; then
            echo "::error::A security test is marked Skip."
            exit 1
          fi

      - name: Dependency vulnerability audit
        run: |
          set -o pipefail
          dotnet list MASTERAPP.sln package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -qiE '>[[:space:]]*(Low|Moderate|High|Critical)' vuln.log || grep -qi 'has the following vulnerable' vuln.log; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Committed-secret scan
        run: |
          if git ls-files | grep -E 'publish-macos/.*appsettings.*\.json$'; then
            echo "::error::Committed publish-macos appsettings (may contain secrets)."
            exit 1
          fi
          if git ls-files '*appsettings*.json' | xargs -r grep -nEi '(Password|AccountKey|ClientSecret|AccessToken)"?[:=][[:space:]]*"?[^"[:space:],}]+' \
             | grep -vE '"[[:space:]]*"' ; then
            echo "::error::A tracked appsettings file appears to contain a committed secret value."
            exit 1
          fi

      - name: Architecture invariant — composition roots delegate to shared authorities
        run: |
          set -e
          check() { grep -q "$2" "$1" || { echo "::error::$1 missing shared authority '$2'"; exit 1; }; }
          check AgentPortal/Program.cs   AddPlatformDataProtection
          check AgentPortal/Program.cs   PlatformRateLimiting
          check ClientApp/Program.cs     AddPlatformDataProtection
          check ClientApp/Program.cs     PlatformRateLimiting
          check ClientApp/Program.cs     PlatformSecurityHeaders
          check Protect-Website/Program.cs AddPlatformDataProtection
          check Protect-Website/Program.cs PlatformRateLimiting
          check Protect-Website/Program.cs PlatformSecurityHeaders
          check ParfaitApp/Program.cs    PlatformConfigValidation
          check ParfaitApp/Program.cs    PlatformRateLimiting

      - name: Architecture invariant — no inline Azure Data Protection key-ring wiring in apps
        run: |
          if grep -REn 'PersistKeysToAzureBlobStorage|ProtectKeysWithAzureKeyVault' \
                AgentPortal/Program.cs ClientApp/Program.cs Protect-Website/Program.cs ParfaitApp/Program.cs 2>/dev/null; then
            echo "::error::An application composition root inlines Azure Data Protection key-ring wiring."
            exit 1
          fi

      - name: git diff --check
        run: git diff --check

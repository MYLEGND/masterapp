          if old not in text:
              raise SystemExit('timeout isolation contract anchor changed')
          text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/apply-founder-ai-diagnostic-test-contracts.yml').unlink()

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/apply-founder-ai-diagnostic-test-contracts.yml
          grep -q 'GovernedToolReadFailure_DoesNotAbortIndependentGovernedInspection' AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs
          grep -q 'GovernedToolTimeout_DoesNotAbortIndependentGovernedInspection' AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs
          git config user.name 'legend-founder-remediation[bot]'
          git config user.email 'legend-founder-remediation[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prove independent Founder diagnostic reads continue'
          git push origin HEAD:fix/founder-ai-full-diagnostic-access-20260825

name: Production sync checkout validation
on:
  push:
    branches:
      - repair/production-sync-checkout-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate release lifecycle and production sync contract
        run: |
          python3 scripts/test-release-policy.py
          python3 scripts/test-release-lifecycle.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/agentportal-production-deploy.yml').read_text()
          assert 'name: Checkout canonical history for synchronization proof' in text
          assert 'uses: actions/checkout@v4' in text
          assert 'git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_HEAD"' in text
          print('production sync checkout contract verified')
          PY

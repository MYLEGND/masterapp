name: LEGEND release branch lifecycle

# Retired authority. Historical generations remain in Git; this owner must never
# integrate, dispatch, clean branches, or obtain Production credentials again.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject retired release lifecycle
        run: |
          echo 'LEGEND_RELEASE_LIFECYCLE_RETIRED: use the existing Legend/fast-track-release authority'
          exit 1

name: LEGEND release branch lifecycle

on:
  pull_request_target:
    branches: [legend/approved-changes]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - MasterApp platform architecture validation
      - Step 5 isolated conversion mapping validation
      - Step 6 isolated ChatGPT Ads execution validation
      - Steps 7-8 governed advertising and Promote This validation
      - LEGEND approved direct release
      - LEGEND approved release security validation
    types: [completed]
  push:
    branches: [legend/approved-changes]
    paths:
      - .github/workflows/legend-release-lifecycle.yml
      - scripts/release-lifecycle.py
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: legend-release-lifecycle
  cancel-in-progress: false

jobs:
  maintain:
    # Never grant this job to a fork, draft, or untrusted PR author.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Source branches are never checked out or executed with this token.
      - uses: actions/checkout@v4
        with:
          ref: legend/approved-changes
          fetch-depth: 0

      - name: Resolve lifecycle validation authority identity
        id: lifecycleidentity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lifecycle-evidence.json"
          python3 scripts/validation-resume.py lifecycle-evidence \
            --repository "${{ github.repository }}" \
            --output "$evidence"
          python3 - "$evidence" "$GITHUB_OUTPUT" "$GITHUB_ENV" <<'PYLIFECYCLE'
          import json,sys
          data=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as output:
              output.write(f"artifact={data.get('artifact') or ''}\n")
              output.write(f"run_id={data.get('runId') or ''}\n")
          with open(sys.argv[3],'a') as env:
              env.write("REUSE_LIFECYCLE_CONTRACTS="+str(bool(data.get('reusable'))).lower()+"\n")
          print(json.dumps(data,sort_keys=True))
          PYLIFECYCLE

      - name: Check lifecycle safety contracts
        run: |
          if [ "$REUSE_LIFECYCLE_CONTRACTS" = true ]; then
            echo "Preserved unchanged lifecycle safety validation."
            exit 0
          fi
          python3 scripts/test-release-policy.py
          python3 scripts/test-release-lifecycle.py
          python3 scripts/test-validation-resume.py
          python3 scripts/validation-resume.py verify-release-coverage             --workflow all-intentional-direct-release-20260918.yml             --workflow-path .github/workflows/all-intentional-direct-release-20260918.yml
          python3 scripts/validation-resume.py verify-release-coverage             --workflow legend-release-lifecycle.yml             --workflow-path .github/workflows/legend-release-lifecycle.yml

      - name: Retain lifecycle validation authority receipt
        if: env.REUSE_LIFECYCLE_CONTRACTS != 'true'
        shell: bash
        run: |
          printf '%s\n' "${{ steps.lifecycleidentity.outputs.artifact }}" > "$RUNNER_TEMP/lifecycle-validation-receipt.txt"

      - name: Preserve lifecycle validation authority receipt
        if: env.REUSE_LIFECYCLE_CONTRACTS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lifecycleidentity.outputs.artifact }}
          path: ${{ runner.temp }}/lifecycle-validation-receipt.txt
          retention-days: 30
          if-no-files-found: error
      - name: Integrate ready approved change and start direct release
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/release-lifecycle.py integrate --pr "$PR_NUMBER"
      - name: Resume ready changes and corrections on retained branches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-lifecycle.py pending-updates
      - name: Refresh after automatically integrated corrections
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
        run: git fetch --no-tags --prune origin
      - name: Recover authorized direct release when needed
        if: github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          args=()
          if [ -n "$RELEASE_RUN" ]; then args+=(--run "$RELEASE_RUN"); fi
          python3 scripts/release-lifecycle.py reconcile "${args[@]}"
      - name: Refresh approved references before cleanup
        run: git fetch --no-tags --prune origin
      - name: Retire only preserved successfully deployed branches
        if: github.event_name != 'pull_request_target' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-lifecycle.py cleanup --apply --output "$RUNNER_TEMP/branch-cleanup.json"
      - name: Retain exact cleanup decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branch-cleanup.json
          retention-days: 30
          if-no-files-found: warn

name: LEGEND isolated candidate validation

on:
  workflow_dispatch:
    inputs:
      request:
        description: Exact legend-candidate-validation.v1 request approved by the repository authority
        required: true
        type: string

# This workflow has no deployment identity, environment or secret bindings.
permissions:
  contents: read
concurrency:
  group: legend-isolated-candidate-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate dispatch identity before checking out candidate code
        id: request
        env:
          REQUEST_JSON: ${{ inputs.request }}
          TRUSTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          raw = os.environ['REQUEST_JSON']
          if len(raw.encode()) > 4096:
              raise SystemExit('Request exceeds bounded contract')
          value = json.loads(raw)
          assert isinstance(value, dict)
          assert value.get('repository') == os.environ['REPOSITORY']
          assert value.get('trustedWorkflowSha') == os.environ['TRUSTED_SHA']
          assert value.get('profile') == 'cloudflare-contracts'
          assert re.fullmatch(r'[0-9a-f]{40}', value.get('candidateSha', ''))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'request.json').write_text(raw)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('candidate=' + value['candidateSha'] + '\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.request.outputs.candidate }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and execute fixed candidate checks
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          python3 -B trusted/scripts/legend-candidate-validation.py run \
            --request "$RUNNER_TEMP/request.json" \
            --trusted-root "$GITHUB_WORKSPACE/trusted" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/legend-validation/receipt.json"
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legend-candidate-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/legend-validation/receipt.json
            ${{ runner.temp }}/legend-validation/node.log
            ${{ runner.temp }}/legend-validation/restore.log
            ${{ runner.temp }}/legend-validation/dotnet.log
            ${{ runner.temp }}/legend-validation/contracts.trx
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false

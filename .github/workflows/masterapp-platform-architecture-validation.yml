name: MasterApp platform architecture validation

on:
  push:
    branches:
      - architecture/masterapp-platform-ownership-20260925
    paths-ignore:
      - 'Docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterapp-platform-architecture-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore .NET graph
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build shared infrastructure
        run: dotnet build Infrastructure/Infrastructure.csproj -c Release --no-restore

      - name: Build Protect host
        run: dotnet build Protect-Website/ProtectWebsite.csproj -c Release --no-restore

      - name: Compile full regression test project
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Run website ownership and publishing regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteContentEditorRoundTripTests|FullyQualifiedName~WebsiteEditorTicketAuthorityIsolationTests|FullyQualifiedName~WebsiteDomainImportTests"

      - name: Run Meta authority regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~MetaSignalAnalyticsBridgeTests|FullyQualifiedName~MetaSignalBridgeRecoveryTests|FullyQualifiedName~MetaSignalOutcomeDispatcherHostedServiceTests|FullyQualifiedName~MetaConversionsApiServiceTests"

      - name: Run booking authority regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~PublicBookingResolverTests|FullyQualifiedName~PublicBookingConfirmationServiceTests|FullyQualifiedName~LifeQuoteControllerPublicBookingTests"

      - name: Install shared website renderer dependencies
        working-directory: Legend-Website
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build shared website renderer
        working-directory: Legend-Website
        run: npm run build

      - name: Verify renderer authority parity
        working-directory: Legend-Website
        run: npm run check

      - name: Run business renderer tests with approved-baseline no-regression proof
        shell: bash
        run: |
          set +e
          (cd Legend-Website && npm run test:renderer)
          renderer_rc=$?
          set -e
          if [ "$renderer_rc" -eq 0 ]; then
            exit 0
          fi

          git fetch --no-tags origin legend/approved-changes
          base=origin/legend/approved-changes

          # A failing renderer suite may only be treated as pre-existing when the
          # renderer and its tests are unchanged and the centralized assets are
          # byte-identical to their approved pre-move authorities.
          git diff --quiet "$base" -- Legend-Website/scripts/render-business.mjs
          git diff --quiet "$base" -- Legend-Website/scripts/render-business.test.mjs
          git diff --quiet "$base" -- Legend-Website/package-lock.json

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git show "$base:Legend-Design/legend-public-cms.js" > "$tmpdir/legend-public-cms.js"
          git show "$base:Legend-Design/legend-public-web.js" > "$tmpdir/legend-public-web.js"
          git show "$base:Legend-Design/legend-public-web.css" > "$tmpdir/legend-public-web.css"
          cmp -s SHARED/WebsitePlatform/legend-public-cms.js "$tmpdir/legend-public-cms.js"
          cmp -s SHARED/WebsitePlatform/legend-public-web.js "$tmpdir/legend-public-web.js"
          cmp -s SHARED/WebsitePlatform/legend-public-web.css "$tmpdir/legend-public-web.css"

          echo "Renderer suite failure is pre-existing and all renderer inputs touched by this ownership move are byte-identical to the approved baseline."

      - name: Run canonical shared CMS tests
        run: node --test tests/website/legend-public-cms.test.mjs

name: MasterApp platform architecture validation

# analytics-meta-scope-completion validation trigger: latest isolated head
# repaired booking harness validation trigger: d5db695

on:
  push:
    branches:
      - architecture/masterapp-platform-ownership-20260925
      - architecture/masterapp-authority-completion-20260925
      - architecture/consolidated-platform-domain-release-20260925
      - architecture/protect-domain-proof-20260925
      - architecture/analytics-meta-scope-completion-20260925
      - repair/analytics-canonical-reconciliation-20260926
      - repair/scoped-website-analytics-canonical-20260926
      - architecture/meta-test-events-seo-20260926
      - architecture/provider-neutral-marketing-destinations-20260926
      - feature/openai-ads-direct-connect-ui-20260926
      - fix/openai-ads-account-readiness-20260926
      - fix/openai-measurement-refresh-failsoft-20260926
      - fix/openai-pixel-provisioning-outcome-20260927
    paths-ignore:
      - 'Docs/**'
  pull_request:
    branches:
      - legend/approved-changes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: masterapp-platform-architecture-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan exact validation resume
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validation-resume.py plan \
            --workflow masterapp-platform-architecture-validation.yml \
            --current-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --current-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --head-branch "${{ github.head_ref || github.ref_name }}" \
            --event "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --output "$RUNNER_TEMP/validation-resume.json"

      - name: Run branch lifecycle safety contracts
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate lifecycle; then exit 0; fi
          python3 scripts/test-release-lifecycle.py

      - name: Run authenticated mobile authority tests
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate mobile; then exit 0; fi
          node --test tests/layout/modal-content-region.test.mjs tests/layout/app-navigation-contract.test.mjs

      - name: Restore .NET graph
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate restore-dotnet; then exit 0; fi
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build shared infrastructure
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate build-infrastructure; then exit 0; fi
          dotnet build Infrastructure/Infrastructure.csproj -c Release --no-restore

      - name: Build AgentPortal and ClientApp hosts
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate build-hosts; then exit 0; fi
          dotnet build AgentPortal/AgentPortal.csproj -c Release --no-restore
          dotnet build ClientApp/ClientApp.csproj -c Release --no-restore

      - name: Build Protect host
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate build-protect; then exit 0; fi
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --no-restore

      - name: Verify Protect serves the exact shared tracking assets
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate tracking-assets; then exit 0; fi
          dotnet publish Protect-Website/ProtectWebsite.csproj -c Release --no-restore -o "$RUNNER_TEMP/protect-authority-publish"
          cmp SHARED/WebsitePlatform/tracking.js "$RUNNER_TEMP/protect-authority-publish/wwwroot/js/tracking.js"
          cmp SHARED/WebsitePlatform/meta-signal-intelligence.js "$RUNNER_TEMP/protect-authority-publish/wwwroot/js/meta-signal-intelligence.js"
          cmp SHARED/WebsitePlatform/openai-measurement.js "$RUNNER_TEMP/protect-authority-publish/wwwroot/js/openai-measurement.js"

      - name: Install shared website renderer dependencies
        working-directory: Legend-Website
        shell: bash
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validation-resume.py" preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate renderer-install; then exit 0; fi
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build shared website renderer
        working-directory: Legend-Website
        shell: bash
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validation-resume.py" preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate renderer-build; then exit 0; fi
          npm run build

      - name: Verify renderer authority parity
        working-directory: Legend-Website
        shell: bash
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validation-resume.py" preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate renderer-parity; then exit 0; fi
          npm run check

      - name: Run business renderer tests with approved-baseline no-regression proof
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate renderer-tests; then exit 0; fi
          set +e
          (cd Legend-Website && npm run test:renderer)
          renderer_rc=$?
          set -e
          if [ "$renderer_rc" -eq 0 ]; then
            exit 0
          fi

          git fetch --no-tags origin legend/approved-changes
          base=origin/legend/approved-changes

          # Only excuse an approved-baseline failure when every renderer input,
          # its tests, and the shared runtime are byte-identical to that baseline.
          git diff --quiet "$base" -- Legend-Website/scripts/render-business.mjs Legend-Website/scripts/render-business.test.mjs Legend-Website/package-lock.json
          git diff --quiet "$base" -- SHARED/WebsitePlatform/legend-public-cms.js SHARED/WebsitePlatform/legend-public-web.js SHARED/WebsitePlatform/legend-public-web.css
          git diff --quiet "$base" -- tests/website ':!tests/website/legend-public-cms.test.mjs'
          git diff --quiet "$base" -- tests/website/legend-public-cms.test.mjs
          cmp -s SHARED/WebsitePlatform/tracking.js <(git show "$base:SHARED/WebsitePlatform/tracking.js")
          cmp -s SHARED/WebsitePlatform/meta-signal-intelligence.js <(git show "$base:SHARED/WebsitePlatform/meta-signal-intelligence.js")
          echo "Renderer suite failure also exists with byte-identical approved renderer inputs."

      - name: Install canonical shared CMS test dependencies
        working-directory: tests/website
        shell: bash
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validation-resume.py" preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate cms-install; then exit 0; fi
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run canonical shared CMS tests
        working-directory: tests/website
        shell: bash
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validation-resume.py" preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate cms-tests; then exit 0; fi
          npm test

      - name: Compile full regression test project
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate compile-regression; then exit 0; fi
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Compile shared domain release refresh
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate domain-release; then exit 0; fi
          dotnet build scripts/DomainReleaseRefresh/DomainReleaseRefresh.csproj -c Release --nologo -warnaserror

      - name: Run website ownership and publishing regressions
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate website-regressions; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteContentEditorRoundTripTests|FullyQualifiedName~WebsiteEditorTicketAuthorityIsolationTests|FullyQualifiedName~WebsiteDomainImportTests|FullyQualifiedName~WebsiteInquiryIsolationTests|FullyQualifiedName~BusinessWorkspaceTests|FullyQualifiedName~BusinessAnalyticsCompletionTests|FullyQualifiedName~AnalyticsCanonicalReconciliationTests|FullyQualifiedName~AnalyticsPageRoutingTruthTests"

      - name: Run Meta authority regressions
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate meta-regressions; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~MetaSignalAnalyticsBridgeTests|FullyQualifiedName~MetaSignalBridgeRecoveryTests|FullyQualifiedName~MetaSignalOutcomeDispatcherHostedServiceTests|FullyQualifiedName~MetaConversionsApiServiceTests|FullyQualifiedName~MetaSendAuthorityTests|FullyQualifiedName~UnifiedEventMapperTests|FullyQualifiedName~AnalyticsIngestControllerTests|FullyQualifiedName~LaunchAuditReliabilityTests|FullyQualifiedName~WebsiteInquiryIsolationTests|FullyQualifiedName~MarketingConnectionIsolationTests|FullyQualifiedName~MarketingDestinationLayerTests|FullyQualifiedName~OpenAiAdsAccountConnectionAuthorityTests|FullyQualifiedName~OpenAiAdsDirectConnectionServiceTests|FullyQualifiedName~OpenAiMeasurementDeliveryTests|FullyQualifiedName~OpenAiClickReferenceLineageTests|FullyQualifiedName~MarketingSetupCentralizationTests|FullyQualifiedName~BusinessMetaPixelResolutionTests|FullyQualifiedName~BusinessMetaAdsScopeTests|FullyQualifiedName~MetaSignalSingleTruthPolicyTests|FullyQualifiedName~TrackingProxyContractTests|FullyQualifiedName~ProtectLeadModalInquiryTests|FullyQualifiedName~MetaSignalContractTests|FullyQualifiedName~TrackingFailLoudContractTests|FullyQualifiedName~QuoteProductInstrumentationContractTests|FullyQualifiedName~AnalyticsEventCatalogTests"

      - name: Run booking authority regressions
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate booking-regressions; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~PublicBookingResolverTests|FullyQualifiedName~PublicBookingConfirmationServiceTests|FullyQualifiedName~LifeQuoteControllerPublicBookingTests|FullyQualifiedName~PublicBookingControllerParityTests"

      - name: Run CRM outcome regressions
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate crm-regressions; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~LeadsControllerTests|FullyQualifiedName~ProductionControllerTests|FullyQualifiedName~WebsiteAnalyticsScopeTests|FullyQualifiedName~LaunchAuditRiskAssessmentTests|FullyQualifiedName~CanonicalCrmOutcomeLineageTests"

      - name: Run canonical form tracking tests
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate form-tracking; then exit 0; fi
          node --test tests/analytics/form-tracker.test.cjs
      - name: Verify consolidated release scope and routing policy
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate release-policy; then exit 0; fi
          python3 scripts/test-release-policy.py
          python3 scripts/test-deploy-approved-app.py


name: MasterApp platform architecture validation

on:
  push:
    branches:
      - architecture/masterapp-platform-ownership-20260925
      - architecture/masterapp-authority-completion-20260925
    paths-ignore:
      - 'Docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterapp-platform-architecture-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore .NET graph
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build shared infrastructure
        run: dotnet build Infrastructure/Infrastructure.csproj -c Release --no-restore

      - name: Build Protect host
        run: dotnet build Protect-Website/ProtectWebsite.csproj -c Release --no-restore

      - name: Verify Protect serves the exact shared tracking assets
        run: |
          cmp SHARED/WebsitePlatform/tracking.js Protect-Website/bin/Release/net10.0/wwwroot/js/tracking.js
          cmp SHARED/WebsitePlatform/meta-signal-intelligence.js Protect-Website/bin/Release/net10.0/wwwroot/js/meta-signal-intelligence.js

      - name: Compile full regression test project
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Run website ownership and publishing regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteContentEditorRoundTripTests|FullyQualifiedName~WebsiteEditorTicketAuthorityIsolationTests|FullyQualifiedName~WebsiteDomainImportTests"

      - name: Run Meta authority regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~MetaSignalAnalyticsBridgeTests|FullyQualifiedName~MetaSignalBridgeRecoveryTests|FullyQualifiedName~MetaSignalOutcomeDispatcherHostedServiceTests|FullyQualifiedName~MetaConversionsApiServiceTests|FullyQualifiedName~UnifiedEventMapperTests|FullyQualifiedName~AnalyticsIngestControllerTests|FullyQualifiedName~LaunchAuditReliabilityTests|FullyQualifiedName~WebsiteInquiryIsolationTests|FullyQualifiedName~MarketingConnectionIsolationTests|FullyQualifiedName~BusinessMetaPixelResolutionTests|FullyQualifiedName~BusinessMetaAdsScopeTests|FullyQualifiedName~MetaSignalSingleTruthPolicyTests"

      - name: Run booking authority regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~PublicBookingResolverTests|FullyQualifiedName~PublicBookingConfirmationServiceTests|FullyQualifiedName~LifeQuoteControllerPublicBookingTests"

      - name: Run CRM outcome regressions
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~LeadsControllerTests|FullyQualifiedName~ProductionControllerTests|FullyQualifiedName~WebsiteAnalyticsScopeTests"

      - name: Install shared website renderer dependencies
        working-directory: Legend-Website
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build shared website renderer
        working-directory: Legend-Website
        run: npm run build

      - name: Verify renderer authority parity
        working-directory: Legend-Website
        run: npm run check

      - name: Run business renderer tests with approved-baseline no-regression proof
        shell: bash
        run: |
          set +e
          (cd Legend-Website && npm run test:renderer)
          renderer_rc=$?
          set -e
          if [ "$renderer_rc" -eq 0 ]; then
            exit 0
          fi

          git fetch --no-tags origin legend/approved-changes
          base=origin/legend/approved-changes

          # Only excuse an approved-baseline failure when every renderer input,
          # its tests, and the shared runtime are byte-identical to that baseline.
          git diff --quiet "$base" -- Legend-Website SHARED/WebsitePlatform tests/website
          echo "Renderer suite failure also exists with byte-identical approved renderer inputs."

      - name: Install canonical shared CMS test dependencies
        working-directory: tests/website
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run canonical shared CMS tests
        working-directory: tests/website
        run: npm test

      - name: Run canonical form tracking tests
        run: node --test tests/analytics/form-tracker.test.cjs

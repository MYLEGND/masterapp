name: Finalize LEGEND Founder Provider Resilience

on:
  push:
    branches:
      - fix/legend-founder-provider-resilience-20260819

permissions:
  contents: write

concurrency:
  group: legend-founder-provider-resilience-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/legend-founder-provider-resilience-20260819
          fetch-depth: 0
      - name: Remove unreachable legacy fallthrough only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AgentPortal/Services/LegendFounderAiConversationService.cs')
          s = p.read_text()
          old = '''        return null;\n    }\n\n    private static async Task WaitForProviderCooldownAsync('''
          new = '''    }\n\n    private static async Task WaitForProviderCooldownAsync('''
          if s.count(old) != 1:
              raise SystemExit(f'expected one legacy fallthrough, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify exact scope
        run: |
          set -e
          git diff --check
          test "$(git diff --name-only)" = "AgentPortal/Services/LegendFounderAiConversationService.cs"
      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPortal/Services/LegendFounderAiConversationService.cs
          git commit -m 'Finalize LEGEND provider retry loop'
          git push origin HEAD:fix/legend-founder-provider-resilience-20260819

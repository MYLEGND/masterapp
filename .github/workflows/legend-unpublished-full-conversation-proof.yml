name: LEGEND unpublished held-out full conversation proof

on:
  push:
    branches:
      - fix/legend-governed-reasoning-executor-20260827
    paths:
      - .github/workflows/legend-unpublished-full-conversation-proof.yml

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'

jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: Production
    steps:
      - name: Checkout unpublished candidate
        uses: actions/checkout@v4
        with:
          ref: fix/legend-governed-reasoning-executor-20260827
          fetch-depth: 0

      - name: Materialize exact unpublished candidate and inject conversation diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/legend-governed-reasoning-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AgentPortal.Tests/LegendFounderCurriculumSqlServerE2ETests.cs')
          text = path.read_text()
          anchor = '    [Fact]\n    public async Task ProductionReadOnlyEightPromptNativeDiagnostic()'
          if text.count(anchor) != 1:
              raise SystemExit('conversation insertion anchor drifted')
          method = r'''    [Fact]
              public async Task ProductionReadOnlyHeldOutFullConversationDiagnostic()
              {
                  var connectionString = Environment.GetEnvironmentVariable("LEGEND_PRODUCTION_READONLY_CONNECTION");
                  var founderId = Environment.GetEnvironmentVariable("LEGEND_PRODUCTION_READONLY_FOUNDER_OID");
                  if (string.IsNullOrWhiteSpace(connectionString) || string.IsNullOrWhiteSpace(founderId))
                  {
                      _output.WriteLine("Production conversation diagnostic was not selected.");
                      return;
                  }

                  var previousOpenAi = Environment.GetEnvironmentVariable("OPENAI_API_KEY");
                  var previousOpenAiConfig = Environment.GetEnvironmentVariable("OpenAI__ApiKey");
                  var previousFounder = Environment.GetEnvironmentVariable("FOUNDER_OID");
                  Environment.SetEnvironmentVariable("OPENAI_API_KEY", string.Empty);
                  Environment.SetEnvironmentVariable("OpenAI__ApiKey", string.Empty);
                  Environment.SetEnvironmentVariable("FOUNDER_OID", founderId);
                  try
                  {
                      var connection = new SqlConnectionStringBuilder(connectionString)
                      {
                          ApplicationName = "LEGEND unpublished held-out full conversation",
                          ApplicationIntent = ApplicationIntent.ReadOnly
                      };
                      var readOnlyGuard = new ReadOnlyLegendDbCommandInterceptor();
                      await using var db = new MasterAppDbContext(
                          new DbContextOptionsBuilder<MasterAppDbContext>()
                              .UseSqlServer(connection.ConnectionString)
                              .UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking)
                              .AddInterceptors(readOnlyGuard)
                              .Options);

                      Assert.True(await db.AgentProfiles.AsNoTracking().AnyAsync(item =>
                          item.IsActive && item.AgentUserId != null && item.AgentUserId.ToLower() == founderId!.ToLower()));

                      var configuration = new ConfigurationBuilder()
                          .AddInMemoryCollection(new[]
                          {
                              new KeyValuePair<string, string?>("OpenAI:ApiKey", string.Empty),
                              new KeyValuePair<string, string?>("LegendConnect:CorpusAcquisition:Enabled", "false"),
                              new KeyValuePair<string, string?>("LegendConnect:ContextualComposition:Mode", "Shadow")
                          }).Build();
                      var registry = new LegendLanguageRegistry(db, configuration);
                      var corpus = new LegendConnectCorpusService(db, registry, NullLogger<LegendConnectCorpusService>.Instance);
                      var curriculum = new LegendConnectCurriculumService(db, registry, corpus);
                      var operations = new LegendConnectOperations(db, registry, corpus, configuration, curriculum: curriculum);
                      var founder = new ClaimsPrincipal(new ClaimsIdentity([new Claim("oid", founderId!)], "production-held-out-conversation"));
                      var profiles = new AgentProfileAccessResolver(db);
                      var founderLegend = new FounderLegendConnectService(operations, profiles);
                      var factory = new CountingHttpClientFactory();
                      var discourse = new LegendFounderAiDiscourseStateService(db, profiles, operations);
                      var chat = new LegendFounderAiConversationService(
                          factory,
                          configuration,
                          founderLegend,
                          NullLogger<LegendFounderAiConversationService>.Instance,
                          discourse);

                      var prompts = new[]
                      {
                          "Before we touch the research finding, separate the objective, constraints, dependencies, and deliverable so we know what success means.",
                          "Now classify the evidence before drawing any conclusion. Separate confirmed facts, supported inferences, assumptions, estimates, and unknowns.",
                          "Check whether the conclusion about the research finding actually follows from the evidence without adding an unstated premise, and explain the shortest valid reasoning path.",
                          "Diagnose the investigation plan by separating symptoms, candidate causes, and contributing conditions. Rank plausible causes and choose the check that best distinguishes them.",
                          "Now build the ordered plan, respecting dependencies, verification gates, decision points, and a bounded fallback.",
                          "Compare the research finding options using the same explicit criteria. Eliminate anything that violates hard constraints, state the decisive tradeoff, and name the strongest alternative.",
                          "Analyze the research finding across plausible future scenarios. Include second-order effects, reversible probes, leading indicators, recovery options, and adaptation triggers.",
                          "Synthesize the research summary for a decision maker: lead with the main conclusion, tie major claims to evidence, preserve conflicts, and state unresolved questions.",
                          "Before finalizing, detect whether the missing audience scope would materially change the answer. If it would, ask only the decisive clarification instead of guessing.",
                          "Switch contexts: the draft says the deadline is Tuesday, but the authoritative schedule says Wednesday. Correct the statement and explain the repair.",
                          "Verify the arithmetic claim that twelve plus eight equals twenty-one, correct only what is wrong, and state the checked result.",
                          "Switch again and explain idempotency to an experienced engineer without beginner simplification."
                      };

                      var transcript = new List<LegendFounderAiChatMessage>();
                      var passed = 0;
                      _output.WriteLine("============================================================");
                      _output.WriteLine("LEGEND® UNPUBLISHED HELD-OUT FULL CONVERSATION");
                      _output.WriteLine("REAL PRODUCTION CURRICULUM / READ ONLY / OPENAI BLOCKED");
                      _output.WriteLine("============================================================");

                      for (var index = 0; index < prompts.Length; index++)
                      {
                          var prompt = prompts[index];
                          var normalizedPrompt = LegendLanguageIdentity.NormalizeText(prompt);
                          var exactPromptStored = await db.LegendLanguageTextUnits.AsNoTracking().AnyAsync(item =>
                              item.LanguageCode == "en" && item.IsTrainingEligible && item.Text == normalizedPrompt);
                          var graph = await operations.AnalyzeReusableMeaningGraphAsync(prompt);
                          var lexical = await curriculum.AnalyzeSemanticTransitionSourceSemanticsAsync("en", prompt);
                          var context = transcript.Select(message => new LegendConnectConversationContextItem(
                              message.Role ?? string.Empty,
                              message.Content ?? string.Empty)).ToArray();

                          LegendConnectNativeInferenceSnapshot? withoutContext = null;
                          if (index == 1 || index == 4)
                          {
                              withoutContext = await founderLegend.TryInferConversationWithDiscourseAsync(
                                  founder,
                                  prompt,
                                  Array.Empty<LegendConnectConversationContextItem>(),
                                  discourseState: null);
                          }

                          var native = await founderLegend.TryInferConversationWithDiscourseAsync(
                              founder,
                              prompt,
                              context,
                              discourseState: null);
                          var requestMessages = transcript
                              .Append(new LegendFounderAiChatMessage("user", prompt))
                              .ToArray();
                          var reply = await chat.ReplyAsync(
                              founder,
                              new LegendFounderAiChatRequest
                              {
                                  Mode = "legend",
                                  NativeOnly = true,
                                  Messages = requestMessages
                              });
                          var normalizedResponse = LegendLanguageIdentity.NormalizeText(reply.Message ?? string.Empty);
                          var exactResponseStored = string.IsNullOrWhiteSpace(normalizedResponse)
                              ? false
                              : await db.LegendLanguageTextUnits.AsNoTracking().AnyAsync(item =>
                                  item.LanguageCode == "en" && item.IsTrainingEligible && item.Text == normalizedResponse);

                          _output.WriteLine("");
                          _output.WriteLine($"TURN {index + 1}/{prompts.Length}");
                          _output.WriteLine($"USER: {prompt}");
                          _output.WriteLine($"PRIOR TRANSCRIPT MESSAGES: {context.Length}");
                          _output.WriteLine($"EXACT USER SENTENCE IN CURRICULUM: {exactPromptStored}");
                          _output.WriteLine($"MEANING GRAPH COMPOSED: {graph.IsComposed}");
                          _output.WriteLine($"MEANING GRAPH REASON: {graph.ReasonCode}");
                          _output.WriteLine("MEANING NODES: " + (graph.Nodes.Count == 0 ? "<NONE>" : string.Join(" | ", graph.Nodes.Select(node =>
                              $"{node.SemanticDimension}={node.SemanticValue}@{node.StartTokenIndex}:{node.TokenLength}"))));
                          _output.WriteLine("MEANING RELATIONS: " + (graph.Relations.Count == 0 ? "<NONE>" : string.Join(" | ", graph.Relations.Select(relation =>
                              $"{relation.SourceNodeIndex}-{relation.RelationKind}->{relation.TargetNodeIndex}"))));
                          _output.WriteLine("UNKNOWN SURFACE: " + (graph.UnknownSurfaceComponents.Count == 0 ? "<NONE>" : string.Join(" | ", graph.UnknownSurfaceComponents)));
                          _output.WriteLine($"LEXICAL SOURCE STATE: {lexical.State}");
                          if (withoutContext is not null)
                          {
                              _output.WriteLine($"NO-CONTEXT NATIVE SUPPORTED: {withoutContext.Supported}");
                              _output.WriteLine($"NO-CONTEXT REASON: {withoutContext.ReasonCode}");
                          }
                          _output.WriteLine($"WITH-CONTEXT NATIVE SUPPORTED: {native.Supported}");
                          _output.WriteLine($"NATIVE REASON: {native.ReasonCode}");
                          _output.WriteLine($"NATIVE EVIDENCE: {native.EvidenceCount}");
                          _output.WriteLine($"REQUIRES ESCALATION: {native.RequiresEscalation}");
                          _output.WriteLine($"LEGEND: {reply.Message}");
                          _output.WriteLine($"EXACT LEGEND RESPONSE IN CURRICULUM: {exactResponseStored}");
                          _output.WriteLine($"OPENAI CLIENT CALLS: {factory.CreateClientCalls}");

                          Assert.False(exactPromptStored, $"Turn {index + 1} accidentally used a stored curriculum sentence.");
                          Assert.True(graph.IsComposed, $"Turn {index + 1} meaning graph failed: {graph.ReasonCode}");
                          Assert.True(native.Supported, $"Turn {index + 1} native inference failed: {native.ReasonCode}");
                          Assert.False(native.RequiresEscalation, $"Turn {index + 1} requested escalation.");
                          Assert.True(native.EvidenceCount > 0, $"Turn {index + 1} had no governed evidence.");
                          Assert.True(reply.Succeeded, $"Turn {index + 1} ReplyAsync failed: {reply.Message}");
                          Assert.Equal(native.Answer, reply.Message);
                          Assert.False(string.IsNullOrWhiteSpace(reply.Message));
                          Assert.False(exactResponseStored, $"Turn {index + 1} returned a stored curriculum sentence.");
                          Assert.Equal(0, factory.CreateClientCalls);

                          if (index == 1)
                          {
                              Assert.NotNull(withoutContext);
                              Assert.False(withoutContext!.Supported,
                                  "Turn 2 was designed to require prior conversational context, but it answered without context.");
                              _output.WriteLine("CONTEXT DEPENDENCY PROOF: PASS — prior turn was required.");
                          }

                          transcript.Add(new LegendFounderAiChatMessage("user", prompt));
                          transcript.Add(new LegendFounderAiChatMessage("assistant", reply.Message!));
                          passed++;
                          _output.WriteLine("TURN RESULT: PASS");
                      }

                      _output.WriteLine("");
                      _output.WriteLine("============================================================");
                      _output.WriteLine($"HELD-OUT CONVERSATION TURNS PASSED: {passed}/{prompts.Length}");
                      _output.WriteLine($"OPENAI CLIENT CALLS: {factory.CreateClientCalls}");
                      _output.WriteLine("PRODUCTION WRITES: BLOCKED BY READ-ONLY INTERCEPTOR");
                      _output.WriteLine("FULL CONVERSATION PROOF: PASS");
                      _output.WriteLine("============================================================");
                      Assert.Equal(prompts.Length, passed);
                      Assert.Equal(0, factory.CreateClientCalls);
                  }
                  finally
                  {
                      Environment.SetEnvironmentVariable("OPENAI_API_KEY", previousOpenAi);
                      Environment.SetEnvironmentVariable("OpenAI__ApiKey", previousOpenAiConfig);
                      Environment.SetEnvironmentVariable("FOUNDER_OID", previousFounder);
                  }
              }

          '''
          path.write_text(text.replace(anchor, method + anchor, 1))
          PY
          rm -f scripts/legend-governed-reasoning-patch.py
          rm -f .github/workflows/legend-governed-reasoning-predeploy.yml
          rm -f .github/workflows/legend-governed-reasoning-predeploy-v2.yml
          rm -f .github/workflows/legend-governed-reasoning-predeploy-v3.yml
          rm -f .github/workflows/legend-unpublished-curriculum-inventory.yml
          rm -f .github/workflows/legend-unpublished-curriculum-inventory-v2.yml
          rm -f .github/workflows/legend-unpublished-full-conversation-proof.yml
          git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build exact unpublished candidate
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MASTERAPP.sln
          dotnet build MASTERAPP.sln -c Release --no-restore

      - name: Login to Azure for live read-only conversation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run full held-out conversation against real LEGEND curriculum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $connection = ''
          $connections = az webapp config connection-string list --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output json | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match) { $connection = [string]$match.value }
          $settings = @{}
          foreach ($item in (az webapp config appsettings list --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output json | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }
          if ([string]::IsNullOrWhiteSpace($connection)) {
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $connection = $settings[$name]; break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection string could not be resolved.' }
          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $founderOid = $settings[$name]; break }
          }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Production Founder OID could not be resolved.' }
          Write-Output "::add-mask::$connection"
          Write-Output "::add-mask::$founderOid"
          $env:LEGEND_PRODUCTION_READONLY_CONNECTION = $connection
          $env:LEGEND_PRODUCTION_READONLY_FOUNDER_OID = $founderOid
          $env:OPENAI_API_KEY = ''
          $env:OpenAI__ApiKey = ''
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~ProductionReadOnlyHeldOutFullConversationDiagnostic' --logger 'console;verbosity=detailed'
          if ($LASTEXITCODE -ne 0) { throw 'Held-out full conversation proof failed.' }

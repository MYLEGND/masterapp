name: LEGEND 120x120 Founder training

on:
  push:
    branches:
      - training/legend-120x120-20260827
    paths:
      - .github/workflows/legend-120x120-founder-training.yml
      - .github/legend-training/**

permissions:
  contents: read
  id-token: write

jobs:
  batch001:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: Production
    steps:
      - name: Checkout isolated training branch
        uses: actions/checkout@v4
        with:
          ref: training/legend-120x120-20260827
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve live Founder production authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $connections = az webapp config connection-string list --resource-group masterapp-rg --name masterapp-portal --output json | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -eq $match -or [string]::IsNullOrWhiteSpace([string]$match.value)) { throw 'MasterAppDb unavailable' }
          $settings = @{}
          foreach ($item in (az webapp config appsettings list --resource-group masterapp-rg --name masterapp-portal --output json | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }
          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) { if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $founderOid = $settings[$name]; break } }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Founder OID unavailable' }
          Write-Output "::add-mask::$($match.value)"
          Write-Output "::add-mask::$founderOid"
          "LEGEND_PRODUCTION_CONNECTION=$($match.value)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LEGEND_PRODUCTION_FOUNDER_OID=$founderOid" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOUNDER_OID=$founderOid" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install corrected disposable Batch 001 test in runner
        shell: bash
        run: |
          cp .github/legend-training/Legend120x120Batch001Tests.cs AgentPortal.Tests/Legend120x120Batch001Tests.cs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AgentPortal.Tests/Legend120x120Batch001Tests.cs')
          s=p.read_text()
          replacements={
          '"what success means, what cannot be violated, what must already be true, and how success will be recognized"':'"what success means for the technology choice, what cannot be violated, what must already be true, and how success will be recognized"',
          '"competing explanations remain viable, and which test would discriminate among them"':'"competing explanations remain viable for the technology choice issue, and which test would discriminate among them"',
          '"actually know, what are we inferring, and what remains uncertain"':'"actually know about the technology choice, what are we inferring, and what remains uncertain"',
          '"what is known, what is estimated, assumed, or unresolved"':'"what is known about the data migration from what is estimated, assumed, or unresolved"',
          '"unknown after confirmed observations and reasonable inferences are separated"':'"unknown about the data migration after confirmed observations and reasonable inferences are separated"',
          '"actually established, what follows from evidence, and what is still uncertain"':'"actually established about the strategic risk, what follows from evidence, and what is still uncertain"',
          '"unknowns rather than filling them with unsupported confidence"':'"unknowns in the strategic risk analysis rather than filling them with unsupported confidence"'
          }
          for old,new in replacements.items():
              if s.count(old)!=1: raise SystemExit(f'Expected one span anchor: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Build production code plus Batch 001 harness
        run: |
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore
      - name: Submit and verify Batch 001 through canonical Founder authority
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Legend120x120Batch001Tests.Batch001_SubmitsThroughCanonicalFounderAuthority_AndCompletesWithoutContradiction' --logger 'console;verbosity=detailed'

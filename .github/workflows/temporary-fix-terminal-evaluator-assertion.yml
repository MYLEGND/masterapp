name: Temporary repair terminal evaluator regression assertion
on:
  push:
    branches: [fix/legend-governed-capability-plane-20260824]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply exact regression correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AgentPortal.Tests/LegendConnectCurriculumTests.cs')
          s = p.read_text()
          old = '        Assert.Null(failed.CompletedLanguageIntelligenceEvaluatorVersion);'
          new = '        Assert.Equal(0, failed.CompletedLanguageIntelligenceEvaluatorVersion);'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- AgentPortal.Tests/LegendConnectCurriculumTests.cs
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-fix-terminal-evaluator-assertion.yml
          git add AgentPortal.Tests/LegendConnectCurriculumTests.cs
          git diff --cached --check
          git commit -m 'Align terminal manifest evaluator regression with non-nullable contract'
          git push origin HEAD:fix/legend-governed-capability-plane-20260824
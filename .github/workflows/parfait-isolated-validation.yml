name: Parfait commerce isolated build and contracts

on:
  push:
    branches:
      - isolation/parfait-canonical-commerce-20261010
      - isolation/canonical-scoped-commerce-internal-20261010
      - repair/fast-track-already-ready-no-sql-20261011
      - repair/fast-track-map-no-sql-regression-20261011
      - isolation/parfait-live-cutover-20261011
      - isolation/business-scoped-payments-20261011
    paths:
      - .github/workflows/legend-fast-track-ui.yml
      - scripts/deploy-approved-app.py
      - scripts/release-operation-evidence.py
      - scripts/release-migration.py
      - scripts/release-router.py
      - scripts/release-migration-history-audit.py
      - scripts/release-lifecycle.py
      - scripts/test-release-lifecycle.py
      - scripts/test-fast-track-release.py
      - scripts/test-fast-track-ready-no-sql.py
      - CommerceCore/**
      - Infrastructure/Commerce/**
      - Infrastructure/Businesses/**
      - Infrastructure/WebsiteRuntime/**
      - Legend-Cloudflare/src/website-routing/**
      - Legend-Cloudflare/tests/website-routing/**
      - Protect-Website/**
      - ParfaitApp/**
      - AgentPortal.Tests/**
      - Domain/Entities/CommerceMerchant*.cs
      - Domain/Entities/CommercePayment*.cs
      - Domain/Models/Commerce/**
      - Infrastructure/Data/MasterAppDbContext.cs
      - Infrastructure/Migrations/**
      - scripts/MigrationReleaseProbe/**
      - scripts/migration-probe-package.py
      - scripts/test-migration-probe-package.py
      - scripts/test-parfait-readonly-workflow.py
      - scripts/validation-resume.py
      - scripts/test-validation-resume.py
      - .github/workflows/approved-release-security-validation.yml
      - .github/workflows/parfait-cutover-live-readonly.yml
      - diagnostics/MerchantPaymentCoreTests/**
      - diagnostics/MerchantPaymentAdapterChecks/**
      - .github/workflows/parfait-isolated-validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: parfait-isolated-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact validation resume
        id: resume
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validation-resume.py plan \
            --workflow parfait-isolated-validation.yml --validation-base Legend/fast-track-release \
            --current-sha "$GITHUB_SHA" --current-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --head-branch "${{ github.ref_name }}" \
            --event "$GITHUB_EVENT_NAME" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/validation-resume.json"
          python3 - <<'PYPLAN'
          import json,os,pathlib
          plan=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'validation-resume.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('plan='+json.dumps(plan,separators=(',',':'))+'\n')
          PYPLAN
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore isolated commerce and Parfait projects
        id: gate_restore
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['restore'].run }}
        run: |
          dotnet restore CommerceCore/LegendCommerce.csproj --nologo
          dotnet restore ParfaitApp/ParfaitApp.csproj --nologo
          dotnet restore Protect-Website/ProtectWebsite.csproj --nologo
      - name: Compile shared commerce and Parfait host
        id: gate_build
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['build'].run }}
        run: |
          dotnet build CommerceCore/LegendCommerce.csproj -c Release --no-restore --nologo
          dotnet build ParfaitApp/ParfaitApp.csproj -c Release --no-restore --nologo
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --no-restore --nologo
      - name: Restore contract tests
        id: gate_test_restore
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['test-restore'].run }}
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj --nologo
      - name: Run focused Parfait commerce and canonical parity tests
        id: gate_contracts
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['contracts'].run }}
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo \
            --filter 'FullyQualifiedName~ParfaitCanonicalPresentationPreservationTests|FullyQualifiedName~ParfaitCanonicalCutoverSafetyTests|FullyQualifiedName~ScopedParfaitCommerceAuthorityTests|FullyQualifiedName~ParfaitCheckoutBillingCutoverTests|FullyQualifiedName~CentralizedWebsiteCommerceTests|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~AnalyticsCanonicalArchitectureTests|FullyQualifiedName~CommerceCoreOwnershipContractTests|FullyQualifiedName~CommerceCutoverInventoryTests|FullyQualifiedName~CommerceSharedHostPreviewGateTests|FullyQualifiedName~CommerceTenantBrandIsolationTests|FullyQualifiedName~CommerceLegacyTransferTests|FullyQualifiedName~ParfaitOriginalPublicPagesTests|FullyQualifiedName~CommerceAutomationDispatcherLeaseTests|FullyQualifiedName~CommercePreviewMediaTests|FullyQualifiedName~CommerceSharedHostCutoverTests|FullyQualifiedName~CommerceCutoverStartupProofTests|FullyQualifiedName~CommerceCanonicalInternalBrandIsolationTests|FullyQualifiedName~CommerceManagementCapabilityPolicyTests|FullyQualifiedName~CommerceOrderMailTenantIsolationTests|FullyQualifiedName~AdversarialReportingTruthTests|FullyQualifiedName~Meta|FullyQualifiedName~Analytics|FullyQualifiedName~WebsiteInquiryIsolationTests|FullyQualifiedName~WebsiteSnapshotRetentionTests|FullyQualifiedName~LeadSnapshotAttributionTests'

      - name: Verify selective Cloudflare commerce routing without deployment
        id: gate_routing
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['routing'].run }}
        run: |
          npm ci --prefix tests/website --ignore-scripts --no-audit --no-fund
          npm ci --prefix Legend-Website --ignore-scripts --no-audit --no-fund
          node --test Legend-Cloudflare/tests/website-routing/*.test.mjs Legend-Website/scripts/*.test.mjs tests/website/legend-public-cms.test.mjs tests/website/legend-public-inquiry.test.mjs tests/website/public-first-paint.test.mjs

      - name: Verify scoped payment ownership, replay safety and provider contracts
        id: gate_payments
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['payments'].run }}
        run: |
          dotnet test diagnostics/MerchantPaymentCoreTests/MerchantPaymentCoreTests.csproj -c Release --nologo
          dotnet run --project diagnostics/MerchantPaymentAdapterChecks/MerchantPaymentAdapterChecks.csproj -c Release

      - name: Verify canonical migration operation contract
        id: gate_migration_contract
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['migration-contract'].run }}
        run: |
          python3 scripts/test-validation-resume.py ParfaitValidationResumeTests FastTrackExecutionIdentityTests FastTrackImpactTests FastTrackSourceValidationTests ApprovedHeadPreflightTests
          python3 scripts/test-parfait-readonly-workflow.py
          python3 scripts/test-migration-probe-package.py
          python3 scripts/test-release-migration-probe-retry.py
          python3 scripts/test-release-children.py
          python3 scripts/test-release-migration-history-audit.py
          python3 scripts/test-fast-track-release.py
          python3 scripts/test-fast-track-ready-no-sql.py
          dotnet build scripts/MigrationReleaseProbe/MigrationReleaseProbe.csproj -c Release --nologo -m:1 -nr:false -p:UseSharedCompilation=false
          dotnet build scripts/MigrationReleaseProbe/Rehearsal/MigrationRehearsal.csproj -c Release --nologo -m:1 -nr:false -p:UseSharedCompilation=false
          dotnet run --project scripts/MigrationReleaseProbe/Rehearsal/MigrationRehearsal.csproj -c Release --no-build -- contract-test

      - name: Exercise payment migration and schema drift on disposable SQL Server
        id: gate_sql_contract
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['sql-contract'].run }}
        run: |
          python3 scripts/migration-probe-package.py test-contract \
            --tool-revision "${{ github.sha }}" --application-revision "${{ github.sha }}" \
            --directory "$RUNNER_TEMP/payment-sql-contract"

      - name: Publish and inspect exact Parfait + Protect packages without deployment
        id: gate_publish
        if: ${{ fromJSON(steps.resume.outputs.plan).gates['publish'].run }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ParfaitApp/ParfaitApp.csproj -c Release --no-restore --nologo \
            -o "$RUNNER_TEMP/parfait-package"
          dotnet publish Protect-Website/ProtectWebsite.csproj -c Release --no-restore --nologo \
            -o "$RUNNER_TEMP/protect-package"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/store-assets/css/storefront.css"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/store-assets/js/storefront.js"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/store-assets/images/favicon/parfait-logo.png"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/css/internal.css"
          cmp ParfaitApp/wwwroot/css/storefront.css \
            "$RUNNER_TEMP/protect-package/wwwroot/store-assets/css/storefront.css"
          cmp ParfaitApp/wwwroot/js/storefront.js \
            "$RUNNER_TEMP/protect-package/wwwroot/store-assets/js/storefront.js"
          cmp ParfaitApp/wwwroot/images/favicon/parfait-logo.png \
            "$RUNNER_TEMP/protect-package/wwwroot/store-assets/images/favicon/parfait-logo.png"
          cmp ParfaitApp/wwwroot/css/internal.css \
            "$RUNNER_TEMP/protect-package/wwwroot/css/internal.css"
          echo "PARFAIT_PUBLISHED_ASSETS_MATCH_SOURCE: YES"

      - name: Record canonical child execution evidence
        if: ${{ always() && steps.resume.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validation-resume.py record-evidence \
            --plan "$RUNNER_TEMP/validation-resume.json" --output "$RUNNER_TEMP/validation-resume.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
      - name: Preserve exact validation resume plan
        if: ${{ always() && steps.resume.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-resume-parfait-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-resume.json
          retention-days: 30
          if-no-files-found: error

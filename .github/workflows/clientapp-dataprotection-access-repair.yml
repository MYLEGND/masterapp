name: Repair ClientApp Data Protection access

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - .github/workflows/clientapp-dataprotection-access-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Grant least-privilege Data Protection access
        shell: bash
        run: |
          set -euo pipefail
          settings=/tmp/client-settings.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-client -o json > "$settings"
          blob_uri="$(jq -r '.[] | select(.name=="DataProtection__BlobUri" or .name=="DataProtection:BlobUri") | .value' "$settings" | head -n1)"
          key_uri="$(jq -r '.[] | select(.name=="DataProtection__KeyVaultKeyId" or .name=="DataProtection:KeyVaultKeyId") | .value' "$settings" | head -n1)"
          test -n "$blob_uri"
          test -n "$key_uri"

          client_principal="$(az webapp identity show -g masterapp-rg -n masterapp-client --query principalId -o tsv)"
          test -n "$client_principal"

          read -r storage_account container <<<"$(BLOB_URI="$blob_uri" python3 - <<'PY'
          import os,urllib.parse
          u=urllib.parse.urlparse(os.environ['BLOB_URI'])
          account=u.hostname.split('.')[0]
          parts=[p for p in u.path.split('/') if p]
          if not account or not parts: raise SystemExit(1)
          print(account,parts[0])
          PY
          )"
          read -r vault key_name <<<"$(KEY_URI="$key_uri" python3 - <<'PY'
          import os,urllib.parse
          u=urllib.parse.urlparse(os.environ['KEY_URI'])
          vault=u.hostname.split('.')[0]
          parts=[p for p in u.path.split('/') if p]
          if len(parts)<2 or parts[0].lower()!='keys': raise SystemExit(1)
          print(vault,parts[1])
          PY
          )"

          subscription_id="$(az account show --query id -o tsv)"
          storage_id="/subscriptions/$subscription_id/resourceGroups/masterapp-rg/providers/Microsoft.Storage/storageAccounts/$storage_account"
          vault_id="/subscriptions/$subscription_id/resourceGroups/masterapp-rg/providers/Microsoft.KeyVault/vaults/$vault"
          container_scope="$storage_id/blobServices/default/containers/$container"
          key_scope="$vault_id/keys/$key_name"

          ensure_role() {
            local role="$1" scope="$2"
            if [ "$(az role assignment list --assignee "$client_principal" --scope "$scope" --role "$role" --query 'length(@)' -o tsv)" = "0" ]; then
              az role assignment create --assignee-object-id "$client_principal" --assignee-principal-type ServicePrincipal --role "$role" --scope "$scope" --output none
            fi
          }
          ensure_role "Storage Blob Data Contributor" "$container_scope"
          ensure_role "Key Vault Crypto User" "$key_scope"

          az role assignment list --assignee "$client_principal" --scope "$container_scope" --role "Storage Blob Data Contributor" --query '[].roleDefinitionName' -o tsv | grep -Fx "Storage Blob Data Contributor"
          az role assignment list --assignee "$client_principal" --scope "$key_scope" --role "Key Vault Crypto User" --query '[].roleDefinitionName' -o tsv | grep -Fx "Key Vault Crypto User"

      - name: Verify ClientApp browser routes recover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client,ssl,time
          context=ssl.create_default_context()
          hosts=('client.mylegnd.com','masterapp-client.azurewebsites.net')
          deadline=time.monotonic()+300
          last={}
          while time.monotonic()<deadline:
              healthy=True
              for host in hosts:
                  conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
                  try:
                      conn.request('GET','/Account/Login',headers={'User-Agent':'LEGEND-dp-repair-check/1.0','Cache-Control':'no-cache','Accept':'text/html'})
                      r=conn.getresponse(); body=r.read(65537)
                      last[host]=(r.status,len(body),r.getheader('Content-Type'))
                      if r.status!=200 or len(body)<512 or not (r.getheader('Content-Type') or '').lower().startswith('text/html'):
                          healthy=False
                  finally:
                      conn.close()
              if healthy:
                  for host,value in last.items(): print(host,*value)
                  raise SystemExit(0)
              time.sleep(10)
          for host,value in last.items(): print(host,*value)
          raise SystemExit('ClientApp login route did not recover after least-privilege RBAC repair')
          PY

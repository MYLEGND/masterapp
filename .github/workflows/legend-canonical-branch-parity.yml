name: LEGEND canonical branch parity

on:
  push:
    branches:
      - production
      - legend/approved-changes
  workflow_run:
    workflows:
      - Validate, merge, and deploy AgentPortal to production
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: legend-canonical-branch-parity
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical history without executing application code
        uses: actions/checkout@v4
        with:
          ref: legend/approved-changes
          fetch-depth: 0

      - name: Diagnose live ClientApp browser entry when requested
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '"requestId": "clientapp-blank-entry-diagnostic-20260921-1"' Docs/releases/direct-release-request.json; then
            echo "ClientApp entry diagnostic not requested."
            exit 0
          fi
          python3 - <<'PYENTRY'
          import http.client, json, ssl
          context=ssl.create_default_context()
          for host in ('client.mylegnd.com','masterapp-client.azurewebsites.net'):
              for path in ('/','/Account/Login'):
                  conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
                  try:
                      conn.request('GET',path,headers={'User-Agent':'LEGEND-live-entry-diagnostic/1.0','Cache-Control':'no-cache','Accept':'text/html'})
                      response=conn.getresponse()
                      body=response.read(65537)
                      print(json.dumps({
                          'host':host,
                          'path':path,
                          'status':response.status,
                          'location':response.getheader('Location'),
                          'contentType':response.getheader('Content-Type'),
                          'contentLength':response.getheader('Content-Length'),
                          'bytes':len(body),
                          'startsWith':body[:120].decode('utf-8','replace')
                      }))
                  finally:
                      conn.close()
          PYENTRY

      - name: Resolve canonical-history validation identity
        id: parityidentity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authority_hash="$(
            sha256sum               .github/workflows/legend-canonical-branch-parity.yml               scripts/release-lifecycle.py               scripts/test-release-lifecycle.py |
            sha256sum | cut -d ' ' -f 1
          )"
          artifact_name="legend-parity-contracts-$authority_hash"
          run_id=""
          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100")"
          while read -r candidate_run; do
            [ -n "$candidate_run" ] || continue
            run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run")"
            if [ "$(printf '%s' "$run" | jq -r '.path // ""')" = ".github/workflows/legend-canonical-branch-parity.yml" ]; then
              run_id="$candidate_run"
              break
            fi
          done < <(printf '%s' "$artifacts" | jq -r '.artifacts[] | select(.expired == false) | .workflow_run.id' | awk '!seen[$0]++')
          echo "artifact=$artifact_name" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "REUSE_PARITY_CONTRACTS=true" >> "$GITHUB_ENV"
            echo "Canonical-history safety authority unchanged; preserving prior success."
          else
            echo "REUSE_PARITY_CONTRACTS=false" >> "$GITHUB_ENV"
          fi

      - name: Check canonical history safety contracts
        shell: bash
        run: |
          if [ "$REUSE_PARITY_CONTRACTS" = true ]; then
            echo "Preserved unchanged canonical-history safety validation."
            exit 0
          fi
          python3 scripts/test-release-lifecycle.py

      - name: Retain canonical-history validation receipt
        if: env.REUSE_PARITY_CONTRACTS != 'true'
        shell: bash
        run: printf '%s\n' "${{ steps.parityidentity.outputs.artifact }}" > "$RUNNER_TEMP/parity-validation-receipt.txt"

      - name: Preserve canonical-history validation receipt
        if: env.REUSE_PARITY_CONTRACTS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parityidentity.outputs.artifact }}
          path: ${{ runner.temp }}/parity-validation-receipt.txt
          retention-days: 30
          if-no-files-found: error

      - name: Fetch both canonical refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/production:refs/remotes/origin/production' \
            '+refs/heads/legend/approved-changes:refs/remotes/origin/legend/approved-changes'

      - name: Reconcile canonical history through the lifecycle authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-lifecycle.py branch-parity

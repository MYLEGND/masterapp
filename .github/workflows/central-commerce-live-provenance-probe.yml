name: Central commerce live provenance probe
on:
  push:
    branches:
      - diagnose/central-commerce-live-provenance-20260925

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Authenticate to Azure for read-only diagnostics
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inventory existing App Service managed identity shapes
        shell: bash
        run: |
          set -euo pipefail
          for app in masterapp-portal masterapp-protect masterapp-client masterapp-parfait masterapp-website; do
            identity="$RUNNER_TEMP/$app-identity.json"
            az webapp show -g masterapp-rg -n "$app" --query identity -o json > "$identity"
            APP="$app" FILE="$identity" python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ["FILE"],encoding="utf-8")) if os.path.getsize(os.environ["FILE"]) else {}
          assigned=data.get("userAssignedIdentities") or {}
          print(f"app={os.environ['APP']} type={data.get('type') or 'None'} system_present={bool(data.get('principalId'))} user_assigned_count={len(assigned)}")
          for resource_id, meta in assigned.items():
              name=resource_id.rstrip('/').split('/')[-1]
              print(f"app={os.environ['APP']} user_identity={name} client_id_present={bool((meta or {}).get('clientId'))}")
          PY
            rm -f "$identity"
          done

name: Steps 9-13 canonical marketing system validation

on:
  push:
    branches:
      - feature/marketing-manager-chatgpt-ads-ingestion-20260926
  workflow_dispatch:

concurrency:
  group: steps-9-13-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore affected graph
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build affected graph
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Run canonical marketing and advertising tests
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~AdvertisingActionAuthorizationServiceTests|FullyQualifiedName~PromotionOrchestrationTests|FullyQualifiedName~AdvertisingCommandCenterCentralizationTests|FullyQualifiedName~OpenAiAdsExecutionServiceTests|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~MarketingDestinationLayerTests|FullyQualifiedName~MarketingSetupCentralizationTests|FullyQualifiedName~BusinessWorkspaceTests|FullyQualifiedName~MarketingManagerCentralizationTests|FullyQualifiedName~GrowthEconomicsOpenAiFeedOnboardingTests"

      - name: Run shared website analytics UI tests
        run: |
          cd tests/website
          npm ci
          npm test

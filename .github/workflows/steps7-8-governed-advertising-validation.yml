name: Steps 7-8 governed advertising and Promote This validation

on:
  pull_request:
    branches:
      - legend/approved-changes
    paths:
      - 'Domain/Entities/AdvertisingActionAuthorization.cs'
      - 'SHARED/Analytics/AdvertisingActionContracts.cs'
      - 'Infrastructure/Analytics/AdvertisingActionAuthorizationService.cs'
      - 'Infrastructure/Analytics/MarketingConnectionStore.cs'
      - 'Infrastructure/WebsiteEditing/PromotionOrchestrationService.cs'
      - 'Infrastructure/WebsiteEditing/WebsitePlatformController.cs'
      - 'Infrastructure/Data/MasterAppDbContext.cs'
      - 'Infrastructure/Migrations/20260927053000_AddAdvertisingActionAuthorizations.cs'
      - 'Legend-Design/legend-website-management.js'
      - 'AgentPortal.Tests/AdvertisingActionAuthorizationServiceTests.cs'
      - 'AgentPortal.Tests/PromotionOrchestrationTests.cs'
      - 'AgentPortal.Tests/MarketingScopeParityContractTests.cs'
      - 'Infrastructure/Analytics/AdvertisingCommandCenterService.cs'
      - 'AgentPortal/Controllers/WebsiteAnalyticsController.cs'
      - 'AgentPortal/Views/WebsiteAnalytics/Index.cshtml'
      - 'AgentPortal/wwwroot/js/website-analytics.js'
      - 'AgentPortal/wwwroot/css/website-analytics.css'
      - 'Infrastructure/Businesses/BusinessWorkspaceControllerBase.cs'
      - 'AgentPortal.Tests/AdvertisingCommandCenterCentralizationTests.cs'
      - '.github/workflows/steps7-8-governed-advertising-validation.yml'
      - 'scripts/validation-resume.py'
      - 'scripts/test-validation-resume.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: advertising-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan exact validation resume
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/validation-resume.json"
          python3 scripts/validation-resume.py plan \
            --workflow steps7-8-governed-advertising-validation.yml \
            --current-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --current-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --head-branch "${{ github.head_ref || github.ref_name }}" \
            --event "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --output "$plan"
          python3 - "$plan" "$GITHUB_OUTPUT" <<'PYPLAN'
          import json, sys
          data=json.load(open(sys.argv[1]))
          running={key for key,row in data.get('gates',{}).items() if row.get('run')}
          with open(sys.argv[2],'a') as output:
              output.write('dotnet='+str(bool(running & {'restore','build','governance-tests'})).lower()+'\n')
              output.write('node='+str('website-ui-tests' in running).lower()+'\n')
              output.write('all_preserved='+str(not running).lower()+'\n')
          PYPLAN

      - uses: actions/setup-dotnet@v4
        if: steps.plan.outputs.dotnet == 'true'
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.node == 'true'
        with:
          node-version: '22'

      - name: Restore affected graph
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate restore; then exit 0; fi
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build affected graph
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate build; then exit 0; fi
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Run Steps 7-8 governance, promotion, execution, and scope-parity tests
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate governance-tests; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~AdvertisingActionAuthorizationServiceTests|FullyQualifiedName~PromotionOrchestrationTests|FullyQualifiedName~AdvertisingCommandCenterCentralizationTests|FullyQualifiedName~OpenAiAdsExecutionServiceTests|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~MarketingDestinationLayerTests|FullyQualifiedName~MarketingSetupCentralizationTests|FullyQualifiedName~BusinessWorkspaceTests"

      - name: Run shared website management UI tests
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate website-ui-tests; then exit 0; fi
          cd tests/website
          npm ci
          npm test

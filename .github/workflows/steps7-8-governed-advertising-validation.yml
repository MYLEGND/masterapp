name: Steps 7-8 governed advertising and Promote This validation

on:
  pull_request:
    branches:
      - legend/approved-changes
    paths:
      - 'Domain/Entities/AdvertisingActionAuthorization.cs'
      - 'SHARED/Analytics/AdvertisingActionContracts.cs'
      - 'Infrastructure/Analytics/AdvertisingActionAuthorizationService.cs'
      - 'Infrastructure/Analytics/MarketingConnectionStore.cs'
      - 'Infrastructure/WebsiteEditing/PromotionOrchestrationService.cs'
      - 'Infrastructure/WebsiteEditing/WebsitePlatformController.cs'
      - 'Infrastructure/Data/MasterAppDbContext.cs'
      - 'Infrastructure/Migrations/20260927053000_AddAdvertisingActionAuthorizations.cs'
      - 'Legend-Design/legend-website-management.js'
      - 'AgentPortal.Tests/AdvertisingActionAuthorizationServiceTests.cs'
      - 'AgentPortal.Tests/PromotionOrchestrationTests.cs'
      - 'AgentPortal.Tests/MarketingScopeParityContractTests.cs'
      - 'Infrastructure/Analytics/AdvertisingCommandCenterService.cs'
      - 'AgentPortal/Controllers/WebsiteAnalyticsController.cs'
      - 'AgentPortal/Views/WebsiteAnalytics/Index.cshtml'
      - 'AgentPortal/wwwroot/js/website-analytics.js'
      - 'AgentPortal/wwwroot/css/website-analytics.css'
      - 'Infrastructure/Businesses/BusinessWorkspaceControllerBase.cs'
      - 'AgentPortal.Tests/AdvertisingCommandCenterCentralizationTests.cs'
      - '.github/workflows/steps7-8-governed-advertising-validation.yml'
      - 'scripts/validation-resume.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  approved-head-preflight:
    name: approved-head-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate preflight authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify candidate contains current approved head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validation-resume.py approved-head-preflight \
            --repository "${{ github.repository }}" \
            --current-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --event "${{ github.event_name }}" \
            --output "$RUNNER_TEMP/approved-head-preflight.json"

  validation_plan:
    needs: approved-head-preflight
    name: advertising-validation-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore PR-local validation gate evidence
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/validation-resume-cache
          key: validation-resume-step78-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            validation-resume-step78-pr-${{ github.event.pull_request.number }}-

      - name: Plan exact validation resume
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/validation-resume.json"
          python3 scripts/validation-resume.py plan \
            --workflow steps7-8-governed-advertising-validation.yml \
            --current-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --current-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --head-branch "${{ github.head_ref || github.ref_name }}" \
            --event "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --resume-cache "/tmp/validation-resume-cache/validation-resume.json" \
            --output "$plan"

      - name: Preserve exact advertising validation plan for DAG lanes
        uses: actions/upload-artifact@v4
        with:
          name: validation-plan-step78-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-resume.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  advertising_dotnet:
    needs: validation_plan
    name: advertising-dotnet-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load exact validation plan
        uses: actions/download-artifact@v4
        with:
          name: validation-plan-step78-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore affected graph
        id: gate_restore
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate restore; then exit 0; fi
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - name: Build affected graph
        id: gate_build
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate build; then exit 0; fi
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore
      - name: Run Steps 7-8 governance, promotion, execution, and scope-parity tests
        id: gate_governance_tests
        shell: bash
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate governance-tests; then exit 0; fi
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --no-restore \
            --filter "FullyQualifiedName~AdvertisingActionAuthorizationServiceTests|FullyQualifiedName~PromotionOrchestrationTests|FullyQualifiedName~AdvertisingCommandCenterCentralizationTests|FullyQualifiedName~OpenAiAdsExecutionServiceTests|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~MarketingDestinationLayerTests|FullyQualifiedName~MarketingSetupCentralizationTests|FullyQualifiedName~BusinessWorkspaceTests"

  advertising_ui:
    needs: validation_plan
    name: advertising-website-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load exact validation plan
        uses: actions/download-artifact@v4
        with:
          name: validation-plan-step78-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared website management UI tests
        id: gate_website_ui_tests
        run: |
          if python3 scripts/validation-resume.py preserved --plan "$RUNNER_TEMP/validation-resume.json" --gate website-ui-tests; then exit 0; fi
          cd tests/website
          npm ci
          npm test

  advertising_evidence:
    needs:
      - validation_plan
      - advertising_dotnet
      - advertising_ui
    if: always() && needs.validation_plan.result == 'success'
    name: advertising-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load exact validation plan
        uses: actions/download-artifact@v4
        with:
          name: validation-plan-step78-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Record canonical child execution evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validation-resume.py record-evidence \
            --plan "$RUNNER_TEMP/validation-resume.json" \
            --output "$RUNNER_TEMP/validation-resume.json" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --cache-output /tmp/validation-resume-cache/validation-resume.json
      - name: Preserve exact validation resume plan
        uses: actions/upload-artifact@v4
        with:
          name: validation-resume-step78-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-resume.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Check PR-local validation gate cache readiness
        id: gatecache
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f /tmp/validation-resume-cache/validation-resume.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save PR-local validation gate evidence
        if: steps.gatecache.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/validation-resume-cache
          key: validation-resume-step78-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require all advertising validation lanes
        if: always()
        shell: bash
        env:
          DOTNET_RESULT: ${{ needs.advertising_dotnet.result }}
          UI_RESULT: ${{ needs.advertising_ui.result }}
        run: |
          set -euo pipefail
          if [ "$DOTNET_RESULT" != success ] || [ "$UI_RESULT" != success ]; then
            echo "::error::Advertising validation lane failure: dotnet=$DOTNET_RESULT ui=$UI_RESULT"
            exit 1
          fi

name: LEGEND canonical native predeploy proof

on:
  push:
    branches:
      - fix/legend-native-context-reasoning-20260827
    paths:
      - .github/workflows/legend-native-predeploy-builder-v2.yml

permissions:
  contents: write
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'

jobs:
  prove-before-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Production
    steps:
      - name: Checkout isolated unpublished branch
        uses: actions/checkout@v4
        with:
          ref: fix/legend-native-context-reasoning-20260827
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Apply canonical replacement patch
        run: python3 scripts/legend-native-predeploy-patch.py

      - name: Remove disposable branch-only harnesses
        shell: bash
        run: |
          git rm .github/workflows/legend-native-predeploy-builder.yml
          git rm .github/workflows/legend-native-live-shape-diagnostic.yml
          git rm .github/workflows/legend-native-predeploy-builder-v2.yml
          git rm scripts/legend-native-predeploy-patch.py
          git diff --check

      - name: Restore
        run: dotnet restore MASTERAPP.sln

      - name: Build release with zero warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet build MASTERAPP.sln -c Release --no-restore 2>&1 | tee build.log
          grep -qE '^[[:space:]]*0 Warning\(s\)' build.log

      - name: Login to Azure for live Founder proof
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove native LEGEND on live Founder data with OpenAI blocked
        shell: pwsh
        run: ./scripts/legend-production-native-proof.ps1

      - name: Run full regression only after live proof passes
        shell: bash
        run: |
          set -o pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build 2>&1 | tee test.log
          if grep -qE 'Failed:[[:space:]]*[1-9][0-9]*' test.log; then exit 1; fi
          grep -Eq 'Passed![[:space:]]+-[[:space:]]+Failed:[[:space:]]+0,[[:space:]]+Passed:[[:space:]]+[1-9][0-9]*|Test Run Successful' test.log

      - name: Commit only the proven canonical advancement
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance LEGEND native contextual reasoning and governed articulation'
          git push origin HEAD:fix/legend-native-context-reasoning-20260827

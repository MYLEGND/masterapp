name: Centralized website commerce validation
on:
  push:
    branches:
      - feature/centralized-website-commerce-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/website/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Install shared website test dependencies
        working-directory: tests/website
        run: npm ci
      - name: Check shared Website Studio syntax
        run: node --check Legend-Design/legend-public-cms.js
      - name: Check commerce browser runtime syntax
        run: node --check ParfaitApp/wwwroot/js/storefront.js
      - name: Run shared website suite
        working-directory: tests/website
        run: npm test
      - name: Run focused commerce and website authority tests
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --nologo \
            --filter 'FullyQualifiedName~ParfaitCheckoutBillingCutoverTests|FullyQualifiedName~ParfaitAnalyticsTrafficQualityTests|FullyQualifiedName~MarketingConnectionIsolationTests|FullyQualifiedName~BusinessMetaPixelResolutionTests|FullyQualifiedName~BusinessWorkspaceTests|FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteContentEditorRoundTripTests'
      - name: Build centralized Parfait commerce host
        run: dotnet build ParfaitApp/ParfaitApp.csproj -c Release --nologo -warnaserror
      - name: Build Protect website authority
        run: dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo -warnaserror
      - name: Build LEGEND website
        run: npm --prefix Legend-Website run build

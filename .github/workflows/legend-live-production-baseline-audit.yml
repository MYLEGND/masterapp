name: LEGEND live production baseline audit

on:
  push:
    branches:
      - fix/legend-governed-reasoning-executor-20260827
    paths:
      - .github/workflows/legend-live-production-baseline-audit.yml

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment:
      name: Production
    timeout-minutes: 35
    steps:
      - name: Checkout exact production baseline
        uses: actions/checkout@v4
        with:
          ref: production
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Create disposable Founder conversation audit only in runner
        shell: bash
        run: |
          cat > AgentPortal.Tests/LegendLiveProductionBaselineAuditTests.cs <<'EOF'
          using System;
          using System.Collections.Generic;
          using System.Data.Common;
          using System.Linq;
          using System.Net.Http;
          using System.Security.Claims;
          using System.Threading;
          using System.Threading.Tasks;
          using AgentPortal.Models;
          using AgentPortal.Services;
          using Infrastructure.Data;
          using Infrastructure.Messaging;
          using Microsoft.Data.SqlClient;
          using Microsoft.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore.Diagnostics;
          using Microsoft.Extensions.Configuration;
          using Microsoft.Extensions.Logging.Abstractions;
          using Xunit;
          using Xunit.Abstractions;

          namespace AgentPortal.Tests;

          [Collection("LegendConnectFounderEnvironment")]
          public sealed class LegendLiveProductionBaselineAuditTests
          {
              private readonly ITestOutputHelper _output;
              public LegendLiveProductionBaselineAuditTests(ITestOutputHelper output) => _output = output;

              [Fact]
              public async Task FreshFounderConversationAgainstLiveProductionWithOpenAiBlocked()
              {
                  var raw = Environment.GetEnvironmentVariable("LEGEND_PRODUCTION_READONLY_CONNECTION");
                  var founderId = Environment.GetEnvironmentVariable("LEGEND_PRODUCTION_READONLY_FOUNDER_OID");
                  Assert.False(string.IsNullOrWhiteSpace(raw));
                  Assert.False(string.IsNullOrWhiteSpace(founderId));

                  var cs = new SqlConnectionStringBuilder(raw!)
                  {
                      ApplicationName = "LEGEND live production baseline audit",
                      ApplicationIntent = ApplicationIntent.ReadOnly
                  };
                  var guard = new ReadOnlyInterceptor();
                  await using var db = new MasterAppDbContext(
                      new DbContextOptionsBuilder<MasterAppDbContext>()
                          .UseSqlServer(cs.ConnectionString)
                          .UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking)
                          .AddInterceptors(guard)
                          .Options);

                  Assert.True(await db.AgentProfiles.AsNoTracking().AnyAsync(x =>
                      x.IsActive && x.AgentUserId != null && x.AgentUserId.ToLower() == founderId!.ToLower()));

                  var configuration = new ConfigurationBuilder()
                      .AddInMemoryCollection(new Dictionary<string, string?>
                      {
                          ["OpenAI:ApiKey"] = string.Empty,
                          ["LegendConnect:CorpusAcquisition:Enabled"] = "false",
                          ["LegendConnect:ContextualComposition:Mode"] = "Shadow",
                          ["LegendConnect:LanguageRegistry:Baseline:0:Code"] = "en",
                          ["LegendConnect:LanguageRegistry:Baseline:0:Name"] = "English",
                          ["LegendConnect:LanguageRegistry:Baseline:0:NativeName"] = "English"
                      }).Build();
                  var registry = new LegendLanguageRegistry(db, configuration);
                  var access = new ControlledResourceAccessService(db, configuration, registry);
                  var runtime = new LegendConnectRuntimePolicyAuthority(db, access, registry, configuration,
                      NullLogger<LegendConnectRuntimePolicyAuthority>.Instance);
                  var intelligence = new LegendConnectTranslationIntelligence(db, configuration, runtime);
                  var corpus = new LegendConnectCorpusService(db, registry,
                      NullLogger<LegendConnectCorpusService>.Instance, intelligence: intelligence);
                  var curriculum = new LegendConnectCurriculumService(db, registry, corpus);
                  var operations = new LegendConnectOperations(db, registry, corpus, configuration,
                      runtimePolicy: runtime, curriculum: curriculum, intelligence: intelligence);
                  var profiles = new AgentProfileAccessResolver(db);
                  var founderLegend = new FounderLegendConnectService(operations, profiles);
                  var http = new NoProviderHttpClientFactory();
                  var chat = new LegendFounderAiConversationService(
                      http, configuration, founderLegend,
                      NullLogger<LegendFounderAiConversationService>.Instance,
                      new LegendFounderAiDiscourseStateService(db, profiles, operations));
                  var founder = new ClaimsPrincipal(new ClaimsIdentity(
                      [new Claim("oid", founderId!)], "production-baseline-audit"));

                  var turns = new[]
                  {
                      "Frame the software release request by separating the intended outcome, constraints, prerequisites, and completion test before choosing actions.",
                      "Using that release context, organize the work so prerequisites, parallel steps, validation gates, and recovery actions are explicit.",
                      "For the process delay, treat the leading explanation as provisional, rank plausible causes against the evidence, and identify the test that would best distinguish them.",
                      "Before concluding from the market assessment, separate confirmed facts, supported inferences, estimates, assumptions, and unknowns.",
                      "Evaluate the technology choice by hard constraints first, then compare tradeoffs, confidence, downside risk, and the conditions that would reverse the recommendation.",
                      "For the learning iteration, compare likely, favorable, and adverse scenarios, state assumptions, and define the signals that should trigger adaptation.",
                      "If the instruction execution contains a contradiction, preserve what remains valid, replace the disproven part, and require independent verification before calling the correction complete.",
                      "Turn the executive brief into a concise synthesis that leads with the conclusion, preserves conflicting evidence, and keeps facts, inferences, and uncertainties distinct.",
                      "Now revisit the technology choice and explain what evidence or changed constraint would make the strongest alternative preferable.",
                      "Apply the same evidence discipline to the process delay: what should remain uncertain until the discriminating test is actually observed?",
                      "Based on everything above, what operating principle should guide the next decision when new evidence contradicts the current plan?",
                      "Summarize the decision-making approach we have been using in this conversation without pretending that unsupported facts are known."
                  };

                  var transcript = new List<LegendFounderAiChatMessage>();
                  var context = new List<LegendConnectConversationContextItem>();
                  var nativeCount = 0;
                  var storedAnswerCount = 0;

                  _output.WriteLine("=== LEGEND LIVE PRODUCTION FOUNDER CONVERSATION AUDIT ===");
                  _output.WriteLine("OPENAI: BLOCKED; PRODUCTION DB: READ ONLY");
                  for (var i = 0; i < turns.Length; i++)
                  {
                      var input = turns[i];
                      transcript.Add(new LegendFounderAiChatMessage("user", input));
                      var graph = await operations.AnalyzeReusableMeaningGraphAsync(input);
                      var native = await founderLegend.TryInferConversationWithDiscourseAsync(
                          founder, input, context, discourseState: null);
                      var reply = await chat.ReplyAsync(founder, new LegendFounderAiChatRequest
                      {
                          Mode = "legend",
                          NativeOnly = true,
                          Messages = transcript.ToArray()
                      });
                      var answer = reply.Message ?? string.Empty;
                      var exactStoredInput = await db.LegendLanguageTextUnits.AsNoTracking().AnyAsync(x =>
                          x.LanguageCode == "en" && x.IsTrainingEligible && x.Text == input);
                      var exactStoredAnswer = !string.IsNullOrWhiteSpace(answer) &&
                          await db.LegendLanguageTextUnits.AsNoTracking().AnyAsync(x =>
                              x.LanguageCode == "en" && x.IsTrainingEligible && x.Text == answer);
                      if (exactStoredAnswer) storedAnswerCount++;
                      if (native.Supported && reply.Succeeded && reply.ResponseAuthority == "LegendAi" &&
                          reply.Stage == "native_response" && !native.RequiresEscalation &&
                          string.Equals(native.Answer, answer, StringComparison.Ordinal)) nativeCount++;

                      _output.WriteLine("---");
                      _output.WriteLine($"TURN {i + 1}");
                      _output.WriteLine($"USER: {input}");
                      _output.WriteLine($"INPUT EXACT STORED: {exactStoredInput}");
                      _output.WriteLine($"MEANING COMPOSED: {graph.IsComposed}");
                      _output.WriteLine($"MEANING REASON: {graph.ReasonCode}");
                      _output.WriteLine("MEANING NODES: " + (graph.Nodes.Count == 0 ? "<NONE>" :
                          string.Join(" | ", graph.Nodes.Select(n => n.SemanticDimension + "=" + n.SemanticValue))));
                      _output.WriteLine($"NATIVE SUPPORTED: {native.Supported}");
                      _output.WriteLine($"NATIVE REASON: {native.ReasonCode}");
                      _output.WriteLine($"NATIVE EVIDENCE: {native.EvidenceCount}");
                      _output.WriteLine($"ESCALATION: {native.RequiresEscalation}");
                      _output.WriteLine($"LEGEND: {answer}");
                      _output.WriteLine($"AUTHORITY: {reply.ResponseAuthority}");
                      _output.WriteLine($"STAGE: {reply.Stage}");
                      _output.WriteLine($"ANSWER EXACT STORED: {exactStoredAnswer}");

                      context.Add(new LegendConnectConversationContextItem("user", input));
                      if (!string.IsNullOrWhiteSpace(answer))
                      {
                          context.Add(new LegendConnectConversationContextItem("assistant", answer));
                          transcript.Add(new LegendFounderAiChatMessage("assistant", answer));
                      }
                  }

                  _output.WriteLine("=== SUMMARY ===");
                  _output.WriteLine($"NATIVE TURNS: {nativeCount}/{turns.Length}");
                  _output.WriteLine($"EXACT STORED ANSWERS: {storedAnswerCount}/{turns.Length}");
                  _output.WriteLine($"OPENAI CLIENT CREATIONS: {http.CreateClientCalls}");
                  _output.WriteLine("OPENAI HTTP CALLS: 0");
                  _output.WriteLine($"PRODUCTION QUERY COMMANDS: {guard.QueryCommands}");
                  _output.WriteLine($"PRODUCTION WRITE COMMANDS: {guard.WriteCommands}");

                  Assert.Equal(0, http.CreateClientCalls);
                  Assert.Equal(0, guard.WriteCommands);
              }

              private sealed class NoProviderHttpClientFactory : IHttpClientFactory
              {
                  public int CreateClientCalls { get; private set; }
                  public HttpClient CreateClient(string name)
                  {
                      CreateClientCalls++;
                      throw new InvalidOperationException("Provider creation forbidden in native production audit.");
                  }
              }

              private sealed class ReadOnlyInterceptor : DbCommandInterceptor
              {
                  public int QueryCommands { get; private set; }
                  public int WriteCommands { get; private set; }
                  public override InterceptionResult<DbDataReader> ReaderExecuting(DbCommand command, CommandEventData eventData, InterceptionResult<DbDataReader> result)
                  { QueryCommands++; Guard(command); return result; }
                  public override ValueTask<InterceptionResult<DbDataReader>> ReaderExecutingAsync(DbCommand command, CommandEventData eventData, InterceptionResult<DbDataReader> result, CancellationToken cancellationToken = default)
                  { QueryCommands++; Guard(command); return ValueTask.FromResult(result); }
                  public override InterceptionResult<int> NonQueryExecuting(DbCommand command, CommandEventData eventData, InterceptionResult<int> result)
                  { WriteCommands++; throw new InvalidOperationException("Production audit attempted a write."); }
                  public override ValueTask<InterceptionResult<int>> NonQueryExecutingAsync(DbCommand command, CommandEventData eventData, InterceptionResult<int> result, CancellationToken cancellationToken = default)
                  { WriteCommands++; throw new InvalidOperationException("Production audit attempted a write."); }
                  private static void Guard(DbCommand command)
                  {
                      var sql = command.CommandText.TrimStart();
                      if (sql.StartsWith("SELECT", StringComparison.OrdinalIgnoreCase) || sql.StartsWith("WITH", StringComparison.OrdinalIgnoreCase)) return;
                      throw new InvalidOperationException("Production audit attempted non-query SQL.");
                  }
              }
          }
          EOF
      - name: Restore and build production baseline plus disposable audit
        run: |
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run fresh Founder production conversation with OpenAI blocked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $connections = az webapp config connection-string list --resource-group masterapp-rg --name masterapp-portal --output json | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -eq $match -or [string]::IsNullOrWhiteSpace([string]$match.value)) { throw 'MasterAppDb unavailable' }
          $settings = @{}
          foreach ($item in (az webapp config appsettings list --resource-group masterapp-rg --name masterapp-portal --output json | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }
          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) { if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $founderOid = $settings[$name]; break } }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Founder OID unavailable' }
          $env:LEGEND_PRODUCTION_READONLY_CONNECTION = [string]$match.value
          $env:LEGEND_PRODUCTION_READONLY_FOUNDER_OID = $founderOid
          $env:FOUNDER_OID = $founderOid
          $env:OPENAI_API_KEY = ''
          $env:OpenAI__ApiKey = ''
          Write-Output "::add-mask::$env:LEGEND_PRODUCTION_READONLY_CONNECTION"
          Write-Output "::add-mask::$founderOid"
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendLiveProductionBaselineAuditTests.FreshFounderConversationAgainstLiveProductionWithOpenAiBlocked' --logger 'console;verbosity=detailed'
          if ($LASTEXITCODE -ne 0) { throw 'Live production baseline audit failed.' }

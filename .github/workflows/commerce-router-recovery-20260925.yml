name: Diagnose canonical storefront bridge only

on:
  push:
    branches: [legend/approved-changes]
    paths:
      - '.github/workflows/commerce-router-recovery-20260925.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentportal-production
  cancel-in-progress: false

env:
  PINNED_APP_SHA: fc495d8f6f2d5c477c85c9f32a64fd113d507b8c
  CAMO_HOST: camoexterior.com

jobs:
  diagnose-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Checkout exact validated storefront routing source
        uses: actions/checkout@v4
        with:
          ref: fc495d8f6f2d5c477c85c9f32a64fd113d507b8c
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Authenticate for read-only routing authority lookup
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read existing bridge authority
        shell: bash
        run: |
          set -euo pipefail
          protect=/tmp/protect-routing.json
          parfait=/tmp/parfait-routing.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect"
          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait"
          value() {
            local file="$1"; shift
            local key found
            for key in "$@"; do
              found="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$found" ]; then printf '%s' "$found"; return 0; fi
            done
            return 1
          }
          bridge="$(value "$protect" WebsiteRouting__BridgeSecret 'WebsiteRouting:BridgeSecret')"
          parfait_bridge="$(value "$parfait" WebsiteRouting__BridgeSecret 'WebsiteRouting:BridgeSecret')"
          origin="$(value "$parfait" WebsiteRouting__BridgeOriginHost 'WebsiteRouting:BridgeOriginHost')"
          [ "${#bridge}" -ge 32 ]
          [ "$parfait_bridge" = "$bridge" ]
          [ "$origin" = "masterapp-parfait.azurewebsites.net" ]
          echo "::add-mask::$bridge"
          printf 'LEGEND_WEBSITE_BRIDGE_SECRET=%s\n' "$bridge" >> "$GITHUB_ENV"
          echo "Existing bridge authority matched."

      - name: Prove CAMO domain binding from production source of truth
        shell: bash
        run: |
          set -euo pipefail
          connection="$(az webapp config connection-string list -g masterapp-rg -n masterapp-portal -o json | jq -r '.[] | select(.name=="MasterAppDb") | .value' | head -n 1)"
          if [ -z "$connection" ] || [ "$connection" = null ]; then
            connection="$(az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json | jq -r '.[] | select(.name=="ConnectionStrings__MasterAppDb" or .name=="MasterAppDb" or .name=="SQLCONNSTR_MasterAppDb") | .value' | head -n 1)"
          fi
          [ -n "$connection" ] && [ "$connection" != null ] || { echo "::error::Production MasterAppDb connection is unavailable."; exit 1; }
          echo "::add-mask::$connection"
          export MASTERAPP_PROBE_CONNECTION="$connection"

          mkdir -p /tmp/domainprobe
          cat > /tmp/domainprobe/DomainProbe.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/Infrastructure/Infrastructure.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > /tmp/domainprobe/Program.cs <<'EOF'
          using Domain.Entities;
          using Infrastructure.Data;
          using Microsoft.EntityFrameworkCore;

          var connection = Environment.GetEnvironmentVariable("MASTERAPP_PROBE_CONNECTION")
              ?? throw new InvalidOperationException("Missing connection.");
          var options = new DbContextOptionsBuilder<MasterAppDbContext>()
              .UseSqlServer(connection)
              .Options;
          await using var db = new MasterAppDbContext(options);

          var host = "camoexterior.com";
          var bindings = await db.Set<WebsiteDomainBinding>()
              .AsNoTracking()
              .Where(x => x.Hostname == host)
              .Select(x => new
              {
                  x.Id,
                  x.CommerceBusinessId,
                  x.Hostname,
                  x.Status,
                  x.CertificateStatus,
                  x.LastCheckedUtc,
                  x.CreatedUtc
              })
              .ToListAsync();

          Console.WriteLine($"binding-count={bindings.Count}");
          foreach (var row in bindings)
              Console.WriteLine($"binding id={row.Id} business={row.CommerceBusinessId} host={row.Hostname} status={row.Status} certificate={row.CertificateStatus} lastChecked={row.LastCheckedUtc:O} created={row.CreatedUtc:O}");

          var businessIds = bindings.Select(x => x.CommerceBusinessId).Distinct().ToArray();
          var linkedBusinesses = await db.CommerceBusinesses
              .AsNoTracking()
              .Where(x => businessIds.Contains(x.Id))
              .Select(x => new { x.Id, x.Key, x.DisplayName, x.PrimaryDomain, x.Status, x.IsActive })
              .ToListAsync();
          foreach (var row in linkedBusinesses)
              Console.WriteLine($"linked-business id={row.Id} key={row.Key} display={row.DisplayName} primaryDomain={row.PrimaryDomain} status={row.Status} active={row.IsActive}");

          var camoBusinesses = await db.CommerceBusinesses
              .AsNoTracking()
              .Where(x =>
                  x.Key.ToLower().Contains("camo") ||
                  x.DisplayName.ToLower().Contains("camo") ||
                  (x.PrimaryDomain != null && x.PrimaryDomain.ToLower().Contains("camoexterior")))
              .Select(x => new { x.Id, x.Key, x.DisplayName, x.PrimaryDomain, x.Status, x.IsActive })
              .ToListAsync();
          Console.WriteLine($"camo-business-count={camoBusinesses.Count}");
          foreach (var row in camoBusinesses)
              Console.WriteLine($"camo-business id={row.Id} key={row.Key} display={row.DisplayName} primaryDomain={row.PrimaryDomain} status={row.Status} active={row.IsActive}");

          var camoIds = camoBusinesses.Select(x => x.Id).ToArray();
          var states = await db.Set<WebsiteContentState>()
              .AsNoTracking()
              .Where(x => x.CommerceBusinessId.HasValue && camoIds.Contains(x.CommerceBusinessId.Value))
              .Select(x => new { x.Id, x.OwnerKey, x.SiteKey, x.CommerceBusinessId, x.PublishedVersionId, x.Revision })
              .ToListAsync();
          foreach (var row in states)
              Console.WriteLine($"website-state id={row.Id} owner={row.OwnerKey} site={row.SiteKey} business={row.CommerceBusinessId} published={row.PublishedVersionId} revision={row.Revision}");
          EOF

          dotnet run --project /tmp/domainprobe/DomainProbe.csproj -c Release --nologo

      - name: Probe signed origins and current public CAMO without mutation
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1" url="$2"; shift 2
            local hdr body code
            hdr="/tmp/${label}.headers"
            body="/tmp/${label}.body"
            code="$(curl --silent --show-error --max-time 20 --connect-timeout 10               --dump-header "$hdr" --output "$body" --write-out '%{http_code}'               "$@" "$url" || true)"
            printf '%s status=%s bytes=%s\n' "$label" "$code" "$(wc -c < "$body" 2>/dev/null || printf 0)"
            grep -Ei '^(HTTP/|server:|location:|content-type:|cf-ray:|x-powered-by:|x-azure-ref:)' "$hdr" | sed -E 's/[[:cntrl:]]//g' || true
            python3 - "$body" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          data=p.read_bytes()[:500] if p.exists() else b''
          text=data.decode('utf-8','replace').replace('\n',' ').replace('\r',' ')
          print('body-prefix=',text[:500])
          PY
          }

          signed=(-H "X-Legend-Original-Host: $CAMO_HOST" -H "X-Legend-Website-Bridge: $LEGEND_WEBSITE_BRIDGE_SECRET" -H "Cache-Control: no-cache" -H "User-Agent: LEGEND-bridge-diagnostic/1.0")

          probe protect_signed_binding "https://masterapp-protect.azurewebsites.net/.well-known/legend-website" "${signed[@]}"
          probe protect_unsigned_binding "https://masterapp-protect.azurewebsites.net/.well-known/legend-website" -H "Cache-Control: no-cache"
          probe parfait_signed_store "https://masterapp-parfait.azurewebsites.net/store" "${signed[@]}"
          probe parfait_unsigned_store "https://masterapp-parfait.azurewebsites.net/store" -H "Cache-Control: no-cache"
          probe camo_public_binding "https://$CAMO_HOST/.well-known/legend-website" -H "Cache-Control: no-cache"
          probe camo_public_store "https://$CAMO_HOST/store" -H "Cache-Control: no-cache"

          python3 - <<'PY'
          import json, os, urllib.request
          expected=os.environ['PINNED_APP_SHA']
          for host in ('masterapp-protect.azurewebsites.net','masterapp-parfait.azurewebsites.net'):
              req=urllib.request.Request(f'https://{host}/api/runtime-provenance?diag={expected}',headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  actual=json.load(response).get('sourceRevision')
              print('provenance',host,actual)
              if actual!=expected:
                  raise SystemExit('Live app revision changed during read-only diagnosis')
          PY
          echo "Read-only storefront bridge diagnosis complete."

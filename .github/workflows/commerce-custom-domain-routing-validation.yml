name: Commerce custom-domain routing validation
on:
  push:
    branches:
      - repair/commerce-custom-domain-store-routing-20260925

permissions:
  contents: read

concurrency:
  group: commerce-custom-domain-routing-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore affected .NET graph
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj --nologo

      - name: Build shared infrastructure
        run: dotnet build Infrastructure/Infrastructure.csproj -c Release --no-restore --nologo -warnaserror

      - name: Build Protect website host
        run: dotnet build Protect-Website/ProtectWebsite.csproj -c Release --no-restore --nologo -warnaserror

      - name: Build Parfait commerce host
        run: dotnet build ParfaitApp/ParfaitApp.csproj -c Release --no-restore --nologo -warnaserror

      - name: Build regression project
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo -warnaserror

      - name: Run commerce and domain routing regressions
        run: >-
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo
          --filter "FullyQualifiedName~CentralizedWebsiteCommerceTests|FullyQualifiedName~WebsiteDomainImportTests|FullyQualifiedName~WebsitePublishingAuthorityTests"

      - name: Validate website compiler and canonical store links
        run: |
          npm ci --prefix tests/website
          node --test tests/website/*.test.mjs
          npm --prefix Legend-Website ci
          npm --prefix Legend-Website run build
          npm --prefix Legend-Website run check
          if grep -RFn 'shopparfait.com/store/s/' Legend-Website Infrastructure/WebsiteEditing ParfaitApp/Views 2>/dev/null; then
            echo "::error::A public website renderer still hardcodes a scoped shopparfait.com storefront."
            exit 1
          fi

      - name: Validate Cloudflare commerce transport
        run: |
          npm ci --prefix Legend-Cloudflare
          npm --prefix Legend-Cloudflare run test:website-routing
          npm --prefix Legend-Cloudflare run check:website-routing

      - name: Verify Parfait publish contains proxied storefront assets
        run: |
          rm -rf /tmp/parfait-routing-publish
          dotnet publish ParfaitApp/ParfaitApp.csproj -c Release --no-build --no-restore -o /tmp/parfait-routing-publish --nologo
          test -s /tmp/parfait-routing-publish/wwwroot/css/site.css
          test -s /tmp/parfait-routing-publish/wwwroot/css/storefront.css
          test -s /tmp/parfait-routing-publish/wwwroot/js/storefront.js
          test -s /tmp/parfait-routing-publish/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css

      - name: Validate release policy syntax
        run: |
          python3 -m py_compile scripts/approved-release-baseline.py scripts/release_policy.py
          git diff --check

name: Temporary LEGEND terminal retirement repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply narrow production repair
        shell: bash
        run: |
          git show 465235313eab38f06d08d2561b540eac4aebd954:.github/workflows/temporary-legend-terminal-retirement-repair.yml > /tmp/original.yml
          python - <<'PY'
          from pathlib import Path
          source=Path('/tmp/original.yml').read_text()
          start=source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=source.index("          PY\n\n      - name: Verify patch shape", start)
          code=source[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          needle="text = replace_once(text, family_old, family_new, 'stop Founder family resurrection')"
          code=code.replace(needle, "print('FAMILY_OLD_REPR', repr(family_old)); print('FAMILY_COUNT', text.count(family_old)); print('PRIOR_COUNT', text.count('prior.ProcessingState == Failed')); " + needle)
          Path('/tmp/repair.py').write_text(code+'\n')
          PY
          python /tmp/repair.py
      - name: Verify patch shape
        run: git diff --check
      - name: Restore
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - name: Build production
        run: dotnet build AgentPortal/AgentPortal.csproj --configuration Release --no-restore
      - name: Build tests
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj --configuration Release --no-restore
      - name: Run focused regression
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~LegendConnectHistoricalReevaluationWorkTests|FullyQualifiedName~LegendFounderAiConversationRoutingTests'
      - name: Run full regression
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj --configuration Release --no-build
      - name: Commit only after green
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-legend-terminal-retirement-repair.yml
          git add Infrastructure/Messaging/LegendConnectHistoricalReevaluationWork.cs Infrastructure/Messaging/LegendConnectCurriculumManifestProcessing.cs AgentPortal/Services/LegendFounderAiConversationService.cs AgentPortal.Tests/LegendConnectHistoricalReevaluationWorkTests.cs AgentPortal.Tests/LegendFounderAiConversationRoutingTests.cs
          git diff --cached --check
          git commit -m 'Retire terminal LEGEND failures and surface exact reasons'
          git push origin HEAD:fix/legend-terminal-retirement-reasons-run-20260824
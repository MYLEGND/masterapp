name: Resume centralized commerce release 173

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - ParfaitApp/Program.cs
      - .github/workflows/resume-centralized-commerce-release-173.yml

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: agentportal-production
  cancel-in-progress: false

env:
  RECOVERY_BASE_SHA: 1e3fec75c19f9ecf3b0de9ff4ae8f9c6599c0ce4
  PREVIOUS_APPLICATION_SHA: 3d1ebdb82561a12716d0d9c3f3daa927a1bfa803
  SOURCE_RUN_ID: "36175813329"
  ARTIFACT_NAME: founder-diagnostics-packages-3d1ebdb82561a12716d0d9c3f3daa927a1bfa803

jobs:
  resume-parfait:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove only the Parfait live-gate repair changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RECOVERY_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$RECOVERY_BASE_SHA" HEAD)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              ParfaitApp/Program.cs|.github/workflows/resume-centralized-commerce-release-173.yml) ;;
              *) echo "::error::Unexpected change in final Parfait recovery: $path"; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -ge 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build only corrected Parfait application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/parfait-repair
          dotnet publish ParfaitApp/ParfaitApp.csproj -c Release -o /tmp/parfait-repair \
            -p:SourceRevisionId="$GITHUB_SHA" --nologo
          printf '{"releaseSha":"%s"}\n' "$GITHUB_SHA" > /tmp/parfait-repair/wwwroot/_deployment-provenance.json
          test -s /tmp/parfait-repair/ParfaitApp.dll
          test "$(jq -r .releaseSha /tmp/parfait-repair/wwwroot/_deployment-provenance.json)" = "$GITHUB_SHA"

      - name: Recover exact pre-repair Parfait package for rollback only
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/diagnostics-packages
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify rollback package is the already-live commerce package
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/diagnostics-packages/parfait.zip
          unzip -tq /tmp/diagnostics-packages/parfait.zip >/dev/null
          test "$(unzip -p /tmp/diagnostics-packages/parfait.zip wwwroot/_deployment-provenance.json | jq -r .releaseSha)" = "$PREVIOUS_APPLICATION_SHA"
          rm -rf /tmp/parfait-rollback
          mkdir -p /tmp/parfait-rollback
          unzip -q /tmp/diagnostics-packages/parfait.zip -d /tmp/parfait-rollback

      - name: Capture the exact pre-repair Parfait HTTP failure
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.error, urllib.request
          url='https://masterapp-parfait.azurewebsites.net/api/runtime-provenance?pre-repair=1'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  print('pre-repair status',r.status)
                  print(r.read(512).decode(errors='replace'))
          except urllib.error.HTTPError as e:
              print('pre-repair status',e.code)
              print(e.read(512).decode(errors='replace'))
          PY

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy only corrected Parfait
        id: deploy
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-parfait
          slot-name: Production
          package: /tmp/parfait-repair

      - name: Verify corrected Parfait runtime provenance
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          expected=os.environ['GITHUB_SHA']
          url='https://masterapp-parfait.azurewebsites.net/api/runtime-provenance?release='+expected
          deadline=time.monotonic()+480
          last=None
          while time.monotonic()<deadline:
              try:
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'LEGEND-parfait-recovery/1.0'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      body=json.load(response)
                      actual=body.get('sourceRevision')
                      last={'status':response.status,'actual':actual}
                      if response.status==200 and actual==expected:
                          print(json.dumps({'host':'masterapp-parfait.azurewebsites.net','passed':True,'actual':actual}))
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  last={'status':error.code,'body':error.read(256).decode(errors='replace')}
              except Exception as error:
                  last={'error':type(error).__name__,'message':str(error)[:200]}
              time.sleep(5)
          print(json.dumps({'host':'masterapp-parfait.azurewebsites.net','passed':False,'last':last}))
          raise SystemExit(1)
          PY

      - name: Roll back only Parfait if the repair did not verify
        id: rollback
        if: always() && (steps.deploy.outcome != 'success' || steps.verify.outcome != 'success')
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-parfait
          slot-name: Production
          package: /tmp/parfait-rollback

      - name: Enforce final Parfait recovery outcome
        if: always()
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy=$DEPLOY verify=$VERIFY rollback=$ROLLBACK"
          if [ "$DEPLOY" != success ] || [ "$VERIFY" != success ]; then
            echo "::error::Parfait repair did not verify; rollback was attempted only for Parfait."
            exit 1
          fi

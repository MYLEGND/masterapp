name: Resume centralized commerce release 173
# trigger: parfait-runtime-authority-repair-20260925

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - .github/workflows/resume-centralized-commerce-release-173.yml

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: agentportal-production
  cancel-in-progress: false

env:
  COMMERCE_APPLICATION_SHA: 3d1ebdb82561a12716d0d9c3f3daa927a1bfa803

jobs:
  resume-parfait:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove this resumes only the failed Parfait runtime gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$COMMERCE_APPLICATION_SHA" HEAD
          test -f .github/workflows/resume-centralized-commerce-release-173.yml
          echo "No application build, migration, package recovery, or unrelated deployment will be repeated."

      - name: Confirm the retained commerce package is still the live Parfait target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.error, urllib.request
          url='https://masterapp-parfait.azurewebsites.net/api/runtime-provenance?before-authority-repair=1'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  print('pre-repair status', r.status)
                  print(r.read(512).decode(errors='replace'))
          except urllib.error.HTTPError as e:
              print('pre-repair status', e.code)
              print(e.read(512).decode(errors='replace'))
          PY

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore only Parfait canonical runtime authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          portal="$RUNNER_TEMP/portal-settings.json"
          parfait="$RUNNER_TEMP/parfait-settings.json"
          az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json > "$portal"
          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait"

          resolve_value() {
            local file="$1"; shift
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$value"; return 0; fi
            done
            return 1
          }

          founder="$(resolve_value "$portal" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')"
          blob="$(resolve_value "$portal" DataProtection__BlobUri 'DataProtection:BlobUri')"
          keyvault="$(resolve_value "$portal" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')"
          [ -n "$founder" ] && [ -n "$blob" ] && [ -n "$keyvault" ]
          echo "::add-mask::$founder"
          echo "::add-mask::$blob"
          echo "::add-mask::$keyvault"

          current_founder="$(resolve_value "$parfait" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid' || true)"
          current_blob="$(resolve_value "$parfait" DataProtection__BlobUri 'DataProtection:BlobUri' || true)"
          current_keyvault="$(resolve_value "$parfait" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId' || true)"

          updates=()
          if [ "$current_founder" != "$founder" ]; then updates+=("FOUNDER_OID=$founder"); fi
          if [ "$current_blob" != "$blob" ]; then updates+=("DataProtection__BlobUri=$blob"); fi
          if [ "$current_keyvault" != "$keyvault" ]; then updates+=("DataProtection__KeyVaultKeyId=$keyvault"); fi
          if [ "${#updates[@]}" -gt 0 ]; then
            az webapp config appsettings set -g masterapp-rg -n masterapp-parfait --settings "${updates[@]}" --output none
          fi

          parfait_pid="$(az webapp show -g masterapp-rg -n masterapp-parfait --query identity.principalId -o tsv)"
          if [ -z "$parfait_pid" ]; then
            parfait_pid="$(az webapp identity assign -g masterapp-rg -n masterapp-parfait --query principalId -o tsv)"
          fi
          [ -n "$parfait_pid" ]

          BLOB_URI="$blob" KEY_URI="$keyvault" python3 - <<'PY' > "$RUNNER_TEMP/parfait-dp-resources.txt"
          import os, urllib.parse
          blob=urllib.parse.urlparse(os.environ["BLOB_URI"])
          key=urllib.parse.urlparse(os.environ["KEY_URI"])
          print((blob.hostname or "").split(".")[0])
          print((key.hostname or "").split(".")[0])
          PY
          storage_name="$(sed -n '1p' "$RUNNER_TEMP/parfait-dp-resources.txt")"
          vault_name="$(sed -n '2p' "$RUNNER_TEMP/parfait-dp-resources.txt")"
          storage_id="$(az storage account show -g masterapp-rg -n "$storage_name" --query id -o tsv)"
          vault_id="$(az keyvault show -g masterapp-rg -n "$vault_name" --query id -o tsv)"
          [ -n "$storage_id" ] && [ -n "$vault_id" ]

          az role assignment create \
            --assignee-object-id "$parfait_pid" \
            --assignee-principal-type ServicePrincipal \
            --role "Storage Blob Data Contributor" \
            --scope "$storage_id" --output none
          az role assignment create \
            --assignee-object-id "$parfait_pid" \
            --assignee-principal-type ServicePrincipal \
            --role "Key Vault Crypto User" \
            --scope "$vault_id" --output none

          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait"
          test "$(resolve_value "$parfait" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')" = "$founder"
          test "$(resolve_value "$parfait" DataProtection__BlobUri 'DataProtection:BlobUri')" = "$blob"
          test "$(resolve_value "$parfait" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')" = "$keyvault"
          test "$(az webapp show -g masterapp-rg -n masterapp-parfait --query identity.type -o tsv)" = "SystemAssigned"

          rm -f "$portal" "$parfait" "$RUNNER_TEMP/parfait-dp-resources.txt"
          echo "Parfait now uses the existing managed-identity Data Protection authority."

      - name: Verify the retained commerce package recovers without redeployment
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          expected=os.environ['COMMERCE_APPLICATION_SHA']
          provenance='https://masterapp-parfait.azurewebsites.net/api/runtime-provenance?authority-repair='+expected
          deadline=time.monotonic()+600
          last=None
          while time.monotonic()<deadline:
              try:
                  request=urllib.request.Request(provenance,headers={
                      'Cache-Control':'no-cache',
                      'User-Agent':'LEGEND-parfait-authority-recovery/1.0'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      body=json.load(response)
                      actual=body.get('sourceRevision')
                      last={'status':response.status,'actual':actual}
                      if response.status==200 and actual==expected:
                          break
              except urllib.error.HTTPError as error:
                  last={'status':error.code,'body':error.read(256).decode(errors='replace')}
              except Exception as error:
                  last={'error':type(error).__name__,'message':str(error)[:200]}
              time.sleep(5)
          else:
              print(json.dumps({'passed':False,'endpoint':'provenance','last':last}))
              raise SystemExit(1)

          checks=[
              ('https://masterapp-parfait.azurewebsites.net/', {200}),
              ('https://masterapp-parfait.azurewebsites.net/store', {200}),
              ('https://shopparfait.com/', {200}),
              ('https://shopparfait.com/store', {200}),
              ('https://masterapp-parfait.azurewebsites.net/internal/login', {200,302}),
          ]
          failures=[]
          for url, allowed in checks:
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'LEGEND-parfait-authority-recovery/1.0'})
                  opener=urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
                  with opener.open(req,timeout=20) as response:
                      status=response.status
                  if status not in allowed:
                      failures.append({'url':url,'status':status})
              except urllib.error.HTTPError as error:
                  if error.code not in allowed:
                      failures.append({'url':url,'status':error.code})
              except Exception as error:
                  failures.append({'url':url,'error':type(error).__name__})
          print(json.dumps({'passed':not failures,'sourceRevision':expected,'failures':failures}))
          if failures:
              raise SystemExit(1)
          PY

      - name: Enforce Parfait-only recovery outcome
        if: always()
        env:
          AUTHORITY: ${{ steps.authority.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "authority=$AUTHORITY verify=$VERIFY"
          if [ "$AUTHORITY" != success ] || [ "$VERIFY" != success ]; then
            echo "::error::Parfait runtime authority recovery did not verify. No unrelated app was deployed."
            exit 1
          fi
          echo "Parfait-only commerce recovery completed from the failed live gate without repeating prior build, migration, rollback preservation, or deployments."

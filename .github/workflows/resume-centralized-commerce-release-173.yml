name: Resume centralized commerce release 173
# trigger: parfait-persistent-dp-recovery-20260925-rerun

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - ParfaitApp/Program.cs
      - .github/workflows/resume-centralized-commerce-release-173.yml

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: agentportal-production
  cancel-in-progress: false

env:
  PREVIOUS_APPLICATION_SHA: 3d1ebdb82561a12716d0d9c3f3daa927a1bfa803
  SOURCE_RUN_ID: "36175813329"
  ARTIFACT_NAME: founder-diagnostics-packages-3d1ebdb82561a12716d0d9c3f3daa927a1bfa803

jobs:
  resume-parfait:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove this is only the Parfait persistent-key recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            case "$path" in
              ParfaitApp/Program.cs|.github/workflows/resume-centralized-commerce-release-173.yml) ;;
              *) echo "::error::Unexpected change in Parfait recovery release: $path"; exit 1 ;;
            esac
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build only repaired Parfait application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/parfait-repair
          dotnet publish ParfaitApp/ParfaitApp.csproj -c Release -o /tmp/parfait-repair \
            -p:SourceRevisionId="$GITHUB_SHA" --nologo
          printf '{"releaseSha":"%s"}\n' "$GITHUB_SHA" > /tmp/parfait-repair/wwwroot/_deployment-provenance.json
          test -s /tmp/parfait-repair/ParfaitApp.dll
          test "$(jq -r .releaseSha /tmp/parfait-repair/wwwroot/_deployment-provenance.json)" = "$GITHUB_SHA"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Switch only Parfait to the shared authority persistent-file mode
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          portal="$RUNNER_TEMP/portal-settings.json"
          parfait="$RUNNER_TEMP/parfait-settings.json"
          az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json > "$portal"
          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait"

          resolve_value() {
            local file="$1"; shift
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$value"; return 0; fi
            done
            return 1
          }

          founder="$(resolve_value "$portal" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')"
          [ -n "$founder" ]
          echo "::add-mask::$founder"
          current_founder="$(resolve_value "$parfait" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid' || true)"
          if [ "$current_founder" != "$founder" ]; then
            az webapp config appsettings set -g masterapp-rg -n masterapp-parfait \
              --settings "FOUNDER_OID=$founder" --output none
          fi

          mapfile -t dp_keys < <(jq -r '.[].name | select(
            . == "DataProtection__BlobUri" or
            . == "DataProtection:BlobUri" or
            . == "DataProtection__KeyVaultKeyId" or
            . == "DataProtection:KeyVaultKeyId")' "$parfait")
          if [ "${#dp_keys[@]}" -gt 0 ]; then
            az webapp config appsettings delete -g masterapp-rg -n masterapp-parfait \
              --setting-names "${dp_keys[@]}" --output none
          fi

          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait"
          remaining="$(jq -r '[.[].name | select(
            . == "DataProtection__BlobUri" or
            . == "DataProtection:BlobUri" or
            . == "DataProtection__KeyVaultKeyId" or
            . == "DataProtection:KeyVaultKeyId")] | length' "$parfait")"
          test "$remaining" = "0"
          test "$(resolve_value "$parfait" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')" = "$founder"
          echo "Parfait host Data Protection now uses PlatformDataProtection persistent-file mode; shared marketing authority settings were not changed."
          rm -f "$portal" "$parfait"

      - name: Observe existing package after authority switch
        id: predeploy
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          url='https://masterapp-parfait.azurewebsites.net/api/runtime-provenance?persistent-file-predeploy=1'
          deadline=time.monotonic()+180
          last=None
          while time.monotonic()<deadline:
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'LEGEND-parfait-recovery/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=json.load(response)
                      print(json.dumps({'status':response.status,'sourceRevision':body.get('sourceRevision')}))
                      if response.status == 200:
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  last={'status':error.code}
              except Exception as error:
                  last={'error':type(error).__name__}
              time.sleep(5)
          print(json.dumps({'recoveredBeforeDeploy':False,'last':last}))
          raise SystemExit(1)
          PY

      - name: Deploy only repaired Parfait
        id: deploy
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-parfait
          slot-name: Production
          package: /tmp/parfait-repair

      - name: Verify repaired Parfait live
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          expected=os.environ['GITHUB_SHA']
          provenance='https://masterapp-parfait.azurewebsites.net/api/runtime-provenance?release='+expected
          deadline=time.monotonic()+480
          last=None
          while time.monotonic()<deadline:
              try:
                  request=urllib.request.Request(provenance,headers={
                      'Cache-Control':'no-cache',
                      'User-Agent':'LEGEND-parfait-persistent-dp-recovery/1.0'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      body=json.load(response)
                      actual=body.get('sourceRevision')
                      last={'status':response.status,'actual':actual}
                      if response.status==200 and actual==expected:
                          break
              except urllib.error.HTTPError as error:
                  last={'status':error.code}
              except Exception as error:
                  last={'error':type(error).__name__,'message':str(error)[:160]}
              time.sleep(5)
          else:
              print(json.dumps({'passed':False,'endpoint':'provenance','last':last}))
              raise SystemExit(1)

          checks=[
              ('https://masterapp-parfait.azurewebsites.net/', {200}),
              ('https://masterapp-parfait.azurewebsites.net/store', {200}),
              ('https://shopparfait.com/', {200}),
              ('https://shopparfait.com/store', {200}),
              ('https://masterapp-parfait.azurewebsites.net/internal/login', {200,302}),
              ('https://masterapp-parfait.azurewebsites.net/internal/dashboard', {200,302}),
          ]
          failures=[]
          opener=urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          for url, allowed in checks:
              try:
                  req=urllib.request.Request(url,headers={
                      'Cache-Control':'no-cache',
                      'User-Agent':'LEGEND-parfait-persistent-dp-recovery/1.0'})
                  with opener.open(req,timeout=20) as response:
                      status=response.status
                  if status not in allowed:
                      failures.append({'url':url,'status':status})
              except urllib.error.HTTPError as error:
                  if error.code not in allowed:
                      failures.append({'url':url,'status':error.code})
              except Exception as error:
                  failures.append({'url':url,'error':type(error).__name__})
          print(json.dumps({'passed':not failures,'sourceRevision':expected,'failures':failures}))
          if failures:
              raise SystemExit(1)
          PY

      - name: Recover prior Parfait package only if live verification fails
        if: always() && (steps.deploy.outcome == 'failure' || (steps.deploy.outcome == 'success' && steps.verify.outcome != 'success'))
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/parfait-rollback-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Prepare prior Parfait rollback only after failed verification
        if: always() && (steps.deploy.outcome == 'failure' || (steps.deploy.outcome == 'success' && steps.verify.outcome != 'success'))
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/parfait-rollback-source/parfait.zip
          test "$(unzip -p /tmp/parfait-rollback-source/parfait.zip wwwroot/_deployment-provenance.json | jq -r .releaseSha)" = "$PREVIOUS_APPLICATION_SHA"
          rm -rf /tmp/parfait-rollback
          mkdir -p /tmp/parfait-rollback
          unzip -q /tmp/parfait-rollback-source/parfait.zip -d /tmp/parfait-rollback

      - name: Roll back only Parfait after failed verification
        id: rollback
        if: always() && (steps.deploy.outcome == 'failure' || (steps.deploy.outcome == 'success' && steps.verify.outcome != 'success'))
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-parfait
          slot-name: Production
          package: /tmp/parfait-rollback

      - name: Enforce Parfait recovery outcome
        if: always()
        env:
          AUTHORITY: ${{ steps.authority.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "authority=$AUTHORITY deploy=$DEPLOY verify=$VERIFY rollback=$ROLLBACK"
          if [ "$AUTHORITY" != success ] || [ "$DEPLOY" != success ] || [ "$VERIFY" != success ]; then
            echo "::error::Parfait persistent Data Protection recovery did not verify; rollback was attempted only for Parfait when needed."
            exit 1
          fi
          echo "Parfait-only commerce recovery verified live without rerunning the migration or deploying any unrelated app."

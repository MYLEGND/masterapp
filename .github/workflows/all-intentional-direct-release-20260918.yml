name: LEGEND approved direct release

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Canonical lifecycle handoff from one fully validated merged PR
        type: boolean
        default: false
      source_pr:
        description: Validated source PR number for automatic publication
        type: string
        default: ''
      validated_sha:
        description: Exact validated PR head SHA
        type: string
        default: ''
      merge_sha:
        description: Exact approved merge SHA to execute
        type: string
        default: ''
      targets_json:
        description: Canonically derived target scope; revalidated before publication
        type: string
        default: ''
  push:
    branches: [legend/approved-changes]
    paths: ['Docs/releases/direct-release-request.json']
permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write
concurrency:
  group: legend-approved-release
  cancel-in-progress: false
env:
  RELEASE_SHA: ${{ inputs.merge_sha || github.sha }}
jobs:
  discover-live:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.live.outputs.matrix }}
      baselines: ${{ steps.live.outputs.baselines }}
      portal: ${{ steps.live.outputs.portal }}
      database_baseline: ${{ steps.live.outputs.database_baseline }}
      targets: ${{ steps.live.outputs.targets }}
      portal_only: ${{ steps.live.outputs.portal_only }}
      website_only: ${{ steps.live.outputs.website_only }}
      public_only: ${{ steps.live.outputs.public_only }}
      client_only: ${{ steps.live.outputs.client_only }}
      validate_only: ${{ steps.live.outputs.validate_only }}
      website_routing: ${{ steps.live.outputs.website_routing }}
      website_routing_canary: ${{ steps.live.outputs.website_routing_canary }}
      preserve_live_targets: ${{ steps.live.outputs.preserve_live_targets }}
      exact_live: ${{ steps.live.outputs.exact_live }}
      application_release_sha: ${{ steps.live.outputs.application_release_sha }}
      package_identity: ${{ steps.live.outputs.package_identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Pin approved source and actual live rollback revisions
        id: live
        env:
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
          AUTOMATIC_SOURCE_PR: ${{ inputs.source_pr }}
          AUTOMATIC_VALIDATED_SHA: ${{ inputs.validated_sha }}
          AUTOMATIC_MERGE_SHA: ${{ inputs.merge_sha }}
          AUTOMATIC_TARGETS_JSON: ${{ inputs.targets_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$AUTOMATIC_RELEASE" = true ]; then args+=(--automatic); fi
          python3 scripts/approved-release-baseline.py "${args[@]}" --output "$GITHUB_OUTPUT"
  preserve-rollback:
    needs: discover-live
    if: needs.discover-live.outputs.preserve_live_targets != 'true' && needs.discover-live.outputs.exact_live != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-live.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0

      - name: Load current canonical release authority without changing rollback source
        shell: bash
        run: |
          set -euo pipefail
          git show "${RELEASE_SHA}:scripts/validation-resume.py" > "$RUNNER_TEMP/validation-resume.py"
          python3 "$RUNNER_TEMP/validation-resume.py" --help >/dev/null

      - name: Reuse exact retained live package when available
        id: retained
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rollback-evidence.json"
          python3 "$RUNNER_TEMP/validation-resume.py" rollback-evidence \
            --repository "${{ github.repository }}" \
            --revision "$REVISION" \
            --app "$APP" \
            --output "$evidence"

          read -r reusable run_id package_artifact package_name < <(
            python3 - "$evidence" <<'PYROLLBACKDECISION'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print(
              str(bool(data.get('reusable'))).lower(),
              data.get('runId') or '',
              data.get('packageArtifact') or '',
              data.get('packageName') or '',
          )
          PYROLLBACKDECISION
          )
          echo "reused=false" >> "$GITHUB_OUTPUT"
          if [ "$reusable" != true ]; then
            echo "No retained canonical package covers $APP at $REVISION; source-equivalent rollback rebuild remains required."
            exit 0
          fi

          rm -rf /tmp/retained-package
          mkdir -p /tmp/retained-package
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$package_artifact" --dir /tmp/retained-package
          candidate="$(find /tmp/retained-package -type f -name "$package_name" -print -quit)"
          [ -n "$candidate" ]
          sums="$(find "$(dirname "$candidate")" -maxdepth 1 -type f -name SHA256SUMS -print -quit)"
          [ -n "$sums" ]
          python3 - "$candidate" "$sums" "$REVISION" "$APP" <<'PYROLLBACK'
          import hashlib,json,pathlib,sys,zipfile
          package=pathlib.Path(sys.argv[1])
          sums=pathlib.Path(sys.argv[2])
          revision=sys.argv[3]
          app=sys.argv[4]
          rows=[line.split() for line in sums.read_text().splitlines()]
          expected=[row[0] for row in rows if len(row)==2 and pathlib.Path(row[1]).name==package.name]
          with package.open('rb') as stream:
              actual=hashlib.file_digest(stream,'sha256').hexdigest()
          if expected != [actual]:
              raise SystemExit('Retained rollback package digest mismatch')
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Retained rollback package is corrupt')
              entry='_deployment-provenance.txt' if app=='website' else 'wwwroot/_deployment-provenance.json'
              raw=archive.read(entry).decode().strip()
              embedded=raw if app=='website' else json.loads(raw)['releaseSha']
          if embedded != revision:
              raise SystemExit('Retained rollback package revision mismatch')
          PYROLLBACK

          mkdir -p /tmp/rollback
          cp "$candidate" /tmp/rollback/package.zip
          printf '%s %s retained canonical package from release run %s\n' "$APP" "$REVISION" "$run_id" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "Reused exact verified rollback package for $APP at $REVISION from direct release run $run_id."

      - uses: actions/setup-dotnet@v4
        if: matrix.project != 'static' && steps.retained.outputs.reused != 'true'
        with:
          dotnet-version: '10.x'
      - name: Preserve source-equivalent rollback without production data
        if: steps.retained.outputs.reused != 'true'
        env:
          PROJECT: ${{ matrix.project }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rollback
          if [ "$PROJECT" = static ]; then
            npm --prefix Legend-Website run build
            cp Legend-Website/public/web.config Legend-Website/dist/web.config
            printf '%s\n' "$REVISION" > Legend-Website/dist/_deployment-provenance.txt
            (cd Legend-Website/dist && zip -qr /tmp/rollback/package.zip .)
          else
            dotnet publish "$PROJECT" -c Release -o /tmp/rollback-publish -p:SourceRevisionId="$REVISION" --nologo
            printf '{"releaseSha":"%s"}\n' "$REVISION" > /tmp/rollback-publish/wwwroot/_deployment-provenance.json
            (cd /tmp/rollback-publish && zip -qr /tmp/rollback/package.zip .)
          fi
          printf '%s %s source-equivalent rebuild\n' "$APP" "$REVISION" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-rollback-${{ matrix.app }}-${{ env.RELEASE_SHA }}
          path: /tmp/rollback/
          retention-days: 1
          if-no-files-found: error
  release:
    needs: [discover-live, preserve-rollback]
    if: ${{ always() && needs.discover-live.result == 'success' && (needs.preserve-rollback.result == 'success' || needs.preserve-rollback.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    env:
      EXPECTED_BASE_SHA: ${{ needs.discover-live.outputs.portal }}
      EXPECTED_DB_BASE_SHA: ${{ needs.discover-live.outputs.database_baseline }}
      LIVE_BASELINES: ${{ needs.discover-live.outputs.baselines }}
      SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
      PORTAL_ONLY: ${{ needs.discover-live.outputs.portal_only }}
      WEBSITE_ONLY: ${{ needs.discover-live.outputs.website_only }}
      PUBLIC_ONLY: ${{ needs.discover-live.outputs.public_only }}
      CLIENT_ONLY: ${{ needs.discover-live.outputs.client_only }}
      VALIDATE_ONLY: ${{ needs.discover-live.outputs.validate_only }}
      WEBSITE_ROUTING: ${{ needs.discover-live.outputs.website_routing }}
      WEBSITE_ROUTING_CANARY: ${{ needs.discover-live.outputs.website_routing_canary }}
      PRESERVE_LIVE_TARGETS: ${{ needs.discover-live.outputs.preserve_live_targets }}
      EXACT_LIVE: ${{ needs.discover-live.outputs.exact_live }}
      APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
      PACKAGE_IDENTITY: ${{ needs.discover-live.outputs.package_identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        if: env.WEBSITE_ONLY != 'true' && env.EXACT_LIVE != 'true'
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        if: env.WEBSITE_ROUTING == 'true' && env.EXACT_LIVE != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Legend-Cloudflare/package-lock.json

      - name: Reuse exact successful validation package when available
        id: reusevalidated
        if: env.EXACT_LIVE != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/validation-resume.py verify-release-coverage \
            --workflow all-intentional-direct-release-20260918.yml \
            --workflow-path .github/workflows/all-intentional-direct-release-20260918.yml
          evidence="$RUNNER_TEMP/validated-package-evidence.json"
          python3 scripts/validation-resume.py validated-package \
            --repository "${{ github.repository }}" \
            --revision "$APPLICATION_RELEASE_SHA" \
            --package-identity "$PACKAGE_IDENTITY" \
            --output "$evidence"
          python3 - "$evidence" "$GITHUB_OUTPUT" "$GITHUB_ENV" <<'PYVALIDATED'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if not data.get('reusable') or not data.get('runId') or not data.get('artifact'):
              raise SystemExit(
                  f"Exact validated release package is missing for {data.get('revision')}; "
                  "release refuses to rebuild production bytes."
              )
          with open(sys.argv[2],'a') as output:
              output.write(f"run_id={data['runId']}\n")
              output.write(f"artifact={data['artifact']}\n")
          with open(sys.argv[3],'a') as env:
              env.write("REUSE_VALIDATED_PACKAGE=true\n")
          print(f"Exact immutable package preserved from successful architecture validation run {data['runId']}.")
          PYVALIDATED
      - name: Load exact preserved deployable package
        if: steps.reusevalidated.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.reusevalidated.outputs.artifact }}
          path: /tmp/diagnostics-packages
          run-id: ${{ steps.reusevalidated.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify restored immutable validation package
        if: steps.reusevalidated.outputs.run_id != ''
        shell: bash
        run: |
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages
      - name: Verify current live base before publication
        id: base
        run: |
          python3 - <<'PYBASE'
          import json, os, subprocess, urllib.request
          for row in json.loads(os.environ['LIVE_BASELINES']):
              host=row['host']
              with urllib.request.urlopen('https://'+host+row['path'],timeout=30) as response:
                  actual=response.read().decode().strip() if row['project']=='static' else json.load(response)['sourceRevision']
              print(host,actual)
              assert actual == row['revision'], 'Live revision changed; rebuild the release baseline'
              if os.environ['CLIENT_ONLY'] == 'true' and row['app'] == 'client':
                  subprocess.run(['git','diff','--quiet',row['revision'],'HEAD','--','Infrastructure/Migrations'],check=True)
          PYBASE
      - name: Verify ClientApp browser entry routes
        id: cliententry
        if: contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-client')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCLIENTENTRY'
          import http.client, json, ssl, urllib.parse
          hosts=('client.mylegnd.com','masterapp-client.azurewebsites.net')
          paths=('/', '/Account/Login')
          rows=[]
          context=ssl.create_default_context()
          for host in hosts:
              for path in paths:
                  conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
                  try:
                      conn.request('GET',path,headers={'User-Agent':'LEGEND-release-entry-probe/1.0','Cache-Control':'no-cache','Accept':'text/html'})
                      response=conn.getresponse()
                      body=response.read(65537)
                      row={'host':host,'path':path,'status':response.status,'location':response.getheader('Location'),'contentType':response.getheader('Content-Type'),'bytes':len(body)}
                      rows.append(row)
                      print(json.dumps(row))
                      if len(body)>65536: raise SystemExit(f'Oversized entry response: {host}{path}')
                  finally:
                      conn.close()
          by={(r['host'],r['path']):r for r in rows}
          for host in hosts:
              root=by[(host,'/')]
              login=by[(host,'/Account/Login')]
              if root['status'] not in (200,301,302,303,307,308):
                  raise SystemExit(f'Client root unhealthy: {host} status={root["status"]}')
              if root['status']==200 and root['bytes']<256:
                  raise SystemExit(f'Client root returned a blank document: {host} bytes={root["bytes"]}')
              if login['status']!=200 or login['bytes']<512 or not (login['contentType'] or '').lower().startswith('text/html'):
                  raise SystemExit(f'Client login page unhealthy: {host} status={login["status"]} bytes={login["bytes"]} type={login["contentType"]}')
          PYCLIENTENTRY
      - name: Build exact selected release candidate
        id: build
        if: env.WEBSITE_ONLY != 'true' && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact candidate build from immutable validation artifact; production rebuild is forbidden."
      - name: Verify business website routing bridge
        id: routingchecks
        if: env.WEBSITE_ROUTING == 'true' && (steps.build.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true')
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact routing source-contract validation from architecture proof; release will perform only current-state routing checks."
      - name: Verify localization retention privacy limits and original delivery
        id: tests
        if: env.PUBLIC_ONLY != 'true' && env.PRESERVE_LIVE_TARGETS != 'true' && steps.build.outcome == 'success'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact .NET/full-suite validation for the immutable application revision."
      - name: Verify shared web catalog contracts
        id: web
        if: env.PUBLIC_ONLY != 'true' && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact release web-contract validation from architecture proof."
      - name: Verify selected website catalog and build
        id: websitechecks
        if: contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-website') && env.EXACT_LIVE != 'true'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact website build/check validation from immutable validation artifact."
      - name: Publish exact selected application packages
        id: package
        if: always() && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true' && (env.WEBSITE_ROUTING != 'true' || steps.routingchecks.outcome == 'success') && ((env.CLIENT_ONLY == 'true' && steps.build.outcome == 'success' && steps.tests.outcome == 'success' && steps.web.outcome == 'success') || ((env.WEBSITE_ONLY == 'true' || (env.PUBLIC_ONLY == 'true' && steps.build.outcome == 'success') || (steps.tests.outcome == 'success' && steps.web.outcome == 'success')) && (!contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-website') || steps.websitechecks.outcome == 'success')))
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages
          echo "Using exact validated package bytes; release contains no fallback package builder."
      - name: Retain exact deployable candidate packages
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: founder-diagnostics-packages-${{ needs.discover-live.outputs.package_identity }}
          path: /tmp/diagnostics-packages/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - uses: azure/login@v2
        id: azure
        if: (steps.package.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Preserve targets already live at exact candidate
        id: resumestate
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.VALIDATE_ONLY != 'true' && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-resume.py live-state \
            --revision "$APPLICATION_RELEASE_SHA" \
            --selected-targets "$SELECTED_TARGETS" \
            --output "$RUNNER_TEMP/release-live-state.json" \
            --github-output "$GITHUB_OUTPUT"
          echo "Exact-candidate live targets are preserved; only targets not already live may deploy."

      - name: Synchronize Protect shared website authorization and publisher runtime
        id: protectauth
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-protect') && steps.azure.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          portal_settings=/tmp/portal-shared-auth.json
          protect_settings=/tmp/protect-shared-auth.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json > "$portal_settings"
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect_settings"

          resolve_value() {
            local file="$1"; shift
            local key value
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$value"; return 0; fi
            done
            return 1
          }
          resolve_key() {
            local file="$1"; shift
            local key value
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$key"; return 0; fi
            done
            return 1
          }

          founder="$(resolve_value "$portal_settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')"
          founder_upn="$(resolve_value "$portal_settings" Founder__Upn 'Founder:Upn')"
          blob="$(resolve_value "$portal_settings" DataProtection__BlobUri 'DataProtection:BlobUri')"
          keyvault="$(resolve_value "$portal_settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')"
          [ -n "$founder" ] && [ -n "$founder_upn" ] && [ -n "$blob" ] && [ -n "$keyvault" ]
          echo "::add-mask::$founder"
          echo "::add-mask::$founder_upn"
          echo "::add-mask::$blob"
          echo "::add-mask::$keyvault"

          protect_founder_key="$(resolve_key "$protect_settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid' || true)"
          protect_founder_upn_key="$(resolve_key "$protect_settings" Founder__Upn 'Founder:Upn' || true)"
          protect_blob_key="$(resolve_key "$protect_settings" DataProtection__BlobUri 'DataProtection:BlobUri' || true)"
          protect_keyvault_key="$(resolve_key "$protect_settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId' || true)"
          protect_founder="$(resolve_value "$protect_settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid' || true)"
          protect_founder_upn="$(resolve_value "$protect_settings" Founder__Upn 'Founder:Upn' || true)"
          protect_blob="$(resolve_value "$protect_settings" DataProtection__BlobUri 'DataProtection:BlobUri' || true)"
          protect_keyvault="$(resolve_value "$protect_settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId' || true)"

          updates=()
          if [ "$protect_founder" != "$founder" ]; then updates+=("${protect_founder_key:-FOUNDER_OID}=$founder"); fi
          if [ "$protect_founder_upn" != "$founder_upn" ]; then updates+=("${protect_founder_upn_key:-Founder__Upn}=$founder_upn"); fi
          if [ "$protect_blob" != "$blob" ]; then updates+=("${protect_blob_key:-DataProtection__BlobUri}=$blob"); fi
          if [ "$protect_keyvault" != "$keyvault" ]; then updates+=("${protect_keyvault_key:-DataProtection__KeyVaultKeyId}=$keyvault"); fi
          protect_node="$(resolve_value "$protect_settings" WEBSITE_NODE_DEFAULT_VERSION || true)"
          if [ "$protect_node" != "~24" ]; then updates+=("WEBSITE_NODE_DEFAULT_VERSION=~24"); fi
          if [ "${#updates[@]}" -gt 0 ]; then
            az webapp config appsettings set -g masterapp-rg -n masterapp-protect --settings "${updates[@]}" --output none
          fi

          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect_settings"
          [ "$(resolve_value "$protect_settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')" = "$founder" ]
          [ "$(resolve_value "$protect_settings" Founder__Upn 'Founder:Upn')" = "$founder_upn" ]
          [ "$(resolve_value "$protect_settings" DataProtection__BlobUri 'DataProtection:BlobUri')" = "$blob" ]
          [ "$(resolve_value "$protect_settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')" = "$keyvault" ]
          [ "$(resolve_value "$protect_settings" WEBSITE_NODE_DEFAULT_VERSION)" = "~24" ]
          # AgentPortal owns the receiver secret. Keep Protect's sender and legacy
          # aliases on that exact value, without printing settings or secret values.
          ingest_secret="$(resolve_value "$portal_settings" Analytics__SharedSecret 'Analytics:SharedSecret' LeadIngest__SharedSecret 'LeadIngest:SharedSecret')"
          [ -n "$ingest_secret" ]
          echo "::add-mask::$ingest_secret"
          ingest_updates=()
          for key in Analytics__SharedSecret Tracking__SharedSecret; do
            current="$(resolve_value "$protect_settings" "$key" || true)"
            if [ "$current" != "$ingest_secret" ]; then ingest_updates+=("$key=$ingest_secret"); fi
          done
          for alias in 'Analytics:SharedSecret' 'LeadIngest:SharedSecret' LeadIngest__SharedSecret 'Tracking:SharedSecret' TRACKING_SHARED_SECRET; do
            if jq -e --arg key "$alias" 'any(.[]; .name == $key)' "$protect_settings" >/dev/null; then
              current="$(resolve_value "$protect_settings" "$alias" || true)"
              if [ "$current" != "$ingest_secret" ]; then ingest_updates+=("$alias=$ingest_secret"); fi
            fi
          done
          if [ "${#ingest_updates[@]}" -gt 0 ]; then
            az webapp config appsettings set -g masterapp-rg -n masterapp-protect --settings "${ingest_updates[@]}" --output none
          fi
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect_settings"
          [ "$(resolve_value "$protect_settings" Analytics__SharedSecret 'Analytics:SharedSecret')" = "$ingest_secret" ]
          [ "$(resolve_value "$protect_settings" Tracking__SharedSecret 'Tracking:SharedSecret' TRACKING_SHARED_SECRET)" = "$ingest_secret" ]
          echo "Protect website and analytics ingest authority match AgentPortal."
          for app in masterapp-portal masterapp-protect masterapp-client masterapp-parfait; do
            if [[ "$SELECTED_TARGETS" != *"\"$app\""* ]]; then continue; fi
            settings_file="/tmp/$app-marketing-authority.json"
            az webapp config appsettings list -g masterapp-rg -n "$app" -o json > "$settings_file"
            marketing_updates=()
            for pair in BlobUri KeyVaultKeyId; do
              expected="$blob"; if [ "$pair" = KeyVaultKeyId ]; then expected="$keyvault"; fi
              key="$(resolve_key "$settings_file" "MarketingDataProtection__$pair" "MarketingDataProtection:$pair" || true)"
              current="$(resolve_value "$settings_file" "MarketingDataProtection__$pair" "MarketingDataProtection:$pair" || true)"
              if [ "$current" != "$expected" ]; then marketing_updates+=("${key:-MarketingDataProtection__$pair}=$expected"); fi
            done
            if [ "${#marketing_updates[@]}" -gt 0 ]; then
              az webapp config appsettings set -g masterapp-rg -n "$app" --settings "${marketing_updates[@]}" --output none
            fi
            az webapp config appsettings list -g masterapp-rg -n "$app" -o json > "$settings_file"
            [ "$(resolve_value "$settings_file" MarketingDataProtection__BlobUri 'MarketingDataProtection:BlobUri')" = "$blob" ]
            [ "$(resolve_value "$settings_file" MarketingDataProtection__KeyVaultKeyId 'MarketingDataProtection:KeyVaultKeyId')" = "$keyvault" ]
          done
          echo "Selected marketing consumers use the shared key authority."

      - name: Synchronize shared website editor ticket authority
        id: editorauth
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && steps.azure.outcome == 'success' && env.VALIDATE_ONLY != 'true' && (contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-protect') || contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-parfait')) }}
        shell: bash
        run: |
          set -euo pipefail
          portal_settings=/tmp/portal-editor-ticket-authority.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json > "$portal_settings"
          value() {
            local file="$1"; shift
            local key found
            for key in "$@"; do
              found="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$found" ]; then printf '%s' "$found"; return 0; fi
            done
            return 1
          }
          blob="$(value "$portal_settings" WebsiteEditorDataProtection__BlobUri 'WebsiteEditorDataProtection:BlobUri' DataProtection__BlobUri 'DataProtection:BlobUri')"
          keyvault="$(value "$portal_settings" WebsiteEditorDataProtection__KeyVaultKeyId 'WebsiteEditorDataProtection:KeyVaultKeyId' DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')"
          [ -n "$blob" ] && [ -n "$keyvault" ]
          echo "::add-mask::$blob"
          echo "::add-mask::$keyvault"
          for app in masterapp-protect masterapp-parfait; do
            if [[ "$SELECTED_TARGETS" != *"\"$app\""* ]]; then continue; fi
            settings="/tmp/$app-editor-ticket-authority.json"
            az webapp config appsettings list -g masterapp-rg -n "$app" -o json > "$settings"
            editor_updates=()
            for pair in BlobUri KeyVaultKeyId; do
              expected="$blob"; if [ "$pair" = KeyVaultKeyId ]; then expected="$keyvault"; fi
              current="$(value "$settings" "WebsiteEditorDataProtection__$pair" "WebsiteEditorDataProtection:$pair" || true)"
              if [ "$current" != "$expected" ]; then editor_updates+=("WebsiteEditorDataProtection__$pair=$expected"); fi
            done
            if [ "${#editor_updates[@]}" -gt 0 ]; then
              az webapp config appsettings set -g masterapp-rg -n "$app" --settings "${editor_updates[@]}" --output none
              az webapp config appsettings list -g masterapp-rg -n "$app" -o json > "$settings"
            fi
            [ "$(value "$settings" WebsiteEditorDataProtection__BlobUri 'WebsiteEditorDataProtection:BlobUri')" = "$blob" ]
            [ "$(value "$settings" WebsiteEditorDataProtection__KeyVaultKeyId 'WebsiteEditorDataProtection:KeyVaultKeyId')" = "$keyvault" ]
          done
          echo "Selected website and commerce runtimes share one editor-ticket key authority."

      - name: Prepare shared business website routing authority
        id: routingsecret
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.azure.outcome == 'success' && (steps.protectauth.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        env:
          PRIMARY_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="${PRIMARY_CLOUDFLARE_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "::error::Central Cloudflare routing authority is not configured. Set the Production secret CLOUDFLARE_WORKERS_API_TOKEN to the scoped LEGEND Cloudflare Production Routing token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

          settings=/tmp/protect-website-routing.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$settings"

          zone_id="$(jq -r '.[] | select(.name == "WebsiteDomains__CloudflareZoneId" or .name == "WebsiteDomains:CloudflareZoneId") | (.value // empty)' "$settings" | head -n 1)"
          if ! [[ "$zone_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::Configured Cloudflare SaaS zone ID is missing or invalid."
            exit 1
          fi
          echo "::add-mask::$zone_id"
          printf 'CLOUDFLARE_ZONE_ID=%s\n' "$zone_id" >> "$GITHUB_ENV"

          account_id="${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$account_id" ]; then
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $token" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id")"
            account_id="$(printf '%s' "$response" | jq -r 'select(.success == true) | .result.account.id // empty')"
          fi
          if ! [[ "$account_id" =~ ^[A-Za-z0-9_-]{16,64}$ ]]; then
            echo "::error::Cloudflare account ID could not be resolved from the deployment token and configured SaaS zone."
            exit 1
          fi
          echo "::add-mask::$account_id"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          bridge_secret="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$settings" | head -n 1)"
          if [ -z "$bridge_secret" ]; then
            if [ "$PRESERVE_LIVE_TARGETS" = true ]; then
              echo "::error::Preserve-live routing recovery requires the existing Protect bridge secret; no application setting mutation is authorized."
              exit 1
            fi
            bridge_secret="$(openssl rand -hex 32)"
            az webapp config appsettings set -g masterapp-rg -n masterapp-protect \
              --settings "WebsiteRouting__BridgeSecret=$bridge_secret" --output none
          fi
          if [ "${#bridge_secret}" -lt 32 ]; then
            echo "::error::Website routing bridge secret is missing or too short."
            exit 1
          fi
          echo "::add-mask::$bridge_secret"
          printf 'LEGEND_WEBSITE_BRIDGE_SECRET=%s\n' "$bridge_secret" >> "$GITHUB_ENV"

          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$settings"
          persisted="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$settings" | head -n 1)"
          [ "$persisted" = "$bridge_secret" ]
          protect_origin="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeOriginHost" or .name == "WebsiteRouting:BridgeOriginHost") | (.value // empty)' "$settings" | head -n 1)"
          if [ "$protect_origin" != "masterapp-protect.azurewebsites.net" ]; then
            if [ "$PRESERVE_LIVE_TARGETS" = true ]; then
              echo "::error::Preserve-live routing recovery requires Protect's existing bridge origin host."
              exit 1
            fi
            az webapp config appsettings set -g masterapp-rg -n masterapp-protect \
              --settings "WebsiteRouting__BridgeOriginHost=masterapp-protect.azurewebsites.net" --output none
          fi
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$settings"
          [ "$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeOriginHost" or .name == "WebsiteRouting:BridgeOriginHost") | (.value // empty)' "$settings" | head -n 1)" = "masterapp-protect.azurewebsites.net" ]

          parfait_settings=/tmp/parfait-website-routing.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait_settings"
          parfait_bridge="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$parfait_settings" | head -n 1)"
          parfait_origin="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeOriginHost" or .name == "WebsiteRouting:BridgeOriginHost") | (.value // empty)' "$parfait_settings" | head -n 1)"
          if [ "$PRESERVE_LIVE_TARGETS" = true ]; then
            [ "$parfait_bridge" = "$bridge_secret" ] || { echo "::error::Preserve-live routing recovery requires Parfait to already share the website bridge authority."; exit 1; }
            [ "$parfait_origin" = "masterapp-parfait.azurewebsites.net" ] || { echo "::error::Preserve-live routing recovery requires Parfait's existing bridge origin host."; exit 1; }
          else
            parfait_updates=()
            if [ "$parfait_bridge" != "$bridge_secret" ]; then parfait_updates+=("WebsiteRouting__BridgeSecret=$bridge_secret"); fi
            if [ "$parfait_origin" != "masterapp-parfait.azurewebsites.net" ]; then parfait_updates+=("WebsiteRouting__BridgeOriginHost=masterapp-parfait.azurewebsites.net"); fi
            if [ "${#parfait_updates[@]}" -gt 0 ]; then
              az webapp config appsettings set -g masterapp-rg -n masterapp-parfait --settings "${parfait_updates[@]}" --output none
            fi
          fi
          az webapp config appsettings list -g masterapp-rg -n masterapp-parfait -o json > "$parfait_settings"
          [ "$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$parfait_settings" | head -n 1)" = "$bridge_secret" ]
          [ "$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeOriginHost" or .name == "WebsiteRouting:BridgeOriginHost") | (.value // empty)' "$parfait_settings" | head -n 1)" = "masterapp-parfait.azurewebsites.net" ]
          echo "Shared website routing authority is present in Protect and Parfait without exposing its value."

      - name: Audit centralized Cloudflare routing authority
        id: routingauthority
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingsecret.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py audit --prove-cache-purge

      - name: Diagnose preserve-live routing origin acceptance
        id: routingorigin
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS == 'true' && env.WEBSITE_ROUTING == 'true' && steps.routingsecret.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Azure front-door summaries (no secrets):"
          for app in masterapp-protect masterapp-parfait; do
            echo "=== $app ==="
            az webapp show -g masterapp-rg -n "$app" --query '{publicNetworkAccess:publicNetworkAccess,httpsOnly:httpsOnly,state:state}' -o json
            az webapp config access-restriction show -g masterapp-rg -n "$app" \
              --query '{mainSiteAccessRestrictions:ipSecurityRestrictions,mainSiteDefaultAction:ipSecurityRestrictionsDefaultAction,scmSiteDefaultAction:scmIpSecurityRestrictionsDefaultAction}' -o json
            az webapp auth show -g masterapp-rg -n "$app" \
              --query '{enabled:platform.enabled,requireAuthentication:globalValidation.requireAuthentication,unauthenticatedClientAction:globalValidation.unauthenticatedClientAction,excludedPaths:globalValidation.excludedPaths}' -o json || true
          done

          probe() {
            app="$1"
            path="$2"
            body="/tmp/${app}-origin-body"
            headers="/tmp/${app}-origin-headers"
            status="$(curl --silent --show-error --max-time 30 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              -H "X-Legend-Original-Host: $WEBSITE_ROUTING_CANARY" \
              -H "X-Legend-Website-Bridge: $LEGEND_WEBSITE_BRIDGE_SECRET" \
              -H "User-Agent: LEGEND-routing-origin-diagnostic/1.0" \
              "https://${app}.azurewebsites.net${path}")"
            echo "${app}${path} direct-origin status=${status} bytes=$(wc -c < "$body")"
            grep -Ei '^(server|x-|location|content-type|date):' "$headers" || true
            sha256sum "$body"
            python3 - "$body" <<'PYORIGIN'
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()[:512]
          text=raw.decode('utf-8','replace').replace('\r',' ').replace('\n',' ')
          print('body-prefix:',text)
          PYORIGIN
          }
          probe masterapp-protect /
          probe masterapp-parfait /store



      - name: Apply additive diagnostics migrations before restarting apps
        id: migrate
        if: env.PRESERVE_LIVE_TARGETS != 'true' && env.CLIENT_ONLY != 'true' && env.WEBSITE_ONLY != 'true' && steps.package.outcome == 'success' && steps.azure.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DB_BASE_SHA"
          git merge-base --is-ancestor "$EXPECTED_DB_BASE_SHA" "$APPLICATION_RELEASE_SHA"

          python3 - <<'PYBASELINE'
          import importlib.util, os, sys
          from pathlib import Path
          scripts=Path('scripts').resolve()
          sys.path.insert(0,str(scripts))
          path=scripts / 'release-lifecycle.py'
          spec=importlib.util.spec_from_file_location('release_lifecycle',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          base=os.environ['EXPECTED_DB_BASE_SHA']
          if not module.release_proven(module.GitHub(),base,app='portal'):
              raise SystemExit('Live database baseline lacks a successful canonical Portal release receipt; no migration authorized.')
          print('Database baseline release receipt verified:',base)
          PYBASELINE

          changed="$(
            git diff --name-only "$EXPECTED_DB_BASE_SHA" "$APPLICATION_RELEASE_SHA" -- Infrastructure/Migrations |
            grep -E '^Infrastructure/Migrations/[0-9]{14}_.+\.cs$' |
            grep -v '\.Designer\.cs$' || true
          )"
          if [ -z "$changed" ]; then
            echo "No candidate migration source changed from the proven database baseline."
            exit 0
          fi
          printf '%s\n' "$changed"

          test -x /tmp/diagnostics-packages/masterapp-migrations
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages

          python3 - <<'PYMIGRATE'
          import json, os, subprocess
          def az(*args):
              return json.loads(subprocess.check_output(['az',*args,'-o','json'],text=True))
          rows=az('webapp','config','connection-string','list','-g','masterapp-rg','-n','masterapp-portal')
          connection=next((x['value'] for x in rows if x['name']=='MasterAppDb'),None)
          if not connection:
              settings={x['name']:x['value'] for x in az('webapp','config','appsettings','list','-g','masterapp-rg','-n','masterapp-portal')}
              connection=next((settings[k] for k in ('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb') if settings.get(k)),None)
          if not connection or '\n' in connection or not any(x in connection.lower() for x in ('server=tcp:','.database.windows.net','initial catalog=')):
              raise SystemExit('Production SQL connection unavailable; no restart authorized.')
          print('::add-mask::'+connection,flush=True)
          subprocess.run(
              ['/tmp/diagnostics-packages/masterapp-migrations','--connection',connection],
              check=True,
              env=os.environ | {'DOTNET_ENVIRONMENT':'Development','ASPNETCORE_ENVIRONMENT':'Development'},
          )
          print('Schema ready. Executed the exact validated migration bundle from the proven live database baseline.')
          PYMIGRATE
      - name: Load preserved rollback packages for transactional publication
        id: rollbackpackages
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true' && env.VALIDATE_ONLY != 'true' && steps.package.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:

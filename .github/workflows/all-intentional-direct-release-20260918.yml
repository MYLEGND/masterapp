          MIGRATE: ${{ steps.migrate.outcome }}
          PROTECT: ${{ steps.protect.outcome }}
          PROTECTAUTH: ${{ steps.protectauth.outcome }}
          EDITORAUTH: ${{ steps.editorauth.outcome }}
          PARFAIT: ${{ steps.parfait.outcome }}
          WEBSITE: ${{ steps.website.outcome }}
          WEBSITECHECKS: ${{ steps.websitechecks.outcome }}
          ROUTINGCHECKS: ${{ steps.routingchecks.outcome }}

name: LEGEND approved direct release
run-name: "LEGEND release pr=${{ inputs.source_pr || '0' }} candidate=${{ inputs.validated_sha || inputs.merge_sha || github.sha }} authority=${{ inputs.merge_sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Canonical lifecycle handoff from one fully validated merged PR
        type: boolean
        default: false
      source_pr:
        description: Validated source PR number for automatic publication
        type: string
        default: ''
      validated_sha:
        description: Exact validated PR head SHA
        type: string
        default: ''
      source_merge_sha:
        description: Exact historical approved merge SHA for the validated source PR
        type: string
        default: ''
      merge_sha:
        description: Exact approved merge SHA to execute
        type: string
        default: ''
      targets_json:
        description: Canonically derived target scope; revalidated before publication
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write
concurrency:
  group: legend-approved-release
  cancel-in-progress: false
env:
  RELEASE_SHA: ${{ inputs.merge_sha || github.sha }}
  RELEASE_CANDIDATE_SHA: ${{ inputs.validated_sha || inputs.merge_sha || github.sha }}
jobs:
  admission:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: legend-release-lifecycle
      cancel-in-progress: false
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      state: ${{ steps.admission.outputs.state }}
      admission_id: ${{ steps.admission.outputs.admission_id }}
      resources: ${{ steps.admission.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify selected authority belongs to protected event history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUTHORITY'
          import os,re,subprocess
          selected=os.environ['RELEASE_SHA']
          event=os.environ['GITHUB_SHA']
          if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (selected,event)):
              raise SystemExit('Malformed protected release authority identity')
          subprocess.run(['git','merge-base','--is-ancestor',selected,event],check=True)
          PYAUTHORITY
      - name: Install canonical admission evidence transport
        run: npm ci --ignore-scripts --prefix scripts/release-artifacts
      - name: Bind admission evidence runtime
        uses: ./scripts/release-artifacts
      - name: Admit canonical release resource ownership
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
          AUTOMATIC_SOURCE_PR: ${{ inputs.source_pr }}
          AUTOMATIC_VALIDATED_SHA: ${{ inputs.validated_sha }}
          AUTOMATIC_SOURCE_MERGE_SHA: ${{ inputs.source_merge_sha }}
          AUTOMATIC_TARGETS_JSON: ${{ inputs.targets_json }}
        run: python3 scripts/release-lifecycle.py admit-worker

  discover-live:
    needs: admission
    if: needs.admission.outputs.admitted == 'true' && needs.admission.outputs.state == 'RELEASE_READY'
    runs-on: ubuntu-latest
    outputs:
      admission_id: ${{ needs.admission.outputs.admission_id }}
      admission_resources: ${{ needs.admission.outputs.resources }}
      matrix: ${{ steps.live.outputs.matrix }}
      baselines: ${{ steps.live.outputs.baselines }}
      portal: ${{ steps.live.outputs.portal }}
      database_baseline: ${{ steps.live.outputs.database_baseline }}
      targets: ${{ steps.live.outputs.targets }}
      portal_only: ${{ steps.live.outputs.portal_only }}
      website_only: ${{ steps.live.outputs.website_only }}
      public_only: ${{ steps.live.outputs.public_only }}
      client_only: ${{ steps.live.outputs.client_only }}
      validate_only: ${{ steps.live.outputs.validate_only }}
      website_routing: ${{ steps.live.outputs.website_routing }}
      website_routing_canary: ${{ steps.live.outputs.website_routing_canary }}
      founder_cloudflare: ${{ steps.live.outputs.founder_cloudflare }}
      preserve_live_targets: ${{ steps.live.outputs.preserve_live_targets }}
      exact_live: ${{ steps.live.outputs.exact_live }}
      application_release_sha: ${{ steps.live.outputs.application_release_sha }}
      package_identity: ${{ steps.live.outputs.package_identity }}
      resource_group: ${{ steps.live.outputs.resource_group }}
      migration_bundle: ${{ steps.live.outputs.migration_bundle }}
      routing_worker: ${{ steps.live.outputs.routing_worker }}
      routing_pass_through_hosts: ${{ steps.live.outputs.routing_pass_through_hosts }}
      domain_refresh_project: ${{ steps.live.outputs.domain_refresh_project }}
      database_authority: ${{ steps.live.outputs.database_authority }}
      browser_entry_hosts: ${{ steps.live.outputs.browser_entry_hosts }}
      shared_auth_targets: ${{ steps.live.outputs.shared_auth_targets }}
      editor_targets: ${{ steps.live.outputs.editor_targets }}
      marketing_targets: ${{ steps.live.outputs.marketing_targets }}
      routing_targets: ${{ steps.live.outputs.routing_targets }}
      routing_primary: ${{ steps.live.outputs.routing_primary }}
      routing_primary_host: ${{ steps.live.outputs.routing_primary_host }}
      selected_has_browser_entry: ${{ steps.live.outputs.selected_has_browser_entry }}
      selected_has_static: ${{ steps.live.outputs.selected_has_static }}
      selected_has_shared_auth: ${{ steps.live.outputs.selected_has_shared_auth }}
      selected_has_editor: ${{ steps.live.outputs.selected_has_editor }}
      selected_database_dependent: ${{ steps.live.outputs.selected_database_dependent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify selected authority belongs to protected event history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUTHORITY'
          import os,re,subprocess
          selected=os.environ['RELEASE_SHA']
          event=os.environ['GITHUB_SHA']
          if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (selected,event)):
              raise SystemExit('Malformed protected release authority identity')
          subprocess.run(['git','merge-base','--is-ancestor',selected,event],check=True)
          PYAUTHORITY
      - name: Pin approved source and actual live rollback revisions
        id: live
        env:
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
          AUTOMATIC_SOURCE_PR: ${{ inputs.source_pr }}
          AUTOMATIC_VALIDATED_SHA: ${{ inputs.validated_sha }}
          AUTOMATIC_SOURCE_MERGE_SHA: ${{ inputs.source_merge_sha }}
          AUTOMATIC_MERGE_SHA: ${{ inputs.merge_sha }}
          AUTOMATIC_TARGETS_JSON: ${{ inputs.targets_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$AUTOMATIC_RELEASE" = true ]; then args+=(--automatic); fi
          python3 scripts/approved-release-baseline.py "${args[@]}" --output "$GITHUB_OUTPUT"

  migration-readiness:
    # First SQL gate after protected authority/live-target discovery. It runs
    # before rollback packaging or app release; all SQL operations are read-only.
    needs: [admission, discover-live]
    if: needs.discover-live.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    outputs:
      pending: ${{ steps.observe.outputs.pending || steps.skip.outputs.pending }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.merge_sha || github.sha }}
      APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
      RELEASE_RESOURCE_GROUP: ${{ needs.discover-live.outputs.resource_group }}
      DATABASE_AUTHORITY: ${{ needs.discover-live.outputs.database_authority }}
      EXPECTED_DB_BASE_SHA: ${{ needs.discover-live.outputs.database_baseline }}
      MIGRATION_BUNDLE: ${{ needs.discover-live.outputs.migration_bundle }}
      SELECTED_DATABASE_DEPENDENT: ${{ needs.discover-live.outputs.selected_database_dependent }}
      PRESERVE_LIVE_TARGETS: ${{ needs.discover-live.outputs.preserve_live_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Reuse no-database release scope without SQL execution
        id: skip
        if: env.SELECTED_DATABASE_DEPENDENT != 'true' || env.PRESERVE_LIVE_TARGETS == 'true'
        run: |
          echo "pending=false" >> "$GITHUB_OUTPUT"
          echo "LEGEND_MIGRATION_READINESS:NOT_APPLICABLE"

      - name: Resolve reusable, exact validated migration probe
        id: probe
        if: env.SELECTED_DATABASE_DEPENDENT == 'true' && env.PRESERVE_LIVE_TARGETS != 'true'
        run: |
          set -euo pipefail
          python3 scripts/migration-probe-package.py resolve \
            --tool-revision "$RELEASE_SHA" \
            --application-revision "$APPLICATION_RELEASE_SHA" \
            --directory "$RUNNER_TEMP/migration-probe" \
            --output "$GITHUB_OUTPUT"

      - name: Reuse immutable migration probe without rebuilding
        if: steps.probe.outputs.runId != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.probe.outputs.artifact }}
          run-id: ${{ steps.probe.outputs.runId }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/migration-probe

      - name: Verify retained migration probe identity and digest
        if: steps.probe.outputs.runId != ''
        run: |
          python3 scripts/migration-probe-package.py verify \
            --tool-revision "$RELEASE_SHA" \
            --application-revision "$APPLICATION_RELEASE_SHA" \
            --directory "$RUNNER_TEMP/migration-probe"

      - uses: actions/setup-dotnet@v4
        if: steps.probe.outputs.runId != ''
        with:
          dotnet-version: '10.x'

      - uses: azure/login@v2
        if: steps.probe.outputs.runId != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Observe physical production schema FIRST without SQL mutation
        id: observe
        if: steps.probe.outputs.runId != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PYEARLYSQL'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location('migration_owner', 'scripts/release-migration.py')
          owner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owner)
          owner.release_authority().assert_protected_release_execution()
          probe = pathlib.Path(sys.argv[1]).parent / 'migration-probe' / 'MigrationReleaseProbe.dll'
          # Validated probe was downloaded under RUNNER_TEMP, not the output folder.
          import os
          probe = pathlib.Path(os.environ['RUNNER_TEMP']) / 'migration-probe/MigrationReleaseProbe.dll'
          before = owner.observe(probe, owner.connection_string())
          pending = before['pendingCount'] > 0
          with open(sys.argv[1], 'a') as output:
              output.write('pending=' + str(pending).lower() + '\n')
          print('LEGEND_MIGRATION_READINESS:OBSERVED:' + ('PENDING' if pending else 'READY'))
          PYEARLYSQL

      - name: Prove pending SQL belongs to the approved live baseline
        if: steps.observe.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBASELINE'
          import importlib.util, os, subprocess
          path='scripts/release-prepublication.py'
          spec=importlib.util.spec_from_file_location('prepublication',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          base=os.environ['EXPECTED_DB_BASE_SHA']
          revision=os.environ['APPLICATION_RELEASE_SHA']
          if not module.git_ok('merge-base','--is-ancestor',base,revision):
              if (not module.git_ok('merge-base','--is-ancestor',revision,base)
                  or not module.git_ok('diff','--quiet',revision,base,'--')):
                  raise SystemExit('Live database baseline is not a proven candidate ancestor')
          module.release_proven(base, os.environ['DATABASE_AUTHORITY'])
          print('LEGEND_MIGRATION_READINESS:BASELINE_PROVEN')
          PYBASELINE

      - name: Resolve validated package only when live SQL has pending migrations
        id: package
        if: steps.observe.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-resume.py validated-package \
            --repository "${{ github.repository }}" \
            --revision "$APPLICATION_RELEASE_SHA" \
            --package-identity "${{ needs.discover-live.outputs.package_identity }}" \
            --output "$RUNNER_TEMP/migration-package-evidence.json"
          python3 - "$RUNNER_TEMP/migration-package-evidence.json" "$GITHUB_OUTPUT" <<'PYPACKAGE'
          import json,sys
          value=json.load(open(sys.argv[1]))
          if not value.get('reusable') or not value.get('runId') or not value.get('artifact'):
              raise SystemExit('Validated bundle unavailable; no SQL authorized')
          with open(sys.argv[2],'a') as output:
              output.write('runId='+str(value['runId'])+'\n')
              output.write('artifact='+value['artifact']+'\n')
          PYPACKAGE

      - name: Reuse exact validated EF bundle (pending SQL only)
        if: steps.package.outputs.runId != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          run-id: ${{ steps.package.outputs.runId }}
          github-token: ${{ github.token }}
          path: /tmp/diagnostics-packages

      - name: Verify exact validated EF bundle (pending SQL only)
        if: steps.package.outputs.runId != ''
        run: |
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages

      - name: Authenticate historical first-write admission BEFORE release preparation
        if: steps.observe.outputs.pending == 'true'
        env:
          MIGRATION_PROBE_DLL: ${{ runner.temp }}/migration-probe/MigrationReleaseProbe.dll
        run: |
          set -euo pipefail
          python3 scripts/release-migration.py --preflight

  preserve-rollback:
    needs: [discover-live, migration-readiness]
    if: needs.discover-live.outputs.preserve_live_targets != 'true' && needs.discover-live.outputs.exact_live != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-live.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0

      - name: Load current canonical release authority without changing rollback source
        shell: bash
        run: |
          set -euo pipefail
          git show "${RELEASE_SHA}:scripts/validation-resume.py" > "$RUNNER_TEMP/validation-resume.py"
          python3 "$RUNNER_TEMP/validation-resume.py" --help >/dev/null

      - name: Reuse exact retained live package when available
        id: retained
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
          STATIC_TARGET: ${{ matrix.static }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rollback-evidence.json"
          python3 "$RUNNER_TEMP/validation-resume.py" rollback-evidence \
            --repository "${{ github.repository }}" \
            --revision "$REVISION" \
            --app "$APP" \
            --output "$evidence"

          read -r reusable run_id package_artifact package_name < <(
            python3 - "$evidence" <<'PYROLLBACKDECISION'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print(
              str(bool(data.get('reusable'))).lower(),
              data.get('runId') or '',
              data.get('packageArtifact') or '',
              data.get('packageName') or '',
          )
          PYROLLBACKDECISION
          )
          echo "reused=false" >> "$GITHUB_OUTPUT"
          if [ "$reusable" != true ]; then
            echo "No retained canonical package covers $APP at $REVISION; source-equivalent rollback rebuild remains required."
            exit 0
          fi

          rm -rf /tmp/retained-package
          mkdir -p /tmp/retained-package
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$package_artifact" --dir /tmp/retained-package
          candidate="$(find /tmp/retained-package -type f -name "$package_name" -print -quit)"
          [ -n "$candidate" ]
          sums="$(find "$(dirname "$candidate")" -maxdepth 1 -type f -name SHA256SUMS -print -quit)"
          [ -n "$sums" ]
          python3 - "$candidate" "$sums" "$REVISION" "$STATIC_TARGET" <<'PYROLLBACK'
          import hashlib,json,pathlib,sys,zipfile
          package=pathlib.Path(sys.argv[1])
          sums=pathlib.Path(sys.argv[2])
          revision=sys.argv[3]
          static=sys.argv[4].lower()=='true'
          rows=[line.split() for line in sums.read_text().splitlines()]
          expected=[row[0] for row in rows if len(row)==2 and pathlib.Path(row[1]).name==package.name]
          with package.open('rb') as stream:
              actual=hashlib.file_digest(stream,'sha256').hexdigest()
          if expected != [actual]:
              raise SystemExit('Retained rollback package digest mismatch')
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Retained rollback package is corrupt')
              entry='_deployment-provenance.txt' if static else 'wwwroot/_deployment-provenance.json'
              raw=archive.read(entry).decode().strip()
              embedded=raw if static else json.loads(raw)['releaseSha']
          if embedded != revision:
              raise SystemExit('Retained rollback package revision mismatch')
          PYROLLBACK

          mkdir -p /tmp/rollback
          cp "$candidate" /tmp/rollback/package.zip
          printf '%s %s retained canonical package from release run %s\n' "$APP" "$REVISION" "$run_id" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "Reused exact verified rollback package for $APP at $REVISION from direct release run $run_id."

      - uses: actions/setup-dotnet@v4
        if: matrix.static != true && steps.retained.outputs.reused != 'true'
        with:
          dotnet-version: '10.x'
      - name: Preserve source-equivalent rollback without production data
        if: steps.retained.outputs.reused != 'true'
        env:
          PROJECT: ${{ matrix.project }}
          SOURCE_ROOT: ${{ matrix.sourceRoot }}
          PACKAGE_NAME: ${{ matrix.package }}
          STATIC_TARGET: ${{ matrix.static }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rollback
          if [ "$STATIC_TARGET" = true ]; then
            npm ci --prefix "$SOURCE_ROOT" --ignore-scripts --no-audit --no-fund
            npm --prefix "$SOURCE_ROOT" run build
            cp "$SOURCE_ROOT/public/web.config" "$SOURCE_ROOT/dist/web.config"
            printf '%s\n' "$REVISION" > "$SOURCE_ROOT/dist/_deployment-provenance.txt"
            (cd "$SOURCE_ROOT/dist" && zip -qr /tmp/rollback/package.zip .)
          else
            dotnet publish "$PROJECT" -c Release -o /tmp/rollback-publish -p:SourceRevisionId="$REVISION" --nologo
            printf '{"releaseSha":"%s"}\n' "$REVISION" > /tmp/rollback-publish/wwwroot/_deployment-provenance.json
            (cd /tmp/rollback-publish && zip -qr /tmp/rollback/package.zip .)
          fi
          printf '%s %s source-equivalent rebuild\n' "$APP" "$REVISION" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-rollback-${{ matrix.app }}-${{ env.RELEASE_SHA }}
          path: /tmp/rollback/
          retention-days: 1
          if-no-files-found: error
  release:
    needs: [discover-live, migration-readiness, preserve-rollback]
    if: ${{ always() && needs.discover-live.result == 'success' && needs.migration-readiness.result == 'success' && (needs.preserve-rollback.result == 'success' || needs.preserve-rollback.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_BASE_SHA: ${{ needs.discover-live.outputs.portal }}
      EXPECTED_DB_BASE_SHA: ${{ needs.discover-live.outputs.database_baseline }}
      LIVE_BASELINES: ${{ needs.discover-live.outputs.baselines }}
      ADMISSION_ID: ${{ needs.discover-live.outputs.admission_id }}
      ADMISSION_RESOURCES: ${{ needs.discover-live.outputs.admission_resources }}
      SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
      PORTAL_ONLY: ${{ needs.discover-live.outputs.portal_only }}
      WEBSITE_ONLY: ${{ needs.discover-live.outputs.website_only }}
      PUBLIC_ONLY: ${{ needs.discover-live.outputs.public_only }}
      CLIENT_ONLY: ${{ needs.discover-live.outputs.client_only }}
      VALIDATE_ONLY: ${{ needs.discover-live.outputs.validate_only }}
      WEBSITE_ROUTING: ${{ needs.discover-live.outputs.website_routing }}
      WEBSITE_ROUTING_CANARY: ${{ needs.discover-live.outputs.website_routing_canary }}
      FOUNDER_CLOUDFLARE: ${{ needs.discover-live.outputs.founder_cloudflare }}
      PRESERVE_LIVE_TARGETS: ${{ needs.discover-live.outputs.preserve_live_targets }}
      EXACT_LIVE: ${{ needs.discover-live.outputs.exact_live }}
      APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
      PACKAGE_IDENTITY: ${{ needs.discover-live.outputs.package_identity }}
      RELEASE_RESOURCE_GROUP: ${{ needs.discover-live.outputs.resource_group }}
      MIGRATION_BUNDLE: ${{ needs.discover-live.outputs.migration_bundle }}
      MIGRATION_READINESS_PENDING: ${{ needs.migration-readiness.outputs.pending }}
      ROUTING_WORKER: ${{ needs.discover-live.outputs.routing_worker }}
      ROUTING_PASS_THROUGH_HOSTS: ${{ needs.discover-live.outputs.routing_pass_through_hosts }}
      DOMAIN_REFRESH_PROJECT: ${{ needs.discover-live.outputs.domain_refresh_project }}
      DATABASE_AUTHORITY: ${{ needs.discover-live.outputs.database_authority }}
      BROWSER_ENTRY_HOSTS: ${{ needs.discover-live.outputs.browser_entry_hosts }}
      SHARED_AUTH_TARGETS: ${{ needs.discover-live.outputs.shared_auth_targets }}
      EDITOR_TARGETS: ${{ needs.discover-live.outputs.editor_targets }}
      MARKETING_TARGETS: ${{ needs.discover-live.outputs.marketing_targets }}
      ROUTING_TARGETS: ${{ needs.discover-live.outputs.routing_targets }}
      ROUTING_PRIMARY: ${{ needs.discover-live.outputs.routing_primary }}
      ROUTING_PRIMARY_HOST: ${{ needs.discover-live.outputs.routing_primary_host }}
      SELECTED_HAS_BROWSER_ENTRY: ${{ needs.discover-live.outputs.selected_has_browser_entry }}
      SELECTED_HAS_STATIC: ${{ needs.discover-live.outputs.selected_has_static }}
      SELECTED_HAS_SHARED_AUTH: ${{ needs.discover-live.outputs.selected_has_shared_auth }}
      SELECTED_HAS_EDITOR: ${{ needs.discover-live.outputs.selected_has_editor }}
      SELECTED_DATABASE_DEPENDENT: ${{ needs.discover-live.outputs.selected_database_dependent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        if: env.WEBSITE_ONLY != 'true' && env.EXACT_LIVE != 'true'
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        if: (env.WEBSITE_ROUTING == 'true' || env.FOUNDER_CLOUDFLARE == 'true') && env.EXACT_LIVE != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Legend-Cloudflare/package-lock.json

      - name: Reuse exact successful validation package when available
        id: reusevalidated
        if: env.EXACT_LIVE != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/validation-resume.py verify-release-coverage \
            --workflow all-intentional-direct-release-20260918.yml \
            --workflow-path .github/workflows/all-intentional-direct-release-20260918.yml
          # Deployment remains bound to RELEASE_SHA, but durable evidence
          # recognition must use the current approved control-plane contract so
          # later canonical receipt formats can validate older authorized bytes.
          git show "${GITHUB_SHA}:scripts/validation-resume.py" > "$RUNNER_TEMP/current-validation-resume.py"
          evidence="$RUNNER_TEMP/validated-package-evidence.json"
          python3 "$RUNNER_TEMP/current-validation-resume.py" validated-package \
            --repository "${{ github.repository }}" \
            --revision "$APPLICATION_RELEASE_SHA" \
            --package-identity "$PACKAGE_IDENTITY" \
            --output "$evidence"
          python3 - "$evidence" "$GITHUB_OUTPUT" "$GITHUB_ENV" <<'PYVALIDATED'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if not data.get('reusable') or not data.get('runId') or not data.get('artifact'):
              raise SystemExit(

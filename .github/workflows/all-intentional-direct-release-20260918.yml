name: Direct deploy shared application translation repair

on:
  push:
    branches: [repair/translation-admission-20260918]
    paths: ['.github/workflows/all-intentional-direct-release-20260918.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: september-18-direct-release
  cancel-in-progress: false
env:
  RELEASE_SHA: ${{ github.sha }}
  EXPECTED_BASE_SHA: fd22853357d4005269a0bf73ae88602c949d8995
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Verify current live base before publication
        id: base
        run: |
          python3 - <<'PYBASE'
          import json, os, urllib.request
          for host in ('portal.mylegnd.com','client.mylegnd.com'):
              with urllib.request.urlopen('https://'+host+'/_deployment-provenance.json?translation_preflight='+os.environ['RELEASE_SHA'],timeout=30) as response:
                  actual=json.load(response)['releaseSha']
              print(host,actual)
              assert actual == os.environ['EXPECTED_BASE_SHA'], 'Live revision changed; rebase before deployment'
          PYBASE
      - name: Build exact translation candidate
        id: build
        continue-on-error: true
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --nologo -p:SourceRevisionId="$RELEASE_SHA"
      - name: Verify localization retention privacy limits and original delivery
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo \
            --filter 'FullyQualifiedName~ApplicationLocalization|FullyQualifiedName~ApplicationTranslationAdmission|FullyQualifiedName~LegendConnectTrainingDatasetGroupSplitTests|FullyQualifiedName~LegendConnectEntitlementTests|FullyQualifiedName~AzureTranslatorServiceTests|FullyQualifiedName~AzureTranslatorSubscriptionCapacityTests|FullyQualifiedName~MessagingDeferredPresentationTests|FullyQualifiedName~FounderLegendConnectLiveMetricsTests' \
            --logger 'trx;LogFileName=translation.trx' --results-directory /tmp/translation-results
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/translation-results/translation.trx')
          cases=root.findall('.//{*}UnitTestResult')
          assert len(cases)>0 and all(c.get('outcome')=='Passed' for c in cases)
          assert any('ApplicationTranslationAdmissionTests' in c.get('testName','') for c in cases), 'Admission suite did not execute'
          print('Verified passing executions:',len(cases))
          PYTEST
      - name: Verify shared web catalog contracts
        id: web
        continue-on-error: true
        run: node --test tests/legend-connect/*.test.mjs tests/messaging/message-presentation.test.mjs
      - name: Publish existing portal and client packages
        id: package
        if: steps.tests.outcome == 'success' && steps.web.outcome == 'success'
        run: |
          set -euo pipefail
          dotnet publish AgentPortal/AgentPortal.csproj -c Release --no-restore -o /tmp/agentportal-publish -p:SourceRevisionId="$RELEASE_SHA"
          dotnet publish ClientApp/ClientApp.csproj -c Release --no-restore -o /tmp/clientapp-publish -p:SourceRevisionId="$RELEASE_SHA"
          for app in agentportal clientapp; do
            mkdir -p "/tmp/$app-publish/wwwroot"
            printf '{"releaseSha":"%s","release":"translation-admission-20260918"}\n' "$RELEASE_SHA" > "/tmp/$app-publish/wwwroot/_deployment-provenance.json"
          done
      - uses: azure/login@v2
        id: azure
        if: steps.package.outcome == 'success'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Direct deploy AgentPortal
        id: portal
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.azure.outcome == 'success' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-portal
          slot-name: Production
          package: /tmp/agentportal-publish
      - name: Direct deploy ClientApp
        id: client
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.azure.outcome == 'success' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-client
          slot-name: Production
          package: /tmp/clientapp-publish
      - name: Verify every deployed target and collect all failures
        id: live
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.azure.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PYLIVE'
          import concurrent.futures, json, os, time, urllib.request
          hosts=('portal.mylegnd.com','masterapp-portal.azurewebsites.net','client.mylegnd.com','masterapp-client.azurewebsites.net')
          def verify(host):
              end=time.monotonic()+480
              actual=None
              while time.monotonic()<end:
                  try:
                      request=urllib.request.Request('https://'+host+'/_deployment-provenance.json?release='+os.environ['RELEASE_SHA'],headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response: actual=json.load(response).get('releaseSha')
                      if actual==os.environ['RELEASE_SHA']: return {'host':host,'passed':True,'actual':actual}
                  except Exception as error: actual=type(error).__name__
                  time.sleep(5)
              return {'host':host,'passed':False,'actual':actual}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(verify,hosts))
          os.makedirs('/tmp/translation-results',exist_ok=True)
          with open('/tmp/translation-results/live.json','w') as output: json.dump(rows,output,indent=2)
          for row in rows: print(json.dumps(row))
          assert all(row['passed'] for row in rows)
          PYLIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-direct-release-${{ github.sha }}
          path: /tmp/translation-results/
          if-no-files-found: warn
      - name: Enforce complete direct deployment outcome
        if: always()
        env:
          BASE: ${{ steps.base.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WEB: ${{ steps.web.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          AZURE: ${{ steps.azure.outcome }}
          PORTAL: ${{ steps.portal.outcome }}
          CLIENT: ${{ steps.client.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          results={key:os.environ[key] for key in ('BASE','BUILD','TESTS','WEB','PACKAGE','AZURE','PORTAL','CLIENT','LIVE')}
          print(json.dumps(results,indent=2))
          assert all(value=='success' for value in results.values())
          PYRESULT

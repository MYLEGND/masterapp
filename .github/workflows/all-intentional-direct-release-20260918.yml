name: LEGEND approved direct release

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Release all existing web targets for an automatically integrated change
        type: boolean
        default: false
  push:
    branches: [legend/approved-changes]
    paths: ['Docs/releases/direct-release-request.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: agentportal-production
  cancel-in-progress: false
env:
  RELEASE_SHA: ${{ github.sha }}
jobs:
  discover-live:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.live.outputs.matrix }}
      baselines: ${{ steps.live.outputs.baselines }}
      portal: ${{ steps.live.outputs.portal }}
      targets: ${{ steps.live.outputs.targets }}
      portal_only: ${{ steps.live.outputs.portal_only }}
      website_only: ${{ steps.live.outputs.website_only }}
      public_only: ${{ steps.live.outputs.public_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin approved source and actual live rollback revisions
        id: live
        env:
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
        run: |
          args=()
          if [ "$AUTOMATIC_RELEASE" = true ]; then args+=(--automatic); fi
          python3 scripts/approved-release-baseline.py "${args[@]}" --output "$GITHUB_OUTPUT"
  preserve-rollback:
    needs: discover-live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-live.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-dotnet@v4
        if: matrix.project != 'static'
        with:
          dotnet-version: '10.x'
      - name: Preserve source-equivalent rollback without production data
        env:
          PROJECT: ${{ matrix.project }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rollback
          if [ "$PROJECT" = static ]; then
            npm --prefix Legend-Website run build
            cp Legend-Website/public/web.config Legend-Website/dist/web.config
            printf '%s\n' "$REVISION" > Legend-Website/dist/_deployment-provenance.txt
            (cd Legend-Website/dist && zip -qr /tmp/rollback/package.zip .)
          else
            dotnet publish "$PROJECT" -c Release -o /tmp/rollback-publish -p:SourceRevisionId="$REVISION" --nologo
            printf '{"releaseSha":"%s"}\n' "$REVISION" > /tmp/rollback-publish/wwwroot/_deployment-provenance.json
            (cd /tmp/rollback-publish && zip -qr /tmp/rollback/package.zip .)
          fi
          printf '%s %s source-equivalent rebuild\n' "$APP" "$REVISION" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-rollback-${{ matrix.app }}-${{ github.sha }}
          path: /tmp/rollback/
          retention-days: 1
          if-no-files-found: error
  release:
    needs: [discover-live, preserve-rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    env:
      EXPECTED_BASE_SHA: ${{ needs.discover-live.outputs.portal }}
      LIVE_BASELINES: ${{ needs.discover-live.outputs.baselines }}
      SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
      PORTAL_ONLY: ${{ needs.discover-live.outputs.portal_only }}
      WEBSITE_ONLY: ${{ needs.discover-live.outputs.website_only }}
      PUBLIC_ONLY: ${{ needs.discover-live.outputs.public_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        if: env.WEBSITE_ONLY != 'true'
        with:
          dotnet-version: '10.x'
      - name: Verify current live base before publication
        id: base
        run: |
          python3 - <<'PYBASE'
          import json, os, subprocess, urllib.request
          for row in json.loads(os.environ['LIVE_BASELINES']):
              host=row['host']
              with urllib.request.urlopen('https://'+host+row['path'],timeout=30) as response:
                  actual=response.read().decode().strip() if row['project']=='static' else json.load(response)['sourceRevision']
              print(host,actual)
              assert actual == row['revision'], 'Live revision changed; rebuild the release baseline'
              if os.environ['PUBLIC_ONLY'] == 'true' and row['app'] == 'protect':
                  subprocess.run(['git','diff','--quiet',row['revision'],'HEAD','--','Infrastructure/Migrations'],check=True)
          PYBASE
      - name: Build exact selected release candidate
        id: build
        if: env.WEBSITE_ONLY != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$PUBLIC_ONLY" = true ]; then
            dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo -warnaserror -p:SourceRevisionId="$RELEASE_SHA"
          elif [ "$PORTAL_ONLY" = true ]; then
            dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --nologo -warnaserror -p:SourceRevisionId="$RELEASE_SHA"
          else
            dotnet build MASTERAPP.sln -c Release --nologo -warnaserror -p:SourceRevisionId="$RELEASE_SHA"
          fi
      - name: Verify localization retention privacy limits and original delivery
        id: tests
        if: env.PUBLIC_ONLY != 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo \
            --filter 'FullyQualifiedName~ApplicationLocalization|FullyQualifiedName~ApplicationTranslationAdmission|FullyQualifiedName~LegendConnectTrainingDatasetGroupSplitTests|FullyQualifiedName~LegendConnectEntitlementTests|FullyQualifiedName~AzureTranslatorServiceTests|FullyQualifiedName~AzureTranslatorSubscriptionCapacityTests|FullyQualifiedName~MessagingDeferredPresentationTests|FullyQualifiedName~FounderLegendConnectLiveMetricsTests|FullyQualifiedName~RuntimeDiagnostics|FullyQualifiedName~PageHealthContractTests|FullyQualifiedName~WebDiagnosticPrivacyTests|FullyQualifiedName~RuntimeDiagnosticCaptureTests|FullyQualifiedName~FounderSoftwareRepairBatchTests|FullyQualifiedName~FounderSoftwareRepairCompletionTests|FullyQualifiedName~FounderRemediationRevocationTests|FullyQualifiedName~ClientAppDeploymentWorkflowTests|FullyQualifiedName~LegendFounderAiContractTests.SoftwareRemediation|FullyQualifiedName~LegendCloudflareTransportTests|FullyQualifiedName~LegendCloudflareToolCallbackTests|FullyQualifiedName~LegendFounderToolAuthorizationTests|FullyQualifiedName~LegendFounderCloudActionApprovalTests|FullyQualifiedName~MessagingServiceTests.FounderAiDelegation_|FullyQualifiedName~FounderCandidateValidationTests|FullyQualifiedName~LegendFounderCloudToolExposureTests|FullyQualifiedName~LegendFounderCloudProposalTests|FullyQualifiedName~AuthenticatedRequestBindingTests|FullyQualifiedName~WebsiteContentEditorRoundTripTests' \
            --logger 'trx;LogFileName=translation.trx' --results-directory /tmp/translation-results
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/translation-results/translation.trx')
          cases=root.findall('.//{*}UnitTestResult')
          assert len(cases)>0 and all(c.get('outcome')=='Passed' for c in cases)
          assert any('ApplicationTranslationAdmissionTests' in c.get('testName','') for c in cases), 'Admission suite did not execute'
          required=('LegendCloudflareTransportTests','LegendCloudflareToolCallbackTests','LegendFounderToolAuthorizationTests','LegendFounderCloudActionApprovalTests','FounderAiDelegation_','FounderCandidateValidationTests','LegendFounderCloudToolExposureTests','LegendFounderCloudProposalTests','AuthenticatedRequestBindingTests','WebsiteContentEditorRoundTripTests')
          for suite in required:
              assert any(suite in c.get('testName','') for c in cases), suite+' did not execute'
          print('Verified passing executions:',len(cases))
          PYTEST
      - name: Verify shared web catalog contracts
        id: web
        if: env.PUBLIC_ONLY != 'true'
        continue-on-error: true
        run: |
          node --test tests/legend-connect/*.test.mjs tests/messaging/message-presentation.test.mjs tests/layout/page-health.test.mjs
          node --test Legend-Cloudflare/tests/runtime/*.test.mjs Legend-Cloudflare/tests/security/*.test.mjs Legend-Cloudflare/tests/security/application.integration.mjs
          python3 scripts/test-diagnostic-project-impact.py
          python3 scripts/test-sync-published-checkout.py
      - name: Verify selected website catalog and build
        id: websitechecks
        if: contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-website')
        continue-on-error: true
        run: |
          node --test tests/website/legend-public-cms.test.mjs
          npm --prefix Legend-Website run build
          npm --prefix Legend-Website run check
      - name: Publish exact selected application packages
        id: package
        if: (env.WEBSITE_ONLY == 'true' || (env.PUBLIC_ONLY == 'true' && steps.build.outcome == 'success') || (steps.tests.outcome == 'success' && steps.web.outcome == 'success')) && (steps.websitechecks.outcome == 'success' || (!contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-website') && steps.websitechecks.outcome == 'skipped'))
        run: |
          set -euo pipefail
          apps=()
          if [[ "$SELECTED_TARGETS" == *'"masterapp-portal"'* ]]; then
            dotnet publish AgentPortal/AgentPortal.csproj -c Release --no-build --no-restore -o /tmp/agentportal-publish -p:SourceRevisionId="$RELEASE_SHA"
            apps+=(agentportal)
          fi
          if [[ "$SELECTED_TARGETS" == *'"masterapp-client"'* ]]; then
            dotnet publish ClientApp/ClientApp.csproj -c Release --no-build --no-restore -o /tmp/clientapp-publish -p:SourceRevisionId="$RELEASE_SHA"
            apps+=(clientapp)
          fi
          if [[ "$SELECTED_TARGETS" == *'"masterapp-protect"'* ]]; then
            dotnet publish Protect-Website/ProtectWebsite.csproj -c Release --no-build --no-restore -o /tmp/protect-publish -p:SourceRevisionId="$RELEASE_SHA"
            apps+=(protect)
          fi
          if [[ "$SELECTED_TARGETS" == *'"masterapp-parfait"'* ]]; then
            dotnet publish ParfaitApp/ParfaitApp.csproj -c Release --no-build --no-restore -o /tmp/parfait-publish -p:SourceRevisionId="$RELEASE_SHA"
            apps+=(parfait)
          fi
          if [[ "$SELECTED_TARGETS" == *'"masterapp-website"'* ]]; then
            printf '%s\n' "$RELEASE_SHA" > Legend-Website/dist/_deployment-provenance.txt
            cp Legend-Website/public/web.config Legend-Website/dist/web.config
          fi
          for app in "${apps[@]}"; do
            mkdir -p "/tmp/$app-publish/wwwroot"
            printf '{"releaseSha":"%s","release":"founder-diagnostics-20260918"}\n' "$RELEASE_SHA" > "/tmp/$app-publish/wwwroot/_deployment-provenance.json"
          done
          mkdir -p /tmp/diagnostics-packages
          for app in "${apps[@]}"; do
            (cd "/tmp/$app-publish" && zip -qr "/tmp/diagnostics-packages/$app.zip" .)
          done
          if [ "$PORTAL_ONLY" != true ]; then
            (cd Legend-Website/dist && zip -qr /tmp/diagnostics-packages/website.zip .)
          fi
          sha256sum /tmp/diagnostics-packages/*.zip > /tmp/diagnostics-packages/SHA256SUMS
      - name: Retain exact deployable candidate packages
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: founder-diagnostics-packages-${{ github.sha }}
          path: /tmp/diagnostics-packages/
          retention-days: 1
          if-no-files-found: error
      - uses: azure/login@v2
        id: azure
        if: steps.package.outcome == 'success'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply additive diagnostics migrations before restarting apps
        id: migrate
        if: env.PUBLIC_ONLY != 'true' && steps.package.outcome == 'success' && steps.azure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          python3 - <<'PYMIGRATE'
          import json, os, subprocess
          def az(*args):
              return json.loads(subprocess.check_output(['az',*args,'-o','json'],text=True))
          rows=az('webapp','config','connection-string','list','-g','masterapp-rg','-n','masterapp-portal')
          connection=next((x['value'] for x in rows if x['name']=='MasterAppDb'),None)
          if not connection:
              settings={x['name']:x['value'] for x in az('webapp','config','appsettings','list','-g','masterapp-rg','-n','masterapp-portal')}
              connection=next((settings[k] for k in ('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb') if settings.get(k)),None)
          if not connection or '\n' in connection or not any(x in connection.lower() for x in ('server=tcp:','.database.windows.net','initial catalog=')):
              raise SystemExit('Production SQL connection unavailable; no restart authorized.')
          print('::add-mask::'+connection,flush=True)
          env=os.environ | {'ConnectionStrings__MasterAppDb':connection,'EF_FORCE_SQLSERVER':'true','DOTNET_ENVIRONMENT':'Development','ASPNETCORE_ENVIRONMENT':'Development'}
          common=['--project','Infrastructure/Infrastructure.csproj','--startup-project','AgentPortal/AgentPortal.csproj','--context','MasterAppDbContext','--configuration','Release','--no-build']
          listing=subprocess.check_output(['dotnet','tool','run','dotnet-ef','migrations','list',*common],env=env,text=True)
          pending=[x.split()[0] for x in listing.splitlines() if '(Pending)' in x]
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['EXPECTED_BASE_SHA'],'HEAD','--','Infrastructure/Migrations'],text=True).splitlines()
          allowed={p.rsplit('/',1)[-1][:-3] for p in changed if p.endswith('.cs') and not p.endswith('.Designer.cs') and 'ModelSnapshot' not in p}
          if not set(pending)<=allowed: raise SystemExit('Unexpected pending migrations; no restart authorized.')
          subprocess.run(['dotnet','tool','run','dotnet-ef','database','update',*common],env=env,check=True)
          after=subprocess.check_output(['dotnet','tool','run','dotnet-ef','migrations','list',*common],env=env,text=True)
          if '(Pending)' in after: raise SystemExit('Pending migrations remain; no restart authorized.')
          print('Schema ready. Applied candidate migrations only; no down migrations.')
          PYMIGRATE
      - name: Direct deploy AgentPortal
        id: portal
        if: ${{ contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-portal') && !cancelled() && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-portal
          slot-name: Production
          package: /tmp/agentportal-publish
      - name: Direct deploy ClientApp
        id: client
        if: ${{ !cancelled() && contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-client') && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-client
          slot-name: Production
          package: /tmp/clientapp-publish
      - name: Direct deploy Protect
        id: protect
        if: ${{ !cancelled() && contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-protect') && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && (steps.migrate.outcome == 'success' || env.PUBLIC_ONLY == 'true') }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-protect
          slot-name: Production
          package: /tmp/protect-publish
      - name: Direct deploy Parfait
        id: parfait
        if: ${{ !cancelled() && contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-parfait') && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-parfait
          slot-name: Production
          package: /tmp/parfait-publish
      - name: Direct deploy Website
        id: website
        if: ${{ !cancelled() && contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-website') && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && (steps.migrate.outcome == 'success' || env.PUBLIC_ONLY == 'true') }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-website
          slot-name: Production
          package: /tmp/diagnostics-packages/website.zip
      - name: Verify every deployed target and collect all failures
        id: live
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && (steps.migrate.outcome == 'success' || env.PUBLIC_ONLY == 'true') }}
        continue-on-error: true
        run: |
          python3 - <<'PYLIVE'
          import concurrent.futures, json, os, time, urllib.request
          selected=json.loads(os.environ['SELECTED_TARGETS'])
          inventory={'masterapp-portal':('portal.mylegnd.com','masterapp-portal.azurewebsites.net'),'masterapp-client':('client.mylegnd.com','masterapp-client.azurewebsites.net'),'masterapp-protect':('masterapp-protect.azurewebsites.net',),'masterapp-parfait':('masterapp-parfait.azurewebsites.net',),'masterapp-website':('masterapp-website.azurewebsites.net','mylegnd.com','www.mylegnd.com')}
          assert selected and all(app in inventory for app in selected)
          hosts=tuple(host for app in selected for host in inventory[app])
          def verify(host):
              end=time.monotonic()+480
              actual=None
              while time.monotonic()<end:
                  try:
                      path='/_deployment-provenance.txt' if host in inventory['masterapp-website'] else '/api/runtime-provenance'
                      request=urllib.request.Request('https://'+host+path+'?release='+os.environ['RELEASE_SHA'],headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          actual=response.read().decode().strip() if host in inventory['masterapp-website'] else json.load(response).get('sourceRevision')
                      if actual==os.environ['RELEASE_SHA']: return {'host':host,'passed':True,'actual':actual}
                  except Exception as error: actual=type(error).__name__
                  time.sleep(5)
              return {'host':host,'passed':False,'actual':actual}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(verify,hosts))
          os.makedirs('/tmp/translation-results',exist_ok=True)
          with open('/tmp/translation-results/live.json','w') as output: json.dump(rows,output,indent=2)
          for row in rows: print(json.dumps(row))
          assert all(row['passed'] for row in rows)
          PYLIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-direct-release-${{ github.sha }}
          path: /tmp/translation-results/
          if-no-files-found: warn
      - name: Enforce complete direct deployment outcome
        if: always()
        env:
          BASE: ${{ steps.base.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WEB: ${{ steps.web.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          AZURE: ${{ steps.azure.outcome }}
          PORTAL: ${{ steps.portal.outcome }}
          CLIENT: ${{ steps.client.outcome }}
          LIVE: ${{ steps.live.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          PROTECT: ${{ steps.protect.outcome }}
          PARFAIT: ${{ steps.parfait.outcome }}
          WEBSITE: ${{ steps.website.outcome }}
          WEBSITECHECKS: ${{ steps.websitechecks.outcome }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          selected=json.loads(os.environ['SELECTED_TARGETS'])
          apps={'masterapp-portal':'PORTAL','masterapp-client':'CLIENT','masterapp-protect':'PROTECT','masterapp-parfait':'PARFAIT','masterapp-website':'WEBSITE'}
          assert selected and len(selected)==len(set(selected)) and all(app in apps for app in selected)
          required=['BASE','PACKAGE','AZURE','LIVE']+[apps[app] for app in selected]
          excluded=[step for app,step in apps.items() if app not in selected]
          (excluded if selected == ['masterapp-website'] else required).append('BUILD')
          (excluded if set(selected) <= {'masterapp-protect','masterapp-website'} else required).extend(['TESTS','WEB','MIGRATE'])
          (required if 'masterapp-website' in selected else excluded).append('WEBSITECHECKS')
          results={key:os.environ[key] for key in required}
          skipped={key:os.environ[key] for key in excluded}
          print(json.dumps({'required':results,'unselected':skipped},indent=2))
          assert all(value=='success' for value in results.values())
          assert all(value=='skipped' for value in skipped.values()), 'Unselected release step unexpectedly executed'
          PYRESULT

        continue-on-error: true
        shell: bash
        run: python3 scripts/deploy-approved-app.py --target parfait
      - name: Reconcile public custom-hostname Cloudflare policy
        id: routingpolicy
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingauthority.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py reconcile-bot-fight
          python3 scripts/cloudflare-routing-authority.py reconcile-bic

      - name: Deploy shared Cloudflare business website router
        id: routingdeploy
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingsecret.outcome == 'success' && steps.routingauthority.outcome == 'success' && steps.routingpolicy.outcome == 'success' && (steps.package.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && (steps.protect.outcome == 'success' || steps.resumestate.outputs.protect_live == 'true' || env.PRESERVE_LIVE_TARGETS == 'true') && (steps.parfait.outcome == 'success' || steps.resumestate.outputs.parfait_live == 'true' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd Legend-Cloudflare

          deployments_file=/tmp/legend-router-deployments.json
          deployments_status="$(curl --silent --show-error \
            -o "$deployments_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/legend-business-website-router/deployments?per_page=1")"
          case "$deployments_status" in
            200)
              previous_version="$(jq -r 'select(.success == true) | .result.deployments[0].versions[0].version_id // empty' "$deployments_file")"
              ;;
            404)
              previous_version=""
              echo "No existing LEGEND website-router deployment is present; first deployment will proceed."
              ;;
            *)
              echo "::error::Cloudflare Worker deployment history lookup failed with HTTP $deployments_status."
              exit 1
              ;;
          esac
          if [ -n "$previous_version" ]; then
            echo "::add-mask::$previous_version"
          fi
          printf 'LEGEND_ROUTING_PREVIOUS_VERSION=%s\n' "$previous_version" >> "$GITHUB_ENV"

          restore_router() {
            set +e
            if [ -n "$previous_version" ]; then
              payload="$(jq -cn --arg version "$previous_version" '{strategy:"percentage",versions:[{version_id:$version,percentage:100}],annotations:{"workers/message":"Automatic LEGEND website-router rollback"}}')"
              response="$(curl --silent --show-error -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/legend-business-website-router/deployments")"
              if [ "$(printf '%s' "$response" | jq -r '.success // false')" = true ]; then
                echo "Restored previous Cloudflare Worker version."
                return 0
              fi
            fi

            routes="$(curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"
            printf '%s' "$routes" | jq -r '.result[]? | select(.script=="legend-business-website-router") | .id' | while read -r route_id; do
              [ -z "$route_id" ] && continue
              curl --silent --show-error -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes/$route_id" >/dev/null
            done
            echo "::warning::Previous Worker version was unavailable; removed the LEGEND Worker route to restore provider DNS behavior."
          }

          npx wrangler deploy --config wrangler.website-routing.jsonc
          printf '%s' "$LEGEND_WEBSITE_BRIDGE_SECRET" | npx wrangler secret put LEGEND_WEBSITE_BRIDGE_SECRET --config wrangler.website-routing.jsonc

          if ! python3 - <<'PYFIRSTPARTY'
          import http.client, ssl, time
          hosts=('mylegnd.com','www.mylegnd.com','protect.mylegnd.com','portal.mylegnd.com','client.mylegnd.com')
          context=ssl.create_default_context()
          failures=[]
          for host in hosts:
              last=None
              for attempt in range(1,7):
                  conn=http.client.HTTPSConnection(host,443,timeout=15,context=context)
                  try:
                      conn.request('GET','/',headers={'User-Agent':'LEGEND-worker-release-smoke/1.0','Cache-Control':'no-cache'})
                      response=conn.getresponse()
                      body=response.read(1025)
                      last=f'HTTP {response.status}'
                      print(host,attempt,response.status,len(body))
                      if 200 <= response.status < 400:
                          break
                  except Exception as error:
                      last=type(error).__name__
                      print(host,attempt,last)
                  finally:
                      conn.close()
                  time.sleep(5)
              else:
                  failures.append(f'{host}: {last}')
          if failures:
              raise SystemExit('LEGEND-owned host smoke failed after bounded retries: '+'; '.join(failures))
          PYFIRSTPARTY
          then
            restore_router
            exit 1
          fi
          echo "Cloudflare website router deployed and LEGEND-owned host pass-through verified."
      - name: Direct deploy Website immutable ZIP
        id: website
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && contains(fromJSON(env.SELECTED_TARGETS), 'masterapp-website') && steps.resumestate.outputs.website_live != 'true' && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && steps.azuredeploy.outcome == 'success' && (steps.migrate.outcome == 'success' || env.PUBLIC_ONLY == 'true') }}
        continue-on-error: true
        shell: bash
        run: python3 scripts/deploy-approved-app.py --target website
      - name: Verify custom-domain bridge end to end
        id: routinglive
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingdeploy.outcome == 'success' && (steps.protect.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && (steps.parfait.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          restore_router() {
            set +e
            if [ -n "${LEGEND_ROUTING_PREVIOUS_VERSION:-}" ]; then
              payload="$(jq -cn --arg version "$LEGEND_ROUTING_PREVIOUS_VERSION" '{strategy:"percentage",versions:[{version_id:$version,percentage:100}],annotations:{"workers/message":"Automatic LEGEND custom-domain proof rollback"}}')"
              response="$(curl --silent --show-error -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/legend-business-website-router/deployments")"
              if [ "$(printf '%s' "$response" | jq -r '.success // false')" = true ]; then
                echo "Restored previous Cloudflare Worker version."
                return 0
              fi
            fi
            routes="$(curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"
            printf '%s' "$routes" | jq -r '.result[]? | select(.script=="legend-business-website-router") | .id' | while read -r route_id; do
              [ -z "$route_id" ] && continue
              curl --silent --show-error -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes/$route_id" >/dev/null
            done
          }

          portal_connection="$(az webapp config connection-string list -g masterapp-rg -n masterapp-portal -o json | jq -r '.[] | select(.name=="MasterAppDb") | .value' | head -n 1)"
          if [ -z "$portal_connection" ] || [ "$portal_connection" = null ]; then
            portal_connection="$(az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json | jq -r '.[] | select(.name=="ConnectionStrings__MasterAppDb" or .name=="MasterAppDb" or .name=="SQLCONNSTR_MasterAppDb") | .value' | head -n 1)"
          fi
          protect_settings=/tmp/protect-domain-refresh.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect_settings"
          domain_token="$(jq -r '.[] | select(.name=="WebsiteDomains__ApiToken" or .name=="WebsiteDomains:ApiToken") | .value' "$protect_settings" | head -n 1)"
          cname_target="$(jq -r '.[] | select(.name=="WebsiteDomains__CnameTarget" or .name=="WebsiteDomains:CnameTarget") | .value' "$protect_settings" | head -n 1)"
          if [ -z "$portal_connection" ] || [ "$portal_connection" = null ] ||
             [ -z "$domain_token" ] || [ "$domain_token" = null ] ||
             [ -z "$cname_target" ] || [ "$cname_target" = null ]; then
            echo "::error::Shared domain authority configuration is unavailable."
            restore_router
            exit 1
          fi
          echo "::add-mask::$portal_connection"
          echo "::add-mask::$domain_token"
          if ! LEGEND_RELEASE_DOMAIN="$WEBSITE_ROUTING_CANARY" \
               LEGEND_RELEASE_DB_CONNECTION="$portal_connection" \
               LEGEND_RELEASE_ZONE_ID="$CLOUDFLARE_ZONE_ID" \
               LEGEND_RELEASE_DOMAIN_TOKEN="$domain_token" \
               LEGEND_RELEASE_CNAME_TARGET="$cname_target" \
               dotnet run --project scripts/DomainReleaseRefresh/DomainReleaseRefresh.csproj -c Release --no-restore; then
            restore_router
            exit 1
          fi

          if ! python3 - <<'PYCUSTOM'
          import http.client, json, os, ssl, time
          host=os.environ['WEBSITE_ROUTING_CANARY']
          context=ssl.create_default_context()

          def request(path, accept=None):
              conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
              try:
                  headers={'User-Agent':'LEGEND-commerce-domain-proof/1.0','Cache-Control':'no-cache'}
                  if accept: headers['Accept']=accept
                  conn.request('GET',path,headers=headers)
                  response=conn.getresponse()
                  body=response.read(8193)
                  edge_headers={key.lower(): value for key,value in response.getheaders()}
                  if response.status >= 400:
                      print('edge-diagnostic', json.dumps({
                          'path': path,
                          'status': response.status,
                          'bytes': len(body),
                          'server': edge_headers.get('server'),
                          'cf-ray': edge_headers.get('cf-ray'),
                          'cf-cache-status': edge_headers.get('cf-cache-status'),
                          'x-azure-ref': edge_headers.get('x-azure-ref'),
                          'x-ms-forbidden-ip': edge_headers.get('x-ms-forbidden-ip'),
                          'content-type': edge_headers.get('content-type'),
                          'bodyPrefix': body[:768].decode('utf-8','replace').replace('\\r',' ').replace('\\n',' ')
                      }))
                  return response.status, body, response.getheader('Location')
              finally:
                  conn.close()

          binding_ok=False
          store_ok=False
          home_ok=False
          last_binding=None
          last_store=None
          last_home=None
          for attempt in range(1,9):
              try:
                  status,body,location=request('/.well-known/legend-website','application/json')
                  last_binding=(status,len(body),location)
                  print(host,'binding',attempt,status,len(body),location or '')
                  if status==200 and len(body)<=4096 and not location:
                      receipt=json.loads(body)
                      if all(isinstance(receipt.get(key),str) and len(receipt.get(key))>=32 for key in ('businessId','bindingId')):
                          binding_ok=True
              except Exception as error:
                  last_binding=(type(error).__name__,0,None)
                  print(host,'binding',attempt,type(error).__name__)

              try:
                  status,body,location=request('/')
                  last_home=(status,len(body),location)
                  print(host,'/',attempt,status,len(body),location or '')
                  home_ok=status==200 and len(body)>0 and not location
              except Exception as error:
                  last_home=(type(error).__name__,0,None)
                  print(host,'/',attempt,type(error).__name__)
                  home_ok=False

              try:
                  status,body,location=request('/store')
                  last_store=(status,len(body),location)
                  print(host,'/store',attempt,status,len(body),location or '')
                  store_ok=status==200 and not location
              except Exception as error:
                  last_store=(type(error).__name__,0,None)
                  print(host,'/store',attempt,type(error).__name__)
                  store_ok=False

              if binding_ok and home_ok and store_ok:
                  break
              time.sleep(5)

          if not binding_ok:
              raise SystemExit(f'Custom-domain routing proof did not stabilize: {last_binding}')
          if not home_ok:
              raise SystemExit(f'Custom-domain homepage did not stabilize: {last_home}')
          if not store_ok:
              raise SystemExit(f'Custom-domain store proof did not stabilize: {last_store}')
          PYCUSTOM
          then
            restore_router
            exit 1
          fi
          echo "Custom-domain Worker bridge reached the exact LEGEND business binding proof."

      - name: Capture exact Cloudflare challenge event after failed live proof
        id: routingchallenge
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routinglive.outcome == 'failure' && steps.routingauthority.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py challenge-events --host "$WEBSITE_ROUTING_CANARY"

      - name: Verify every deployed target and collect all failures
        id: live
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true' || env.EXACT_LIVE == 'true') && (steps.azure.outcome == 'success' || env.EXACT_LIVE == 'true') && (env.WEBSITE_ROUTING != 'true' || steps.routinglive.outcome == 'success') && (steps.migrate.outcome == 'success' || env.PUBLIC_ONLY == 'true' || env.CLIENT_ONLY == 'true' || env.PRESERVE_LIVE_TARGETS == 'true' || env.EXACT_LIVE == 'true') }}
        continue-on-error: true
        run: |
          python3 - <<'PYLIVE'
          import concurrent.futures, json, os, time, urllib.request
          selected=json.loads(os.environ['SELECTED_TARGETS'])
          inventory={'masterapp-portal':('portal.mylegnd.com','masterapp-portal.azurewebsites.net'),'masterapp-client':('client.mylegnd.com','masterapp-client.azurewebsites.net'),'masterapp-protect':('masterapp-protect.azurewebsites.net',),'masterapp-parfait':('masterapp-parfait.azurewebsites.net',),'masterapp-website':('masterapp-website.azurewebsites.net','mylegnd.com','www.mylegnd.com')}
          assert selected and all(app in inventory for app in selected)
          hosts=tuple(host for app in selected for host in inventory[app])
          def verify(host):
              end=time.monotonic()+480
              actual=None
              while time.monotonic()<end:
                  try:
                      path='/_deployment-provenance.txt' if host in inventory['masterapp-website'] else '/api/runtime-provenance'
                      expected=os.environ['APPLICATION_RELEASE_SHA']
                      request=urllib.request.Request('https://'+host+path+'?release='+expected,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          actual=response.read().decode().strip() if host in inventory['masterapp-website'] else json.load(response).get('sourceRevision')
                      if actual==expected: return {'host':host,'passed':True,'actual':actual}
                  except Exception as error: actual=type(error).__name__
                  time.sleep(5)
              return {'host':host,'passed':False,'actual':actual}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(verify,hosts))
          os.makedirs('/tmp/translation-results',exist_ok=True)
          with open('/tmp/translation-results/live.json','w') as output: json.dump(rows,output,indent=2)
          for row in rows: print(json.dumps(row))
          assert all(row['passed'] for row in rows)
          PYLIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-direct-release-${{ github.sha }}

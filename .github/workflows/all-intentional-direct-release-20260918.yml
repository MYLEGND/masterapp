          validate_only=os.environ.get('VALIDATE_ONLY')=='true'
          website_routing=os.environ.get('WEBSITE_ROUTING')=='true'
          preserve_live_targets=os.environ.get('PRESERVE_LIVE_TARGETS')=='true'
          routing_steps=['ROUTINGCHECKS','ROUTINGSECRET','ROUTINGDEPLOY','ROUTINGLIVE']
          if preserve_live_targets:
              assert not validate_only and website_routing
              required=['BASE','AZURE','LIVE']+routing_steps
              skipped=['BUILD','TESTS','WEB','PACKAGE','MIGRATE','PROTECTAUTH','PORTAL','CLIENT','PROTECT','PARFAIT','WEBSITE','WEBSITECHECKS']
              results={key:os.environ[key] for key in required}
              skipped_results={key:os.environ[key] for key in skipped}
              print(json.dumps({'mode':'preserve-live-routing-recovery','required':results,'preservedSteps':skipped_results},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped_results.values()), 'Preserve-live recovery redeployed or mutated an application target'
          elif validate_only:
              if website_routing:
                  required=['BASE','BUILD','ROUTINGCHECKS','PACKAGE']
                  skipped=['TESTS','WEB','AZURE','MIGRATE','LIVE','PROTECTAUTH','ROUTINGSECRET','ROUTINGDEPLOY','ROUTINGLIVE']+list(apps.values())
              elif set(selected) <= {'masterapp-protect','masterapp-website'}:
                  required=['BASE','BUILD','PACKAGE']
                  skipped=['TESTS','WEB','AZURE','MIGRATE','LIVE','PROTECTAUTH']+routing_steps+list(apps.values())
              else:
                  required=['BASE','BUILD','TESTS','WEB','PACKAGE']
                  skipped=['AZURE','MIGRATE','LIVE','PROTECTAUTH']+routing_steps+list(apps.values())
              if 'masterapp-website' in selected:
                  required.append('WEBSITECHECKS')
              else:
                  skipped.append('WEBSITECHECKS')
              results={key:os.environ[key] for key in required}
              skipped_results={key:os.environ[key] for key in skipped}
              print(json.dumps({'mode':'validate-only','required':results,'skippedSteps':skipped_results},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped_results.values()), 'Validation-only run executed a publish or deployment step'
          else:
              required=['BASE','PACKAGE','AZURE','LIVE']+[apps[app] for app in selected]
              excluded=[step for app,step in apps.items() if app not in selected]
              (required if 'masterapp-protect' in selected else excluded).append('PROTECTAUTH')
              (excluded if selected == ['masterapp-website'] else required).append('BUILD')
              if os.environ.get('CLIENT_ONLY') == 'true':
                  required.extend(['TESTS','WEB'])
                  excluded.append('MIGRATE')
              elif set(selected) <= {'masterapp-protect','masterapp-website'}:
                  excluded.extend(['TESTS','WEB'])
                  (excluded if selected == ['masterapp-website'] else required).append('MIGRATE')
              else:
                  required.extend(['TESTS','WEB','MIGRATE'])
              (required if 'masterapp-website' in selected else excluded).append('WEBSITECHECKS')
              if website_routing:
                  required.extend(routing_steps)
              else:
                  excluded.extend(routing_steps)
              results={key:os.environ[key] for key in required}
              skipped={key:os.environ[key] for key in excluded}
              print(json.dumps({'mode':'approved-only','required':results,'unselected':skipped},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped.values()), 'Unselected release step unexpectedly executed'
          PYRESULT

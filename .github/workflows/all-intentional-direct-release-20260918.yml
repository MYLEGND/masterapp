        shell: bash
        run: |
          python3 - /tmp/release-auxiliary-results/router.json <<'PYAUXPOLICY'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit('Router auxiliary result missing')
          data=json.loads(path.read_text())
          if data.get('schemaVersion') != 1 or data.get('lane') != 'router' or data.get('policySuccess') is not True:
              raise SystemExit('Cloudflare routing policy lane did not succeed')
          print(json.dumps(data,sort_keys=True))
          PYAUXPOLICY

      - name: Deploy shared Cloudflare business website router
        id: routingdeploy
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.prepublication.outcome == 'success' && steps.routingauthority.outcome == 'success' && steps.routingpolicy.outcome == 'success' && (steps.transaction.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 - /tmp/release-auxiliary-results/router.json <<'PYAUXROUTER'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit('Router auxiliary result missing')
          data=json.loads(path.read_text())
          if data.get('schemaVersion') != 1 or data.get('lane') != 'router' or data.get('deploySuccess') is not True:
              raise SystemExit('Cloudflare router auxiliary lane did not succeed')
          print(json.dumps(data,sort_keys=True))
          PYAUXROUTER

      - name: Verify custom-domain bridge end to end
        id: routinglive
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingdeploy.outcome == 'success' && (steps.transaction.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          db_connection="$(az webapp config connection-string list -g "$RELEASE_RESOURCE_GROUP" -n "$DATABASE_AUTHORITY" -o json | jq -r '.[] | select(.name=="MasterAppDb") | .value' | head -n 1)"
          if [ -z "$db_connection" ] || [ "$db_connection" = null ]; then
            db_connection="$(az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$DATABASE_AUTHORITY" -o json | jq -r '.[] | select(.name=="ConnectionStrings__MasterAppDb" or .name=="MasterAppDb" or .name=="SQLCONNSTR_MasterAppDb") | .value' | head -n 1)"
          fi
          routing_settings=/tmp/routing-domain-refresh.json
          az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$ROUTING_PRIMARY" -o json > "$routing_settings"
          domain_token="$(jq -r '.[] | select(.name=="WebsiteDomains__ApiToken" or .name=="WebsiteDomains:ApiToken") | .value' "$routing_settings" | head -n 1)"
          cname_target="$(jq -r '.[] | select(.name=="WebsiteDomains__CnameTarget" or .name=="WebsiteDomains:CnameTarget") | .value' "$routing_settings" | head -n 1)"
          if [ -z "$db_connection" ] || [ "$db_connection" = null ] ||
             [ -z "$domain_token" ] || [ "$domain_token" = null ] ||
             [ -z "$cname_target" ] || [ "$cname_target" = null ]; then
            echo "::error::Shared domain authority configuration is unavailable."
            echo "::error::Router live proof unresolved; successful immutable publication preserved."
            exit 1
          fi
          echo "::add-mask::$db_connection"
          echo "::add-mask::$domain_token"
          if ! LEGEND_RELEASE_DOMAIN="$WEBSITE_ROUTING_CANARY" \
               LEGEND_RELEASE_DB_CONNECTION="$db_connection" \
               LEGEND_RELEASE_ZONE_ID="$CLOUDFLARE_ZONE_ID" \
               LEGEND_RELEASE_DOMAIN_TOKEN="$domain_token" \
               LEGEND_RELEASE_CNAME_TARGET="$cname_target" \
               dotnet run --project "$DOMAIN_REFRESH_PROJECT" -c Release --no-restore; then
            echo "::error::Router live proof unresolved; successful immutable publication preserved."
            exit 1
          fi

          if ! python3 - <<'PYCUSTOM'
          import http.client, json, os, ssl, time
          host=os.environ['WEBSITE_ROUTING_CANARY']
          context=ssl.create_default_context()

          def request(path, accept=None):
              conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
              try:
                  headers={'User-Agent':'LEGEND-commerce-domain-proof/1.0','Cache-Control':'no-cache'}
                  if accept: headers['Accept']=accept
                  conn.request('GET',path,headers=headers)
                  response=conn.getresponse()
                  body=response.read(8193)
                  edge_headers={key.lower(): value for key,value in response.getheaders()}
                  if response.status >= 400:
                      print('edge-diagnostic', json.dumps({
                          'path': path,
                          'status': response.status,
                          'bytes': len(body),
                          'server': edge_headers.get('server'),
                          'cf-ray': edge_headers.get('cf-ray'),
                          'cf-cache-status': edge_headers.get('cf-cache-status'),
                          'x-azure-ref': edge_headers.get('x-azure-ref'),
                          'x-ms-forbidden-ip': edge_headers.get('x-ms-forbidden-ip'),
                          'content-type': edge_headers.get('content-type'),
                          'bodyPrefix': body[:768].decode('utf-8','replace').replace('\\r',' ').replace('\\n',' ')
                      }))
                  return response.status, body, response.getheader('Location')
              finally:
                  conn.close()

          binding_ok=False
          store_ok=False
          home_ok=False
          last_binding=None
          last_store=None
          last_home=None
          for attempt in range(1,9):
              try:
                  status,body,location=request('/.well-known/legend-website','application/json')
                  last_binding=(status,len(body),location)
                  print(host,'binding',attempt,status,len(body),location or '')
                  if status==200 and len(body)<=4096 and not location:
                      receipt=json.loads(body)
                      if all(isinstance(receipt.get(key),str) and len(receipt.get(key))>=32 for key in ('businessId','bindingId')):
                          binding_ok=True
              except Exception as error:
                  last_binding=(type(error).__name__,0,None)
                  print(host,'binding',attempt,type(error).__name__)

              try:
                  status,body,location=request('/')
                  last_home=(status,len(body),location)
                  print(host,'/',attempt,status,len(body),location or '')
                  home_ok=status==200 and len(body)>0 and not location
              except Exception as error:
                  last_home=(type(error).__name__,0,None)
                  print(host,'/',attempt,type(error).__name__)
                  home_ok=False

              try:
                  status,body,location=request('/store')
                  last_store=(status,len(body),location)
                  print(host,'/store',attempt,status,len(body),location or '')
                  store_ok=status==200 and not location
              except Exception as error:
                  last_store=(type(error).__name__,0,None)
                  print(host,'/store',attempt,type(error).__name__)
                  store_ok=False

              if binding_ok and home_ok and store_ok:
                  break
              time.sleep(5)

          if not binding_ok:
              raise SystemExit(f'Custom-domain routing proof did not stabilize: {last_binding}')
          if not home_ok:
              raise SystemExit(f'Custom-domain homepage did not stabilize: {last_home}')
          if not store_ok:
              raise SystemExit(f'Custom-domain store proof did not stabilize: {last_store}')
          PYCUSTOM
          then
            echo "::error::Router live proof unresolved; successful immutable publication preserved."
            exit 1
          fi
          echo "Custom-domain Worker bridge reached the exact LEGEND business binding proof."

      - name: Capture exact Cloudflare challenge event after failed live proof
        id: routingchallenge
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routinglive.outcome == 'failure' && steps.routingauthority.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py challenge-events --host "$WEBSITE_ROUTING_CANARY"

      - name: Verify every deployed target and collect all failures
        id: live
        if: ${{ !cancelled() && (steps.transaction.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true' || env.EXACT_LIVE == 'true') && (env.WEBSITE_ROUTING != 'true' || steps.routinglive.outcome == 'success') && (env.FOUNDER_CLOUDFLARE != 'true' || steps.foundercloud.outcome == 'success') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/translation-results
          python3 scripts/validation-resume.py verify-live \
            --revision "$APPLICATION_RELEASE_SHA" \
            --selected-targets "$SELECTED_TARGETS" \
            --output /tmp/translation-results/live.json
          python3 scripts/release-child-receipt.py live-proof

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-direct-release-${{ env.RELEASE_SHA }}
          path: /tmp/translation-results/
          if-no-files-found: warn
      - name: Enforce complete direct deployment outcome
        if: always()
        env:
          BASE: ${{ steps.base.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          AZURE: ${{ steps.azure.outcome }}
          TRANSACTION: ${{ steps.transaction.outcome }}
          LIVE: ${{ steps.live.outcome }}
          ROUTING_LIVE: ${{ steps.routinglive.outcome }}
          FOUNDER_CLOUD: ${{ steps.foundercloud.outcome }}
          VALIDATE_ONLY: ${{ env.VALIDATE_ONLY }}
          WEBSITE_ROUTING: ${{ env.WEBSITE_ROUTING }}
          FOUNDER_CLOUDFLARE: ${{ env.FOUNDER_CLOUDFLARE }}
          PRESERVE_LIVE_TARGETS: ${{ env.PRESERVE_LIVE_TARGETS }}
          EXACT_LIVE: ${{ env.EXACT_LIVE }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          selected=json.loads(os.environ['SELECTED_TARGETS'])
          assert isinstance(selected,list) and selected and len(selected)==len(set(selected))
          validate_only=os.environ.get('VALIDATE_ONLY')=='true'
          website_routing=os.environ.get('WEBSITE_ROUTING')=='true'
          founder_cloudflare=os.environ.get('FOUNDER_CLOUDFLARE')=='true'
          preserve_live=os.environ.get('PRESERVE_LIVE_TARGETS')=='true'
          exact_live=os.environ.get('EXACT_LIVE')=='true'
          base=os.environ['BASE']
          package=os.environ['PACKAGE']
          azure=os.environ['AZURE']
          transaction=os.environ['TRANSACTION']
          effective_transaction=transaction
          live=os.environ['LIVE']
          routing_live=os.environ['ROUTING_LIVE']
          founder_cloud=os.environ['FOUNDER_CLOUD']

          if validate_only:
              assert not preserve_live and not exact_live
              assert base=='success' and package=='success'
              assert effective_transaction=='skipped' and live=='skipped'
              mode='validate-only'
          elif exact_live:
              assert not preserve_live and not website_routing and not founder_cloudflare
              assert base=='success' and live=='success'
              assert effective_transaction=='skipped'
              mode='exact-live-noop'
          elif preserve_live:
              assert website_routing
              assert base=='success' and azure=='success' and live=='success'
              assert effective_transaction=='skipped'
              mode='preserve-live-routing-recovery'
          else:
              assert base=='success' and package=='success' and azure=='success'
              assert effective_transaction=='success'
              assert live=='success'
              if founder_cloudflare:
                  assert founder_cloud=='success'
              mode='approved-transaction'

          if website_routing and not validate_only:
              assert routing_live=='success'

          receipt={
              'schemaVersion':2,
              'mode':mode,
              'applicationReleaseSha':os.environ['APPLICATION_RELEASE_SHA'],
              'releaseHeadSha':os.environ['RELEASE_SHA'],
              'selectedTargets':selected,
              'packageIdentity':os.environ['PACKAGE_IDENTITY'],
              'founderCloudflare':founder_cloudflare,
              'transaction':'committed' if effective_transaction=='success' else 'preserved',
          }
          with open('/tmp/approved-release-receipt.json','w') as output:
              json.dump(receipt,output,sort_keys=True,indent=2)
          print(json.dumps(receipt,sort_keys=True))
          PYRESULT
      - name: Retain exact approved release receipt
        if: success() && env.VALIDATE_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: legend-approved-release-${{ env.APPLICATION_RELEASE_SHA }}
          path: /tmp/approved-release-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile terminal release resource disposition
        id: disposition
        if: >-
          always() && steps.transactionprepare.outcome == 'success' &&
          (steps.prepublication.outcome == 'success' || steps.prepublication.outcome == 'skipped') &&
          (steps.routingauthority.outcome == 'success' || steps.routingauthority.outcome == 'skipped') &&
          (steps.routingpolicy.outcome == 'success' || steps.routingpolicy.outcome == 'skipped') &&
          (steps.routingdeploy.outcome == 'success' || steps.routingdeploy.outcome == 'skipped') &&
          (steps.foundercloud.outcome == 'success' || steps.foundercloud.outcome == 'skipped')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PRODUCER_RUN: ${{ steps.reusevalidated.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/deploy-approved-app.py \
            --targets-json "$SELECTED_TARGETS" \
            --package-root /tmp/diagnostics-packages \
            --disposition-only --transaction-plan /tmp/release-transaction.json > /tmp/release-provider-disposition.json
          python3 - <<'PYDISPOSITION'
          import json,os,pathlib
          evidence=json.loads(pathlib.Path('/tmp/release-provider-disposition.json').read_text())
          if evidence.get('terminal') is not True:
              raise SystemExit('Provider release resource disposition remains unknown')
          evidence.update(admissionId=os.environ['ADMISSION_ID'], resources=json.loads(os.environ['ADMISSION_RESOURCES']),
                          producingRun=int(os.environ['GITHUB_RUN_ID']), producingAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          mutableChildrenSettled=True)
          pathlib.Path('/tmp/release-disposition.json').write_text(json.dumps(evidence,sort_keys=True)+'\n')
          PYDISPOSITION
      - name: Preserve terminal release resource disposition
        if: always() && steps.disposition.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: legend-release-disposition-${{ env.ADMISSION_ID }}-${{ github.run_attempt }}
          path: /tmp/release-disposition.json
          retention-days: 90
          if-no-files-found: error

  target-release-receipts:
    name: target-release-receipts (${{ matrix.app }})
    needs: [discover-live, release]
    if: needs.release.result == 'success' && needs.discover-live.outputs.validate_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-live.outputs.matrix) }}
    steps:
      - name: Bind live-proven transaction receipt to canonical target
        shell: bash
        env:
          APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
          SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
          TARGET_NAME: ${{ matrix.releaseName }}
        run: |
          set -euo pipefail
          python3 - <<'PYTARGETRECEIPT'
          import json,os,pathlib
          names=json.loads(os.environ['SELECTED_TARGETS'])
          release_name=os.environ['TARGET_NAME']
          if release_name not in names:
              raise SystemExit('Target receipt is not part of the canonical selected release set')
          payload={
              'schemaVersion':2,
              'applicationReleaseSha':os.environ['APPLICATION_RELEASE_SHA'],
              'target':release_name,
              'transaction':'committed-or-preserved',
              'liveProven':True,
              'authority':'post-live-verification',
          }
          pathlib.Path('/tmp/target-release-receipt.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          PYTARGETRECEIPT
      - name: Preserve target-specific live-proven deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: legend-approved-release-${{ needs.discover-live.outputs.application_release_sha }}-${{ matrix.releaseName }}
          path: /tmp/target-release-receipt.json
          retention-days: 90
          if-no-files-found: error

  release-state-receipt:
    name: release-state-receipt
    needs: [discover-live, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
      PACKAGE_IDENTITY: ${{ needs.discover-live.outputs.package_identity }}
      SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
    steps:
      - name: Capture exact release step-state receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100")"
          printf '%s' "$jobs" > "$RUNNER_TEMP/release-jobs.json"
          python3 - "$RUNNER_TEMP/release-jobs.json" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$APPLICATION_RELEASE_SHA" "$PACKAGE_IDENTITY" "$SELECTED_TARGETS" <<'PYSTATE'
          import json,sys
          jobs_path,run_id,attempt,release_sha,application_sha,package_identity,targets=sys.argv[1:]
          with open(jobs_path) as source:
              payload=json.load(source)
          release_jobs=[row for row in payload.get('jobs',[]) if row.get('name')=='release']
          if len(release_jobs)!=1:
              raise SystemExit('Expected exactly one terminal release job')
          job=release_jobs[0]
          if job.get('status')!='completed':
              raise SystemExit('Release job is not terminal; refusing partial state receipt')
          steps=[
              {
                  'number':step.get('number'),
                  'name':step.get('name'),
                  'status':step.get('status'),
                  'conclusion':step.get('conclusion'),
              }
              for step in job.get('steps',[])
          ]
          if any(not row['name'] for row in steps):
              raise SystemExit('Release step inventory malformed')
          if not steps and job.get('conclusion')!='skipped':
              raise SystemExit('Terminal non-skipped release job has no step inventory')
          state={
              'schemaVersion':2,
              'runId':int(run_id),
              'runAttempt':int(attempt),
              'releaseHeadSha':release_sha,
              'applicationReleaseSha':application_sha or None,
              'packageIdentity':package_identity or None,
              'selectedTargets':json.loads(targets) if targets else [],
              'releaseJobConclusion':job.get('conclusion'),
              'steps':steps,
          }
          with open('/tmp/legend-release-step-state.json','w') as output:
              json.dump(state,output,sort_keys=True,indent=2)
          print(json.dumps({
              'releaseJobConclusion':state['releaseJobConclusion'],
              'applicationReleaseSha':state['applicationReleaseSha'],
              'stepOutcomes':{row['name']:row['conclusion'] for row in steps},
          },sort_keys=True))
          PYSTATE

      - name: Preserve exact release step-state receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: legend-release-step-state-${{ needs.discover-live.outputs.application_release_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/legend-release-step-state.json
          retention-days: 30
          if-no-files-found: error

      - name: Bind successful release to canonical validated package
        if: >-
          needs.release.result == 'success' &&
          needs.discover-live.outputs.validate_only != 'true' &&
          needs.discover-live.outputs.exact_live != 'true' &&
          needs.discover-live.outputs.preserve_live_targets != 'true' &&
          needs.discover-live.outputs.package_identity != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPACKAGELINK'
          import json,os,pathlib,re
          revision=os.environ['APPLICATION_RELEASE_SHA']
          identity=os.environ['PACKAGE_IDENTITY']
          if not re.fullmatch(r'[0-9a-f]{40}',revision):
              raise SystemExit('Package-link release revision is malformed')
          if not re.fullmatch(r'[0-9a-f]{64}',identity):
              raise SystemExit('Package-link identity is malformed')
          payload={
              'schemaVersion':1,
              'applicationReleaseSha':revision,
              'packageIdentity':identity,
              'source':'canonical-validated-package',
          }
          pathlib.Path('/tmp/legend-approved-package-link.json').write_text(
              json.dumps(payload,sort_keys=True,indent=2)+'\n'
          )
          PYPACKAGELINK

      - name: Preserve validated package release binding
        if: >-
          needs.release.result == 'success' &&
          needs.discover-live.outputs.validate_only != 'true' &&
          needs.discover-live.outputs.exact_live != 'true' &&
          needs.discover-live.outputs.preserve_live_targets != 'true' &&
          needs.discover-live.outputs.package_identity != ''
        uses: actions/upload-artifact@v4
        with:
          name: legend-approved-package-link-${{ needs.discover-live.outputs.application_release_sha }}-${{ needs.discover-live.outputs.package_identity }}
          path: /tmp/legend-approved-package-link.json
          retention-days: 90
          if-no-files-found: error

  wake-release-lifecycle-after-terminal-release:
    name: wake-release-lifecycle-after-terminal-release
    needs: [target-release-receipts, release-state-receipt]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout protected lifecycle wake authority
        uses: actions/checkout@v4
        with:
          ref: legend/approved-changes
          fetch-depth: 1
          persist-credentials: false
      - name: Wake protected lifecycle after terminal direct release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wake-release-lifecycle.py

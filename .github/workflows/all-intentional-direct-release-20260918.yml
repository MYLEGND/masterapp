name: LEGEND approved direct release

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Canonical lifecycle handoff from one fully validated merged PR
        type: boolean
        default: false
      source_pr:
        description: Validated source PR number for automatic publication
        type: string
        default: ''
      validated_sha:
        description: Exact validated PR head SHA
        type: string
        default: ''
      source_merge_sha:
        description: Exact historical approved merge SHA for the validated source PR
        type: string
        default: ''
      merge_sha:
        description: Exact approved merge SHA to execute
        type: string
        default: ''
      targets_json:
        description: Canonically derived target scope; revalidated before publication
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write
concurrency:
  group: legend-approved-release
  cancel-in-progress: false
env:
  RELEASE_SHA: ${{ inputs.merge_sha || github.sha }}
jobs:
  discover-live:
    if: github.ref == 'refs/heads/legend/approved-changes'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.live.outputs.matrix }}
      baselines: ${{ steps.live.outputs.baselines }}
      portal: ${{ steps.live.outputs.portal }}
      database_baseline: ${{ steps.live.outputs.database_baseline }}
      targets: ${{ steps.live.outputs.targets }}
      portal_only: ${{ steps.live.outputs.portal_only }}
      website_only: ${{ steps.live.outputs.website_only }}
      public_only: ${{ steps.live.outputs.public_only }}
      client_only: ${{ steps.live.outputs.client_only }}
      validate_only: ${{ steps.live.outputs.validate_only }}
      website_routing: ${{ steps.live.outputs.website_routing }}
      website_routing_canary: ${{ steps.live.outputs.website_routing_canary }}
      founder_cloudflare: ${{ steps.live.outputs.founder_cloudflare }}
      preserve_live_targets: ${{ steps.live.outputs.preserve_live_targets }}
      exact_live: ${{ steps.live.outputs.exact_live }}
      application_release_sha: ${{ steps.live.outputs.application_release_sha }}
      package_identity: ${{ steps.live.outputs.package_identity }}
      resource_group: ${{ steps.live.outputs.resource_group }}
      migration_bundle: ${{ steps.live.outputs.migration_bundle }}
      routing_worker: ${{ steps.live.outputs.routing_worker }}
      routing_pass_through_hosts: ${{ steps.live.outputs.routing_pass_through_hosts }}
      domain_refresh_project: ${{ steps.live.outputs.domain_refresh_project }}
      database_authority: ${{ steps.live.outputs.database_authority }}
      browser_entry_hosts: ${{ steps.live.outputs.browser_entry_hosts }}
      shared_auth_targets: ${{ steps.live.outputs.shared_auth_targets }}
      editor_targets: ${{ steps.live.outputs.editor_targets }}
      marketing_targets: ${{ steps.live.outputs.marketing_targets }}
      routing_targets: ${{ steps.live.outputs.routing_targets }}
      routing_primary: ${{ steps.live.outputs.routing_primary }}
      routing_primary_host: ${{ steps.live.outputs.routing_primary_host }}
      selected_has_browser_entry: ${{ steps.live.outputs.selected_has_browser_entry }}
      selected_has_static: ${{ steps.live.outputs.selected_has_static }}
      selected_has_shared_auth: ${{ steps.live.outputs.selected_has_shared_auth }}
      selected_has_editor: ${{ steps.live.outputs.selected_has_editor }}
      selected_database_dependent: ${{ steps.live.outputs.selected_database_dependent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Pin approved source and actual live rollback revisions
        id: live
        env:
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
          AUTOMATIC_SOURCE_PR: ${{ inputs.source_pr }}
          AUTOMATIC_VALIDATED_SHA: ${{ inputs.validated_sha }}
          AUTOMATIC_SOURCE_MERGE_SHA: ${{ inputs.source_merge_sha }}
          AUTOMATIC_MERGE_SHA: ${{ inputs.merge_sha }}
          AUTOMATIC_TARGETS_JSON: ${{ inputs.targets_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$AUTOMATIC_RELEASE" = true ]; then args+=(--automatic); fi
          python3 scripts/approved-release-baseline.py "${args[@]}" --output "$GITHUB_OUTPUT"
  preserve-rollback:
    needs: discover-live
    if: needs.discover-live.outputs.preserve_live_targets != 'true' && needs.discover-live.outputs.exact_live != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-live.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0

      - name: Load current canonical release authority without changing rollback source
        shell: bash
        run: |
          set -euo pipefail
          git show "${RELEASE_SHA}:scripts/validation-resume.py" > "$RUNNER_TEMP/validation-resume.py"
          python3 "$RUNNER_TEMP/validation-resume.py" --help >/dev/null

      - name: Reuse exact retained live package when available
        id: retained
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
          STATIC_TARGET: ${{ matrix.static }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rollback-evidence.json"
          python3 "$RUNNER_TEMP/validation-resume.py" rollback-evidence \
            --repository "${{ github.repository }}" \
            --revision "$REVISION" \
            --app "$APP" \
            --output "$evidence"

          read -r reusable run_id package_artifact package_name < <(
            python3 - "$evidence" <<'PYROLLBACKDECISION'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print(
              str(bool(data.get('reusable'))).lower(),
              data.get('runId') or '',
              data.get('packageArtifact') or '',
              data.get('packageName') or '',
          )
          PYROLLBACKDECISION
          )
          echo "reused=false" >> "$GITHUB_OUTPUT"
          if [ "$reusable" != true ]; then
            echo "No retained canonical package covers $APP at $REVISION; source-equivalent rollback rebuild remains required."
            exit 0
          fi

          rm -rf /tmp/retained-package
          mkdir -p /tmp/retained-package
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$package_artifact" --dir /tmp/retained-package
          candidate="$(find /tmp/retained-package -type f -name "$package_name" -print -quit)"
          [ -n "$candidate" ]
          sums="$(find "$(dirname "$candidate")" -maxdepth 1 -type f -name SHA256SUMS -print -quit)"
          [ -n "$sums" ]
          python3 - "$candidate" "$sums" "$REVISION" "$STATIC_TARGET" <<'PYROLLBACK'
          import hashlib,json,pathlib,sys,zipfile
          package=pathlib.Path(sys.argv[1])
          sums=pathlib.Path(sys.argv[2])
          revision=sys.argv[3]
          static=sys.argv[4].lower()=='true'
          rows=[line.split() for line in sums.read_text().splitlines()]
          expected=[row[0] for row in rows if len(row)==2 and pathlib.Path(row[1]).name==package.name]
          with package.open('rb') as stream:
              actual=hashlib.file_digest(stream,'sha256').hexdigest()
          if expected != [actual]:
              raise SystemExit('Retained rollback package digest mismatch')
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Retained rollback package is corrupt')
              entry='_deployment-provenance.txt' if static else 'wwwroot/_deployment-provenance.json'
              raw=archive.read(entry).decode().strip()
              embedded=raw if static else json.loads(raw)['releaseSha']
          if embedded != revision:
              raise SystemExit('Retained rollback package revision mismatch')
          PYROLLBACK

          mkdir -p /tmp/rollback
          cp "$candidate" /tmp/rollback/package.zip
          printf '%s %s retained canonical package from release run %s\n' "$APP" "$REVISION" "$run_id" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "Reused exact verified rollback package for $APP at $REVISION from direct release run $run_id."

      - uses: actions/setup-dotnet@v4
        if: matrix.static != true && steps.retained.outputs.reused != 'true'
        with:
          dotnet-version: '10.x'
      - name: Preserve source-equivalent rollback without production data
        if: steps.retained.outputs.reused != 'true'
        env:
          PROJECT: ${{ matrix.project }}
          SOURCE_ROOT: ${{ matrix.sourceRoot }}
          PACKAGE_NAME: ${{ matrix.package }}
          STATIC_TARGET: ${{ matrix.static }}
          REVISION: ${{ matrix.revision }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rollback
          if [ "$STATIC_TARGET" = true ]; then
            npm ci --prefix "$SOURCE_ROOT" --ignore-scripts --no-audit --no-fund
            npm --prefix "$SOURCE_ROOT" run build
            cp "$SOURCE_ROOT/public/web.config" "$SOURCE_ROOT/dist/web.config"
            printf '%s\n' "$REVISION" > "$SOURCE_ROOT/dist/_deployment-provenance.txt"
            (cd "$SOURCE_ROOT/dist" && zip -qr /tmp/rollback/package.zip .)
          else
            dotnet publish "$PROJECT" -c Release -o /tmp/rollback-publish -p:SourceRevisionId="$REVISION" --nologo
            printf '{"releaseSha":"%s"}\n' "$REVISION" > /tmp/rollback-publish/wwwroot/_deployment-provenance.json
            (cd /tmp/rollback-publish && zip -qr /tmp/rollback/package.zip .)
          fi
          printf '%s %s source-equivalent rebuild\n' "$APP" "$REVISION" > /tmp/rollback/manifest.txt
          sha256sum /tmp/rollback/package.zip > /tmp/rollback/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-rollback-${{ matrix.app }}-${{ env.RELEASE_SHA }}
          path: /tmp/rollback/
          retention-days: 1
          if-no-files-found: error
  release:
    needs: [discover-live, preserve-rollback]
    if: ${{ always() && needs.discover-live.result == 'success' && (needs.preserve-rollback.result == 'success' || needs.preserve-rollback.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    env:
      EXPECTED_BASE_SHA: ${{ needs.discover-live.outputs.portal }}
      EXPECTED_DB_BASE_SHA: ${{ needs.discover-live.outputs.database_baseline }}
      LIVE_BASELINES: ${{ needs.discover-live.outputs.baselines }}
      SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
      PORTAL_ONLY: ${{ needs.discover-live.outputs.portal_only }}
      WEBSITE_ONLY: ${{ needs.discover-live.outputs.website_only }}
      PUBLIC_ONLY: ${{ needs.discover-live.outputs.public_only }}
      CLIENT_ONLY: ${{ needs.discover-live.outputs.client_only }}
      VALIDATE_ONLY: ${{ needs.discover-live.outputs.validate_only }}
      WEBSITE_ROUTING: ${{ needs.discover-live.outputs.website_routing }}
      WEBSITE_ROUTING_CANARY: ${{ needs.discover-live.outputs.website_routing_canary }}
      FOUNDER_CLOUDFLARE: ${{ needs.discover-live.outputs.founder_cloudflare }}
      PRESERVE_LIVE_TARGETS: ${{ needs.discover-live.outputs.preserve_live_targets }}
      EXACT_LIVE: ${{ needs.discover-live.outputs.exact_live }}
      APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
      PACKAGE_IDENTITY: ${{ needs.discover-live.outputs.package_identity }}
      RELEASE_RESOURCE_GROUP: ${{ needs.discover-live.outputs.resource_group }}
      MIGRATION_BUNDLE: ${{ needs.discover-live.outputs.migration_bundle }}
      ROUTING_WORKER: ${{ needs.discover-live.outputs.routing_worker }}
      ROUTING_PASS_THROUGH_HOSTS: ${{ needs.discover-live.outputs.routing_pass_through_hosts }}
      DOMAIN_REFRESH_PROJECT: ${{ needs.discover-live.outputs.domain_refresh_project }}
      DATABASE_AUTHORITY: ${{ needs.discover-live.outputs.database_authority }}
      BROWSER_ENTRY_HOSTS: ${{ needs.discover-live.outputs.browser_entry_hosts }}
      SHARED_AUTH_TARGETS: ${{ needs.discover-live.outputs.shared_auth_targets }}
      EDITOR_TARGETS: ${{ needs.discover-live.outputs.editor_targets }}
      MARKETING_TARGETS: ${{ needs.discover-live.outputs.marketing_targets }}
      ROUTING_TARGETS: ${{ needs.discover-live.outputs.routing_targets }}
      ROUTING_PRIMARY: ${{ needs.discover-live.outputs.routing_primary }}
      ROUTING_PRIMARY_HOST: ${{ needs.discover-live.outputs.routing_primary_host }}
      SELECTED_HAS_BROWSER_ENTRY: ${{ needs.discover-live.outputs.selected_has_browser_entry }}
      SELECTED_HAS_STATIC: ${{ needs.discover-live.outputs.selected_has_static }}
      SELECTED_HAS_SHARED_AUTH: ${{ needs.discover-live.outputs.selected_has_shared_auth }}
      SELECTED_HAS_EDITOR: ${{ needs.discover-live.outputs.selected_has_editor }}
      SELECTED_DATABASE_DEPENDENT: ${{ needs.discover-live.outputs.selected_database_dependent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        if: env.WEBSITE_ONLY != 'true' && env.EXACT_LIVE != 'true'
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        if: (env.WEBSITE_ROUTING == 'true' || env.FOUNDER_CLOUDFLARE == 'true') && env.EXACT_LIVE != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Legend-Cloudflare/package-lock.json

      - name: Reuse exact successful validation package when available
        id: reusevalidated
        if: env.EXACT_LIVE != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/validation-resume.py verify-release-coverage \
            --workflow all-intentional-direct-release-20260918.yml \
            --workflow-path .github/workflows/all-intentional-direct-release-20260918.yml
          # Deployment remains bound to RELEASE_SHA, but durable evidence
          # recognition must use the current approved control-plane contract so
          # later canonical receipt formats can validate older authorized bytes.
          git show "${GITHUB_SHA}:scripts/validation-resume.py" > "$RUNNER_TEMP/current-validation-resume.py"
          evidence="$RUNNER_TEMP/validated-package-evidence.json"
          python3 "$RUNNER_TEMP/current-validation-resume.py" validated-package \
            --repository "${{ github.repository }}" \
            --revision "$APPLICATION_RELEASE_SHA" \
            --package-identity "$PACKAGE_IDENTITY" \
            --output "$evidence"
          python3 - "$evidence" "$GITHUB_OUTPUT" "$GITHUB_ENV" <<'PYVALIDATED'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if not data.get('reusable') or not data.get('runId') or not data.get('artifact'):
              raise SystemExit(
                  f"Exact validated release package is missing for {data.get('revision')}; "
                  "release refuses to rebuild production bytes."
              )
          with open(sys.argv[2],'a') as output:
              output.write(f"run_id={data['runId']}\n")
              output.write(f"artifact={data['artifact']}\n")
          with open(sys.argv[3],'a') as env:
              env.write("REUSE_VALIDATED_PACKAGE=true\n")
          print(f"Exact immutable package preserved from successful architecture validation run {data['runId']}.")
          PYVALIDATED
      - name: Load exact preserved deployable package
        if: steps.reusevalidated.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.reusevalidated.outputs.artifact }}
          path: /tmp/diagnostics-packages
          run-id: ${{ steps.reusevalidated.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify restored immutable validation package
        if: steps.reusevalidated.outputs.run_id != ''
        shell: bash
        run: |
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages
      - name: Verify current live base before publication
        id: base
        run: |
          python3 - <<'PYBASE'
          import json, os, subprocess, urllib.request
          for row in json.loads(os.environ['LIVE_BASELINES']):
              host=row['host']
              with urllib.request.urlopen('https://'+host+row['path'],timeout=30) as response:
                  actual=response.read().decode().strip() if row['project']=='static' else json.load(response)['sourceRevision']
              print(host,actual)
              assert actual == row['revision'], 'Live revision changed; rebuild the release baseline'
              if os.environ['CLIENT_ONLY'] == 'true':
                  subprocess.run(['git','diff','--quiet',row['revision'],'HEAD','--','Infrastructure/Migrations'],check=True)
          PYBASE
      - name: Verify ClientApp browser entry routes
        id: cliententry
        if: env.SELECTED_HAS_BROWSER_ENTRY == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCLIENTENTRY'
          import http.client, json, os, ssl, urllib.parse
          hosts=tuple(json.loads(os.environ['BROWSER_ENTRY_HOSTS']))
          paths=('/', '/Account/Login')
          rows=[]
          context=ssl.create_default_context()
          for host in hosts:
              for path in paths:
                  conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
                  try:
                      conn.request('GET',path,headers={'User-Agent':'LEGEND-release-entry-probe/1.0','Cache-Control':'no-cache','Accept':'text/html'})
                      response=conn.getresponse()
                      body=response.read(65537)
                      row={'host':host,'path':path,'status':response.status,'location':response.getheader('Location'),'contentType':response.getheader('Content-Type'),'bytes':len(body)}
                      rows.append(row)
                      print(json.dumps(row))
                      if len(body)>65536: raise SystemExit(f'Oversized entry response: {host}{path}')
                  finally:
                      conn.close()
          by={(r['host'],r['path']):r for r in rows}
          for host in hosts:
              root=by[(host,'/')]
              login=by[(host,'/Account/Login')]
              if root['status'] not in (200,301,302,303,307,308):
                  raise SystemExit(f'Client root unhealthy: {host} status={root["status"]}')
              if root['status']==200 and root['bytes']<256:
                  raise SystemExit(f'Client root returned a blank document: {host} bytes={root["bytes"]}')
              if login['status']!=200 or login['bytes']<512 or not (login['contentType'] or '').lower().startswith('text/html'):
                  raise SystemExit(f'Client login page unhealthy: {host} status={login["status"]} bytes={login["bytes"]} type={login["contentType"]}')
          PYCLIENTENTRY
      - name: Build exact selected release candidate
        id: build
        if: env.WEBSITE_ONLY != 'true' && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact candidate build from immutable validation artifact; production rebuild is forbidden."
      - name: Verify business website routing bridge
        id: routingchecks
        if: env.WEBSITE_ROUTING == 'true' && (steps.build.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true')
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact routing source-contract validation from architecture proof; release will perform only current-state routing checks."
      - name: Verify localization retention privacy limits and original delivery
        id: tests
        if: env.PUBLIC_ONLY != 'true' && env.PRESERVE_LIVE_TARGETS != 'true' && steps.build.outcome == 'success'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact .NET/full-suite validation for the immutable application revision."
      - name: Verify shared web catalog contracts
        id: web
        if: env.PUBLIC_ONLY != 'true' && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact release web-contract validation from architecture proof."
      - name: Verify selected website catalog and build
        id: websitechecks
        if: env.SELECTED_HAS_STATIC == 'true' && env.EXACT_LIVE != 'true'
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          echo "Preserved exact website build/check validation from immutable validation artifact."
      - name: Publish exact selected application packages
        id: package
        if: always() && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true' && (env.WEBSITE_ROUTING != 'true' || steps.routingchecks.outcome == 'success') && ((env.CLIENT_ONLY == 'true' && steps.build.outcome == 'success' && steps.tests.outcome == 'success' && steps.web.outcome == 'success') || ((env.WEBSITE_ONLY == 'true' || (env.PUBLIC_ONLY == 'true' && steps.build.outcome == 'success') || (steps.tests.outcome == 'success' && steps.web.outcome == 'success')) && (env.SELECTED_HAS_STATIC != 'true' || steps.websitechecks.outcome == 'success')))
        run: |
          test "$REUSE_VALIDATED_PACKAGE" = true
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages
          echo "Using exact validated package bytes; release contains no fallback package builder."
      - uses: azure/login@v2
        id: azure
        if: (steps.package.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Preserve targets already live at exact candidate
        id: resumestate
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.VALIDATE_ONLY != 'true' && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-resume.py live-state \
            --revision "$APPLICATION_RELEASE_SHA" \
            --selected-targets "$SELECTED_TARGETS" \
            --output "$RUNNER_TEMP/release-live-state.json" \
            --github-output "$GITHUB_OUTPUT"
          echo "Exact-candidate live targets are preserved; only targets not already live may deploy."

      - name: Synchronize selected shared authorization and publisher runtimes
        id: sharedauth
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.SELECTED_HAS_SHARED_AUTH == 'true' && steps.azure.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_settings=/tmp/shared-auth-source.json
          az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$DATABASE_AUTHORITY" -o json > "$source_settings"

          selected() {
            jq -e --arg app "$1" 'index($app) != null' <<< "$SELECTED_TARGETS" >/dev/null
          }
          resolve_value() {
            local file="$1"; shift
            local key value
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$value"; return 0; fi
            done
            return 1
          }
          resolve_key() {
            local file="$1"; shift
            local key value
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$key"; return 0; fi
            done
            return 1
          }

          founder="$(resolve_value "$source_settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')"
          founder_upn="$(resolve_value "$source_settings" Founder__Upn 'Founder:Upn')"
          blob="$(resolve_value "$source_settings" DataProtection__BlobUri 'DataProtection:BlobUri')"
          keyvault="$(resolve_value "$source_settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')"
          ingest_secret="$(resolve_value "$source_settings" Analytics__SharedSecret 'Analytics:SharedSecret' LeadIngest__SharedSecret 'LeadIngest:SharedSecret')"
          [ -n "$founder" ] && [ -n "$founder_upn" ] && [ -n "$blob" ] && [ -n "$keyvault" ] && [ -n "$ingest_secret" ]
          for value in "$founder" "$founder_upn" "$blob" "$keyvault" "$ingest_secret"; do echo "::add-mask::$value"; done

          while IFS= read -r app; do
            [ -n "$app" ] || continue
            selected "$app" || continue
            settings="/tmp/shared-auth-${app}.json"
            az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"

            founder_key="$(resolve_key "$settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid' || true)"
            founder_upn_key="$(resolve_key "$settings" Founder__Upn 'Founder:Upn' || true)"
            blob_key="$(resolve_key "$settings" DataProtection__BlobUri 'DataProtection:BlobUri' || true)"
            keyvault_key="$(resolve_key "$settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId' || true)"
            updates=()
            [ "$(resolve_value "$settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid' || true)" = "$founder" ] || updates+=("${founder_key:-FOUNDER_OID}=$founder")
            [ "$(resolve_value "$settings" Founder__Upn 'Founder:Upn' || true)" = "$founder_upn" ] || updates+=("${founder_upn_key:-Founder__Upn}=$founder_upn")
            [ "$(resolve_value "$settings" DataProtection__BlobUri 'DataProtection:BlobUri' || true)" = "$blob" ] || updates+=("${blob_key:-DataProtection__BlobUri}=$blob")
            [ "$(resolve_value "$settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId' || true)" = "$keyvault" ] || updates+=("${keyvault_key:-DataProtection__KeyVaultKeyId}=$keyvault")
            [ "$(resolve_value "$settings" WEBSITE_NODE_DEFAULT_VERSION || true)" = "~24" ] || updates+=("WEBSITE_NODE_DEFAULT_VERSION=~24")
            for key in Analytics__SharedSecret Tracking__SharedSecret; do
              [ "$(resolve_value "$settings" "$key" || true)" = "$ingest_secret" ] || updates+=("$key=$ingest_secret")
            done
            for alias in 'Analytics:SharedSecret' 'LeadIngest:SharedSecret' LeadIngest__SharedSecret 'Tracking:SharedSecret' TRACKING_SHARED_SECRET; do
              if jq -e --arg key "$alias" 'any(.[]; .name == $key)' "$settings" >/dev/null; then
                [ "$(resolve_value "$settings" "$alias" || true)" = "$ingest_secret" ] || updates+=("$alias=$ingest_secret")
              fi
            done
            if [ "${#updates[@]}" -gt 0 ]; then
              az webapp config appsettings set -g "$RELEASE_RESOURCE_GROUP" -n "$app" --settings "${updates[@]}" --output none
              az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
            fi
            [ "$(resolve_value "$settings" FOUNDER_OID FounderOid Founder__Oid 'Founder:Oid')" = "$founder" ]
            [ "$(resolve_value "$settings" Founder__Upn 'Founder:Upn')" = "$founder_upn" ]
            [ "$(resolve_value "$settings" DataProtection__BlobUri 'DataProtection:BlobUri')" = "$blob" ]
            [ "$(resolve_value "$settings" DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')" = "$keyvault" ]
            [ "$(resolve_value "$settings" Analytics__SharedSecret 'Analytics:SharedSecret')" = "$ingest_secret" ]
            [ "$(resolve_value "$settings" Tracking__SharedSecret 'Tracking:SharedSecret' TRACKING_SHARED_SECRET)" = "$ingest_secret" ]
          done < <(jq -r '.[]' <<< "$SHARED_AUTH_TARGETS")

          while IFS= read -r app; do
            [ -n "$app" ] || continue
            selected "$app" || continue
            settings="/tmp/marketing-authority-${app}.json"
            az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
            updates=()
            for pair in BlobUri KeyVaultKeyId; do
              expected="$blob"; [ "$pair" = KeyVaultKeyId ] && expected="$keyvault"
              key="$(resolve_key "$settings" "MarketingDataProtection__$pair" "MarketingDataProtection:$pair" || true)"
              current="$(resolve_value "$settings" "MarketingDataProtection__$pair" "MarketingDataProtection:$pair" || true)"
              [ "$current" = "$expected" ] || updates+=("${key:-MarketingDataProtection__$pair}=$expected")
            done
            if [ "${#updates[@]}" -gt 0 ]; then
              az webapp config appsettings set -g "$RELEASE_RESOURCE_GROUP" -n "$app" --settings "${updates[@]}" --output none
              az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
            fi
            [ "$(resolve_value "$settings" MarketingDataProtection__BlobUri 'MarketingDataProtection:BlobUri')" = "$blob" ]
            [ "$(resolve_value "$settings" MarketingDataProtection__KeyVaultKeyId 'MarketingDataProtection:KeyVaultKeyId')" = "$keyvault" ]
          done < <(jq -r '.[]' <<< "$MARKETING_TARGETS")
          echo "Selected shared-auth and marketing runtimes consume the canonical authority."
      - name: Synchronize selected editor ticket authority
        id: editorauth
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.SELECTED_HAS_EDITOR == 'true' && steps.azure.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_settings=/tmp/editor-ticket-source.json
          az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$DATABASE_AUTHORITY" -o json > "$source_settings"
          value() {
            local file="$1"; shift
            local key found
            for key in "$@"; do
              found="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$found" ]; then printf '%s' "$found"; return 0; fi
            done
            return 1
          }
          selected() {
            jq -e --arg app "$1" 'index($app) != null' <<< "$SELECTED_TARGETS" >/dev/null
          }
          blob="$(value "$source_settings" WebsiteEditorDataProtection__BlobUri 'WebsiteEditorDataProtection:BlobUri' DataProtection__BlobUri 'DataProtection:BlobUri')"
          keyvault="$(value "$source_settings" WebsiteEditorDataProtection__KeyVaultKeyId 'WebsiteEditorDataProtection:KeyVaultKeyId' DataProtection__KeyVaultKeyId 'DataProtection:KeyVaultKeyId')"
          [ -n "$blob" ] && [ -n "$keyvault" ]
          echo "::add-mask::$blob"
          echo "::add-mask::$keyvault"
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            selected "$app" || continue
            settings="/tmp/editor-ticket-${app}.json"
            az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
            updates=()
            for pair in BlobUri KeyVaultKeyId; do
              expected="$blob"; [ "$pair" = KeyVaultKeyId ] && expected="$keyvault"
              current="$(value "$settings" "WebsiteEditorDataProtection__$pair" "WebsiteEditorDataProtection:$pair" || true)"
              [ "$current" = "$expected" ] || updates+=("WebsiteEditorDataProtection__$pair=$expected")
            done
            if [ "${#updates[@]}" -gt 0 ]; then
              az webapp config appsettings set -g "$RELEASE_RESOURCE_GROUP" -n "$app" --settings "${updates[@]}" --output none
              az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
            fi
            [ "$(value "$settings" WebsiteEditorDataProtection__BlobUri 'WebsiteEditorDataProtection:BlobUri')" = "$blob" ]
            [ "$(value "$settings" WebsiteEditorDataProtection__KeyVaultKeyId 'WebsiteEditorDataProtection:KeyVaultKeyId')" = "$keyvault" ]
          done < <(jq -r '.[]' <<< "$EDITOR_TARGETS")
          echo "Selected editor runtimes consume the canonical ticket authority."

      - name: Prepare canonical business website routing authority
        id: routingsecret
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.azure.outcome == 'success' && (steps.sharedauth.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        env:
          PRIMARY_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="${PRIMARY_CLOUDFLARE_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "::error::Central Cloudflare routing authority is not configured."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

          primary_settings=/tmp/routing-primary.json
          az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$ROUTING_PRIMARY" -o json > "$primary_settings"
          zone_id="$(jq -r '.[] | select(.name == "WebsiteDomains__CloudflareZoneId" or .name == "WebsiteDomains:CloudflareZoneId") | (.value // empty)' "$primary_settings" | head -n 1)"
          if ! [[ "$zone_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::Configured Cloudflare SaaS zone ID is missing or invalid."
            exit 1
          fi
          echo "::add-mask::$zone_id"
          printf 'CLOUDFLARE_ZONE_ID=%s\n' "$zone_id" >> "$GITHUB_ENV"

          account_id="${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$account_id" ]; then
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $token" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id")"
            account_id="$(printf '%s' "$response" | jq -r 'select(.success == true) | .result.account.id // empty')"
          fi
          if ! [[ "$account_id" =~ ^[A-Za-z0-9_-]{16,64}$ ]]; then
            echo "::error::Cloudflare account ID could not be resolved."
            exit 1
          fi
          echo "::add-mask::$account_id"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"

          bridge_secret="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$primary_settings" | head -n 1)"
          if [ -z "$bridge_secret" ]; then
            if [ "$PRESERVE_LIVE_TARGETS" = true ]; then
              echo "::error::Preserve-live routing recovery requires the existing bridge secret."
              exit 1
            fi
            bridge_secret="$(openssl rand -hex 32)"
          fi
          if [ "${#bridge_secret}" -lt 32 ]; then
            echo "::error::Website routing bridge secret is missing or too short."
            exit 1
          fi
          echo "::add-mask::$bridge_secret"
          printf 'LEGEND_WEBSITE_BRIDGE_SECRET=%s\n' "$bridge_secret" >> "$GITHUB_ENV"

          while IFS=$'\t' read -r app origin probe_path; do
            [ -n "$app" ] && [ -n "$origin" ] || continue
            settings="/tmp/routing-${app}.json"
            az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
            current_secret="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$settings" | head -n 1)"
            current_origin="$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeOriginHost" or .name == "WebsiteRouting:BridgeOriginHost") | (.value // empty)' "$settings" | head -n 1)"
            if [ "$PRESERVE_LIVE_TARGETS" = true ]; then
              [ "$current_secret" = "$bridge_secret" ] || { echo "::error::Preserve-live routing recovery found bridge-secret drift for $app."; exit 1; }
              [ "$current_origin" = "$origin" ] || { echo "::error::Preserve-live routing recovery found origin drift for $app."; exit 1; }
            else
              updates=()
              [ "$current_secret" = "$bridge_secret" ] || updates+=("WebsiteRouting__BridgeSecret=$bridge_secret")
              [ "$current_origin" = "$origin" ] || updates+=("WebsiteRouting__BridgeOriginHost=$origin")
              if [ "${#updates[@]}" -gt 0 ]; then
                az webapp config appsettings set -g "$RELEASE_RESOURCE_GROUP" -n "$app" --settings "${updates[@]}" --output none
                az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$app" -o json > "$settings"
              fi
            fi
            [ "$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeSecret" or .name == "WebsiteRouting:BridgeSecret") | (.value // empty)' "$settings" | head -n 1)" = "$bridge_secret" ]
            [ "$(jq -r '.[] | select(.name == "WebsiteRouting__BridgeOriginHost" or .name == "WebsiteRouting:BridgeOriginHost") | (.value // empty)' "$settings" | head -n 1)" = "$origin" ]
          done < <(jq -r '.[] | [.releaseName,.azureHost,.probePath] | @tsv' <<< "$ROUTING_TARGETS")
          echo "Every canonical routing target shares one bridge authority and its declared origin."

      - name: Audit centralized Cloudflare routing authority
        id: routingauthority
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingsecret.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py audit --prove-cache-purge

      - name: Diagnose preserve-live routing origin acceptance
        id: routingorigin
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS == 'true' && env.WEBSITE_ROUTING == 'true' && steps.routingsecret.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Azure front-door summaries (no secrets):"
          while IFS=$'\t' read -r app origin probe_path; do
            [ -n "$app" ] && [ -n "$origin" ] && [ -n "$probe_path" ] || continue
            echo "=== $app ==="
            az webapp show -g "$RELEASE_RESOURCE_GROUP" -n "$app" --query '{publicNetworkAccess:publicNetworkAccess,httpsOnly:httpsOnly,state:state}' -o json
            az webapp config access-restriction show -g "$RELEASE_RESOURCE_GROUP" -n "$app" \
              --query '{mainSiteAccessRestrictions:ipSecurityRestrictions,mainSiteDefaultAction:ipSecurityRestrictionsDefaultAction,scmSiteDefaultAction:scmIpSecurityRestrictionsDefaultAction}' -o json
            az webapp auth show -g "$RELEASE_RESOURCE_GROUP" -n "$app" \
              --query '{enabled:platform.enabled,requireAuthentication:globalValidation.requireAuthentication,unauthenticatedClientAction:globalValidation.unauthenticatedClientAction,excludedPaths:globalValidation.excludedPaths}' -o json || true

            body="/tmp/${app}-origin-body"
            headers="/tmp/${app}-origin-headers"
            status="$(curl --silent --show-error --max-time 30 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              -H "X-Legend-Original-Host: $WEBSITE_ROUTING_CANARY" \
              -H "X-Legend-Website-Bridge: $LEGEND_WEBSITE_BRIDGE_SECRET" \
              -H "User-Agent: LEGEND-routing-origin-diagnostic/1.0" \
              "https://${origin}${probe_path}")"
            echo "${app}${probe_path} direct-origin status=${status} bytes=$(wc -c < "$body")"
            grep -Ei '^(server|x-|location|content-type|date):' "$headers" || true
            sha256sum "$body"
            python3 - "$body" <<'PYORIGIN'
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()[:512]
          text=raw.decode('utf-8','replace').replace('\r',' ').replace('\n',' ')
          print('body-prefix:',text)
          PYORIGIN
          done < <(jq -r '.[] | [.releaseName,.azureHost,.probePath] | @tsv' <<< "$ROUTING_TARGETS")


      - name: Apply additive diagnostics migrations before restarting apps
        id: migrate
        if: env.PRESERVE_LIVE_TARGETS != 'true' && env.SELECTED_DATABASE_DEPENDENT == 'true' && steps.package.outcome == 'success' && steps.azure.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DB_BASE_SHA"
          if git merge-base --is-ancestor "$EXPECTED_DB_BASE_SHA" "$APPLICATION_RELEASE_SHA"; then
            echo "Live database baseline is an ancestor of the validated application revision."
          elif git merge-base --is-ancestor "$APPLICATION_RELEASE_SHA" "$EXPECTED_DB_BASE_SHA"; then
            # A live provenance revision may be the approved merge commit whose
            # tree is byte-for-byte identical to the validated PR head. Accept
            # that merge alias only when there is no source drift at all.
            git diff --quiet "$APPLICATION_RELEASE_SHA" "$EXPECTED_DB_BASE_SHA" --
            echo "Live database baseline is a source-identical approved merge alias of the validated application revision."
          else
            echo "::error::Live database baseline and validated application revision do not share a safe ancestry relationship."
            exit 1
          fi

          changed="$(
            git diff --name-only "$EXPECTED_DB_BASE_SHA" "$APPLICATION_RELEASE_SHA" -- Infrastructure/Migrations |
            grep -E '^Infrastructure/Migrations/[0-9]{14}_.+\.cs$' |
            grep -v '\.Designer\.cs$' || true
          )"
          if [ -z "$changed" ]; then
            echo "No candidate migration source changed from the database baseline; migration receipt gate is not applicable."
            exit 0
          fi
          printf '%s\n' "$changed"

          # A prior successful database release receipt is required only when this
          # candidate actually changes migration source and is about to mutate SQL.
          # Schema-neutral releases authorize no database write and therefore do not
          # require historical database-receipt evidence.
          python3 - <<'PYBASELINE'
          import importlib.util, os, sys
          from pathlib import Path
          scripts=Path('scripts').resolve()
          sys.path.insert(0,str(scripts))
          path=scripts / 'release-lifecycle.py'
          spec=importlib.util.spec_from_file_location('release_lifecycle',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          base=os.environ['EXPECTED_DB_BASE_SHA']
          authority=os.environ['DATABASE_AUTHORITY']
          if not module.release_proven(module.GitHub(),base,app=authority):
              raise SystemExit('Live database baseline lacks a successful canonical release receipt; no migration authorized.')
          print('Database baseline release receipt verified:',base)
          PYBASELINE

          bundle="/tmp/diagnostics-packages/$MIGRATION_BUNDLE"
          test -x "$bundle"
          python3 scripts/release-package.py verify \
            --revision "$APPLICATION_RELEASE_SHA" \
            --directory /tmp/diagnostics-packages

          python3 - <<'PYMIGRATE'
          import json, os, pathlib, subprocess
          def az(*args):
              return json.loads(subprocess.check_output(['az',*args,'-o','json'],text=True))
          resource_group=os.environ['RELEASE_RESOURCE_GROUP']
          authority=os.environ['DATABASE_AUTHORITY']
          rows=az('webapp','config','connection-string','list','-g',resource_group,'-n',authority)
          connection=next((x['value'] for x in rows if x['name']=='MasterAppDb'),None)
          if not connection:
              settings={x['name']:x['value'] for x in az('webapp','config','appsettings','list','-g',resource_group,'-n',authority)}
              connection=next((settings[k] for k in ('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb') if settings.get(k)),None)
          if not connection or '\n' in connection or not any(x in connection.lower() for x in ('server=tcp:','.database.windows.net','initial catalog=')):
              raise SystemExit('Production SQL connection unavailable; no restart authorized.')
          print('::add-mask::'+connection,flush=True)
          bundle=pathlib.Path('/tmp/diagnostics-packages') / os.environ['MIGRATION_BUNDLE']
          subprocess.run(
              [str(bundle),'--connection',connection],
              check=True,
              env=os.environ | {
                  'DOTNET_ENVIRONMENT':'Development',
                  'ASPNETCORE_ENVIRONMENT':'Development',
                  'SQLCONNSTR_MasterAppDb':connection,
              },
          )
          print('Schema ready. Executed the exact validated migration bundle from the proven live database baseline.')
          PYMIGRATE
      - name: Load preserved rollback packages for transactional publication
        id: rollbackpackages
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true' && env.VALIDATE_ONLY != 'true' && steps.package.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: diagnostics-rollback-*-${{ env.RELEASE_SHA }}
          path: /tmp/rollback-packages
          merge-multiple: false
      - name: Refresh Azure OIDC before transactional publication
        id: azuredeploy
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true' && env.VALIDATE_ONLY != 'true' && steps.package.outcome == 'success' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish selected head as one transaction
        id: transaction
        if: ${{ !cancelled() && env.PRESERVE_LIVE_TARGETS != 'true' && env.EXACT_LIVE != 'true' && env.VALIDATE_ONLY != 'true' && steps.package.outcome == 'success' && steps.azure.outcome == 'success' && steps.azuredeploy.outcome == 'success' && steps.rollbackpackages.outcome == 'success' && (steps.sharedauth.outcome == 'success' || steps.sharedauth.outcome == 'skipped') && (steps.editorauth.outcome == 'success' || steps.editorauth.outcome == 'skipped') && (steps.migrate.outcome == 'success' || steps.migrate.outcome == 'skipped') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy-approved-app.py \
            --targets-json "$SELECTED_TARGETS" \
            --baselines-json "$LIVE_BASELINES" \
            --package-root /tmp/diagnostics-packages \
            --rollback-root /tmp/rollback-packages
      - name: Deploy and activate LEGEND Founder Cloudflare baseline
        id: foundercloud
        if: ${{ !cancelled() && env.FOUNDER_CLOUDFLARE == 'true' && steps.transaction.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Central Cloudflare Workers authority is not configured."; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Central Cloudflare account authority is not configured."; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/translation-results
          python3 scripts/deploy-founder-cloudflare.py deploy \
            --state /tmp/legend-founder-cloudflare-state.json \
            --receipt /tmp/translation-results/legend-founder-cloudflare.json

      - name: Reconcile public custom-hostname Cloudflare policy
        id: routingpolicy
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingauthority.outcome == 'success' && env.VALIDATE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py reconcile-bot-fight
          python3 scripts/cloudflare-routing-authority.py reconcile-bic

      - name: Deploy shared Cloudflare business website router
        id: routingdeploy
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingsecret.outcome == 'success' && steps.routingauthority.outcome == 'success' && steps.routingpolicy.outcome == 'success' && (steps.transaction.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') && env.VALIDATE_ONLY != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd Legend-Cloudflare

          deployments_file=/tmp/legend-router-deployments.json
          deployments_status="$(curl --silent --show-error \
            -o "$deployments_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ROUTING_WORKER/deployments?per_page=1")"
          case "$deployments_status" in
            200)
              previous_version="$(jq -r 'select(.success == true) | .result.deployments[0].versions[0].version_id // empty' "$deployments_file")"
              ;;
            404)
              previous_version=""
              echo "No existing LEGEND website-router deployment is present; first deployment will proceed."
              ;;
            *)
              echo "::error::Cloudflare Worker deployment history lookup failed with HTTP $deployments_status."
              exit 1
              ;;
          esac
          if [ -n "$previous_version" ]; then
            echo "::add-mask::$previous_version"
          fi
          printf 'LEGEND_ROUTING_PREVIOUS_VERSION=%s\n' "$previous_version" >> "$GITHUB_ENV"

          restore_router() {
            set +e
            if [ -n "$previous_version" ]; then
              payload="$(jq -cn --arg version "$previous_version" '{strategy:"percentage",versions:[{version_id:$version,percentage:100}],annotations:{"workers/message":"Automatic LEGEND website-router rollback"}}')"
              response="$(curl --silent --show-error -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ROUTING_WORKER/deployments")"
              if [ "$(printf '%s' "$response" | jq -r '.success // false')" = true ]; then
                echo "Restored previous Cloudflare Worker version."
                return 0
              fi
            fi

            routes="$(curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"
            printf '%s' "$routes" | jq -r --arg worker "$ROUTING_WORKER" '.result[]? | select(.script==$worker) | .id' | while read -r route_id; do
              [ -z "$route_id" ] && continue
              curl --silent --show-error -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes/$route_id" >/dev/null
            done
            echo "::warning::Previous Worker version was unavailable; removed the LEGEND Worker route to restore provider DNS behavior."
          }

          npx wrangler deploy --config wrangler.website-routing.jsonc
          printf '%s' "$LEGEND_WEBSITE_BRIDGE_SECRET" | npx wrangler secret put LEGEND_WEBSITE_BRIDGE_SECRET --config wrangler.website-routing.jsonc

          if ! python3 - <<'PYFIRSTPARTY'
          import http.client, json, os, ssl, time
          hosts=tuple(json.loads(os.environ['ROUTING_PASS_THROUGH_HOSTS']))
          context=ssl.create_default_context()
          failures=[]
          for host in hosts:
              last=None
              for attempt in range(1,7):
                  conn=http.client.HTTPSConnection(host,443,timeout=15,context=context)
                  try:
                      conn.request('GET','/',headers={'User-Agent':'LEGEND-worker-release-smoke/1.0','Cache-Control':'no-cache'})
                      response=conn.getresponse()
                      body=response.read(1025)
                      last=f'HTTP {response.status}'
                      print(host,attempt,response.status,len(body))
                      if 200 <= response.status < 400:
                          break
                  except Exception as error:
                      last=type(error).__name__
                      print(host,attempt,last)
                  finally:
                      conn.close()
                  time.sleep(5)
              else:
                  failures.append(f'{host}: {last}')
          if failures:
              raise SystemExit('LEGEND-owned host smoke failed after bounded retries: '+'; '.join(failures))
          PYFIRSTPARTY
          then
            restore_router
            exit 1
          fi
          echo "Cloudflare website router deployed and LEGEND-owned host pass-through verified."
      - name: Verify custom-domain bridge end to end
        id: routinglive
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routingdeploy.outcome == 'success' && (steps.transaction.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          restore_router() {
            set +e
            if [ -n "${LEGEND_ROUTING_PREVIOUS_VERSION:-}" ]; then
              payload="$(jq -cn --arg version "$LEGEND_ROUTING_PREVIOUS_VERSION" '{strategy:"percentage",versions:[{version_id:$version,percentage:100}],annotations:{"workers/message":"Automatic LEGEND custom-domain proof rollback"}}')"
              response="$(curl --silent --show-error -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ROUTING_WORKER/deployments")"
              if [ "$(printf '%s' "$response" | jq -r '.success // false')" = true ]; then
                echo "Restored previous Cloudflare Worker version."
                return 0
              fi
            fi
            routes="$(curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"
            printf '%s' "$routes" | jq -r --arg worker "$ROUTING_WORKER" '.result[]? | select(.script==$worker) | .id' | while read -r route_id; do
              [ -z "$route_id" ] && continue
              curl --silent --show-error -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes/$route_id" >/dev/null
            done
          }

          db_connection="$(az webapp config connection-string list -g "$RELEASE_RESOURCE_GROUP" -n "$DATABASE_AUTHORITY" -o json | jq -r '.[] | select(.name=="MasterAppDb") | .value' | head -n 1)"
          if [ -z "$db_connection" ] || [ "$db_connection" = null ]; then
            db_connection="$(az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$DATABASE_AUTHORITY" -o json | jq -r '.[] | select(.name=="ConnectionStrings__MasterAppDb" or .name=="MasterAppDb" or .name=="SQLCONNSTR_MasterAppDb") | .value' | head -n 1)"
          fi
          routing_settings=/tmp/routing-domain-refresh.json
          az webapp config appsettings list -g "$RELEASE_RESOURCE_GROUP" -n "$ROUTING_PRIMARY" -o json > "$routing_settings"
          domain_token="$(jq -r '.[] | select(.name=="WebsiteDomains__ApiToken" or .name=="WebsiteDomains:ApiToken") | .value' "$routing_settings" | head -n 1)"
          cname_target="$(jq -r '.[] | select(.name=="WebsiteDomains__CnameTarget" or .name=="WebsiteDomains:CnameTarget") | .value' "$routing_settings" | head -n 1)"
          if [ -z "$db_connection" ] || [ "$db_connection" = null ] ||
             [ -z "$domain_token" ] || [ "$domain_token" = null ] ||
             [ -z "$cname_target" ] || [ "$cname_target" = null ]; then
            echo "::error::Shared domain authority configuration is unavailable."
            restore_router
            exit 1
          fi
          echo "::add-mask::$db_connection"
          echo "::add-mask::$domain_token"
          if ! LEGEND_RELEASE_DOMAIN="$WEBSITE_ROUTING_CANARY" \
               LEGEND_RELEASE_DB_CONNECTION="$db_connection" \
               LEGEND_RELEASE_ZONE_ID="$CLOUDFLARE_ZONE_ID" \
               LEGEND_RELEASE_DOMAIN_TOKEN="$domain_token" \
               LEGEND_RELEASE_CNAME_TARGET="$cname_target" \
               dotnet run --project "$DOMAIN_REFRESH_PROJECT" -c Release --no-restore; then
            restore_router
            exit 1
          fi

          if ! python3 - <<'PYCUSTOM'
          import http.client, json, os, ssl, time
          host=os.environ['WEBSITE_ROUTING_CANARY']
          context=ssl.create_default_context()

          def request(path, accept=None):
              conn=http.client.HTTPSConnection(host,443,timeout=20,context=context)
              try:
                  headers={'User-Agent':'LEGEND-commerce-domain-proof/1.0','Cache-Control':'no-cache'}
                  if accept: headers['Accept']=accept
                  conn.request('GET',path,headers=headers)
                  response=conn.getresponse()
                  body=response.read(8193)
                  edge_headers={key.lower(): value for key,value in response.getheaders()}
                  if response.status >= 400:
                      print('edge-diagnostic', json.dumps({
                          'path': path,
                          'status': response.status,
                          'bytes': len(body),
                          'server': edge_headers.get('server'),
                          'cf-ray': edge_headers.get('cf-ray'),
                          'cf-cache-status': edge_headers.get('cf-cache-status'),
                          'x-azure-ref': edge_headers.get('x-azure-ref'),
                          'x-ms-forbidden-ip': edge_headers.get('x-ms-forbidden-ip'),
                          'content-type': edge_headers.get('content-type'),
                          'bodyPrefix': body[:768].decode('utf-8','replace').replace('\\r',' ').replace('\\n',' ')
                      }))
                  return response.status, body, response.getheader('Location')
              finally:
                  conn.close()

          binding_ok=False
          store_ok=False
          home_ok=False
          last_binding=None
          last_store=None
          last_home=None
          for attempt in range(1,9):
              try:
                  status,body,location=request('/.well-known/legend-website','application/json')
                  last_binding=(status,len(body),location)
                  print(host,'binding',attempt,status,len(body),location or '')
                  if status==200 and len(body)<=4096 and not location:
                      receipt=json.loads(body)
                      if all(isinstance(receipt.get(key),str) and len(receipt.get(key))>=32 for key in ('businessId','bindingId')):
                          binding_ok=True
              except Exception as error:
                  last_binding=(type(error).__name__,0,None)
                  print(host,'binding',attempt,type(error).__name__)

              try:
                  status,body,location=request('/')
                  last_home=(status,len(body),location)
                  print(host,'/',attempt,status,len(body),location or '')
                  home_ok=status==200 and len(body)>0 and not location
              except Exception as error:
                  last_home=(type(error).__name__,0,None)
                  print(host,'/',attempt,type(error).__name__)
                  home_ok=False

              try:
                  status,body,location=request('/store')
                  last_store=(status,len(body),location)
                  print(host,'/store',attempt,status,len(body),location or '')
                  store_ok=status==200 and not location
              except Exception as error:
                  last_store=(type(error).__name__,0,None)
                  print(host,'/store',attempt,type(error).__name__)
                  store_ok=False

              if binding_ok and home_ok and store_ok:
                  break
              time.sleep(5)

          if not binding_ok:
              raise SystemExit(f'Custom-domain routing proof did not stabilize: {last_binding}')
          if not home_ok:
              raise SystemExit(f'Custom-domain homepage did not stabilize: {last_home}')
          if not store_ok:
              raise SystemExit(f'Custom-domain store proof did not stabilize: {last_store}')
          PYCUSTOM
          then
            restore_router
            exit 1
          fi
          echo "Custom-domain Worker bridge reached the exact LEGEND business binding proof."

      - name: Capture exact Cloudflare challenge event after failed live proof
        id: routingchallenge
        if: ${{ !cancelled() && env.WEBSITE_ROUTING == 'true' && steps.routinglive.outcome == 'failure' && steps.routingauthority.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-routing-authority.py challenge-events --host "$WEBSITE_ROUTING_CANARY"

      - name: Verify every deployed target and collect all failures
        id: live
        if: ${{ !cancelled() && (steps.transaction.outcome == 'success' || env.PRESERVE_LIVE_TARGETS == 'true' || env.EXACT_LIVE == 'true') && (env.WEBSITE_ROUTING != 'true' || steps.routinglive.outcome == 'success') && (env.FOUNDER_CLOUDFLARE != 'true' || steps.foundercloud.outcome == 'success') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/translation-results
          python3 scripts/validation-resume.py verify-live \
            --revision "$APPLICATION_RELEASE_SHA" \
            --selected-targets "$SELECTED_TARGETS" \
            --output /tmp/translation-results/live.json

      - name: Restore Founder Cloudflare baseline after downstream release failure
        id: foundercloudrollback
        if: ${{ always() && env.FOUNDER_CLOUDFLARE == 'true' && steps.foundercloud.outcome == 'success' && steps.live.outcome != 'success' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          python3 scripts/deploy-founder-cloudflare.py rollback \
            --state /tmp/legend-founder-cloudflare-state.json

      - name: Restore complete application baseline after downstream release failure
        id: transactionrollback
        if: ${{ always() && steps.transaction.outcome == 'success' && (steps.live.outcome != 'success' || (env.WEBSITE_ROUTING == 'true' && steps.routinglive.outcome != 'success') || (env.FOUNDER_CLOUDFLARE == 'true' && steps.foundercloud.outcome != 'success')) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy-approved-app.py \
            --targets-json "$SELECTED_TARGETS" \
            --baselines-json "$LIVE_BASELINES" \
            --rollback-root /tmp/rollback-packages \
            --rollback-only

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-direct-release-${{ env.RELEASE_SHA }}
          path: /tmp/translation-results/
          if-no-files-found: warn
      - name: Enforce complete direct deployment outcome
        if: always()
        env:
          BASE: ${{ steps.base.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          AZURE: ${{ steps.azure.outcome }}
          TRANSACTION: ${{ steps.transaction.outcome }}
          TRANSACTION_ROLLBACK: ${{ steps.transactionrollback.outcome }}
          LIVE: ${{ steps.live.outcome }}
          ROUTING_LIVE: ${{ steps.routinglive.outcome }}
          FOUNDER_CLOUD: ${{ steps.foundercloud.outcome }}
          FOUNDER_CLOUD_ROLLBACK: ${{ steps.foundercloudrollback.outcome }}
          VALIDATE_ONLY: ${{ env.VALIDATE_ONLY }}
          WEBSITE_ROUTING: ${{ env.WEBSITE_ROUTING }}
          FOUNDER_CLOUDFLARE: ${{ env.FOUNDER_CLOUDFLARE }}
          PRESERVE_LIVE_TARGETS: ${{ env.PRESERVE_LIVE_TARGETS }}
          EXACT_LIVE: ${{ env.EXACT_LIVE }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          selected=json.loads(os.environ['SELECTED_TARGETS'])
          assert isinstance(selected,list) and selected and len(selected)==len(set(selected))
          validate_only=os.environ.get('VALIDATE_ONLY')=='true'
          website_routing=os.environ.get('WEBSITE_ROUTING')=='true'
          founder_cloudflare=os.environ.get('FOUNDER_CLOUDFLARE')=='true'
          preserve_live=os.environ.get('PRESERVE_LIVE_TARGETS')=='true'
          exact_live=os.environ.get('EXACT_LIVE')=='true'
          base=os.environ['BASE']
          package=os.environ['PACKAGE']
          azure=os.environ['AZURE']
          transaction=os.environ['TRANSACTION']
          rollback=os.environ['TRANSACTION_ROLLBACK']
          live=os.environ['LIVE']
          routing_live=os.environ['ROUTING_LIVE']
          founder_cloud=os.environ['FOUNDER_CLOUD']
          founder_cloud_rollback=os.environ['FOUNDER_CLOUD_ROLLBACK']

          if validate_only:
              assert not preserve_live and not exact_live
              assert base=='success' and package=='success'
              assert transaction=='skipped' and live=='skipped'
              mode='validate-only'
          elif exact_live:
              assert not preserve_live and not website_routing and not founder_cloudflare
              assert base=='success' and live=='success'
              assert transaction=='skipped' and rollback=='skipped'
              mode='exact-live-noop'
          elif preserve_live:
              assert website_routing
              assert base=='success' and azure=='success' and live=='success'
              assert transaction=='skipped' and rollback=='skipped'
              mode='preserve-live-routing-recovery'
          else:
              assert base=='success' and package=='success' and azure=='success'
              assert transaction=='success'
              assert rollback=='skipped', 'Downstream release failure forced complete application rollback'
              assert live=='success'
              if founder_cloudflare:
                  assert founder_cloud=='success'
                  assert founder_cloud_rollback=='skipped'
              mode='approved-transaction'

          if website_routing and not validate_only:
              assert routing_live=='success'

          receipt={
              'schemaVersion':2,
              'mode':mode,
              'applicationReleaseSha':os.environ['APPLICATION_RELEASE_SHA'],
              'releaseHeadSha':os.environ['RELEASE_SHA'],
              'selectedTargets':selected,
              'packageIdentity':os.environ['PACKAGE_IDENTITY'],
              'founderCloudflare':founder_cloudflare,
              'transaction':'committed' if transaction=='success' else 'preserved',
          }
          with open('/tmp/approved-release-receipt.json','w') as output:
              json.dump(receipt,output,sort_keys=True,indent=2)
          print(json.dumps(receipt,sort_keys=True))
          PYRESULT
      - name: Retain exact approved release receipt
        if: success() && env.VALIDATE_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: legend-approved-release-${{ env.APPLICATION_RELEASE_SHA }}
          path: /tmp/approved-release-receipt.json
          retention-days: 90
          if-no-files-found: error

  target-release-receipts:
    name: target-release-receipts (${{ matrix.app }})
    needs: [discover-live, release]
    if: needs.release.result == 'success' && needs.discover-live.outputs.validate_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-live.outputs.matrix) }}
    steps:
      - name: Bind successful transaction receipt to canonical target
        shell: bash
        env:
          APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
          SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
          TARGET_NAME: ${{ matrix.releaseName }}
        run: |
          set -euo pipefail
          python3 - <<'PYTARGETRECEIPT'
          import json,os,pathlib
          names=json.loads(os.environ['SELECTED_TARGETS'])
          release_name=os.environ['TARGET_NAME']
          if release_name not in names:
              raise SystemExit('Target receipt is not part of the canonical selected release set')
          payload={
              'schemaVersion':1,
              'applicationReleaseSha':os.environ['APPLICATION_RELEASE_SHA'],
              'target':release_name,
              'transaction':'committed-or-preserved',
          }
          pathlib.Path('/tmp/target-release-receipt.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          PYTARGETRECEIPT
      - name: Preserve target-specific successful release receipt
        uses: actions/upload-artifact@v4
        with:
          name: legend-approved-release-${{ needs.discover-live.outputs.application_release_sha }}-${{ matrix.releaseName }}
          path: /tmp/target-release-receipt.json
          retention-days: 90
          if-no-files-found: error

  release-state-receipt:
    name: release-state-receipt
    needs: [discover-live, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      APPLICATION_RELEASE_SHA: ${{ needs.discover-live.outputs.application_release_sha }}
      PACKAGE_IDENTITY: ${{ needs.discover-live.outputs.package_identity }}
      SELECTED_TARGETS: ${{ needs.discover-live.outputs.targets }}
    steps:
      - name: Capture exact release step-state receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100")"
          printf '%s' "$jobs" > "$RUNNER_TEMP/release-jobs.json"
          python3 - "$RUNNER_TEMP/release-jobs.json" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$APPLICATION_RELEASE_SHA" "$PACKAGE_IDENTITY" "$SELECTED_TARGETS" <<'PYSTATE'
          import json,sys
          jobs_path,run_id,attempt,release_sha,application_sha,package_identity,targets=sys.argv[1:]
          with open(jobs_path) as source:
              payload=json.load(source)
          release_jobs=[row for row in payload.get('jobs',[]) if row.get('name')=='release']
          if len(release_jobs)!=1:
              raise SystemExit('Expected exactly one terminal release job')
          job=release_jobs[0]
          if job.get('status')!='completed':
              raise SystemExit('Release job is not terminal; refusing partial state receipt')
          steps=[
              {
                  'number':step.get('number'),
                  'name':step.get('name'),
                  'status':step.get('status'),
                  'conclusion':step.get('conclusion'),
              }
              for step in job.get('steps',[])
          ]
          if any(not row['name'] for row in steps):
              raise SystemExit('Release step inventory malformed')
          if not steps and job.get('conclusion')!='skipped':
              raise SystemExit('Terminal non-skipped release job has no step inventory')
          state={
              'schemaVersion':2,
              'runId':int(run_id),
              'runAttempt':int(attempt),
              'releaseHeadSha':release_sha,
              'applicationReleaseSha':application_sha or None,
              'packageIdentity':package_identity or None,
              'selectedTargets':json.loads(targets) if targets else [],
              'releaseJobConclusion':job.get('conclusion'),
              'steps':steps,
          }
          with open('/tmp/legend-release-step-state.json','w') as output:
              json.dump(state,output,sort_keys=True,indent=2)
          print(json.dumps({
              'releaseJobConclusion':state['releaseJobConclusion'],
              'applicationReleaseSha':state['applicationReleaseSha'],
              'stepOutcomes':{row['name']:row['conclusion'] for row in steps},
          },sort_keys=True))
          PYSTATE

      - name: Preserve exact release step-state receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: legend-release-step-state-${{ needs.discover-live.outputs.application_release_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/legend-release-step-state.json
          retention-days: 30
          if-no-files-found: error

      - name: Bind successful release to canonical validated package
        if: >-
          needs.release.result == 'success' &&
          needs.discover-live.outputs.validate_only != 'true' &&
          needs.discover-live.outputs.exact_live != 'true' &&
          needs.discover-live.outputs.preserve_live_targets != 'true' &&
          needs.discover-live.outputs.package_identity != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPACKAGELINK'
          import json,os,pathlib,re
          revision=os.environ['APPLICATION_RELEASE_SHA']
          identity=os.environ['PACKAGE_IDENTITY']
          if not re.fullmatch(r'[0-9a-f]{40}',revision):
              raise SystemExit('Package-link release revision is malformed')
          if not re.fullmatch(r'[0-9a-f]{64}',identity):
              raise SystemExit('Package-link identity is malformed')
          payload={
              'schemaVersion':1,
              'applicationReleaseSha':revision,
              'packageIdentity':identity,
              'source':'canonical-validated-package',
          }
          pathlib.Path('/tmp/legend-approved-package-link.json').write_text(
              json.dumps(payload,sort_keys=True,indent=2)+'\n'
          )
          PYPACKAGELINK

      - name: Preserve validated package release binding
        if: >-
          needs.release.result == 'success' &&
          needs.discover-live.outputs.validate_only != 'true' &&
          needs.discover-live.outputs.exact_live != 'true' &&
          needs.discover-live.outputs.preserve_live_targets != 'true' &&
          needs.discover-live.outputs.package_identity != ''
        uses: actions/upload-artifact@v4
        with:
          name: legend-approved-package-link-${{ needs.discover-live.outputs.application_release_sha }}-${{ needs.discover-live.outputs.package_identity }}
          path: /tmp/legend-approved-package-link.json
          retention-days: 90
          if-no-files-found: error

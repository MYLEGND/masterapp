name: Direct deploy all intentional September 18 updates

on:
  push:
    branches:
      - feature/public-website-editor-20260918
    paths:
      - '.github/workflows/all-intentional-direct-release-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: all-intentional-direct-release-20260918
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: feature/public-website-editor-20260918
          fetch-depth: 0

      - name: Record exact release SHA
        shell: bash
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build LEGEND website artifact
        working-directory: Legend-Website
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp public/web.config dist/web.config
          npm run check
          grep -q 'instagram.com/legend.vault' dist/index.html
          grep -q 'apps.apple.com/us/app/legend/id6798419225' dist/index.html
          grep -q 'Legend® ios App' dist/index.html
          ! grep -q 'brand-banner' dist/index.html
          ! grep -q 'Live Legendary' dist/index.html
          test -f dist/legend-public-cms.js

      - name: Build and publish all affected apps
        shell: bash
        run: |
          set -euo pipefail
          dotnet build AgentPortal/AgentPortal.csproj -c Release --nologo
          dotnet build ClientApp/ClientApp.csproj -c Release --nologo
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo

          dotnet publish AgentPortal/AgentPortal.csproj -c Release -o /tmp/agentportal-publish --no-restore
          dotnet publish ClientApp/ClientApp.csproj -c Release -o /tmp/clientapp-publish --no-restore
          dotnet publish Protect-Website/ProtectWebsite.csproj -c Release -o /tmp/protect-publish --no-restore

          mkdir -p /tmp/agentportal-publish/wwwroot /tmp/clientapp-publish/wwwroot /tmp/protect-publish/wwwroot
          printf '{"releaseSha":"%s","release":"all-intentional-20260918"}\n' "$RELEASE_SHA" > /tmp/agentportal-publish/wwwroot/_deployment-provenance.json
          cp /tmp/agentportal-publish/wwwroot/_deployment-provenance.json /tmp/clientapp-publish/wwwroot/_deployment-provenance.json
          cp /tmp/agentportal-publish/wwwroot/_deployment-provenance.json /tmp/protect-publish/wwwroot/_deployment-provenance.json
          cp /tmp/agentportal-publish/wwwroot/_deployment-provenance.json Legend-Website/dist/_deployment-provenance.json

      - name: Run subscription activation billing and management suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release             --filter 'FullyQualifiedName~BillingCentralizationTests|FullyQualifiedName~ClientAppSubscriptionActivationTests|FullyQualifiedName~ClientBillingNotificationAndSchemaTests|FullyQualifiedName~ClientSubscriptionAdministrationTests|FullyQualifiedName~ClientAppSubscriptionRedirectTests'             --logger 'console;verbosity=minimal'

      - name: Run website analytics editor scope suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release             --filter 'FullyQualifiedName~WebsiteAnalyticsScopeTests|FullyQualifiedName~WebsiteAnalyticsDeleteLeadTests|FullyQualifiedName~WebsiteAnalyticsInitialQualityModeTests'             --logger 'console;verbosity=minimal'

      - name: Guard false-alert subscription behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'POST_ACTIVATION_SIGNIN_SETUP_PENDING' ClientApp/Services/SubscriptionActivationService.cs
          grep -q 'Do not submit another payment' ClientApp/Services/SubscriptionActivationService.cs
          grep -q 'Membership Active — Sign-In Setup Pending' ClientApp/Controllers/SubscriptionActivationController.cs
          grep -q 'activated = isActivated' ClientApp/Controllers/SubscriptionActivationController.cs
          grep -q 'UpdateClientSubscription_RequiresFounderAuthorityAndPreservesTheCurrentSchedule' AgentPortal.Tests/BillingCentralizationTests.cs
          grep -q 'CancelClientSubscriptionAtPeriodEnd_UsesSharedOrchestrator_AndUpdatesOwnedSubscription' AgentPortal.Tests/ClientSubscriptionAdministrationTests.cs

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Protect website
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-protect
          slot-name: Production
          package: /tmp/protect-publish

      - name: Verify Protect exact release
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            base="$1"
            for i in {1..60}; do
              body="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/_deployment-provenance.json?sha=$RELEASE_SHA" || true)"
              if printf '%s' "$body" | grep -q "$RELEASE_SHA"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          verify https://masterapp-protect.azurewebsites.net
          verify https://protect.mylegnd.com
          curl --connect-timeout 5 --max-time 12 -fsSL https://protect.mylegnd.com/ | grep -q '<strong>LEGEND</strong>'
          curl --connect-timeout 5 --max-time 12 -fsSL https://protect.mylegnd.com/design/legend-public-cms.js | grep -q 'Website Editor'

      - name: Deploy LEGEND website
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-website
          slot-name: Production
          package: Legend-Website/dist

      - name: Verify LEGEND exact release
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            base="$1"
            for i in {1..60}; do
              body="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/_deployment-provenance.json?sha=$RELEASE_SHA" || true)"
              if printf '%s' "$body" | grep -q "$RELEASE_SHA"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          verify https://masterapp-website.azurewebsites.net
          verify https://www.mylegnd.com
          curl --connect-timeout 5 --max-time 12 -fsSL https://www.mylegnd.com/ | grep -q '<strong>LEGEND®</strong>'
          curl --connect-timeout 5 --max-time 12 -fsSL https://www.mylegnd.com/ | grep -q 'instagram.com/legend.vault'
          curl --connect-timeout 5 --max-time 12 -fsSL https://www.mylegnd.com/ | grep -q 'Legend® ios App'

      - name: Deploy AgentPortal
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-portal
          slot-name: Production
          package: /tmp/agentportal-publish

      - name: Verify AgentPortal exact release
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            base="$1"
            for i in {1..60}; do
              body="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/_deployment-provenance.json?sha=$RELEASE_SHA" || true)"
              if printf '%s' "$body" | grep -q "$RELEASE_SHA"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          verify https://masterapp-portal.azurewebsites.net
          verify https://portal.mylegnd.com
          curl --connect-timeout 5 --max-time 12 -fsSL https://portal.mylegnd.com/js/website-analytics.js | grep -q 'edit-protect-website'

      - name: Deploy ClientApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-client
          slot-name: Production
          package: /tmp/clientapp-publish

      - name: Verify ClientApp exact release
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            base="$1"
            for i in {1..60}; do
              body="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/_deployment-provenance.json?sha=$RELEASE_SHA" || true)"
              if printf '%s' "$body" | grep -q "$RELEASE_SHA"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          verify https://masterapp-client.azurewebsites.net
          verify https://client.mylegnd.com

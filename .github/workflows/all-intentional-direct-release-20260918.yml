          RESUME_WEBSITE: ${{ steps.resumestate.outputs.website_live }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          selected=json.loads(os.environ['SELECTED_TARGETS'])
          apps={'masterapp-portal':'PORTAL','masterapp-client':'CLIENT','masterapp-protect':'PROTECT','masterapp-parfait':'PARFAIT','masterapp-website':'WEBSITE'}
          assert selected and len(selected)==len(set(selected)) and all(app in apps for app in selected)
          validate_only=os.environ.get('VALIDATE_ONLY')=='true'
          website_routing=os.environ.get('WEBSITE_ROUTING')=='true'
          preserve_live_targets=os.environ.get('PRESERVE_LIVE_TARGETS')=='true'
          exact_live=os.environ.get('EXACT_LIVE')=='true'
          routing_steps=['ROUTINGCHECKS','ROUTINGSECRET','ROUTINGAUTH','ROUTINGPOLICY','ROUTINGDEPLOY','ROUTINGLIVE']
          if exact_live:
              assert not validate_only and not website_routing and not preserve_live_targets
              required=['BASE','LIVE']
              skipped=['BUILD','TESTS','WEB','PACKAGE','AZURE','MIGRATE','PROTECTAUTH','EDITORAUTH','WEBSITECHECKS']+routing_steps+list(apps.values())
              results={key:os.environ[key] for key in required}
              skipped_results={key:os.environ[key] for key in skipped}
              print(json.dumps({'mode':'exact-live-noop','required':results,'skippedPublicationSteps':skipped_results},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped_results.values()), 'Exact-live release executed publication work'
          elif preserve_live_targets:
              assert not validate_only and website_routing
              required=['BASE','AZURE','LIVE']+routing_steps
              skipped=['BUILD','TESTS','WEB','PACKAGE','MIGRATE','PROTECTAUTH','EDITORAUTH','PORTAL','CLIENT','PROTECT','PARFAIT','WEBSITE']
              if 'masterapp-website' in selected:
                  required.append('WEBSITECHECKS')
              else:
                  skipped.append('WEBSITECHECKS')
              results={key:os.environ[key] for key in required}
              skipped_results={key:os.environ[key] for key in skipped}
              print(json.dumps({'mode':'preserve-live-routing-recovery','required':results,'preservedSteps':skipped_results},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped_results.values()), 'Preserve-live recovery redeployed or mutated an application target'
          elif validate_only:
              if website_routing:
                  required=['BASE','BUILD','ROUTINGCHECKS','PACKAGE']
                  skipped=['TESTS','WEB','AZURE','MIGRATE','LIVE','PROTECTAUTH','EDITORAUTH','ROUTINGSECRET','ROUTINGDEPLOY','ROUTINGLIVE']+list(apps.values())
              elif set(selected) <= {'masterapp-protect','masterapp-website'}:
                  required=['BASE','BUILD','PACKAGE']
                  skipped=['TESTS','WEB','AZURE','MIGRATE','LIVE','PROTECTAUTH']+routing_steps+list(apps.values())
              else:
                  required=['BASE','BUILD','TESTS','WEB','PACKAGE']
                  skipped=['AZURE','MIGRATE','LIVE','PROTECTAUTH','EDITORAUTH']+routing_steps+list(apps.values())
              if 'masterapp-website' in selected:
                  required.append('WEBSITECHECKS')
              else:
                  skipped.append('WEBSITECHECKS')
              results={key:os.environ[key] for key in required}
              skipped_results={key:os.environ[key] for key in skipped}
              print(json.dumps({'mode':'validate-only','required':results,'skippedSteps':skipped_results},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped_results.values()), 'Validation-only run executed a publish or deployment step'
          else:
              required=['BASE','PACKAGE','AZURE','LIVE']
              excluded=[step for app,step in apps.items() if app not in selected]
              resume={
                  'masterapp-portal':os.environ.get('RESUME_PORTAL')=='true',
                  'masterapp-client':os.environ.get('RESUME_CLIENT')=='true',
                  'masterapp-protect':os.environ.get('RESUME_PROTECT')=='true',
                  'masterapp-parfait':os.environ.get('RESUME_PARFAIT')=='true',
                  'masterapp-website':os.environ.get('RESUME_WEBSITE')=='true',
              }
              for app in selected:
                  step=apps[app]
                  if resume[app]:
                      assert os.environ[step]=='skipped', f'{app} was already live at the exact candidate but redeployed'
                  else:
                      required.append(step)
              (required if 'masterapp-protect' in selected else excluded).append('PROTECTAUTH')
              (required if any(app in selected for app in ('masterapp-protect','masterapp-parfait')) else excluded).append('EDITORAUTH')
              (excluded if selected == ['masterapp-website'] else required).append('BUILD')
              if os.environ.get('CLIENT_ONLY') == 'true':
                  required.extend(['TESTS','WEB'])
                  excluded.append('MIGRATE')
              elif set(selected) <= {'masterapp-protect','masterapp-website'}:
                  excluded.extend(['TESTS','WEB'])
                  (excluded if selected == ['masterapp-website'] else required).append('MIGRATE')
              else:
                  required.extend(['TESTS','WEB','MIGRATE'])
              (required if 'masterapp-website' in selected else excluded).append('WEBSITECHECKS')
              if website_routing:
                  required.extend(routing_steps)
              else:
                  excluded.extend(routing_steps)
              results={key:os.environ[key] for key in required}
              skipped={key:os.environ[key] for key in excluded}
              preserved={app:resume[app] for app in selected if resume[app]}
              print(json.dumps({'mode':'approved-only','required':results,'unselected':skipped,'preservedExactLiveTargets':preserved},indent=2))
              assert all(value=='success' for value in results.values())
              assert all(value=='skipped' for value in skipped.values()), 'Unselected release step unexpectedly executed'
          receipt={
              'schemaVersion':1,
              'applicationReleaseSha':os.environ['APPLICATION_RELEASE_SHA'],
              'releaseHeadSha':os.environ['RELEASE_SHA'],
              'selectedTargets':selected,
              'packageIdentity':os.environ['PACKAGE_IDENTITY'],

name: Restore preserved ClientApp package

on:
  push:
    branches:
      - legend/approved-changes
    paths:
      - .github/workflows/clientapp-preserved-package-restore.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Download preserved pre-Run-35 ClientApp package
        uses: actions/download-artifact@v4
        with:
          name: diagnostics-rollback-client-07609108b60fcd78bf4479cbcd4f6ceb0af1d409
          path: /tmp/rollback
          run-id: 35616116843
          github-token: ${{ github.token }}
      - name: Verify exact preserved rollback identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "client d851c95a009d386e8b320df8490c20da4cdd3bf1 source-equivalent rebuild" /tmp/rollback/manifest.txt
          test -s /tmp/rollback/package.zip
          (cd /tmp/rollback && sha256sum -c SHA256SUMS)
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy preserved ClientApp package only
        uses: azure/webapps-deploy@v3
        with:
          app-name: masterapp-client
          slot-name: Production
          package: /tmp/rollback/package.zip
      - name: Verify browser routes on both live hostnames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client,ssl,time
          hosts=('client.mylegnd.com','masterapp-client.azurewebsites.net')
          paths=('/','/Account/Login')
          context=ssl.create_default_context()
          deadline=time.monotonic()+420
          last={}
          while time.monotonic()<deadline:
              ok=True
              for host in hosts:
                  for path in paths:
                      try:
                          c=http.client.HTTPSConnection(host,443,timeout=20,context=context)
                          c.request('GET',path,headers={'User-Agent':'LEGEND-preserved-restore-check/1.0','Cache-Control':'no-cache','Accept':'text/html'})
                          r=c.getresponse(); body=r.read(65537)
                          last[(host,path)]=(r.status,len(body),r.getheader('Content-Type'),r.getheader('Location'))
                          c.close()
                          if path=='/Account/Login':
                              ok &= r.status==200 and len(body)>=512 and (r.getheader('Content-Type') or '').lower().startswith('text/html')
                          else:
                              ok &= r.status in (200,301,302,303,307,308) and not (r.status==200 and len(body)<256)
                      except Exception as e:
                          last[(host,path)]=(type(e).__name__,0,None,None)
                          ok=False
              if ok:
                  for key,value in last.items(): print(key,*value)
                  raise SystemExit(0)
              time.sleep(10)
          for key,value in last.items(): print(key,*value)
          raise SystemExit('Preserved ClientApp package did not restore browser entry routes')
          PY

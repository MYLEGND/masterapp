name: Temporary governed operational diagnostics repair
on:
  push:
    branches: [fix/legend-governed-capability-plane-20260824]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply bounded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('AgentPortal.Tests/LegendConnectCurriculumTests.cs')
          s = p.read_text()
          s = s.replace('FounderCurriculumManifest_TerminalReceipt_IsRetiredWithoutResumingFamilyWork', 'FounderCurriculumManifest_TerminalReceipt_RemainsFailedWithoutInventingDurableFamilyWork', 1)
          s = s.replace('''        var retired = Assert.Single(await db.Set<LegendCurriculumManifestWorkItem>().ToListAsync());\n        Assert.Equal("Retired", retired.ProcessingState);\n        Assert.Equal(0, retired.NextFamilyIndex);\n        Assert.Equal(5, retired.AttemptCount);\n        Assert.Equal("founder_manifest_family_failure", retired.LastErrorCode);\n        Assert.Equal("Transient governed evaluator failure.", retired.LastErrorMessage);\n        Assert.Null(retired.CompletedLanguageIntelligenceEvaluatorVersion);\n        Assert.Empty(await db.LegendCurriculumFamilies.ToListAsync());\n        Assert.Empty(await db.LegendHistoricalReevaluationWorkItems\n            .Where(item => item.SubjectId == retired.Id &&\n                item.WorkKind == LegendConnectHistoricalReevaluationWorkAuthority.FounderManifestFamilyWorkKind)\n            .ToListAsync());\n''','''        var failed = Assert.Single(await db.Set<LegendCurriculumManifestWorkItem>().ToListAsync());\n        Assert.Equal("Failed", failed.ProcessingState);\n        Assert.Equal(0, failed.NextFamilyIndex);\n        Assert.Equal(5, failed.AttemptCount);\n        Assert.Equal("founder_manifest_family_failure", failed.LastErrorCode);\n        Assert.Equal("Transient governed evaluator failure.", failed.LastErrorMessage);\n        Assert.Null(failed.CompletedLanguageIntelligenceEvaluatorVersion);\n        Assert.Empty(await db.LegendCurriculumFamilies.ToListAsync());\n        Assert.Empty(await db.LegendHistoricalReevaluationWorkItems\n            .Where(item => item.SubjectId == failed.Id &&\n                item.WorkKind == LegendConnectHistoricalReevaluationWorkAuthority.FounderManifestFamilyWorkKind)\n            .ToListAsync());\n''', 1)
          p.write_text(s)

          p = Path('AgentPortal/Services/LegendFounderAiConversationService.cs')
          s = p.read_text()
          s = s.replace('''            "legend_system_overview" or\n            "legend_provider_capacity" or''','''            "legend_capabilities" or\n            "legend_system_overview" or\n            "legend_operational_diagnostics" or\n            "legend_provider_capacity" or''', 1)
          s = s.replace('''            case "legend_provider_capacity":\n            {''','''            case "legend_operational_diagnostics":\n            {\n                var state = await _legend.GetLanguageStateAsync(\n                    founder,\n                    "en",\n                    null,\n                    cancellationToken);\n                var capacity = await _legend.GetProviderCapacityAsync(\n                    founder,\n                    cancellationToken);\n                return SerializeUnbounded(new\n                {\n                    state.RuntimePolicy,\n                    state.ProductionReadiness,\n                    ProviderCapacity = capacity,\n                    acquisitionContract = new\n                    {\n                        queueAuthority = "LegendCorpusCandidate",\n                        downstreamLearningEvent = "LegendTranslationLearningEvent",\n                        rule = "Approved candidates are claimed directly by the existing acquisition worker. Learning events are downstream results, not a prerequisite job queue.",\n                        safety = "BLOCKED or DEGRADED readiness intentionally prevents new acquisition claims. Never bypass historical convergence, worker health, capacity, live reserve, or language-registry gates."\n                    }\n                });\n            }\n\n            case "legend_provider_capacity":\n            {''', 1)
          s = s.replace('''                arbitrarySql = false,\n                arbitraryShell = false,\n                arbitraryCodeExecution = false''','''                requiresExplicitFounderCommand = mutation,\n                canOverrideAuthorities = false,\n                canModifyRepository = false,\n                canDeploy = false,\n                arbitrarySql = false,\n                arbitraryShell = false,\n                arbitraryCodeExecution = false''', 1)
          marker = '''            new\n            {\n                type = "function",\n                name = "legend_provider_capacity",'''
          insert = '''            new\n            {\n                type = "function",\n                name = "legend_operational_diagnostics",\n                description =\n                    "Read the existing runtime-policy readiness gates, provider capacity, and acquisition contract together. Use this before diagnosing a candidate backlog. A nonzero candidate backlog with zero downstream learning events is not by itself a broken handoff: approved candidates are the durable acquisition queue, and BLOCKED/DEGRADED readiness intentionally prevents claims. This tool is read-only and cannot reset rows, bypass gates, edit code, or deploy.",\n                parameters = new\n                {\n                    type = "object",\n                    properties = new { },\n                    required = Array.Empty<string>(),\n                    additionalProperties = false\n                },\n                strict = true\n            },\n'''
          if marker not in s:
              raise SystemExit('provider capacity tool marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          p = Path('AgentPortal.Tests/LegendFounderAiContractTests.cs')
          s = p.read_text()
          s = s.replace('''        Assert.Contains("legend_capabilities", discoveredNames);\n        Assert.Contains("legend_submit_machine_learning_candidate", discoveredNames);''','''        Assert.Contains("legend_capabilities", discoveredNames);\n        Assert.Contains("legend_operational_diagnostics", discoveredNames);\n        Assert.Contains("legend_submit_machine_learning_candidate", discoveredNames);''', 1)
          s = s.replace('''            Assert.False(item.GetProperty("arbitrarySql").GetBoolean());''','''            Assert.False(item.GetProperty("canOverrideAuthorities").GetBoolean());\n            Assert.False(item.GetProperty("canModifyRepository").GetBoolean());\n            Assert.False(item.GetProperty("canDeploy").GetBoolean());\n            Assert.False(item.GetProperty("arbitrarySql").GetBoolean());''', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-governed-ops-diagnostics.yml
          git add AgentPortal.Tests/LegendConnectCurriculumTests.cs AgentPortal.Tests/LegendFounderAiContractTests.cs AgentPortal/Services/LegendFounderAiConversationService.cs
          git diff --cached --check
          git commit -m 'Clarify governed acquisition diagnostics and Founder boundaries'
          git push origin HEAD:fix/legend-governed-capability-plane-20260824

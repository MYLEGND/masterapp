name: Apply Founder Teacher request-budget repair

on:
  push:
    branches:
      - fix/founder-teacher-request-budget-20260825

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/founder-teacher-request-budget-20260825
          fetch-depth: 0

      - name: Verify immutable production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production --no-tags
          base="$(git merge-base HEAD origin/production)"
          test "$base" = "eec135d17d46c8e3f75ddfe8fccec59d0205bf71" || {
            echo "Unexpected production merge base: $base" >&2
            exit 1
          }
          blob="$(git rev-parse HEAD:AgentPortal/Services/LegendFounderAiConversationService.cs)"
          test "$blob" = "6c2df5e2ee6326f8a82b59954ffadfc5f2258cd1" || {
            echo "Unexpected service blob: $blob" >&2
            exit 1
          }

      - name: Apply exact surgical replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("AgentPortal/Services/LegendFounderAiConversationService.cs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "private const int MinimumFinalizationReserveSeconds = 6;",
                  "private const int MinimumFinalizationReserveSeconds = 45;",
              ),
              (
                  "private const int MinimumFinalSynthesisWindowSeconds = 20;",
                  "private const int MinimumFinalSynthesisWindowSeconds = 60;",
              ),
              (
                  'configuration.GetValue<int?>(\n                    "OpenAI:LegendFounderAiTimeoutSeconds") ??\n                    210,\n                60,\n                240);',
                  'configuration.GetValue<int?>(\n                    "OpenAI:LegendFounderAiTimeoutSeconds") ??\n                    900,\n                120,\n                1_800);',
              ),
              (
                  "var allowTools =\n                    requiresGovernedInspection &&\n                    round < maximumToolRounds - 1 &&",
                  "var allowTools =\n                    requiresGovernedInspection &&\n                    !governedInspectionCompleted &&\n                    round < maximumToolRounds - 1 &&",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify surgical diff only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "AgentPortal/Services/LegendFounderAiConversationService.cs" || {
            echo "Unexpected changed files before helper cleanup:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git diff -- AgentPortal/Services/LegendFounderAiConversationService.cs

      - name: Remove one-time helper and commit product repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-founder-teacher-request-budget-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPortal/Services/LegendFounderAiConversationService.cs
          git commit -m "Fix Founder Teacher comprehensive request budget"
          git push origin HEAD:fix/founder-teacher-request-budget-20260825

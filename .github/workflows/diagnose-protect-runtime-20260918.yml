name: Diagnose all direct release targets

on:
  push:
    branches:
      - feature/public-website-editor-20260918
    paths:
      - '.github/workflows/diagnose-protect-runtime-20260918.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELEASE_SHA: fd22853357d4005269a0bf73ae88602c949d8995
    environment:
      name: Production
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect configuration and deployed metadata for both unresolved apps
        shell: bash
        run: |
          set -u
          for app in masterapp-website masterapp-client; do
            echo "TARGET: $app"
            timeout 30s az webapp config show --resource-group masterapp-rg --name "$app" --query '{netFrameworkVersion:netFrameworkVersion,linuxFxVersion:linuxFxVersion,windowsFxVersion:windowsFxVersion,alwaysOn:alwaysOn,virtualApplications:virtualApplications}' -o json || true
            timeout 30s az rest --method get --url "https://$app.scm.azurewebsites.net/api/vfs/site/wwwroot/_deployment-provenance.json" --resource https://management.azure.com/ -o json || true
          done

      - name: Probe metadata and runtime routes together
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, time, urllib.request, urllib.error, urllib.parse
          targets = [(host,path) for host in ("masterapp-client.azurewebsites.net","client.mylegnd.com","masterapp-website.azurewebsites.net","www.mylegnd.com") for path in ("/_deployment-provenance.json", "/_deployment-provenance.json?sha=fd22853357d4005269a0bf73ae88602c949d8995", "/")]
          def probe(item):
              host,path=item
              start=time.monotonic()
              try:
                  with urllib.request.urlopen("https://"+host+path,timeout=30) as r:
                      b=r.read(100000).decode("utf-8",errors="replace")
                      parsed=urllib.parse.urlsplit(r.geturl())
                      print(json.dumps({"host":host,"path":path,"status":r.status,"seconds":round(time.monotonic()-start,1),"type":r.headers.get("Content-Type"),"bytes":len(b),"destination":parsed.netloc+parsed.path,"release":b[:150] if b.strip().startswith('{"releaseSha"') else None}),flush=True)
              except urllib.error.HTTPError as e:
                  print(json.dumps({"host":host,"path":path,"status":e.code,"type":e.headers.get("Content-Type"),"seconds":round(time.monotonic()-start,1)}),flush=True)
              except Exception as e:
                  print(json.dumps({"host":host,"path":path,"error":type(e).__name__,"seconds":round(time.monotonic()-start,1)}),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(probe,targets))
          
          PY

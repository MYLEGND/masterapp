name: LEGEND general reasoning predeploy builder

on:
  push:
    branches:
      - builder/legend-general-reasoning-20260827
    paths:
      - .github/workflows/legend-general-reasoning-builder.yml

permissions:
  contents: write
  id-token: write

env:
  DOTNET_VERSION: '10.x'
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg

jobs:
  build-prove-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: Production
    steps:
      - name: Checkout builder tools
        uses: actions/checkout@v4
        with:
          ref: builder/legend-general-reasoning-20260827
          path: builder-tools

      - name: Checkout exact frozen advancement base
        uses: actions/checkout@v4
        with:
          ref: advance/legend-general-reasoning-20260827
          fetch-depth: 0
          path: candidate

      - name: Verify immutable green parent and apply advancement
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "057144c6416c48a2d5db6a698ba95d80cb0ab318"
          python ../builder-tools/.builder/apply_general_reasoning_patch.py
          cp ../builder-tools/.builder/LegendConnectGeneralReasoningExecutorTests.cs AgentPortal.Tests/LegendConnectGeneralReasoningExecutorTests.cs
          git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        working-directory: candidate
        run: dotnet restore MASTERAPP.sln

      - name: Build exact advancement with zero warnings
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          dotnet build MASTERAPP.sln -c Release --no-restore 2>&1 | tee build.log
          grep -qE '^[[:space:]]*0 Warning\(s\)' build.log
          grep -qE '^[[:space:]]*0 Error\(s\)' build.log

      - name: Prove new general multi-step reasoning executor
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendConnectGeneralReasoningExecutorTests' --logger 'console;verbosity=normal' 2>&1 | tee reasoning.log
          if grep -qE 'Failed:[[:space:]]*[1-9][0-9]*' reasoning.log; then exit 1; fi
          grep -Eq 'Test Run Successful|Passed![[:space:]]+-[[:space:]]+Failed:[[:space:]]+0' reasoning.log

      - name: Reprove prior broad native architecture
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendConnectCompositionalUnderstandingTests|FullyQualifiedName~LegendConnectDiscourseReferenceBindingTests|FullyQualifiedName~LegendConnectMeaningGraphTests|FullyQualifiedName~LegendConnectSemanticSpanGroundingTests|FullyQualifiedName~LegendConnectFounderSemanticTransformationSqlTests' --logger 'console;verbosity=minimal' 2>&1 | tee prior-architecture.log
          if grep -qE 'Failed:[[:space:]]*[1-9][0-9]*' prior-architecture.log; then exit 1; fi

      - name: Audit single runtime authority
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          files=(Infrastructure/Messaging/LegendConnectCurriculum.cs Infrastructure/Messaging/LegendConnectOperations.cs)
          if grep -nE '"Hi there\."|"Hi Legend\."|"Hey Legend\."|"Good morning\."|"Nice to meet you\."|"What.s up\?"' "${files[@]}"; then exit 1; fi
          test "$(grep -c 'private static SemanticReasoningPathResult ExpandGovernedSemanticReasoningPath' Infrastructure/Messaging/LegendConnectCurriculum.cs)" -eq 1
          git diff --check

      - name: Login to Azure for live Founder proof
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reprove live Founder native behavior with OpenAI blocked
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $connection = ''
          $connections = az webapp config connection-string list --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output json | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match) { $connection = [string]$match.value }
          $settings = @{}
          foreach ($item in (az webapp config appsettings list --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output json | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }
          if ([string]::IsNullOrWhiteSpace($connection)) {
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $connection = $settings[$name]; break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection unavailable.' }
          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $founderOid = $settings[$name]; break }
          }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Production Founder OID unavailable.' }
          Write-Output "::add-mask::$connection"
          Write-Output "::add-mask::$founderOid"
          $env:LEGEND_PRODUCTION_READONLY_CONNECTION = $connection
          $env:LEGEND_PRODUCTION_READONLY_FOUNDER_OID = $founderOid
          $env:LEGEND_PRODUCTION_READONLY_EXPECT_NATIVE = 'true'
          $env:OPENAI_API_KEY = ''
          $env:OpenAI__ApiKey = ''
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyEightPromptNativeDiagnostic' --logger 'console;verbosity=detailed'
          if ($LASTEXITCODE -ne 0) { throw 'Live native proof failed.' }

      - name: Run complete regression on exact advancement
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build 2>&1 | tee full-regression.log
          if grep -qE 'Failed:[[:space:]]*[1-9][0-9]*' full-regression.log; then exit 1; fi
          grep -Eq 'Passed![[:space:]]+-[[:space:]]+Failed:[[:space:]]+0|Test Run Successful' full-regression.log

      - name: Commit exact proven advancement only
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'MYLEGND'
          git config user.email 'zac.owen@mylegnd.com'
          git add Infrastructure/Messaging/LegendConnectCurriculum.cs AgentPortal.Tests/LegendConnectGeneralReasoningExecutorTests.cs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Add governed multi-step semantic reasoning executor'
          git push origin HEAD:advance/legend-general-reasoning-20260827

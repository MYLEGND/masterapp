name: Validate scoped Parfait commerce authority

on:
  push:
    branches:
      - fix/scoped-parfait-commerce-single-authority-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - name: Build shared commerce authority
        run: |
          dotnet build Infrastructure/Infrastructure.csproj -c Release --no-restore --nologo
          dotnet build ParfaitApp/ParfaitApp.csproj -c Release --no-restore --nologo
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo
      - name: Run existing commerce and website contracts
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo \
            --filter 'FullyQualifiedName~WebsiteContentEditorRoundTripTests|FullyQualifiedName~WebsitePublishingAuthorityTests|FullyQualifiedName~WebsiteDomainImportTests|FullyQualifiedName~BusinessWorkspaceTests|FullyQualifiedName~ParfaitCheckoutBillingCutoverTests'
      - name: Run Cloudflare storefront bridge tests
        run: node --test Legend-Cloudflare/tests/website-routing/bridge.test.mjs
      - name: Prove one management UI authority
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ParfaitApp/Views/CommerceManagement/Workspace.cshtml
          test ! -e ParfaitApp/Models/CommerceManagementWorkspaceViewModel.cs
          grep -F 'Views/InternalModules/Products.cshtml' ParfaitApp/Controllers/CommerceManagementController.cs
          grep -F 'Views/InternalModules/Orders.cshtml' ParfaitApp/Controllers/CommerceManagementController.cs
          grep -F 'Views/InternalModules/Automations.cshtml' ParfaitApp/Controllers/CommerceManagementController.cs
          grep -F '/commerce/manage/products?ticket=' Infrastructure/WebsiteEditing/WebsitePlatformController.cs
          ! grep -R 'CommerceManagementWorkspaceViewModel' ParfaitApp --exclude-dir=obj --exclude-dir=bin

name: Validate subscription activation repair

on:
  push:
    branches:
      - fix/mobile-web-native-parity-20260917
    paths:
      - '.github/workflows/subscription-activation-repair-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
      - name: Focused subscription and activation tests
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj
          -c Release --no-restore --nologo
          --filter "FullyQualifiedName~ClientAppSubscriptionActivationTests|FullyQualifiedName~ClientSubscriptionAdministrationTests|FullyQualifiedName~ClientBillingNotificationAndSchemaTests|FullyQualifiedName~BillingCentralizationTests"
      - name: Build AgentPortal
        run: dotnet build AgentPortal/AgentPortal.csproj -c Release --no-restore --nologo
      - name: Build ClientApp
        run: dotnet build ClientApp/ClientApp.csproj -c Release --no-restore --nologo
      - name: JavaScript parse
        run: node --check AgentPortal/wwwroot/js/billing/qv-billing-management.js
      - name: Diff check
        run: git diff --check HEAD^ HEAD

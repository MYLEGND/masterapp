name: Step 5 isolated conversion mapping validation

on:
  pull_request:
    branches:
      - legend/approved-changes
    paths:
      - 'SHARED/Analytics/**'
      - 'Infrastructure/Analytics/**'
      - 'AgentPortal.Tests/**'
      - '.github/workflows/step5-isolated-conversion-mapping-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore AgentPortal tests
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build affected test graph
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Run Step 5 focused tests
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~OpenAiMeasurementDeliveryTests"

      - name: Run full AgentPortal regression suite
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build

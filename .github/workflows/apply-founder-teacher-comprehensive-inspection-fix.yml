name: Apply exact Founder Teacher comprehensive inspection repair

on:
  push:
    branches:
      - fix/founder-teacher-comprehensive-inspection-20260825

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founder-teacher-comprehensive-inspection-20260825
          fetch-depth: 0

      - name: Apply exact validated repair
        run: python scripts/apply-founder-teacher-comprehensive-inspection-fix.py

      - name: Validate exact bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'legend_founder_dashboard' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'legend_section_page' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'Continuing independent governed inspection' AgentPortal/Services/LegendFounderAiConversationService.cs

      - name: Commit only canonical product and regression files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-founder-teacher-comprehensive-inspection-fix.yml
          rm -f scripts/apply-founder-teacher-comprehensive-inspection-fix.py
          git config user.name 'legend-founder-remediation[bot]'
          git config user.email 'legend-founder-remediation[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Expand Founder Teacher governed inspection'
          git push origin HEAD:fix/founder-teacher-comprehensive-inspection-20260825

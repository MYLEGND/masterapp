name: Generate Founder Teacher comprehensive inspection repair

on:
  push:
    branches:
      - fix/founder-teacher-comprehensive-inspection-20260825

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply bounded one-authority repair
        run: python scripts/apply-founder-teacher-comprehensive-inspection-fix.py

      - name: Validate bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- AgentPortal/Services/LegendFounderAiConversationService.cs AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs AgentPortal.Tests/LegendFounderAiComprehensiveInspectionContractTests.cs
          grep -q 'legend_founder_dashboard' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'legend_section_page' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'Continuing independent governed inspection' AgentPortal/Services/LegendFounderAiConversationService.cs

      - name: Package exact patched files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair/AgentPortal/Services repair/AgentPortal.Tests
          cp AgentPortal/Services/LegendFounderAiConversationService.cs repair/AgentPortal/Services/
          cp AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs repair/AgentPortal.Tests/
          cp AgentPortal.Tests/LegendFounderAiComprehensiveInspectionContractTests.cs repair/AgentPortal.Tests/

      - name: Upload bounded repair artifact
        uses: actions/upload-artifact@v4
        with:
          name: founder-teacher-comprehensive-inspection-repair
          path: repair
          if-no-files-found: error
          retention-days: 1

name: Apply Founder Teacher comprehensive inspection repair

on:
  push:
    branches:
      - fix/founder-teacher-comprehensive-inspection-20260825

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founder-teacher-comprehensive-inspection-20260825
          fetch-depth: 0

      - name: Apply bounded one-authority repair
        shell: python
        run: |
          from pathlib import Path

          service = Path('AgentPortal/Services/LegendFounderAiConversationService.cs')
          text = service.read_text()

          replacements = [
              ('private const int MaximumConversationMessages = 30;', 'private const int MaximumConversationMessages = 60;'),
              ('private const int MaximumConversationCharacters = 750_000;', 'private const int MaximumConversationCharacters = 1_500_000;'),
              ('private const int MinimumProviderConversationCharacters = 60_000;', 'private const int MinimumProviderConversationCharacters = 120_000;'),
              ('private const int MaximumProviderConversationCharacters = 180_000;', 'private const int MaximumProviderConversationCharacters = 320_000;'),
              ('private const int MinimumLatestMessageTailCharacters = 12_000;', 'private const int MinimumLatestMessageTailCharacters = 24_000;'),
              ('private const int MaximumProviderRoundSeconds = 75;', 'private const int MaximumProviderRoundSeconds = 110;'),
              ('private const int MinimumCasualOutputTokens = 256;', 'private const int MinimumCasualOutputTokens = 512;'),
              ('private const int MaximumCasualOutputTokens = 1_200;', 'private const int MaximumCasualOutputTokens = 8_000;'),
              ('private const int MinimumReadOnlyToolSeconds = 8;', 'private const int MinimumReadOnlyToolSeconds = 12;'),
              ('private const int MaximumReadOnlyToolSeconds = 20;', 'private const int MaximumReadOnlyToolSeconds = 45;'),
              ('private const int MinimumToolOutputCharacters = 20_000;', 'private const int MinimumToolOutputCharacters = 40_000;'),
              ('private const int MaximumToolOutputCharacters = 80_000;', 'private const int MaximumToolOutputCharacters = 120_000;'),
              ('private const int MinimumRetainedContextCharacters = 16_000;', 'private const int MinimumRetainedContextCharacters = 24_000;'),
              ('private const int MaximumRetainedContextCharacters = 64_000;', 'private const int MaximumRetainedContextCharacters = 96_000;'),
          ]
          for old, new in replacements:
              assert old in text, f'constant anchor changed: {old}'
              text = text.replace(old, new, 1)

          old = '''                configuration.GetValue<int?>(
                    "OpenAI:LegendFounderAiTimeoutSeconds") ??
                    120,
                45,
                240);'''
          new = '''                configuration.GetValue<int?>(
                    "OpenAI:LegendFounderAiTimeoutSeconds") ??
                    300,
                180,
                600);'''
          assert old in text, 'timeout configuration anchor changed'
          text = text.replace(old, new, 1)

          old = '''                configuration.GetValue<int?>(
                    "OpenAI:LegendFounderAiMaxOutputTokens") ??
                    8_000,
                1_500,
                16_000);'''
          new = '''                configuration.GetValue<int?>(
                    "OpenAI:LegendFounderAiMaxOutputTokens") ??
                    24_000,
                8_000,
                64_000);'''
          assert old in text, 'output-token configuration anchor changed'
          text = text.replace(old, new, 1)

          old = '''                foreach (var call in toolCalls)
                {
                    var toolDescription =
                        DescribeFounderToolCall(
                            call);

                    await ReportProgressAsync(
                        progress,
                        new LegendFounderAiProgressEvent(
                            "tool",
                            toolDescription,
                            round + 1,
                            call.Name),
                        effectiveToken);

                    var toolOutput =
                        await ExecuteFounderToolWithBudgetAsync(
                            founder,
                            call,
                            mode,
                            request.FounderCommandConfirmed,
                            ResolveReadOnlyToolBudget(remaining),
                            toolOutputBudget,
                            effectiveToken);

                    if (IsReadOnlyFounderTool(call.Name))
                    {
                        governedInspectionCompleted = true;
                    }

                    await ReportProgressAsync(
                        progress,
                        new LegendFounderAiProgressEvent(
                            "tool_complete",
                            $"Completed: {toolDescription}",
                            round + 1,
                            call.Name),
                        effectiveToken);

                    input.Add(new Dictionary<string, object?>
                    {
                        ["type"] = "function_call_output",
                        ["call_id"] = call.CallId,
                        ["output"] = toolOutput
                    });
                }'''
          new = '''                foreach (var call in toolCalls)
                {
                    var toolDescription =
                        DescribeFounderToolCall(
                            call);

                    await ReportProgressAsync(
                        progress,
                        new LegendFounderAiProgressEvent(
                            "tool",
                            toolDescription,
                            round + 1,
                            call.Name),
                        effectiveToken);

                    string toolOutput;
                    var toolSucceeded = false;
                    try
                    {
                        toolOutput =
                            await ExecuteFounderToolWithBudgetAsync(
                                founder,
                                call,
                                mode,
                                request.FounderCommandConfirmed,
                                ResolveReadOnlyToolBudget(remaining),
                                toolOutputBudget,
                                effectiveToken);
                        toolSucceeded = true;
                    }
                    catch (LegendFounderAiToolExecutionException exception)
                        when (IsReadOnlyFounderTool(call.Name))
                    {
                        // One unavailable read must never collapse a broad Founder
                        // diagnosis. Feed the exact safe failure classification back
                        // into the same provider conversation so OpenAI can continue
                        // independent governed reads and report the blocked authority.
                        toolOutput = SerializeUnbounded(new
                        {
                            error = exception.Reason,
                            tool = exception.Tool,
                            failureKind = exception.FailureKind,
                            detail = exception.Detail,
                            recoverable = true
                        });

                        _logger.LogWarning(
                            "LEGEND Founder AI read-only tool {Tool} returned a recoverable inspection failure. Reason={Reason} Detail={Detail}",
                            exception.Tool,
                            exception.Reason,
                            exception.Detail);
                    }

                    if (toolSucceeded && IsReadOnlyFounderTool(call.Name))
                    {
                        governedInspectionCompleted = true;
                    }

                    await ReportProgressAsync(
                        progress,
                        new LegendFounderAiProgressEvent(
                            toolSucceeded ? "tool_complete" : "tool_unavailable",
                            toolSucceeded
                                ? $"Completed: {toolDescription}"
                                : $"Unavailable: {toolDescription} Continuing independent governed inspection.",
                            round + 1,
                            call.Name),
                        effectiveToken);

                    input.Add(new Dictionary<string, object?>
                    {
                        ["type"] = "function_call_output",
                        ["call_id"] = call.CallId,
                        ["output"] = toolOutput
                    });
                }'''
          assert old in text, 'tool execution loop anchor changed'
          text = text.replace(old, new, 1)

          old = '''            throw new LegendFounderAiToolExecutionException(
                call.Name,
                "tool_read_failed",
                "governed_tool");'''
          new = '''            throw new LegendFounderAiToolExecutionException(
                call.Name,
                "tool_read_failed",
                "governed_tool",
                exception.GetType().Name);'''
          assert old in text, 'read failure classification anchor changed'
          text = text.replace(old, new, 1)

          old = '''        public LegendFounderAiToolExecutionException(
            string tool,
            string reason,
            string failureKind)
            : base($"Governed Founder tool '{tool}' could not complete.")
        {
            Tool = tool;
            Reason = reason;
            FailureKind = failureKind;
        }

        public string Tool { get; }

        public string Reason { get; }

        public string FailureKind { get; }'''
          new = '''        public LegendFounderAiToolExecutionException(
            string tool,
            string reason,
            string failureKind,
            string? detail = null)
            : base($"Governed Founder tool '{tool}' could not complete.")
        {
            Tool = tool;
            Reason = reason;
            FailureKind = failureKind;
            Detail = string.IsNullOrWhiteSpace(detail)
                ? "No additional safe diagnostic classification was available."
                : NormalizeFailureDetail(detail);
        }

        public string Tool { get; }

        public string Reason { get; }

        public string FailureKind { get; }

        public string Detail { get; }'''
          assert old in text, 'tool exception anchor changed'
          text = text.replace(old, new, 1)

          old = '''            "legend_system_overview" =>
                "Reading current governed LEGEND system metrics and readiness.",

            "legend_language_state" =>'''
          new = '''            "legend_system_overview" =>
                "Reading current governed LEGEND system metrics and readiness.",

            "legend_founder_dashboard" =>
                "Reading the current Founder-gated LEGEND dashboard shell, runtime policy, remediation state and intelligence evaluation.",

            "legend_section_page" =>
                $"Reading the existing Founder LEGEND section{subject} through its canonical section-page authority.",

            "legend_language_state" =>'''
          assert old in text, 'tool description switch anchor changed'
          text = text.replace(old, new, 1)

          old = '''                    "legend_search_retained_knowledge" =>
                        ReadRequiredString(
                            document.RootElement,
                            "query"),

                    "legend_submit_machine_learning_candidate" =>'''
          new = '''                    "legend_search_retained_knowledge" =>
                        ReadRequiredString(
                            document.RootElement,
                            "query"),

                    "legend_section_page" =>
                        ReadRequiredString(
                            document.RootElement,
                            "section"),

                    "legend_founder_dashboard" =>
                        ReadOptionalString(
                            document.RootElement,
                            "language"),

                    "legend_submit_machine_learning_candidate" =>'''
          assert old in text, 'tool argument description anchor changed'
          text = text.replace(old, new, 1)

          old = '''            "legend_system_overview" or
            "legend_operational_diagnostics" or'''
          new = '''            "legend_system_overview" or
            "legend_founder_dashboard" or
            "legend_section_page" or
            "legend_operational_diagnostics" or'''
          assert old in text, 'read-only tool list anchor changed'
          text = text.replace(old, new, 1)

          old = '''            case "legend_system_overview":
            {
                var snapshot =
                    await _legend.GetLiveMetricsAsync(
                        founder,
                        cancellationToken);

                return SerializeUnbounded(snapshot);
            }

            case "legend_operational_diagnostics":'''
          new = '''            case "legend_system_overview":
            {
                var snapshot =
                    await _legend.GetLiveMetricsAsync(
                        founder,
                        cancellationToken);

                return SerializeUnbounded(snapshot);
            }

            case "legend_founder_dashboard":
            {
                using var arguments = JsonDocument.Parse(call.Arguments);
                var language = ReadOptionalString(arguments.RootElement, "language");
                var pair = ReadOptionalString(arguments.RootElement, "pair");
                var search = ReadOptionalString(arguments.RootElement, "search");
                var snapshot = await _legend.GetDashboardAsync(
                    founder,
                    language,
                    pair,
                    cancellationToken,
                    search);
                return SerializeUnbounded(snapshot);
            }

            case "legend_section_page":
            {
                using var arguments = JsonDocument.Parse(call.Arguments);
                var section = ReadRequiredString(arguments.RootElement, "section");
                var language = ReadOptionalString(arguments.RootElement, "language");
                var search = ReadOptionalString(arguments.RootElement, "search");
                var cursor = ReadOptionalString(arguments.RootElement, "cursor");
                var curriculumFamilyRaw = ReadOptionalString(arguments.RootElement, "curriculum_family_id");

                if (string.IsNullOrWhiteSpace(section))
                    return """{"error":"section_required"}""";

                Guid? curriculumFamilyId = null;
                if (!string.IsNullOrWhiteSpace(curriculumFamilyRaw))
                {
                    if (!Guid.TryParse(curriculumFamilyRaw, out var parsedCurriculumFamilyId))
                        return """{"error":"invalid_curriculum_family_id"}""";
                    curriculumFamilyId = parsedCurriculumFamilyId;
                }

                var snapshot = await _legend.GetSectionPageAsync(
                    founder,
                    section,
                    language,
                    search,
                    cursor,
                    curriculumFamilyId,
                    cancellationToken);
                return SerializeUnbounded(snapshot);
            }

            case "legend_operational_diagnostics":'''
          assert old in text, 'tool execution switch anchor changed'
          text = text.replace(old, new, 1)

          old = '''            new
            {
                type = "function",
                name = "legend_operational_diagnostics",'''
          new = '''            new
            {
                type = "function",
                name = "legend_founder_dashboard",
                description =
                    "Read the existing Founder-gated LEGEND dashboard shell through FounderLegendConnectService, including the canonical section inventory, runtime policy, software-remediation status and current intelligence-evaluation projection. This is read-only and creates no duplicate data authority.",
                parameters = new
                {
                    type = "object",
                    properties = new
                    {
                        language = new { type = new[] { "string", "null" }, maxLength = 40 },
                        pair = new { type = new[] { "string", "null" }, maxLength = 100 },
                        search = new { type = new[] { "string", "null" }, maxLength = 500 }
                    },
                    required = new[] { "language", "pair", "search" },
                    additionalProperties = false
                },
                strict = true
            },
            new
            {
                type = "function",
                name = "legend_section_page",
                description =
                    "Read one existing Founder LEGEND Connect section page through the same canonical section-page authority used by the product UI. Use the dashboard shell to discover sections, then page/search them for curriculum, retained evidence, learning, evaluation, operational and other Founder-visible LEGEND data. This is read-only, preserves pagination, and creates no second query system.",
                parameters = new
                {
                    type = "object",
                    properties = new
                    {
                        section = new { type = "string", minLength = 1, maxLength = 80 },
                        language = new { type = new[] { "string", "null" }, maxLength = 40 },
                        search = new { type = new[] { "string", "null" }, maxLength = 500 },
                        cursor = new { type = new[] { "string", "null" }, maxLength = 500 },
                        curriculum_family_id = new { type = new[] { "string", "null" }, maxLength = 36 }
                    },
                    required = new[] { "section", "language", "search", "cursor", "curriculum_family_id" },
                    additionalProperties = false
                },
                strict = true
            },
            new
            {
                type = "function",
                name = "legend_operational_diagnostics",'''
          assert old in text, 'tool registry insertion anchor changed'
          text = text.replace(old, new, 1)

          old = '''- You can inspect LEGEND through read tools.
- Native OpenAI web search is available for current external research, verification, trusted linguistic references, standards, documentation and other information that is not already established by LEGEND.'''
          new = '''- You can inspect LEGEND through read tools.
- For broad Founder diagnostics, first discover the live capability registry and Founder dashboard, then use the existing section-page, retained-knowledge, language, metric, operational, evaluation, repository, validation and deployment reads as needed. Do not ask the Founder to export information that an exposed governed read can already retrieve.
- A failure of one read-only tool is evidence about that authority, not permission to abandon the entire inspection. Continue independent governed reads, preserve successful results, and identify the exact unavailable tool and safe failure classification in the final answer.
- Never say that no inspection tools are exposed until legend_capabilities itself proves that claim. The tool registry is the source of truth for what this session can inspect.
- Use legend_founder_dashboard and legend_section_page to inspect the same Founder-visible LEGEND Connect data projections used by the product rather than inventing a parallel database query path.
- Use legend_inspect_repository for bounded code/configuration inspection when architecture or orchestration facts depend on repository state; never infer those facts from generic AI architecture assumptions.
- Native OpenAI web search is available for current external research, verification, trusted linguistic references, standards, documentation and other information that is not already established by LEGEND.'''
          assert old in text, 'governance inspection guidance anchor changed'
          text = text.replace(old, new, 1)

          old = '''        var adaptiveTokens = MinimumCasualOutputTokens + latest / 4;'''
          new = '''        var adaptiveTokens = MinimumCasualOutputTokens + latest / 2;'''
          assert old in text, 'casual output adaptation anchor changed'
          text = text.replace(old, new, 1)

          service.write_text(text)

          tests = Path('AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs')
          test_text = tests.read_text()
          start_marker = '''    [Fact]\n    public async Task TeacherMode_GovernedToolReadFailureIsStructuredAndNeverBecomesHttp500()\n'''
          start = test_text.index(start_marker)
          next_fact = test_text.index('\n    [Fact]\n', start + len(start_marker))
          replacement = r'''    [Fact]
    public async Task TeacherMode_OneGovernedReadFailureDoesNotAbortIndependentInspection()
    {
        using var founderEnvironment = new FounderEnvironmentScope();
        await using var db = ControllerTestHelpers.BuildDb();
        var founder = await AddFounderProfileAsync(db);
        var operations = new Mock<ILegendConnectOperations>(MockBehavior.Strict);
        operations
            .Setup(operation => operation.SearchRetainedKnowledgeAsync(
                It.IsAny<string>(),
                It.IsAny<string?>(),
                It.IsAny<string?>(),
                It.IsAny<int>(),
                It.IsAny<CancellationToken>()))
            .ThrowsAsync(new InvalidOperationException("read transport failed"));

        var handler = new FounderAiScenarioHandler(
            ProviderTool("legend_search_retained_knowledge", "{\"query\":\"authority\"}"),
            ProviderTool("legend_capabilities", "{}"),
            ProviderText("The first governed read failed, but the independent capability inspection succeeded and the diagnosis continued."));
        var service = CreateService(db, operations.Object, handler);

        var response = await service.ReplyAsync(
            founder,
            Request("teacher", "Inspect the current LEGEND authority and continue independent reads if one source is unavailable."));

        Assert.True(response.Succeeded, Describe(response));
        Assert.Equal("OpenAITeacher", response.ResponseAuthority);
        Assert.Equal("provider_response", response.Stage);
        Assert.Equal(3, handler.RequestCount);
        operations.Verify(operation => operation.SearchRetainedKnowledgeAsync(
            "authority",
            null,
            null,
            It.IsAny<int>(),
            It.IsAny<CancellationToken>()), Times.Once);
        Assert.Equal(0, NativeInferenceCalls(operations));
    }
'''
          test_text = test_text[:start] + replacement + test_text[next_fact:]
          tests.write_text(test_text)

          contract = Path('AgentPortal.Tests/LegendFounderAiComprehensiveInspectionContractTests.cs')
          contract.write_text(r'''using Xunit;

namespace AgentPortal.Tests;

public sealed class LegendFounderAiComprehensiveInspectionContractTests
{
    [Fact]
    public void TeacherInspection_ReusesFounderAuthoritiesAndContinuesAfterIndependentReadFailure()
    {
        var root = FindRepositoryRoot();
        var source = File.ReadAllText(Path.Combine(root, "AgentPortal", "Services", "LegendFounderAiConversationService.cs"));

        Assert.Contains("name = \"legend_founder_dashboard\"", source, StringComparison.Ordinal);
        Assert.Contains("name = \"legend_section_page\"", source, StringComparison.Ordinal);
        Assert.Contains("await _legend.GetDashboardAsync(", source, StringComparison.Ordinal);
        Assert.Contains("await _legend.GetSectionPageAsync(", source, StringComparison.Ordinal);
        Assert.Contains("Continuing independent governed inspection", source, StringComparison.Ordinal);
        Assert.Contains("recoverable = true", source, StringComparison.Ordinal);
        Assert.Contains("toolSucceeded && IsReadOnlyFounderTool", source, StringComparison.Ordinal);
        Assert.DoesNotContain("throw new LegendFounderAiToolExecutionException(\n                    call.Name,\n                    \"tool_read_failed\",\n                    \"governed_tool\");", source, StringComparison.Ordinal);
    }

    [Fact]
    public void TeacherConversation_UsesExpandedButFiniteProviderEnvelope()
    {
        var root = FindRepositoryRoot();
        var source = File.ReadAllText(Path.Combine(root, "AgentPortal", "Services", "LegendFounderAiConversationService.cs"));

        Assert.Contains("MaximumProviderConversationCharacters = 320_000", source, StringComparison.Ordinal);
        Assert.Contains("MaximumCasualOutputTokens = 8_000", source, StringComparison.Ordinal);
        Assert.Contains("MaximumToolOutputCharacters = 120_000", source, StringComparison.Ordinal);
        Assert.Contains("24_000,\n                8_000,\n                64_000", source, StringComparison.Ordinal);
        Assert.Contains("300,\n                180,\n                600", source, StringComparison.Ordinal);
        Assert.Contains("truncation = \"auto\"", source, StringComparison.Ordinal);
    }

    private static string FindRepositoryRoot()
    {
        var directory = new DirectoryInfo(AppContext.BaseDirectory);
        while (directory is not null)
        {
            if (Directory.Exists(Path.Combine(directory.FullName, "AgentPortal")))
                return directory.FullName;
            directory = directory.Parent;
        }

        throw new DirectoryNotFoundException("Repository root was not found.");
    }
}
''')

          helper = Path('.github/workflows/apply-founder-teacher-comprehensive-inspection-fix.yml')
          helper.unlink()

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test ! -e .github/workflows/apply-founder-teacher-comprehensive-inspection-fix.yml
          grep -q 'legend_founder_dashboard' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'legend_section_page' AgentPortal/Services/LegendFounderAiConversationService.cs
          grep -q 'Continuing independent governed inspection' AgentPortal/Services/LegendFounderAiConversationService.cs

      - name: Commit bounded repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'legend-founder-remediation[bot]'
          git config user.email 'legend-founder-remediation[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Expand Founder Teacher governed inspection'
          git push origin HEAD:fix/founder-teacher-comprehensive-inspection-20260825

name: Parfait fast-track integration preflight (no deployment)

on:
  push:
    branches:
      - integration/parfait-fast-track-release-preflight-20261010
    paths:
      - CommerceCore/**
      - Infrastructure/Commerce/**
      - Infrastructure/WebsiteRuntime/**
      - Legend-Cloudflare/src/website-routing/**
      - Legend-Cloudflare/tests/website-routing/**
      - Protect-Website/**
      - Infrastructure/**
      - Legend-Cloudflare/**
      - ParfaitApp/**
      - AgentPortal.Tests/**
      - .github/workflows/parfait-fast-track-integration-validation.yml
      - .github/workflows/legend-fast-track-ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parfait-isolated-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate fast-track workflow syntax and commerce gate wiring
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/legend-fast-track-ui.yml")'
          python3 - <<'PYVALIDATE'
          from pathlib import Path
          source=Path('.github/workflows/legend-fast-track-ui.yml').read_text()
          required=(
            'commerce-gates:',
            'CommerceCore/',
            "COMMERCE_FAST_TRACK_NON_SCHEMA_VALIDATED: YES",
            'COMMERCE_PRODUCTION_FLAGS_OFF_AND_TARGET_AUTHORIZED:',
            "needs.select-targets.outputs.commerce == 'true'",
            "needs.commerce-gates.result == 'success'",
            "Unmapped fast-track source path",
            'LEGEND_FAST_TRACK_SELECTED=',
          )
          for token in required:
              if token not in source: raise SystemExit('Fast-track commerce contract absent: '+token)
          print('FAST_TRACK_COMMERCE_WORKFLOW_SYNTAX_AND_GATES: READY')
          PYVALIDATE
      - name: Read current production revision without changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREADBACK'
          import json,re,urllib.request,urllib.error
          for app in ('masterapp-protect','masterapp-parfait'):
              url='https://'+app+'.azurewebsites.net/api/runtime-provenance'
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      if response.status!=200: raise RuntimeError('status not 200')
                      body=json.loads(response.read(8192))
                  revision=body.get('sourceRevision')
                  if not isinstance(revision,str) or not re.fullmatch('[0-9a-f]{40}',revision):
                      raise RuntimeError('runtime revision identity not verified')
                  print('PREDEPLOY_LIVE_REVISION='+app+':'+revision)
              except (OSError,ValueError,KeyError,RuntimeError) as ex:
                  raise SystemExit('PREDEPLOY_LIVE_READBACK_UNAVAILABLE: '+app+':'+type(ex).__name__)
          PYREADBACK

      - name: Restore isolated commerce and Parfait projects
        run: |
          dotnet restore CommerceCore/LegendCommerce.csproj --nologo
          dotnet restore ParfaitApp/ParfaitApp.csproj --nologo
          dotnet restore Protect-Website/ProtectWebsite.csproj --nologo
      - name: Compile shared commerce and Parfait host
        run: |
          dotnet build CommerceCore/LegendCommerce.csproj -c Release --no-restore --nologo
          dotnet build ParfaitApp/ParfaitApp.csproj -c Release --no-restore --nologo
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --no-restore --nologo
      - name: Restore contract tests
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj --nologo
      - name: Run focused Parfait commerce and canonical parity tests
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo \
            --filter 'FullyQualifiedName~ParfaitCanonicalPresentationPreservationTests|FullyQualifiedName~ParfaitCanonicalCutoverSafetyTests|FullyQualifiedName~ScopedParfaitCommerceAuthorityTests|FullyQualifiedName~ParfaitCheckoutBillingCutoverTests|FullyQualifiedName~CentralizedWebsiteCommerceTests|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~AnalyticsCanonicalArchitectureTests|FullyQualifiedName~CommerceCoreOwnershipContractTests|FullyQualifiedName~CommerceCutoverInventoryTests|FullyQualifiedName~CommerceSharedHostPreviewGateTests|FullyQualifiedName~CommerceTenantBrandIsolationTests|FullyQualifiedName~CommerceLegacyTransferTests|FullyQualifiedName~ParfaitOriginalPublicPagesTests|FullyQualifiedName~CommerceAutomationDispatcherLeaseTests|FullyQualifiedName~CommercePreviewMediaTests|FullyQualifiedName~CommerceSharedHostCutoverTests|FullyQualifiedName~CommerceCutoverStartupProofTests'

      - name: Verify selective Cloudflare commerce routing without deployment
        run: node --test Legend-Cloudflare/tests/website-routing/*.test.mjs

      - name: Publish and inspect exact Parfait + Protect packages without deployment
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ParfaitApp/ParfaitApp.csproj -c Release --no-restore --nologo \
            -o "$RUNNER_TEMP/parfait-package"
          dotnet publish Protect-Website/ProtectWebsite.csproj -c Release --no-restore --nologo \
            -o "$RUNNER_TEMP/protect-package"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/store-assets/css/storefront.css"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/store-assets/js/storefront.js"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/store-assets/images/favicon/parfait-logo.png"
          test -s "$RUNNER_TEMP/protect-package/wwwroot/css/internal.css"
          cmp ParfaitApp/wwwroot/css/storefront.css \
            "$RUNNER_TEMP/protect-package/wwwroot/store-assets/css/storefront.css"
          cmp ParfaitApp/wwwroot/js/storefront.js \
            "$RUNNER_TEMP/protect-package/wwwroot/store-assets/js/storefront.js"
          cmp ParfaitApp/wwwroot/images/favicon/parfait-logo.png \
            "$RUNNER_TEMP/protect-package/wwwroot/store-assets/images/favicon/parfait-logo.png"
          cmp ParfaitApp/wwwroot/css/internal.css \
            "$RUNNER_TEMP/protect-package/wwwroot/css/internal.css"
          echo "PARFAIT_PUBLISHED_ASSETS_MATCH_SOURCE: YES"

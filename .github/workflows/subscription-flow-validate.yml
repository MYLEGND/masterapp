name: Validate subscription activation and updates

on:
  push:
    branches:
      - fix/mobile-web-native-parity-20260917
    paths:
      - 'AgentPortal.Tests/BillingCentralizationTests.cs'
      - 'AgentPortal.Tests/ClientAppSubscriptionActivationTests.cs'
      - 'AgentPortal.Tests/ClientBillingNotificationAndSchemaTests.cs'
      - 'AgentPortal.Tests/ClientSubscriptionAdministrationTests.cs'
      - 'AgentPortal/Controllers/ClientsController.cs'
      - 'AgentPortal/Models/CreateClientViewModel.cs'
      - 'AgentPortal/Models/ClientCreationFormDefinition.cs'
      - 'AgentPortal/Services/ClientBillingNotificationDeliveryService.cs'
      - 'AgentPortal/Services/ClientBillingNotificationDeliveryHostedService.cs'
      - 'AgentPortal/Views/Clients/Create.cshtml'
      - 'AgentPortal/Views/Shared/_QuickViewBillingSection.cshtml'
      - 'AgentPortal/wwwroot/js/billing/qv-billing-management.js'
      - 'ClientApp/Controllers/SubscriptionActivationController.cs'
      - 'ClientApp/Services/SubscriptionActivationService.cs'
      - 'Domain/Billing/**'
      - 'Infrastructure/Billing/**'
      - '.github/workflows/subscription-flow-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore focused projects
        run: |
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
          dotnet restore AgentPortal/AgentPortal.csproj
          dotnet restore ClientApp/ClientApp.csproj

      - name: Run focused subscription tests
        run: >
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj
          -c Release
          --no-restore
          --filter "FullyQualifiedName~ActivationStatus_RedeemedActiveSubscription_IsCompletedSuccess_NotFalseAlarm|FullyQualifiedName~ActivationIndex_RedeemedActiveSubscription_ResumesIdentityWithoutRebilling|FullyQualifiedName~ActivateAsync_FailedActivation_DoesNotCreateContinuation|FullyQualifiedName~ActivateAsync_BillingSucceedsButSigninSetupFails_ReturnsCompletedStateWithoutContinuationOrRebilling|FullyQualifiedName~ActivateAsync_SuccessCreatesContinuationAndUsesAuthoritativeInputs|FullyQualifiedName~UpdateClientSubscription_EnforcesScopedMinimum_AndFounderCanSetZero_WithoutRescheduling|FullyQualifiedName~OfferPricing_HighCustomAmount_IsAllowedWithinTechnicalRange|FullyQualifiedName~OfferPricing_ZeroCustomAmount_RequiresFounderAllowance|FullyQualifiedName~UpdateClientSubscription_ScopedOwner_CanUpdateAboveMinimum_AndQueuesClientNotice|FullyQualifiedName~UpdateClientSubscription_ScopedOwner_AmountChangePreservesFounderSpecificBillingDay|FullyQualifiedName~UpdateClientSubscription_ScopedOwner_BelowMinimum_IsRejectedWithoutMutation|FullyQualifiedName~SubscriptionTermsUpdate_DeliversBrandedLegendCard|FullyQualifiedName~NotificationQueue_IsIdempotentAndDeliveryMarksTheNoticeSent"
          --logger "console;verbosity=normal"

      - name: Build AgentPortal Release
        run: dotnet build AgentPortal/AgentPortal.csproj -c Release --no-restore --nologo

      - name: Build ClientApp Release
        run: dotnet build ClientApp/ClientApp.csproj -c Release --no-restore --nologo

      - name: Verify patch whitespace
        run: git diff --check HEAD^ HEAD

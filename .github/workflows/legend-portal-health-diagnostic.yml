name: LEGEND Portal live health diagnostic (read only)

# One-shot incident probe. No build, deployment, restart, rollback, appsetting
# changes, production mutations, or work against ClientApp.
on:
  push:
    branches: [Legend/fast-track-release]
    paths: [.github/workflows/legend-portal-health-diagnostic.yml]

permissions:
  contents: read
  id-token: write

jobs:
  portal-readback:
    if: github.ref == 'refs/heads/Legend/fast-track-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Sign in to existing read-only Azure observation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect Azure site state, deployment history, and direct runtime endpoints
        shell: bash
        env:
          EXPECTED_UI_SHA: dba66284ff23e973dc28aa2572da6224c601ee65
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess,time,urllib.error,urllib.request
          def azure(args,timeout=50):
              try:
                  result=subprocess.run(['az',*args,'--only-show-errors','-o','json'],
                      capture_output=True,text=True,timeout=timeout,check=False)
                  if result.returncode: return {'available':False,'failure':'AZURE_READ_DENIED_OR_FAILED'}
                  return {'available':True,'value':json.loads(result.stdout)}
              except (subprocess.TimeoutExpired,ValueError):
                  return {'available':False,'failure':'AZURE_READ_TIMEOUT_OR_INVALID'}
          def probe(url):
              try:
                  request=urllib.request.Request(url+'?incident='+os.environ['GITHUB_RUN_ID']+'-'+str(time.time_ns()),
                      headers={'Cache-Control':'no-cache','User-Agent':'LEGEND-portal-read-only-diagnostic'})
                  with urllib.request.urlopen(request,timeout=18) as response:
                      status=response.status
                      body=response.read(8192) if status==200 else b''
                      revision=None
                      if status==200 and url.endswith('/api/runtime-provenance'):
                          try:
                              candidate=json.loads(body).get('sourceRevision')
                              if isinstance(candidate,str) and re.fullmatch('[0-9a-f]{40}',candidate):
                                  revision=candidate
                          except (ValueError,AttributeError): pass
                      return {'status':status,'revision':revision,
                          'exact':revision==os.environ['EXPECTED_UI_SHA'] if revision else None}
              except urllib.error.HTTPError as exc:
                  return {'status':exc.code,'failure':'HTTP_NON_200'}
              except (OSError,ValueError):
                  return {'status':None,'failure':'NETWORK_TLS_DNS_OR_TIMEOUT'}
          app='masterapp-portal'
          meta=azure(['webapp','show','-g','masterapp-rg','-n',app,
              '--query','{state:state,defaultHostName:defaultHostName,httpsOnly:httpsOnly,availabilityState:availabilityState,enabled:enabled}'])
          print('PORTAL_APP_STATE='+json.dumps(meta,sort_keys=True),flush=True)
          history=azure(['webapp','log','deployment','list','-g','masterapp-rg','-n',app],timeout=55)
          if history['available']:
              rows=history['value']
              if isinstance(rows,list) and all(isinstance(x,dict) for x in rows):
                  history={'available':True,'count':len(rows),
                      'recent':[{'id':str(x.get('id',''))[:130],'status':x.get('status'),
                          'received_time':str(x.get('received_time') or x.get('receivedTime') or '')[:40]}
                          for x in rows[:6]],
                      'activeCount':sum(x.get('status') in (0,1,2) for x in rows)}
              else: history={'available':False,'failure':'INVALID_HISTORY'}
          print('PORTAL_DEPLOYMENT_HISTORY='+json.dumps(history,sort_keys=True),flush=True)
          # Azure exposes distinct GET-only views for OneDeploy and ARM deployment
          # resources. Existing 'az webapp log deployment list' can miss an
          # asynchronous OneDeploy operation, so inspect all three independently.
          subscription=azure(['account','show','--query','id'])
          sid=subscription.get('value')
          if subscription.get('available') and isinstance(sid,str) and re.fullmatch(
              r'[0-9a-fA-F-]{36}',sid):
              base_url=('https://management.azure.com/subscriptions/'+sid+
                  '/resourceGroups/masterapp-rg/providers/Microsoft.Web/sites/'+app)
              def summarize_deployment(item):
                  if not isinstance(item,dict): return {'valid':False}
                  props=item.get('properties') if isinstance(item.get('properties'),dict) else {}
                  return {'id':str(props.get('deploymentId') or item.get('name') or '')[:100],
                      'status':str(props.get('status') or item.get('status') or '')[:60],
                      'start':str(props.get('start_time') or props.get('startTime') or '')[:45],
                      'end':str(props.get('end_time') or props.get('endTime') or '')[:45],
                      'active':props.get('active'),
                      'successfulInstances':props.get('numberOfInstancesSuccessful'),
                      'failedInstances':props.get('numberOfInstancesFailed')}
              for label,suffix in [
                  ('PORTAL_ONEDEPLOY_GET','/extensions/onedeploy?api-version=2025-05-01'),
                  ('PORTAL_ARM_DEPLOYMENTS','/deployments?api-version=2025-05-01')]:
                  observed=azure(['rest','--method','get','--url',base_url+suffix],timeout=40)
                  if observed.get('available'):
                      value=observed['value']
                      if label=='PORTAL_ARM_DEPLOYMENTS':
                          rows=value.get('value') if isinstance(value,dict) else None
                          observed={'available':isinstance(rows,list),
                              'count':len(rows) if isinstance(rows,list) else None,
                              'latest':[summarize_deployment(x) for x in (rows or [])[:12]],
                              'hasNextPage':bool(value.get('nextLink')) if isinstance(value,dict) else None}
                      else:
                          observed={'available':True,'result':summarize_deployment(value),
                              'propertyKeys':sorted((value.get('properties') or {}).keys())
                                  if isinstance(value,dict) and isinstance(value.get('properties'),dict) else []}
                  print(label+'='+json.dumps(observed,sort_keys=True),flush=True)
              # Azure Activity Log is another independent, read-only operation
              # history. Do not print actor identities, payloads or credentials.
              activity=azure(['monitor','activity-log','list',
                  '--resource-id',base_url.removeprefix('https://management.azure.com'),
                  '--start-time','2026-10-12T23:45:00Z',
                  '--end-time','2026-10-13T00:41:00Z',
                  '--max-events','100'],timeout=50)
              if activity.get('available') and isinstance(activity.get('value'),list):
                  rows=activity['value']
                  activity={'available':True,'count':len(rows),
                      'events':[{'operation':str(((x.get('operationName') or {}).get('value') if isinstance(x.get('operationName'),dict) else x.get('operationName')) or '')[:100],
                          'status':str(((x.get('status') or {}).get('value') if isinstance(x.get('status'),dict) else x.get('status')) or '')[:50],
                          'time':str(x.get('eventTimestamp') or '')[:45]}
                          for x in rows if isinstance(x,dict)][:30]}
              print('PORTAL_AZURE_ACTIVITY='+json.dumps(activity,sort_keys=True),flush=True)
          else:
              print('PORTAL_ONEDEPLOY_GET={"available":false,"failure":"SUBSCRIPTION_UNAVAILABLE"}',flush=True)
          hosts=[
              'https://portal.mylegnd.com',
              'https://masterapp-portal.azurewebsites.net',
              'https://client.mylegnd.com'
          ]
          for host in hosts:
              for path in ['/api/runtime-provenance','/']:
                  print('HTTP_READBACK='+json.dumps({'host':host,'path':path,
                      'observation':probe(host+path)},sort_keys=True),flush=True)
          # No provider mutation, no Azure writes, and no inference requests.
          PY

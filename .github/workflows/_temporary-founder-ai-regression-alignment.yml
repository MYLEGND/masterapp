name: Temporary Founder AI regression alignment

on:
  push:
    branches:
      - fix/founder-ai-required-inspection-mobile-reading

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact bounded replacements
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('AgentPortal/Services/LegendFounderAiConversationService.cs')
          isolation_path = Path('AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs')
          service = service_path.read_text()
          old = '            "deployment", "repository", "github", "pull request",\n            "branch", "commit", "workflow", "ci", "coverage"\n'
          new = '            "deployment", "repository", "github", "pull request",\n            "branch", "commit", "workflow", "ci", "coverage",\n            "governed inspection", "current authority"\n'
          if service.count(old) != 1:
              raise SystemExit(f'Expected one governed-signal anchor, found {service.count(old)}')
          service_path.write_text(service.replace(old, new, 1))

          isolation = isolation_path.read_text()
          old = '        var handler = new FounderAiScenarioHandler(\n            TimeSpan.FromSeconds(31),\n            ProviderText("The OpenAI Teacher completed the permitted escalation after LEGEND’s governed first refusal."));\n'
          new = '        var handler = new FounderAiScenarioHandler(\n            TimeSpan.FromSeconds(16),\n            ProviderTool("legend_search_retained_knowledge", "{\\\"query\\\":\\\"governed gap\\\"}"),\n            ProviderText("The OpenAI Teacher completed the permitted escalation after LEGEND’s governed first refusal."));\n'
          if isolation.count(old) != 1:
              raise SystemExit(f'Expected one Legend progress handler anchor, found {isolation.count(old)}')
          isolation = isolation.replace(old, new, 1)

          old = '        Assert.Equal(1, handler.RequestCount);\n        Assert.Equal(1, NativeInferenceCalls(operations));\n    }\n\n    [Fact]\n    public async Task TeacherMode_GovernedReadToolMayExecuteWithoutChangingResponderIdentity()\n'
          new = '        Assert.Equal(2, handler.RequestCount);\n        Assert.Equal(1, NativeInferenceCalls(operations));\n    }\n\n    [Fact]\n    public async Task TeacherMode_GovernedReadToolMayExecuteWithoutChangingResponderIdentity()\n'
          if isolation.count(old) != 1:
              raise SystemExit(f'Expected one Legend progress request-count anchor, found {isolation.count(old)}')
          isolation = isolation.replace(old, new, 1)

          old = '        var handler = new FounderAiScenarioHandler(\n            ProviderText("The OpenAI Teacher is handling this governed escalation."));\n'
          new = '        var handler = new FounderAiScenarioHandler(\n            ProviderTool("legend_search_retained_knowledge", "{\\\"query\\\":\\\"Explain the gap.\\\"}"),\n            ProviderText("The OpenAI Teacher is handling this governed escalation."));\n'
          if isolation.count(old) != 1:
              raise SystemExit(f'Expected one escalation handler anchor, found {isolation.count(old)}')
          isolation = isolation.replace(old, new, 1)

          old = '        Assert.Equal("provider_response", response.Stage);\n        Assert.Equal(1, NativeInferenceCalls(operations));\n        Assert.Equal(1, handler.RequestCount);\n    }\n\n    private static LegendFounderAiConversationService CreateService(\n'
          new = '        Assert.Equal("provider_response", response.Stage);\n        Assert.Equal(1, NativeInferenceCalls(operations));\n        Assert.Equal(2, handler.RequestCount);\n    }\n\n    private static LegendFounderAiConversationService CreateService(\n'
          if isolation.count(old) != 1:
              raise SystemExit(f'Expected one escalation request-count anchor, found {isolation.count(old)}')
          isolation_path.write_text(isolation.replace(old, new, 1))
          Path('.github/workflows/_temporary-founder-ai-regression-alignment.yml').unlink()

      - name: Verify bounded diff
        run: |
          git diff --check
          git diff --stat
          git diff -- AgentPortal/Services/LegendFounderAiConversationService.cs AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Targeted regression
        run: |
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Debug --filter "FullyQualifiedName~LegendFounderAiModeIsolationTests|FullyQualifiedName~LegendFounderAiInspectionRegressionTests|FullyQualifiedName~LegendFounderAiConversationRoutingTests"

      - name: Commit surgical alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPortal/Services/LegendFounderAiConversationService.cs AgentPortal.Tests/LegendFounderAiModeIsolationTests.cs .github/workflows/_temporary-founder-ai-regression-alignment.yml
          git commit -m "Align Founder AI regressions with required inspection"
          git push origin HEAD:fix/founder-ai-required-inspection-mobile-reading

name: Direct deploy validated subscription repair

on:
  push:
    branches:
      - deploy/subscription-activation-20260917
    paths:
      - '.github/workflows/subscription-direct-deploy-20260917.yml'

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.x'
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_CLIENT_WEBAPP_NAME: masterapp-client
  RELEASE_SHA: fa2563642064378bf7b4bde6b30bec470da70297

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Checkout exact release tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish AgentPortal and ClientApp
        run: |
          set -euo pipefail
          dotnet publish AgentPortal/AgentPortal.csproj -c Release -o /tmp/agentportal
          dotnet publish ClientApp/ClientApp.csproj -c Release -o /tmp/clientapp
          printf '{"ReleaseSha":"%s","Source":"direct-validated-subscription-repair"}\n' "$RELEASE_SHA" > /tmp/agentportal/_deployment-provenance.json
          cp /tmp/agentportal/_deployment-provenance.json /tmp/clientapp/_deployment-provenance.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy AgentPortal
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: /tmp/agentportal

      - name: Deploy ClientApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_CLIENT_WEBAPP_NAME }}
          slot-name: Production
          package: /tmp/clientapp

name: Validate and deploy LEGEND Website to Azure

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Legend-Website/**'
      - 'Legend-Design/legend-design.tokens.json'
      - 'Legend-ios/Legend/Resources/Assets.xcassets/LegendLogo.imageset/legend-logo.png'
      - '.github/workflows/legend-website-production-deploy.yml'
  push:
    branches:
      - production
    paths:
      - 'Legend-Website/**'
      - 'Legend-Design/legend-design.tokens.json'
      - 'Legend-ios/Legend/Resources/Assets.xcassets/LegendLogo.imageset/legend-logo.png'
      - '.github/workflows/legend-website-production-deploy.yml'

concurrency:
  group: agentportal-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: masterapp-rg
  AZURE_APP_SERVICE_PLAN: MASTERAPP-PLAN
  AZURE_WEBAPP_NAME: masterapp-website

jobs:
  # The rigorous workflow owns the protected security check for every PR.
  # Keep the website gate distinct so it cannot satisfy that check by name.
  website-security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'legend/approved-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true

      - name: Reuse exact validated website artifact when available
        id: reusewebsite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="legend-public-website-${GITHUB_SHA}"
          run_id=""
          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100")"
          while read -r candidate_run; do
            [ -n "$candidate_run" ] || continue
            run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run")"
            if [ "$(printf '%s' "$run" | jq -r '.path // ""')" = ".github/workflows/legend-website-production-deploy.yml" ] &&
               [ "$(printf '%s' "$run" | jq -r '.head_sha // ""')" = "$GITHUB_SHA" ]; then
              run_id="$candidate_run"
              break
            fi
          done < <(printf '%s' "$artifacts" | jq -r '.artifacts[] | select(.expired == false) | .workflow_run.id' | awk '!seen[$0]++')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact_name" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "REUSE_WEBSITE_VALIDATION=true" >> "$GITHUB_ENV"
            echo "Exact website validation preserved from run $run_id."
          else
            echo "REUSE_WEBSITE_VALIDATION=false" >> "$GITHUB_ENV"
          fi

      - name: Load exact validated website artifact
        if: steps.reusewebsite.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.reusewebsite.outputs.artifact }}
          path: Legend-Website/dist
          run-id: ${{ steps.reusewebsite.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Setup Node
        if: env.REUSE_WEBSITE_VALIDATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build public site from canonical LEGEND design authority
        working-directory: Legend-Website
        run: |
          if [ "$REUSE_WEBSITE_VALIDATION" = true ]; then
            echo "Preserved exact website build validation."
            exit 0
          fi
          npm run build
          cp public/web.config dist/web.config
          npm run check

      - name: Verify migration route boundary
        shell: bash
        run: |
          if [ "$REUSE_WEBSITE_VALIDATION" = true ]; then
            echo "Preserved exact website route-boundary validation."
            exit 0
          fi
          set -euo pipefail
          test -f Legend-Website/dist/index.html
          test -f Legend-Website/dist/about/index.html
          test -f Legend-Website/dist/contact/index.html
          test -f Legend-Website/dist/logo/index.html
          test -f Legend-Website/dist/privacy-terms/index.html
          test -f Legend-Website/dist/web.config
          test ! -e Legend-Website/dist/store
          test ! -e Legend-Website/dist/team
          grep -q 'brand-banner' Legend-Website/dist/index.html
          grep -q 'site-header' Legend-Website/dist/index.html
          grep -q 'site-footer' Legend-Website/dist/index.html
          grep -q 'assets/legend-logo.png' Legend-Website/dist/index.html
          if grep -R 'href="/store"\|href="/team"' Legend-Website/dist --include='*.html'; then
            echo '::error::Excluded Squarespace routes leaked into the new public site.'
            exit 1
          fi
          git diff --check

      - name: Preserve exact validated website artifact
        uses: actions/upload-artifact@v4
        with:
          name: legend-public-website-${{ github.sha }}
          path: Legend-Website/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  deploy:
    if: github.event_name == 'push'
    needs: website-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    steps:
      - name: Checkout immutable production tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true

      - name: Download exact validated production website
        uses: actions/download-artifact@v4
        with:
          name: legend-public-website-${{ github.sha }}
          path: Legend-Website/dist

      - name: Verify current approved release authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin legend/approved-changes
          git show FETCH_HEAD:scripts/release_policy.py > "$RUNNER_TEMP/website-release-policy.py"
          python3 "$RUNNER_TEMP/website-release-policy.py" --sha FETCH_HEAD --require-release

      - name: Login to existing Azure configuration authority
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure dedicated website App Service exists on existing plan
        shell: bash
        run: |
          set -euo pipefail
          if ! az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az webapp create \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --plan "$AZURE_APP_SERVICE_PLAN" \
              --output none
          fi
          az webapp update \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --https-only true \
            --output none

      - name: Deploy exact production artifact
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: Legend-Website/dist

      - name: Verify Azure endpoint and preserved routes
        shell: bash
        run: |
          set -euo pipefail
          host="${AZURE_WEBAPP_NAME}.azurewebsites.net"
          for route in / /about/ /contact/ /logo/ /privacy-terms/; do
            body="$(mktemp)"
            code="$(curl --retry 5 --retry-delay 4 --retry-all-errors -sS -L -o "$body" -w '%{http_code}' "https://$host$route")"
            test "$code" = '200'
            grep -q 'LEGEND®' "$body"
            rm -f "$body"
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$host/store/")" = '404'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$host/team/")" = '404'
          echo "LEGEND website deployed and verified at https://$host" >> "$GITHUB_STEP_SUMMARY"

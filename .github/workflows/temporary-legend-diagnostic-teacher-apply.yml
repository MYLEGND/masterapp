name: Temporary LEGEND diagnostic teacher apply

on:
  push:
    branches:
      - fix/legend-openai-diagnostic-teacher-retention-20260824

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('AgentPortal/Services/LegendFounderAiConversationService.cs')
          tests_path = Path('AgentPortal.Tests/LegendFounderAiConversationRoutingTests.cs')
          service = service_path.read_text()
          tests = tests_path.read_text()

          def once(text, old, new, name):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          service = once(service,
          '''        var requiresGovernedInspection =
            RequiresGovernedInspection(conversation, mode);
''',
          '''        // A native failure that explicitly permits escalation is itself a
        // governed diagnostic event. Even a linguistically casual utterance must
        // enter the existing retained-knowledge / machine-teaching tool path so
        // the external teacher can help LEGEND close the gap instead of merely
        // answering the turn and forgetting why native inference failed.
        var requiresGovernedInspection =
            RequiresProviderGovernedInspection(
                conversation,
                mode,
                nativeInference,
                nativeFailureDetail);
''', 'native gap routing')

          service = once(service,
          '''        var instructions =
            requiresGovernedInspection
                ? BuildInstructions(mode) +
                  (retainedKnowledge is null
                      ? string.Empty
                      : BuildRetainedKnowledgeContext(
                          retainedKnowledge,
                          ResolveRetainedContextBudget(conversation)))
                : BuildCasualInstructions();
''',
          '''        var nativeDiagnosticContext =
            BuildNativeDiagnosticTeachingContext(
                nativeInference,
                nativeFailureDetail);

        var instructions =
            requiresGovernedInspection
                ? BuildInstructions(mode) +
                  nativeDiagnosticContext +
                  (retainedKnowledge is null
                      ? string.Empty
                      : BuildRetainedKnowledgeContext(
                          retainedKnowledge,
                          ResolveRetainedContextBudget(conversation)))
                : BuildCasualInstructions();
''', 'diagnostic context wiring')

          sentence = '- When this conversation reveals a reusable linguistic distinction that is not already established, you may retain one bounded MachineProposed family through legend_submit_machine_learning_candidate. That is how conversational learning survives this chat without creating a second memory system.\n'
          service = once(service, sentence, sentence +
          '- When LEGEND_NATIVE_GAP_CONTEXT is supplied, treat the native failure as a diagnostic teaching task, not merely a request for an OpenAI fallback answer. Inspect retained LEGEND evidence first. If the existing Founder curriculum/evidence supports a coherent reusable linguistic distinction that would close the native gap, you MUST submit exactly one bounded family through legend_submit_machine_learning_candidate before finalizing the answer. If the evidence is insufficient, contradictory, or cannot support controlled contrasts, do not invent teaching; explain the missing governed evidence instead.\n'
          '- Never submit the one-off generated answer itself as curriculum. Retain reusable meaning/components/contrasts that explain why the utterance failed and how the governed semantic family generalizes.\n', 'teacher governance')

          helper = '''    private static string BuildNativeDiagnosticTeachingContext(
        LegendConnectNativeInferenceSnapshot? nativeInference,
        string? nativeFailureDetail)
    {
        if (nativeInference is not { Supported: false, RequiresEscalation: true } &&
            string.IsNullOrWhiteSpace(nativeFailureDetail))
        {
            return string.Empty;
        }

        var reasonCode = string.IsNullOrWhiteSpace(nativeInference?.ReasonCode)
            ? "native_inference_unavailable"
            : nativeInference.ReasonCode.Trim();
        var authorityDetail = !string.IsNullOrWhiteSpace(nativeInference?.AuthoritySummary)
            ? NormalizeFailureDetail(nativeInference.AuthoritySummary)
            : "The native authority returned no additional governed summary.";
        var failureDetail = string.IsNullOrWhiteSpace(nativeFailureDetail)
            ? "No native execution exception was recorded."
            : NormalizeFailureDetail(nativeFailureDetail);
        var evidenceCount = nativeInference?.EvidenceCount ?? 0;

        return $"""

LEGEND_NATIVE_GAP_CONTEXT:
NativeReasonCode={reasonCode}
NativeAuthorityDetail={authorityDetail}
NativeEvidenceCount={evidenceCount}
NativeExecutionDetail={failureDetail}

DIAGNOSTIC TEACHER REQUIREMENTS:
- This turn reached OpenAI because native LEGEND could not produce one governed answer and explicitly permitted escalation.
- Diagnose the linguistic/semantic gap against retained LEGEND evidence before treating OpenAI recall as authoritative.
- Use legend_search_retained_knowledge when a narrower retained-evidence query can distinguish an unknown component, ambiguous composition, missing transition, contradiction, realization gap, or production-eligibility gap.
- If governed evidence supports a reusable controlled semantic family that would reduce recurrence of this native failure, submit exactly one bounded MachineProposed family with legend_submit_machine_learning_candidate before the final response.
- The proposal must capture reusable meaning, semantic components and controlled contrasts; do not store the generated reply, personal facts, transient state, or unsupported speculation.
- If governed evidence cannot support a valid proposal, do not fabricate one. State precisely which evidence or curriculum contrast is missing.
- MachineProposed retention is not canonical approval. The existing independent critic, canonical validator, curriculum admission, dataset compiler, evaluator and promotion authorities remain the only path to native reuse.
""";
    }

'''
          service = once(service,
              '    private static string BuildCasualInstructions() =>\n',
              helper + '    private static string BuildCasualInstructions() =>\n',
              'diagnostic helper')

          route_helper = '''    private static bool RequiresProviderGovernedInspection(
        IReadOnlyList<LegendFounderAiChatMessage> conversation,
        string mode,
        LegendConnectNativeInferenceSnapshot? nativeInference,
        string? nativeFailureDetail) =>
        RequiresGovernedInspection(conversation, mode) ||
        nativeInference is { Supported: false, RequiresEscalation: true } ||
        !string.IsNullOrWhiteSpace(nativeFailureDetail);

'''
          service = once(service,
              '    private static string ResolveReasoningEffortForRound(\n',
              route_helper + '    private static string ResolveReasoningEffortForRound(\n',
              'governed inspection helper')

          test_marker = '''    [Fact]
    public void NativeFailureResponse_ExposesGovernedReasonAndProviderFailureDetail()
'''
          new_tests = '''    [Fact]
    public void CasualNativeEscalation_EntersGovernedDiagnosticTeacherPath()
    {
        var method = typeof(LegendFounderAiConversationService)
            .GetMethod("RequiresProviderGovernedInspection", BindingFlags.NonPublic | BindingFlags.Static);
        Assert.NotNull(method);
        IReadOnlyList<LegendFounderAiChatMessage> conversation = [new("user", "Hi")];
        var snapshot = new LegendConnectNativeInferenceSnapshot(
            false, 0m, null, "ambiguous_composed_meaning", 0,
            "No unique governed semantic transition could be selected.", true);

        Assert.True(Assert.IsType<bool>(method!.Invoke(
            null, new object?[] { conversation, "legend", snapshot, null })));
    }

    [Fact]
    public void CasualNativeSuccess_PreservesFastNonInspectionRoute()
    {
        var method = typeof(LegendFounderAiConversationService)
            .GetMethod("RequiresProviderGovernedInspection", BindingFlags.NonPublic | BindingFlags.Static);
        Assert.NotNull(method);
        IReadOnlyList<LegendFounderAiChatMessage> conversation = [new("user", "How are you?")];
        var snapshot = new LegendConnectNativeInferenceSnapshot(
            true, 1m, "I'm doing great, thanks.", "supported", 4,
            "Governed native response selected.", false);

        Assert.False(Assert.IsType<bool>(method!.Invoke(
            null, new object?[] { conversation, "legend", snapshot, null })));
    }

    [Fact]
    public void NativeGapContext_RequiresEvidenceFirstMachineRetentionWithoutSelfPromotion()
    {
        var method = typeof(LegendFounderAiConversationService)
            .GetMethod("BuildNativeDiagnosticTeachingContext", BindingFlags.NonPublic | BindingFlags.Static);
        Assert.NotNull(method);
        var snapshot = new LegendConnectNativeInferenceSnapshot(
            false, 0m, null, "meaning_graph_component_unknown", 0,
            "A required meaning component was unknown.", true);

        var context = Assert.IsType<string>(method!.Invoke(null, new object?[] { snapshot, null }));
        Assert.Contains("LEGEND_NATIVE_GAP_CONTEXT", context);
        Assert.Contains("meaning_graph_component_unknown", context);
        Assert.Contains("legend_search_retained_knowledge", context);
        Assert.Contains("legend_submit_machine_learning_candidate", context);
        Assert.Contains("MachineProposed", context);
        Assert.Contains("independent critic", context);
        Assert.Contains("do not fabricate", context, StringComparison.OrdinalIgnoreCase);
    }

'''
          tests = once(tests, test_marker, new_tests + test_marker, 'routing tests')

          service_path.write_text(service)
          tests_path.write_text(tests)
          Path('.github/legend-diagnostic-teacher-validation.trigger').write_text(
              'Delete this file with the GitHub connector after the source patch lands to trigger final Security CI.\n')
          PY

          git diff --check

      - name: Commit source repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-legend-diagnostic-teacher-apply.yml
          git add AgentPortal/Services/LegendFounderAiConversationService.cs AgentPortal.Tests/LegendFounderAiConversationRoutingTests.cs .github/legend-diagnostic-teacher-validation.trigger
          git diff --cached --check
          git commit -m 'Teach LEGEND from governed native conversation gaps'
          git push origin HEAD:fix/legend-openai-diagnostic-teacher-retention-20260824

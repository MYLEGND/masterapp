name: LEGEND Fast Track — Affected Web Apps

# One exact affected-app fast track. UI-only updates retain their original
# lane. Commerce/backend updates must pass focused admission, require an
# unchanged live configuration, and never execute database migrations,
# Cloudflare routing changes, or customer-data transfer as part of publication.
on:
  push:
    branches:
      - Legend/fast-track-release
    paths:
      - .github/workflows/legend-fast-track-ui.yml
      - SHARED/Branding/**
      - SHARED/Shared.csproj
      - SHARED/Views/**
      - scripts/test-public-brand-canonical.mjs
      - AgentPortal/Views/**
      - AgentPortal/wwwroot/**
      - ClientApp/Views/**
      - ClientApp/wwwroot/**
      - SHARED/wwwroot/**
      - AgentPortal/Views/Finance/Index.cshtml
      - ClientApp/Views/Finance/Index.cshtml
      - tests/layout/finance-startup-canonical.test.mjs
      - Legend-Design/**
      - Legend-Website/scripts/**
      - Protect-Website/Views/Shared/_Layout.cshtml
      - Protect-Website/ProtectWebsite.csproj
      - ParfaitApp/Views/Shared/_InternalLayout.cshtml
      - ParfaitApp/Program.cs
      - ParfaitApp/Services/**
      - ParfaitApp/Controllers/**
      - ParfaitApp/Models/**
      - ParfaitApp/Views/**
      - CommerceCore/**
      - Infrastructure/Commerce/**
      - Infrastructure/WebsiteRuntime/**
      - Domain/Entities/CommerceProduct.cs
      - Legend-Cloudflare/src/website-routing/**
      - Legend-Cloudflare/tests/website-routing/**
      - Protect-Website/Program.cs
      - Protect-Website/Views/**
      - Infrastructure/WebsiteEditing/WebsiteFaviconParity.cs
      - Infrastructure/WebsiteEditing/WebsitePlatformController.cs
      - Infrastructure/WebsiteRuntime/BusinessWebsiteMiddleware.cs
      - SHARED/WebsitePlatform/legend-public-cms.js
      - tests/website/public-first-paint.test.mjs
      - tests/website/legend-public-cms.test.mjs

permissions:
  contents: read
  id-token: write

# Share the publication mutex with the existing release workflow.
# Only protects against simultaneous production uploads, not branch editing.
concurrency:
  group: legend-approved-release
  cancel-in-progress: false

jobs:
  select-targets:
    name: Select exact affected applications
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      selected: ${{ steps.scope.outputs.selected }}
      commerce: ${{ steps.scope.outputs.commerce }}
    steps:
      - name: Check out exact fast-track source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive application impact exclusively from changed paths
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          catalog={
              'AgentPortal': {'target':'AgentPortal','project':'AgentPortal/AgentPortal.csproj','azure_app':'masterapp-portal','host':'portal.mylegnd.com'},
              'ClientApp': {'target':'ClientApp','project':'ClientApp/ClientApp.csproj','azure_app':'masterapp-client','host':'client.mylegnd.com'},
              'Protect': {'target':'Protect','project':'Protect-Website/ProtectWebsite.csproj','azure_app':'masterapp-protect','host':'masterapp-protect.azurewebsites.net'},
              'Parfait': {'target':'Parfait','project':'ParfaitApp/ParfaitApp.csproj','azure_app':'masterapp-parfait','host':'masterapp-parfait.azurewebsites.net'},
              'Website': {'target':'Website','project':'static','azure_app':'masterapp-website','host':'masterapp-website.azurewebsites.net'}
          }
          def impacts(path):
              if path.startswith('CommerceCore/'): return {'Parfait','Protect'}
              if path.startswith('Infrastructure/Commerce/'): return {'Parfait','Protect'}
              if path.startswith('Infrastructure/WebsiteRuntime/'): return {'Protect'}
              if path == 'Domain/Entities/CommerceProduct.cs': return {'Parfait','Protect'}
              if path.startswith('Legend-Cloudflare/src/website-routing/') or path.startswith('Legend-Cloudflare/tests/website-routing/'): return set()
              if path.startswith('AgentPortal.Tests/') or path.startswith('docs/'): return set()
              if path in ('MASTERAPP.sln','MasterApp.slnx'): return set()
              if path.startswith('AgentPortal/'): return {'AgentPortal'}
              if path.startswith('ClientApp/'): return {'ClientApp'}
              if path.startswith('Protect-Website/'): return {'Protect'}
              if path.startswith('ParfaitApp/'): return {'Parfait'}
              if path.startswith('Legend-Website/'):
                  # The Protect business-website compiler consumes this shared source.
                  return {'Website'} if path=='Legend-Website/scripts/check.mjs' else {'Website','Protect'}
              if path.startswith('SHARED/wwwroot/js/finance-') or path in (
                  'SHARED/wwwroot/js/legend-living-balance-sheet.js',
                  'SHARED/wwwroot/js/expense-lens-projection.js',
                  'SHARED/wwwroot/css/legend-finance-shared.css',
              ): return {'AgentPortal','ClientApp'}
              if path.startswith('SHARED/wwwroot/'): return {'AgentPortal','ClientApp','Protect','Parfait','Website'}
              if path.startswith('SHARED/WebsitePlatform/'): return {'Website','Protect'}
              if path.startswith('SHARED/Views/'): return {'AgentPortal','ClientApp','Protect'}
              if path.startswith('SHARED/Branding/'): return {'AgentPortal','ClientApp','Protect','Website'}
              if path=='SHARED/Shared.csproj': return {'AgentPortal','ClientApp','Protect'}
              if path=='Legend-Design/legend-public-inquiry.js': return {'Website','Protect'}
              if path.startswith('Legend-Design/'): return set(catalog)
              if path=='Infrastructure/WebsiteEditing/WebsiteFaviconParity.cs': return {'AgentPortal','ClientApp','Protect'}
              if path=='Infrastructure/WebsiteEditing/WebsitePlatformController.cs': return {'Protect'}
              if path=='Infrastructure/WebsiteRuntime/BusinessWebsiteMiddleware.cs': return {'Protect'}
              # Workflow changes and test-only changes never trigger an app upload.
              if path.startswith('.github/workflows/') or path.startswith('tests/') or path=='scripts/test-public-brand-canonical.mjs': return set()
              raise SystemExit('Unmapped fast-track source path: '+path)
          assert impacts('SHARED/wwwroot/js/finance-tools.js')=={'AgentPortal','ClientApp'}
          assert impacts('Legend-Website/scripts/check.mjs')=={'Website'}
          assert impacts('Legend-Design/legend-public-inquiry.js')=={'Website','Protect'}
          assert impacts('SHARED/Branding/legend-brand.json')=={'AgentPortal','ClientApp','Protect','Website'}
          assert impacts('SHARED/Shared.csproj')=={'AgentPortal','ClientApp','Protect'}
          assert impacts('Protect-Website/Views/Shared/_Layout.cshtml')=={'Protect'}
          assert impacts('Infrastructure/WebsiteEditing/WebsitePlatformController.cs')=={'Protect'}
          assert impacts('.github/workflows/legend-fast-track-ui.yml')==set()
          before=os.environ['BEFORE']
          head=os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}',head): raise SystemExit('Invalid exact fast-track commit')
          if before=='0'*40:
              changed=subprocess.check_output(['git','diff-tree','--root','--no-commit-id','--name-only','-r',head],text=True).splitlines()
          elif re.fullmatch('[0-9a-f]{40}',before):
              changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
          else:
              raise SystemExit('Invalid fast-track event baseline')
          impacted=set()
          for path in changed: impacted.update(impacts(path))
          backend=any(
              path.startswith(('CommerceCore/','Infrastructure/Commerce/','Infrastructure/WebsiteRuntime/',
                  'Legend-Cloudflare/src/website-routing/','Legend-Cloudflare/tests/website-routing/')) or
              path in ('Domain/Entities/CommerceProduct.cs','ParfaitApp/Program.cs','Protect-Website/Program.cs')
              for path in changed)
          if backend and any(x not in {'Parfait','Protect'} for x in impacted):
              raise SystemExit('Mixed fast-track backend release would affect unrelated applications; split release')
          selected=[catalog[name] for name in catalog if name in impacted]
          output=json.dumps({'include':selected},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('selected='+str(bool(selected)).lower()+'\n')
              stream.write('matrix='+output+'\n')
              stream.write('commerce='+str(backend).lower()+'\n')
          print('LEGEND_FAST_TRACK_CHANGED_FILES='+json.dumps(changed))
          print('LEGEND_FAST_TRACK_SELECTED='+json.dumps([x['target'] for x in selected]))
          PY

  commerce-gates:
    name: Commerce / backend focused admission (no production mutation)
    needs: select-targets
    if: ${{ needs.select-targets.outputs.commerce == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify exact candidate identity and no EF migration mutation
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PYFAST'
          import os,re,subprocess
          before=os.environ['BEFORE'];head=os.environ['GITHUB_SHA']
          if not re.fullmatch('[a-f0-9]{40}',before) or not re.fullmatch('[a-f0-9]{40}',head):
              raise SystemExit('Exact candidate identity missing')
          changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
          banned=[path for path in changed if path.startswith('Infrastructure/Migrations/')
              or path=='Infrastructure/Data/MasterAppDbContext.cs'
              or path.startswith('scripts/release-lifecycle')]
          if banned: raise SystemExit('Commerce fast-track SQL/release mutation path prohibited: '+str(banned))
          if not any(x.startswith('CommerceCore/') for x in changed):
              raise SystemExit('Commerce lane missing shared engine diff')
          print('COMMERCE_FAST_TRACK_NON_SCHEMA_VALIDATED: YES')
          PYFAST
      - name: Build exact affected commerce applications
        run: |
          set -euo pipefail
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj --nologo
          dotnet build ParfaitApp/ParfaitApp.csproj -c Release --nologo
          dotnet build Protect-Website/ProtectWebsite.csproj -c Release --nologo
      - name: Verify commerce and isolation contracts
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo --filter 'FullyQualifiedName~Commerce|FullyQualifiedName~Parfait|FullyQualifiedName~MarketingScopeParityContractTests|FullyQualifiedName~AnalyticsCanonicalArchitectureTests'
          node --test Legend-Cloudflare/tests/website-routing/*.test.mjs
      - name: Verify source Parfait presentation remains exact
        run: |
          set -euo pipefail
          test -s ParfaitApp/wwwroot/css/storefront.css
          test -s ParfaitApp/wwwroot/js/storefront.js
          test -s ParfaitApp/wwwroot/images/favicon/parfait-logo.png
          echo "PARFAIT_COMMERCE_ADMISSION: SOURCE_AND_ROUTING_GREEN"

  deploy-ui:
    name: Affected App Deploy — ${{ matrix.target }}
    needs: [select-targets, commerce-gates]
    if: ${{ !cancelled() && needs.select-targets.outputs.selected == 'true' && (needs.commerce-gates.result == 'success' || needs.commerce-gates.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    steps:
      - name: Check out current fast-track UI code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify shared AI and Messages mobile-sheet contract
        run: node --test tests/layout/messaging-mobile-sheet.test.mjs

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify all five web entrypoints render without blocking on CMS or analytics
        run: node --test tests/website/public-first-paint.test.mjs

      - name: Verify canonical brand registry and four-app identity
        run: node --test scripts/test-public-brand-canonical.mjs

      - name: Verify canonical inquiry button states and retry behavior
        run: node --test Legend-Website/scripts/inquiry-button.test.mjs

      - name: Verify shared Finance bootstrap without touching saved state
        run: node --test tests/layout/finance-startup-canonical.test.mjs

      - name: Install .NET 10
        if: ${{ matrix.project != 'static' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Compile application and produce ZIP
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          if [ "$PROJECT" = static ]; then
            npm ci --prefix Legend-Website --omit=dev --ignore-scripts --no-audit --no-fund
            (cd Legend-Website && node scripts/build.mjs && node scripts/check.mjs && node --test scripts/render-business.test.mjs)
            printf '%s\n' "$GITHUB_SHA" > Legend-Website/dist/_deployment-provenance.txt
            (cd Legend-Website/dist && zip -q -r "$RUNNER_TEMP/deploy.zip" .)
          else
            dotnet publish "$PROJECT" -c Release -o "$RUNNER_TEMP/publish" --nologo -p:SourceRevisionId="$GITHUB_SHA"
            python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'publish'/'wwwroot'/'_deployment-provenance.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'releaseSha':os.environ['GITHUB_SHA']})+'\n')
          PY
            (cd "$RUNNER_TEMP/publish" && zip -q -r "$RUNNER_TEMP/deploy.zip" .)
          fi
          sha256sum "$RUNNER_TEMP/deploy.zip" | cut -d' ' -f1

      - name: Sign in to Azure Production
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fail closed if a shared-host cutover is already enabled in Azure
        if: ${{ needs.select-targets.outputs.commerce == 'true' }}
        shell: bash
        env:
          APP: ${{ matrix.azure_app }}
        run: |
          set -euo pipefail
          az webapp config appsettings list --resource-group masterapp-rg \
            --name "$APP" --only-show-errors -o json > "$RUNNER_TEMP/commerce-settings.json"
          python3 - <<'PYFLAGS'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'commerce-settings.json'
          values=json.loads(p.read_text())
          if not isinstance(values,list):
              raise SystemExit('Azure configuration unavailable. No production upload.')
          flags={
              'commerce__sharedhostcutover__enabled',
              'commerce:sharedhostcutover:enabled',
              'commerce__sharedhostpreview__enabled',
              'commerce:sharedhostpreview:enabled',
              'legend_commerce_cutover_enabled'
          }
          for entry in values:
              if not isinstance(entry,dict) or not isinstance(entry.get('name'),str):
                  raise SystemExit('Azure configuration malformed. No production upload.')
              if entry['name'].lower() in flags and str(entry.get('value') or '').strip().lower() not in ('','false','0'):
                  raise SystemExit('Existing commerce cutover or preview settings are not off. No upload.')
          if os.environ['APP'] not in ('masterapp-parfait','masterapp-protect'):
              raise SystemExit('Unexpected commerce release target. No upload.')
          print('COMMERCE_PRODUCTION_FLAGS_OFF_AND_TARGET_AUTHORIZED: '+os.environ['APP'])
          PYFLAGS

      - name: Check for an active deployment and save baseline IDs
        shell: bash
        env:
          APP: ${{ matrix.azure_app }}
        run: |
          set -euo pipefail
          az webapp log deployment list --resource-group masterapp-rg --name "$APP" --only-show-errors -o json > "$RUNNER_TEMP/baseline.json"
          python3 - <<'PY'
          import json,os,pathlib
          rows=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'baseline.json').read_text())
          if not isinstance(rows,list) or any(not isinstance(x,dict) or not x.get('id') or type(x.get('status')) is not int for x in rows):
              raise SystemExit('Azure deployment status unavailable or malformed; no upload started')
          if any(x['status'] in (0,1,2) for x in rows):
              raise SystemExit('Another Azure deployment is in progress; no simultaneous upload')
          print('Azure idle; baseline deployment records:',len(rows))
          PY

      - name: Submit one direct ZIP deployment
        id: upload
        shell: bash
        env:
          APP: ${{ matrix.azure_app }}
        run: |
          set +e
          timeout 240 az webapp deploy --resource-group masterapp-rg --name "$APP" \
            --src-path "$RUNNER_TEMP/deploy.zip" --type zip \
            --clean true --restart true --async true \
            --track-status false --enable-kudu-warmup false \
            --only-show-errors -o json > "$RUNNER_TEMP/upload.json" 2> "$RUNNER_TEMP/upload.stderr"
          code=$?
          set -e
          echo "upload_exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::The upload response was not confirmed. Do not resubmit; checking Azure instead."
          fi

      - name: Verify deployed Azure revision without resubmitting
        shell: bash
        env:
          APP: ${{ matrix.azure_app }}
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time,urllib.request,urllib.error
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          baseline=json.loads((root/'baseline.json').read_text())
          initial_ids={str(x['id']) for x in baseline}
          expected=os.environ['GITHUB_SHA']
          is_static=os.environ['APP']=='masterapp-website'
          url='https://'+os.environ['HOST']+('/_deployment-provenance.txt' if is_static else '/api/runtime-provenance')
          last='not observed'
          for attempt in range(40):
              time.sleep(15)
              try:
                  provider=subprocess.run(
                      ['az','webapp','log','deployment','list','--resource-group','masterapp-rg',
                       '--name',os.environ['APP'],'--only-show-errors','-o','json'],
                      capture_output=True,text=True,timeout=35)
              except subprocess.TimeoutExpired:
                  last='Azure deployment read timeout; observe again without another upload'
                  continue
              if provider.returncode:
                  last='Azure deployment read unavailable'
                  continue
              try:
                  entries=json.loads(provider.stdout)
                  if not isinstance(entries,list):
                      raise ValueError('unrecognized Azure response')
                  fresh=[x for x in entries if str(x.get('id')) not in initial_ids]
                  if len(fresh)>1:
                      raise RuntimeError('Concurrent Azure deployments detected')
                  if any(x.get('status')==3 for x in fresh):
                      raise RuntimeError('Azure reported failed deployment')
                  active=any(x.get('status') in (0,1,2) for x in entries)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(
                              url+'?fastTrack='+str(time.time_ns()),
                              headers={'Cache-Control':'no-cache'}),timeout=12) as response:
                          raw=response.read(8192).decode().strip()
                          live=(raw if is_static else json.loads(raw).get('sourceRevision')) if response.status==200 else None
                  except (OSError,ValueError):
                      live=None
                  last=f'new_deployments={len(fresh)}, active={active}, revision={live}'
                  if not active and len(fresh)==1 and fresh[0].get('status')==4 and live==expected:
                      icon_path='/favicon.jpg' if is_static else ('/images/favicon/legend-favicon.jpg' if os.environ['APP']=='masterapp-protect' else '/images/favicon/parfait-logo.png' if os.environ['APP']=='masterapp-parfait' else None)
                      if icon_path:
                          try:
                              with urllib.request.urlopen('https://'+os.environ['HOST']+icon_path,timeout=12) as icon:
                                  payload=icon.read(64)
                                  is_jpeg=icon_path.endswith('.jpg')
                                  valid=payload.startswith(bytes([255,216,255])) if is_jpeg else payload.startswith(bytes([137,80,78,71]))
                                  if icon.status!=200 or ('image/jpeg' if is_jpeg else 'image/png') not in icon.headers.get('Content-Type','') or not valid:
                                      raise ValueError('Live favicon response invalid')
                          except (OSError,ValueError) as exc:
                              last='Favicon bytes/type unverified: '+type(exc).__name__
                              continue
                      print('LIVE_REVISION_AND_FAVICON_VERIFIED:',os.environ['APP'],live)
                      raise SystemExit(0)
              except (ValueError,KeyError) as exc:
                  last='Azure deployment response unrecognized: '+type(exc).__name__
                  continue
          raise SystemExit('NOT_DEPLOYED_AND_NOT_VERIFIED: '+os.environ['APP']+' '+last)
          PY

      - name: Verify public sitemap XML and robots contract
        if: ${{ matrix.target == 'Website' || matrix.target == 'Protect' }}
        shell: bash
        env:
          SITE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, xml.etree.ElementTree as ET
          target=os.environ['SITE_TARGET']
          if target not in ('Website','Protect'):
              raise SystemExit('Unexpected sitemap target')
          origin='https://www.mylegnd.com' if target=='Website' else 'https://protect.mylegnd.com'
          sitemap_url=origin+'/sitemap.xml'
          def request(path,accept):
              req=urllib.request.Request(origin+path,headers={
                  'Accept':accept,
                  'Cache-Control':'no-cache',
                  'User-Agent':'LegendSitemapReleaseVerification/1.0'
              })
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.status,response.headers.get('Content-Type','').lower(),response.read(1048576)
          status,content_type,raw=request('/sitemap.xml','application/xml,text/xml')
          if status!=200 or not any(t in content_type for t in ('application/xml','text/xml')):
              raise SystemExit(f'SITEMAP_NOT_XML_HTTP: {target}: status={status}, type={content_type}')
          try:
              root=ET.fromstring(raw)
          except ET.ParseError as error:
              raise SystemExit(f'SITEMAP_MALFORMED_XML: {target}: {error}')
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          locations=[e.text for e in root.findall(ns+'url/'+ns+'loc')]
          if root.tag!=ns+'urlset' or not locations or len(locations)!=len(set(locations)):
              raise SystemExit(f'SITEMAP_INCOMPLETE_OR_DUPLICATE: {target}')
          if any(not loc or not loc.startswith(origin+'/') for loc in locations):
              raise SystemExit(f'SITEMAP_CANONICAL_HOST_MISMATCH: {target}')
          robots_status,robots_type,robots_raw=request('/robots.txt','text/plain')
          robots=robots_raw.decode('utf-8')
          if robots_status!=200 or 'text/plain' not in robots_type or 'Sitemap: '+sitemap_url not in robots.splitlines():
              raise SystemExit(f'ROBOTS_SITEMAP_DISAGREEMENT: {target}')
          print(f'PUBLIC_SITEMAP_XML_VERIFIED target={target} urls={len(locations)} sitemap={sitemap_url}')
          PY

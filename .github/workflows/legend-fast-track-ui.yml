name: LEGEND Fast Track — Affected Web Apps

# One affected-app fast track. Every publication requires exact source checks.
# Backend publication additionally requires
# an authenticated rehearsal, fresh database/recovery evidence and the canonical
# durable migration and upload journals. Routing follows verified app publication.
# Migration admission retains terminal zero-job attempts as proven non-entry.
# Older ambiguous SQL generations require fresh physical-prefix reconciliation.
# Historical admission reads use this job's existing Actions credential.
# Completed pre-reuse migration generations retain their original scoped receipts.

on:
  push:
    branches:
      - Legend/fast-track-release
    paths:
      - .github/workflows/legend-fast-track-ui.yml
      - scripts/validation-resume.py
      - scripts/deploy-approved-app.py
      - scripts/migration-probe-package.py
      - scripts/release-migration.py
      - scripts/release-router.py
      - scripts/release-operation-evidence.py
      - scripts/release-artifacts/**
      - SHARED/Branding/**
      - SHARED/Shared.csproj
      - SHARED/Views/**
      - scripts/test-public-brand-canonical.mjs
      - AgentPortal/Views/**
      - AgentPortal/wwwroot/**
      - ClientApp/Views/**
      - ClientApp/wwwroot/**
      - SHARED/wwwroot/**
      - AgentPortal/Views/Finance/Index.cshtml
      - ClientApp/Views/Finance/Index.cshtml
      - tests/layout/finance-startup-canonical.test.mjs
      - Legend-Design/**
      - Legend-Website/scripts/**
      - Protect-Website/Views/Shared/_Layout.cshtml
      - Protect-Website/ProtectWebsite.csproj
      - ParfaitApp/Views/Shared/_InternalLayout.cshtml
      - ParfaitApp/Program.cs
      - ParfaitApp/Services/**
      - ParfaitApp/Controllers/**
      - ParfaitApp/Models/**
      - ParfaitApp/Views/**
      - CommerceCore/**
      - Infrastructure/Commerce/**
      - Infrastructure/Analytics/**
      - Infrastructure/WebsitePublishing/**
      - Infrastructure/WebsiteEditing/**
      - Domain/Entities/WebsiteContentState.cs
      - Infrastructure/WebsiteRuntime/**
      - Domain/Entities/Commerce*.cs
      - Infrastructure/Data/Configurations/CommercePaymentModel.cs
      - Infrastructure/Data/MasterAppDbContext.cs
      - Infrastructure/Diagnostics/RoutineSqlPolling.cs
      - Infrastructure/Notifications/ApplePushDeliveryHostedService.cs
      - Infrastructure/Notifications/FirebasePushDeliveryHostedService.cs
      - Infrastructure/Migrations/**
      - Infrastructure/Businesses/BusinessWorkspaceAccess.cs
      - Legend-Cloudflare/src/website-routing/**
      - Legend-Cloudflare/tests/website-routing/**
      - Protect-Website/Program.cs
      - Protect-Website/Views/**
      - Infrastructure/WebsiteEditing/WebsiteFaviconParity.cs
      - Infrastructure/WebsiteEditing/WebsitePlatformController.cs
      - Infrastructure/WebsiteRuntime/BusinessWebsiteMiddleware.cs
      - SHARED/WebsitePlatform/legend-public-cms.js
      - tests/website/public-first-paint.test.mjs
      - tests/website/legend-public-cms.test.mjs

permissions:
  contents: read
  actions: read
  pull-requests: read

# Share the publication mutex with the existing release workflow.
# Only protects against simultaneous production uploads, not branch editing.
concurrency:
  group: legend-approved-release
  cancel-in-progress: false

jobs:
  select-targets:
    name: Select exact affected applications
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      selected: ${{ steps.scope.outputs.selected }}
      commerce: ${{ steps.scope.outputs.commerce }}
      targets: ${{ steps.scope.outputs.targets }}
      routing: ${{ steps.scope.outputs.routing }}
      schema: ${{ steps.scope.outputs.schema }}
      baseline: ${{ steps.scope.outputs.baseline }}
      production-eligible: ${{ steps.scope.outputs.production-eligible }}
      promotion: ${{ steps.scope.outputs.promotion }}
    steps:
      - name: Check out exact fast-track source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive application impact exclusively from changed paths
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os,re,subprocess
          spec=importlib.util.spec_from_file_location('release_authority','scripts/validation-resume.py')
          authority=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(authority)
          before=os.environ['BEFORE']
          head=os.environ['GITHUB_SHA']
          scope=authority.fast_track_selection(before,head)
          before=scope['baseline']
          if scope['promotion'] is not None:
              proof=dict(scope['promotion'],producingRun=int(os.environ['GITHUB_RUN_ID']),
                  producingAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
              from pathlib import Path
              Path(os.environ['RUNNER_TEMP'],'fast-track-admission.json').write_text(json.dumps(proof,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('baseline='+before+'\n')
              stream.write('production-eligible='+str(scope['productionEligible']).lower()+'\n')
              stream.write('promotion='+str(scope['promotion'] is not None).lower()+'\n')
              stream.write('selected='+str(scope['selected']).lower()+'\n')
              stream.write('matrix='+json.dumps(scope['matrix'],separators=(',',':'))+'\n')
              stream.write('commerce='+str(scope['commerce']).lower()+'\n')
              stream.write('routing='+str(scope['routing']).lower()+'\n')
              stream.write('schema='+str(scope['schema']).lower()+'\n')
              stream.write('targets='+json.dumps([r['azure_app'] for r in scope['matrix']['include']])+'\n')
          print('LEGEND_FAST_TRACK_PRODUCTION_ELIGIBLE='+str(scope['productionEligible']).lower())
          print('LEGEND_FAST_TRACK_SELECTED='+json.dumps([x['target'] for x in scope['matrix']['include']]))
          print('LEGEND_FAST_TRACK_OWNERSHIP='+json.dumps(scope['impacts'],sort_keys=True))
          PY

      - name: Preserve authenticated nonpublishing promotion proof
        if: steps.scope.outputs.promotion == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fast-track-admission.json
          retention-days: 90
          if-no-files-found: error

  commerce-gates:
    name: Admit exact validated fast-track source
    needs: select-targets
    if: ${{ needs.select-targets.outputs.production-eligible == 'true' && (needs.select-targets.outputs.selected == 'true' || needs.select-targets.outputs.routing == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      candidate: ${{ steps.admit.outputs.candidate }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate merged source and preserved required validation
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('authority','scripts/validation-resume.py')
          owner=importlib.util.module_from_spec(spec);spec.loader.exec_module(owner)
          proof=owner.fast_track_source_admission()
          pathlib.Path(os.environ['RUNNER_TEMP'],'fast-track-admission.json').write_text(json.dumps(proof))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('candidate='+proof['candidate']+'\n')
          print('FAST_TRACK_EXACT_SOURCE_VALIDATION:PROVEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fast-track-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fast-track-admission.json
          retention-days: 30
          if-no-files-found: error

  migrations:
    name: Reconcile production schema before publication
    needs: [select-targets, commerce-gates]
    if: ${{ needs.select-targets.outputs.production-eligible == 'true' && (needs.select-targets.outputs.commerce == 'true' && needs.commerce-gates.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_RESOURCE_GROUP: masterapp-rg
      RELEASE_DATABASE_SERVER_RESOURCE_ID: /subscriptions/a543b54e-8a42-4a4b-bd4d-bc13573b1c48/resourceGroups/MasterApp-Data-RG/providers/Microsoft.Sql/servers/masterapp-sql-prod-1221
      DATABASE_AUTHORITY: masterapp-protect
      RELEASE_SHA: ${{ github.sha }}
      APPLICATION_RELEASE_SHA: ${{ github.sha }}
      RELEASE_CANDIDATE_SHA: ${{ needs.commerce-gates.outputs.candidate }}
      SELECTED_TARGETS: ${{ needs.select-targets.outputs.targets }}
      FAST_TRACK_SCHEMA_CHANGED: ${{ needs.select-targets.outputs.schema }}
      FAST_TRACK_RELEASE_BASELINE: ${{ needs.select-targets.outputs.baseline }}
      FAST_TRACK_MIGRATION_DIRECTORY: /tmp/fast-track-migration
      MIGRATION_BUNDLE: /tmp/fast-track-migration/masterapp-migrations
      MIGRATION_PROBE_DLL: /tmp/fast-track-probe/MigrationReleaseProbe.dll
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build current read-only schema observer for actual migration admission
        run: |
          dotnet publish scripts/MigrationReleaseProbe/MigrationReleaseProbe.csproj -c Release --nologo \
            -m:1 -nr:false -p:UseSharedCompilation=false -o /tmp/fast-track-probe
      - name: Install canonical durable evidence transport
        run: npm ci --prefix scripts/release-artifacts --ignore-scripts --no-audit --no-fund
      - name: Prepare canonical durable evidence transport
        uses: ./scripts/release-artifacts
      - name: Sign in to Azure Production
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify current database recovery window before retention readers
        id: migration-plan
        run: |
          python3 - <<'PY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('migration','scripts/release-migration.py')
          owner=importlib.util.module_from_spec(spec);spec.loader.exec_module(owner)
          observed=owner.observe(pathlib.Path(os.environ['MIGRATION_PROBE_DLL']),owner.connection_string())
          proof=owner.production_recovery(observed['databaseIdentity'])
          pathlib.Path(os.environ['RUNNER_TEMP'],'database-recovery.json').write_text(json.dumps(proof))
          print('FAST_TRACK_DATABASE_RESTORE_WINDOW:VERIFIED:restore-not-executed')
          observed=owner.production_observation_no_sql(pathlib.Path(os.environ['MIGRATION_PROBE_DLL']),owner.connection_string())
          mode=owner.fast_track_migration_plan(observed,proof)
          if mode == 'no-sql':
              retained=pathlib.Path(os.environ['RUNNER_TEMP'],'migration-readiness-observation.json')
              owner.retain_preflight_observation(retained,dict(observed,recoveryEvidence=proof))
              with open(os.environ['GITHUB_ENV'],'a') as stream:
                  stream.write('MIGRATION_READINESS_OBSERVATION='+str(retained)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('mode='+mode+'\n')
          print('FAST_TRACK_MIGRATION_PLAN:'+mode)
          PY
      - name: Preserve recovery evidence before SQL or retention publication
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-database-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/database-recovery.json
          retention-days: 30
          if-no-files-found: error
      - name: Restore authenticated compatible rehearsal without rebuilding
        if: ${{ steps.migration-plan.outputs.mode == 'rehearsal-required' }}
        run: |
          python3 - <<'PY'
          import importlib.util,os,pathlib
          spec=importlib.util.spec_from_file_location('probe','scripts/migration-probe-package.py')
          owner=importlib.util.module_from_spec(spec);spec.loader.exec_module(owner)
          proof=owner.restore_fast_track(os.environ['GITHUB_SHA'],pathlib.Path(os.environ['FAST_TRACK_MIGRATION_DIRECTORY']),
              pathlib.Path(os.environ['MIGRATION_PROBE_DLL']).parent)
          print('FAST_TRACK_REHEARSAL_RESTORED:producer='+proof['candidate'])
          PY
      - name: Check migration admission without entering a write step
        run: python3 scripts/release-migration.py --preflight
      - name: Apply or reconcile the exact rehearsed migration bundle
        if: ${{ steps.migration-plan.outputs.mode == 'rehearsal-required' }}
        run: python3 scripts/release-migration.py
      - name: Reconcile fresh already-ready schema without SQL bundle or mutation
        if: ${{ steps.migration-plan.outputs.mode == 'no-sql' }}
        run: python3 scripts/release-migration.py --no-sql

  deploy-ui:
    name: Affected App Deploy — ${{ matrix.target }}
    needs: [select-targets, commerce-gates, migrations]
    if: ${{ needs.select-targets.outputs.production-eligible == 'true' && (!cancelled() && needs.select-targets.outputs.selected == 'true' && needs.commerce-gates.result == 'success' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BEFORE: ${{ needs.select-targets.outputs.baseline }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    steps:
      - name: Check out current fast-track UI code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify shared AI and Messages mobile-sheet contract
        run: node --test tests/layout/messaging-mobile-sheet.test.mjs

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify all five web entrypoints render without blocking on CMS or analytics
        run: node --test tests/website/public-first-paint.test.mjs

      - name: Verify canonical brand registry and four-app identity
        run: node --test scripts/test-public-brand-canonical.mjs

      - name: Verify canonical inquiry button states and retry behavior
        run: node --test Legend-Website/scripts/inquiry-button.test.mjs

      - name: Verify shared Finance bootstrap without touching saved state
        run: node --test tests/layout/finance-startup-canonical.test.mjs

      - name: Install .NET 10
        if: ${{ matrix.project != 'static' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore existing immutable package on resumed attempts
        id: package
        env:
          TARGET_KEY: ${{ matrix.key }}
        run: |
          python3 - <<'PY'
          import importlib.util,os,pathlib
          spec=importlib.util.spec_from_file_location('deploy','scripts/deploy-approved-app.py')
          owner=importlib.util.module_from_spec(spec);spec.loader.exec_module(owner)
          reused=owner.fast_track_restore_package(os.environ['TARGET_KEY'],pathlib.Path(os.environ['RUNNER_TEMP']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('reused='+str(reused).lower()+'\n')
          PY

      - name: Compile application and produce ZIP
        if: ${{ steps.package.outputs.reused != 'true' }}
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          if [ "$PROJECT" = static ]; then
            npm ci --prefix Legend-Website --omit=dev --ignore-scripts --no-audit --no-fund
            (cd Legend-Website && node scripts/build.mjs && node scripts/check.mjs && node --test scripts/render-business.test.mjs)
            printf '%s\n' "$GITHUB_SHA" > Legend-Website/dist/_deployment-provenance.txt
            (cd Legend-Website/dist && zip -q -r "$RUNNER_TEMP/deploy.zip" .)
          else
            dotnet publish "$PROJECT" -c Release -o "$RUNNER_TEMP/publish" --nologo -p:SourceRevisionId="$GITHUB_SHA"
            python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'publish'/'wwwroot'/'_deployment-provenance.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'releaseSha':os.environ['GITHUB_SHA']})+'\n')
          PY
            (cd "$RUNNER_TEMP/publish" && zip -q -r "$RUNNER_TEMP/deploy.zip" .)
          fi
          (cd "$RUNNER_TEMP" && sha256sum deploy.zip > SHA256SUMS)

      - name: Preserve immutable application bytes before upload
        if: ${{ steps.package.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-package-${{ github.sha }}-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/deploy.zip
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
      - name: Install canonical durable evidence transport
        run: npm ci --prefix scripts/release-artifacts --ignore-scripts --no-audit --no-fund
      - name: Prepare canonical durable evidence transport
        uses: ./scripts/release-artifacts

      - name: Sign in to Azure Production
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fail closed if a shared-host cutover is already enabled in Azure
        if: ${{ needs.select-targets.outputs.commerce == 'true' && (matrix.target == 'Protect' || matrix.target == 'Parfait') }}
        shell: bash
        env:
          APP: ${{ matrix.azure_app }}
        run: |
          set -euo pipefail
          az webapp config appsettings list --resource-group masterapp-rg \
            --name "$APP" --only-show-errors -o json > "$RUNNER_TEMP/commerce-settings.json"
          python3 - <<'PYFLAGS'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'commerce-settings.json'
          values=json.loads(p.read_text())
          if not isinstance(values,list):
              raise SystemExit('Azure configuration unavailable. No production upload.')
          flags={
              'commerce__sharedhostcutover__enabled',
              'commerce:sharedhostcutover:enabled',
              'commerce__sharedhostpreview__enabled',
              'commerce:sharedhostpreview:enabled',
              'legend_commerce_cutover_enabled'
          }
          for entry in values:
              if not isinstance(entry,dict) or not isinstance(entry.get('name'),str):
                  raise SystemExit('Azure configuration malformed. No production upload.')
              if entry['name'].lower() in flags and str(entry.get('value') or '').strip().lower() not in ('','false','0'):
                  raise SystemExit('Existing commerce cutover or preview settings are not off. No upload.')
          if os.environ['APP'] not in ('masterapp-parfait','masterapp-protect'):
              raise SystemExit('Unexpected commerce release target. No upload.')
          print('COMMERCE_PRODUCTION_FLAGS_OFF_AND_TARGET_AUTHORIZED: '+os.environ['APP'])
          PYFLAGS

      - name: Publish or reconcile exact application bytes
        env:
          TARGET_KEY: ${{ matrix.key }}
        run: python3 scripts/deploy-approved-app.py --fast-track-target "$TARGET_KEY" --package-root "$RUNNER_TEMP"

      - name: Verify public sitemap XML and robots contract
        if: ${{ matrix.target == 'Website' || matrix.target == 'Protect' }}
        shell: bash
        env:
          SITE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          target=os.environ['SITE_TARGET']
          if target not in ('Website','Protect'):
              raise SystemExit('Unexpected sitemap target')
          origin='https://www.mylegnd.com' if target=='Website' else 'https://protect.mylegnd.com'
          sitemap_url=origin+'/sitemap.xml'
          def request(path,accept):
              req=urllib.request.Request(origin+path,headers={
                  'Accept':accept,
                  'Cache-Control':'no-cache',
                  'User-Agent':'LegendSitemapReleaseVerification/1.0'
              })
              last='not attempted'
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=22) as response:
                          result=(response.status,response.headers.get('Content-Type','').lower(),response.read(1048576))
                      print(f'SITEMAP_TRANSPORT_REACHED target={target} path={path} attempt={attempt+1}')
                      return result
                  except (OSError,ValueError) as error:
                      last=type(error).__name__
                      print(f'SITEMAP_TRANSPORT_RETRY target={target} path={path} attempt={attempt+1} reason={last}',flush=True)
                      if attempt!=3: time.sleep(8)
              raise SystemExit(f'SITEMAP_TRANSPORT_UNAVAILABLE target={target} path={path} reason={last}')
          status,content_type,raw=request('/sitemap.xml','application/xml,text/xml')
          if status!=200 or not any(t in content_type for t in ('application/xml','text/xml')):
              raise SystemExit(f'SITEMAP_NOT_XML_HTTP: {target}: status={status}, type={content_type}')
          try:
              root=ET.fromstring(raw)
          except ET.ParseError as error:
              raise SystemExit(f'SITEMAP_MALFORMED_XML: {target}: {error}')
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          locations=[e.text for e in root.findall(ns+'url/'+ns+'loc')]
          if root.tag!=ns+'urlset' or not locations or len(locations)!=len(set(locations)):
              raise SystemExit(f'SITEMAP_INCOMPLETE_OR_DUPLICATE: {target}')
          if any(not loc or not loc.startswith(origin+'/') for loc in locations):
              raise SystemExit(f'SITEMAP_CANONICAL_HOST_MISMATCH: {target}')
          robots_status,robots_type,robots_raw=request('/robots.txt','text/plain')
          robots=robots_raw.decode('utf-8')
          if robots_status!=200 or 'text/plain' not in robots_type or 'Sitemap: '+sitemap_url not in robots.splitlines():
              raise SystemExit(f'ROBOTS_SITEMAP_DISAGREEMENT: {target}')
          print(f'PUBLIC_SITEMAP_XML_VERIFIED target={target} urls={len(locations)} sitemap={sitemap_url}')
          PY

  routing-cloudflare:
    name: Publish verified website routing
    needs: [select-targets, commerce-gates, migrations, deploy-ui]
    if: ${{ needs.select-targets.outputs.production-eligible == 'true' && (!cancelled() && needs.select-targets.outputs.routing == 'true' && needs.commerce-gates.result == 'success' && needs.migrations.result == 'success' && (needs.deploy-ui.result == 'success' || (needs.select-targets.outputs.selected == 'false' && needs.deploy-ui.result == 'skipped'))) }}
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      APPLICATION_RELEASE_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install canonical routing and evidence dependencies
        run: |
          npm ci --prefix Legend-Cloudflare --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/release-artifacts --ignore-scripts --no-audit --no-fund
      - name: Prepare canonical durable evidence transport
        uses: ./scripts/release-artifacts
      - name: Publish or reconcile canonical website routing
        run: python3 scripts/release-router.py fast-track

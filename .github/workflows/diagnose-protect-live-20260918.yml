name: Diagnose live Protect exact release

on:
  push:
    branches:
      - feature/public-website-editor-20260918
    paths:
      - '.github/workflows/diagnose-protect-live-20260918.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Protect markers
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 20 -fsSL 'https://protect.mylegnd.com/?diag=fd22853357d4005269a0bf73ae88602c949d8995' -o /tmp/home.html
          curl --connect-timeout 5 --max-time 20 -fsSL 'https://protect.mylegnd.com/design/legend-public-cms.js?diag=fd22853357d4005269a0bf73ae88602c949d8995' -o /tmp/cms.js
          curl --connect-timeout 5 --max-time 20 -fsSL 'https://protect.mylegnd.com/_deployment-provenance.json?diag=fd22853357d4005269a0bf73ae88602c949d8995' -o /tmp/prov.json
          echo "provenance=$(cat /tmp/prov.json)"
          for marker in '<strong>LEGEND</strong>' 'brand-banner' 'instagram.com/legend.vault' 'Legend® ios App' 'Bring order to your life before life demands it from you.'; do
            if grep -Fq "$marker" /tmp/home.html; then echo "HOME_PRESENT: $marker"; else echo "HOME_MISSING: $marker"; fi
          done
          if grep -Fq 'Website Editor' /tmp/cms.js; then echo 'CMS_PRESENT: Website Editor'; else echo 'CMS_MISSING: Website Editor'; fi
          echo '--- HOME HEAD ---'
          head -c 5000 /tmp/home.html

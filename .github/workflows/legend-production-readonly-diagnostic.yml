# Manual production diagnostic trigger — no runtime logic change.
name: LEGEND production read-only diagnostic

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/legend-production-readonly-diagnostic.yml'
      - 'AgentPortal.Tests/LegendProductionComposedNativeReadOnlyTests.cs'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'
  DIAGNOSTIC_RESULT_PATH: diagnostics/legend-production-readonly-latest.txt

jobs:
  production-readonly-diagnostic:
    runs-on: windows-latest
    environment:
      name: Production

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj

      - name: Build test project
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database and Founder identity securely
        shell: pwsh
        run: |
          $connection = ''
          $rawConnections = az webapp config connection-string list `
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' `
            --name '${{ env.AZURE_WEBAPP_NAME }}' `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read production App Service connection strings.' }

          $connections = $rawConnections | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match -and -not [string]::IsNullOrWhiteSpace([string]$match.value)) {
            $connection = [string]$match.value
          }

          $rawSettings = az webapp config appsettings list `
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' `
            --name '${{ env.AZURE_WEBAPP_NAME }}' `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read production App Service settings.' }

          $settings = @{}
          foreach ($item in ($rawSettings | ConvertFrom-Json)) {
            $settings[[string]$item.name] = [string]$item.value
          }

          if ([string]::IsNullOrWhiteSpace($connection)) {
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
                $connection = $settings[$name]
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection string could not be resolved.' }
          if ($connection -notmatch '(?i)(server=tcp:|\.database\.windows\.net|initial catalog=)') { throw 'Resolved MasterAppDb is not recognized as production SQL Server.' }

          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
              $founderOid = $settings[$name]
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Production Founder OID could not be resolved.' }

          Write-Output "::add-mask::$connection"
          Write-Output "::add-mask::$founderOid"
          "LEGEND_PRODUCTION_READONLY_CONNECTION=$connection" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEGEND_PRODUCTION_READONLY_FOUNDER_OID=$founderOid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENAI_API_KEY=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OpenAI__ApiKey=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run exact production composed-native diagnostic
        id: diagnostic
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $composed = 'diagnostics/composed-native.txt'
          $shadow = 'diagnostics/shadow.txt'

          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj `
            -c Release `
            --no-build `
            --filter 'FullyQualifiedName~LegendProductionComposedNativeReadOnlyTests.ProductionReadOnly_ComposedNativeAuthority_ExplainsLiveConversationBoundary' `
            --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath $composed
          $composedExit = $LASTEXITCODE

          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj `
            -c Release `
            --no-build `
            --filter 'FullyQualifiedName~LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyV21ShadowRebuild_UsesLiveFounderEvidenceWithoutWrites' `
            --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath $shadow
          $shadowExit = $LASTEXITCODE

          @(
            'LEGEND PRODUCTION READ-ONLY DIAGNOSTIC'
            "Commit: $env:GITHUB_SHA"
            "ComposedNativeExit: $composedExit"
            "ShadowExit: $shadowExit"
            ''
            '=== EXACT COMPOSED-NATIVE LIVE DATABASE DIAGNOSTIC ==='
            Get-Content $composed
            ''
            '=== V21 LIVE-EVIDENCE SHADOW REBUILD ==='
            Get-Content $shadow
          ) | Set-Content -Path '${{ env.DIAGNOSTIC_RESULT_PATH }}' -Encoding utf8

          "composed_exit=$composedExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "shadow_exit=$shadowExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit sanitized diagnostic transcript
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ env.DIAGNOSTIC_RESULT_PATH }}'
          if (git diff --cached --quiet) {
            Write-Host 'Diagnostic transcript is unchanged.'
          } else {
            git commit -m 'Record live LEGEND read-only diagnostic'
            git push origin HEAD:production
          }

      - name: Enforce diagnostic execution success
        shell: pwsh
        run: |
          if ('${{ steps.diagnostic.outputs.composed_exit }}' -ne '0') { throw 'Production composed-native diagnostic did not execute successfully.' }
          if ('${{ steps.diagnostic.outputs.shadow_exit }}' -ne '0') { throw 'Production V21 shadow diagnostic did not execute successfully.' }

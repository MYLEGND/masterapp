name: LEGEND production read-only diagnostic

# Operational evidence collection is manual. Deployment validation lives in
# agentportal-production-deploy.yml and must not be duplicated after every merge.
on:
  # A validation/* branch can prove its exact commit against the live Founder
  # curriculum without opening or synchronizing a production PR. This is the
  # existing read-only diagnostic authority; it cannot merge or deploy.
  push:
    branches:
      - 'validation/legend-native-*'
  workflow_dispatch:
    inputs:
      run_full_shadow:
        description: Run the full live-evidence V21 shadow rebuild
        required: false
        default: false
        type: boolean

concurrency:
  group: legend-production-readonly-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'
  DIAGNOSTIC_RESULT_PATH: diagnostics/legend-production-readonly-latest.txt

jobs:
  production-readonly-diagnostic:
    runs-on: windows-latest
    # A validation branch runs the complete application regression and then
    # reconstructs the full governed Founder closure twice for idempotence.
    # Keep a hard bound, but size it for the mandatory full-corpus proof.
    timeout-minutes: 90
    environment:
      name: Production

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        id: restore
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj 2>&1 | Tee-Object -FilePath diagnostics/restore.txt
          exit $LASTEXITCODE

      - name: Build test project
        id: build
        if: steps.restore.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore 2>&1 | Tee-Object -FilePath diagnostics/build.txt
          exit $LASTEXITCODE

      - name: Run complete predeployment regression suite
        id: regression
        if: steps.build.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build 2>&1 | Tee-Object -FilePath diagnostics/regression.txt
          exit $LASTEXITCODE

      - name: Login to Azure with OIDC
        if: steps.build.outcome == 'success' && steps.regression.outcome == 'success'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database and Founder identity securely
        if: steps.build.outcome == 'success' && steps.regression.outcome == 'success'
        shell: pwsh
        run: |
          $connection = ''
          $rawConnections = az webapp config connection-string list `
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' `
            --name '${{ env.AZURE_WEBAPP_NAME }}' `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read production App Service connection strings.' }
          $connections = $rawConnections | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match -and -not [string]::IsNullOrWhiteSpace([string]$match.value)) { $connection = [string]$match.value }

          $rawSettings = az webapp config appsettings list `
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' `
            --name '${{ env.AZURE_WEBAPP_NAME }}' `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read production App Service settings.' }
          $settings = @{}
          foreach ($item in ($rawSettings | ConvertFrom-Json)) { $settings[[string]$item.name] = [string]$item.value }

          if ([string]::IsNullOrWhiteSpace($connection)) {
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $connection = $settings[$name]; break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection string could not be resolved.' }
          if ($connection -notmatch '(?i)(server=tcp:|\.database\.windows\.net|initial catalog=)') { throw 'Resolved MasterAppDb is not recognized as production SQL Server.' }

          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) { $founderOid = $settings[$name]; break }
          }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Production Founder OID could not be resolved.' }

          Write-Output "::add-mask::$connection"
          Write-Output "::add-mask::$founderOid"
          "LEGEND_PRODUCTION_READONLY_CONNECTION=$connection" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEGEND_PRODUCTION_READONLY_FOUNDER_OID=$founderOid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # This is a release proof, not an observational smoke test: every
          # bounded Founder prompt must complete natively against the live
          # read-only curriculum with the provider physically unavailable.
          "LEGEND_PRODUCTION_READONLY_EXPECT_NATIVE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENAI_API_KEY=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OpenAI__ApiKey=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read live replay and curriculum processing status
        id: replay_status
        if: steps.build.outcome == 'success' && steps.regression.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet run --file diagnostics/LegendProductionReplayStatus.cs 2>&1 | Tee-Object -FilePath diagnostics/replay-status.txt
          exit $LASTEXITCODE

      - name: Run canonical production read-only diagnostics
        id: diagnostic
        if: steps.build.outcome == 'success' && steps.regression.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $native = 'diagnostics/native.txt'
          $shadow = 'diagnostics/shadow.txt'
          $preflight = 'diagnostics/test-preflight.txt'
          $nativeExit = 99
          $shadowExit = 0
          # Validation branches are release-proof branches, so their exact
          # commit must run both the bounded Founder prompt matrix and the
          # live-evidence shadow rebuild. Manual operational diagnostics keep
          # the explicit opt-in because they are not release candidates.
          $runFullShadow = '${{ startsWith(github.ref, 'refs/heads/validation/legend-native-') || (github.event_name == 'workflow_dispatch' && inputs.run_full_shadow) }}' -eq 'true'
          try {
            dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --list-tests --diag diagnostics/vstest-discovery.txt 2>&1 | Tee-Object -FilePath $preflight
            $listExit = $LASTEXITCODE
            $listText = Get-Content $preflight -Raw
            if ($listExit -ne 0) { throw "Test discovery preflight failed with exit code $listExit." }
            if ($listText -notmatch 'ProductionReadOnlyEightPromptNativeDiagnostic') { throw 'Native production diagnostic was not discovered.' }
            if ($runFullShadow -and $listText -notmatch 'ProductionReadOnlyV21ShadowRebuild_UsesLiveFounderEvidenceWithoutWrites') { throw 'V21 shadow production diagnostic was not discovered.' }

            dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyEightPromptNativeDiagnostic' --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath $native
            $nativeExit = $LASTEXITCODE
            $nativeText = Get-Content $native -Raw
            if ($nativeText -match 'No test is available') { $nativeExit = 97 }
            if ($nativeText -notmatch 'ProductionReadOnlyEightPromptNativeDiagnostic') { $nativeExit = 98 }

            if ($runFullShadow) {
              dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyV21ShadowRebuild_UsesLiveFounderEvidenceWithoutWrites' --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath $shadow
              $shadowExit = $LASTEXITCODE
              $shadowText = Get-Content $shadow -Raw
              if ($shadowText -match 'No test is available') { $shadowExit = 97 }
              if ($shadowText -notmatch 'ProductionReadOnlyV21ShadowRebuild_UsesLiveFounderEvidenceWithoutWrites') { $shadowExit = 98 }
            }
            else {
              'Full V21 shadow rebuild skipped. Use workflow_dispatch with run_full_shadow=true when a bounded production-data shadow replay is specifically required.' | Set-Content -Path $shadow -Encoding utf8
            }
          }
          catch { $_ | Out-String | Add-Content -Path $preflight -Encoding utf8 }
          finally {
            "native_exit=$nativeExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "shadow_exit=$shadowExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Assemble sanitized diagnostic transcript
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @(
            'LEGEND PRODUCTION READ-ONLY DIAGNOSTIC'
            "Commit: $env:GITHUB_SHA"
            "RestoreOutcome: ${{ steps.restore.outcome }}"
            "BuildOutcome: ${{ steps.build.outcome }}"
            "RegressionOutcome: ${{ steps.regression.outcome }}"
            "ReplayStatusOutcome: ${{ steps.replay_status.outcome }}"
            "DiagnosticOutcome: ${{ steps.diagnostic.outcome }}"
            "NativeExit: ${{ steps.diagnostic.outputs.native_exit }}"
            "ShadowExit: ${{ steps.diagnostic.outputs.shadow_exit }}"
            "ShadowRequested: ${{ startsWith(github.ref, 'refs/heads/validation/legend-native-') || (github.event_name == 'workflow_dispatch' && inputs.run_full_shadow) }}"
            ''
            '=== LIVE REPLAY / CURRICULUM STATUS ==='
            if (Test-Path diagnostics/replay-status.txt) { Get-Content diagnostics/replay-status.txt }
            ''
            '=== TEST PREFLIGHT ==='
            if (Test-Path diagnostics/test-preflight.txt) { Get-Content diagnostics/test-preflight.txt }
            ''
            '=== VSTEST DISCOVERY DIAGNOSTIC ==='
            if (Test-Path diagnostics/vstest-discovery.txt) { Get-Content diagnostics/vstest-discovery.txt | Select-Object -Last 250 }
            ''
            '=== RESTORE ==='
            if (Test-Path diagnostics/restore.txt) { Get-Content diagnostics/restore.txt }
            ''
            '=== BUILD ==='
            if (Test-Path diagnostics/build.txt) { Get-Content diagnostics/build.txt }
            ''
            '=== COMPLETE PREDEPLOYMENT REGRESSION ==='
            if (Test-Path diagnostics/regression.txt) { Get-Content diagnostics/regression.txt }
            ''
            '=== NATIVE LIVE DATABASE DIAGNOSTIC ==='
            if (Test-Path diagnostics/native.txt) { Get-Content diagnostics/native.txt }
            ''
            '=== V21 LIVE-EVIDENCE SHADOW REBUILD ==='
            if (Test-Path diagnostics/shadow.txt) { Get-Content diagnostics/shadow.txt }
          ) | Set-Content -Path '${{ env.DIAGNOSTIC_RESULT_PATH }}' -Encoding utf8

      # A diagnostic must never alter the branch it is inspecting. Persist the
      # sanitized transcript only as a workflow artifact; notably, do not use
      # `always()` to push a partial transcript after cancellation or failure.
      - name: Upload sanitized diagnostic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legend-production-readonly-diagnostic-${{ github.run_id }}
          path: ${{ env.DIAGNOSTIC_RESULT_PATH }}
          if-no-files-found: warn

      - name: Enforce diagnostic execution success
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.restore.outcome }}' -ne 'success') { throw 'Production diagnostic restore failed.' }
          if ('${{ steps.build.outcome }}' -ne 'success') { throw 'Production diagnostic build failed.' }
          if ('${{ steps.regression.outcome }}' -ne 'success') { throw 'Complete predeployment regression failed.' }
          if ('${{ steps.replay_status.outcome }}' -ne 'success') { throw 'Production replay-status diagnostic failed.' }
          if ('${{ steps.diagnostic.outcome }}' -ne 'success') { throw 'Production read-only diagnostic was not completed successfully.' }
          if ('${{ steps.diagnostic.outputs.native_exit }}' -ne '0') { throw 'Production native diagnostic did not execute successfully.' }
          if ('${{ steps.diagnostic.outputs.shadow_exit }}' -ne '0') { throw 'Requested production V21 shadow diagnostic did not execute successfully.' }

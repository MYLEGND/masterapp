name: LEGEND candidate read-only production observation

# PR #31 remains the sole isolated candidate validation owner. This workflow
# collects bounded SQL observation; production proof lives only in
# agentportal-production-deploy.yml. It cannot merge, deploy or claim a live SHA.
on:
  push:
    branches:
      - 'validation/legend-native-*'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable candidate commit containing this runner
        required: true
        type: string
      validation_scope:
        description: Native SQL matrix, direct observation, or explicit live provider resources
        required: true
        default: canonical_matrix
        type: choice
        options:
          - canonical_matrix
          - observation
          - provider_resources

concurrency:
  group: legend-production-readonly-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.x'
  LEGEND_VALIDATION_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
  LEGEND_VALIDATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  LEGEND_VALIDATION_SCOPE: ${{ inputs.validation_scope || 'canonical_matrix' }}

jobs:
  production-readonly-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      # Each diagnostic step receives only its selected credentials. Missing
      # configuration fails that scope; no fallback secret discovery is used.
      name: LEGEND-Production-ReadOnly-Validation

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LEGEND_VALIDATION_CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify candidate and runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$LEGEND_VALIDATION_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$LEGEND_VALIDATION_CANDIDATE_SHA"
          test -f scripts/run-legend-production-shadow.sh
          git diff --quiet HEAD --
          mkdir -p diagnostics/legend-shadow

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        id: restore
        shell: bash
        continue-on-error: true
        run: dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj --nologo

      - name: Build exact candidate test project
        id: build
        if: steps.restore.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo -p:SourceRevisionId="$LEGEND_VALIDATION_CANDIDATE_SHA"

      - name: Run complete predeployment regression suite
        id: regression
        if: steps.build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build --nologo

      - name: Run canonical production read-only diagnostics
        id: diagnostic
        # A failed regression still permits bounded observation of a valid
        # build. The final gate below continues to fail the job for regression.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.LEGEND_VALIDATION_SCOPE != 'provider_resources' }}
        timeout-minutes: 14
        shell: bash
        continue-on-error: true
        env:
          LEGEND_PRODUCTION_READONLY_CONNECTION: ${{ secrets.LEGEND_PRODUCTION_SELECT_ONLY_CONNECTION }}
          LEGEND_PRODUCTION_READONLY_FOUNDER_OID: ${{ secrets.LEGEND_PRODUCTION_READONLY_FOUNDER_OID }}
          LEGEND_PRODUCTION_OBSERVATION_REQUIRED: 'true'
          OPENAI_API_KEY: ''
          OpenAI__ApiKey: ''
        run: |
          set -Eeuo pipefail
          export LEGEND_VALIDATION_NONCE="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          # Exact selected entrypoint: ProductionReadOnlyNativeProofMatrix or
          # ProductionReadOnlyCandidateObservation. The same matrix uses only
          # isolated local discourse persistence; all production SQL is guarded.
          bash scripts/run-legend-production-shadow.sh

      - name: Observe explicitly selected live provider resources
        id: resources
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.LEGEND_VALIDATION_SCOPE == 'provider_resources' }}
        timeout-minutes: 5
        shell: bash
        continue-on-error: true
        env:
          LEGEND_RESOURCE_DIAGNOSTICS_REQUIRED: 'true'
          # These references do not establish that a secret is configured.
          # Tests emit NOT_CONFIGURED receipts for missing selected resources.
          OpenAI__ApiKey: ${{ secrets.OPENAI_API_KEY }}
          AzureTranslator__Endpoint: ${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}
          AzureTranslator__Key: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AzureTranslator__Region: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: |
          set -Eeuo pipefail
          export LEGEND_VALIDATION_NONCE="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          # Exactly Azure, governed research, and the existing OpenAI catalog
          # acceptance canary. No production SQL credential enters this step.
          bash scripts/run-legend-production-shadow.sh

      - name: Assemble sanitized diagnostic transcript
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          RESOURCE_OUTCOME: ${{ steps.resources.outcome }}
        run: |
          mkdir -p diagnostics/legend-shadow
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('diagnostics/legend-shadow')
          transcript = {
              'Authority': 'non-authoritative', 'DeployedSha': 'unavailable',
              'CandidateSha': os.environ['LEGEND_VALIDATION_CANDIDATE_SHA'],
              'WorkflowSha': os.environ['LEGEND_VALIDATION_WORKFLOW_SHA'],
              'Restore': os.environ['RESTORE_OUTCOME'], 'Build': os.environ['BUILD_OUTCOME'],
              'Regression': os.environ['REGRESSION_OUTCOME'], 'Observation': os.environ['DIAGNOSTIC_OUTCOME'],
              'ProviderResources': os.environ['RESOURCE_OUTCOME'],
              'ValidationScope': os.environ['LEGEND_VALIDATION_SCOPE'],
              'ReleaseProof': False,
          }
          (root / 'transcript.json').write_text(json.dumps(transcript, indent=2), encoding='utf-8')
          PY

      - name: Upload sanitized diagnostic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legend-readonly-${{ env.LEGEND_VALIDATION_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw SQL/test logs and TRX remain private to the runner; only the
          # bounded structured evidence (no row contents) is published.
          path: |
            diagnostics/legend-shadow/transcript.json
            diagnostics/legend-shadow/summary.json
            diagnostics/legend-shadow/observation.json
            diagnostics/legend-shadow/resource-azure.json
            diagnostics/legend-shadow/resource-research.json
            diagnostics/legend-shadow/resource-openai.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete diagnostic and regression result
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          RESOURCE_OUTCOME: ${{ steps.resources.outcome }}
        run: |
          set -Eeuo pipefail
          selected_outcome="$DIAGNOSTIC_OUTCOME"
          if [[ "$LEGEND_VALIDATION_SCOPE" == 'provider_resources' ]]; then
            selected_outcome="$RESOURCE_OUTCOME"
          fi
          for outcome in "$RESTORE_OUTCOME" "$BUILD_OUTCOME" "$REGRESSION_OUTCOME" "$selected_outcome"; do
            if [[ "$outcome" != 'success' ]]; then
              echo 'Production read-only diagnostic was not completed successfully.'
              exit 1
            fi
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('diagnostics/legend-shadow/summary.json').read_text(encoding='utf-8'))
          assert result['Status'] == 'passed'
          assert result['CandidateSha'] == os.environ['LEGEND_VALIDATION_CANDIDATE_SHA']
          assert result['ReleaseProof'] is False
          assert result['ValidationScope'] == os.environ['LEGEND_VALIDATION_SCOPE']
          if result['ValidationScope'] == 'provider_resources':
              assert result['ProductionSqlExecutionVerified'] is False
              assert result['ResourceReceipts'] == {'azure': 'OBSERVED', 'research': 'OBSERVED', 'openai': 'OBSERVED'}
          PY

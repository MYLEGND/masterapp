name: LEGEND isolated production-data shadow validation

# Non-release evidence only. This workflow has no merge, deployment, migration,
# Azure-control-plane, provider, queue, notification, or production-write authority.
on:
  push:
    branches:
      - 'validation/legend-native-*'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable candidate commit to validate
        required: true
        type: string

concurrency:
  group: legend-production-readonly-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.x'
  LEGEND_VALIDATION_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
  LEGEND_PRODUCTION_PROOF_REQUIRED: 'true'
  LEGEND_PRODUCTION_PROOF_MATRIX_VERSION: 'lai-027-029-v1'
  LEGEND_PRODUCTION_READONLY_CONNECTION: ${{ secrets.LEGEND_PRODUCTION_SELECT_ONLY_CONNECTION }}
  LEGEND_PRODUCTION_READONLY_FOUNDER_OID: ${{ secrets.LEGEND_PRODUCTION_READONLY_FOUNDER_OID }}
  LEGEND_VALIDATION_ROOT: diagnostics/legend-shadow
  LEGEND_STAGE0_RESULT_PATH: diagnostics/legend-shadow/stage0.json
  LEGEND_STAGE1_RESULT_PATH: diagnostics/legend-shadow/stage1.json
  LEGEND_PRODUCTION_PROOF_RESULT_PATH: diagnostics/legend-shadow/stage2.json
  OPENAI_API_KEY: ''
  OpenAI__ApiKey: ''
  LegendConnect__CorpusAcquisition__Enabled: 'false'
  LEGEND_DISABLE_PROVIDER_TRANSPORTS: 'true'
  LEGEND_DISABLE_QUEUES: 'true'
  LEGEND_DISABLE_NOTIFICATIONS: 'true'
  LEGEND_DISABLE_EXTERNAL_SIDE_EFFECTS: 'true'

jobs:
  production-readonly-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # Deliberately separate from the release environment. Only a technically
      # SELECT-only credential belongs in this environment.
      name: LEGEND-Production-ReadOnly-Validation

    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LEGEND_VALIDATION_CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Start the overall validation deadline
        shell: bash
        run: echo "LEGEND_VALIDATION_STARTED_EPOCH_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build once
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore AgentPortal.Tests/AgentPortal.Tests.csproj --nologo
          dotnet build AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-restore --nologo

      - name: Run bounded isolated validation stages
        id: validation
        shell: bash
        run: scripts/run-legend-production-shadow.sh

      - name: Upload sanitized exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legend-shadow-${{ env.LEGEND_VALIDATION_CANDIDATE_SHA }}-${{ github.run_id }}
          path: diagnostics/legend-shadow
          if-no-files-found: error
          retention-days: 14

      - name: Enforce isolated validation result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f diagnostics/legend-shadow/summary.json
          python3 - <<'PY'
          import json
          with open('diagnostics/legend-shadow/summary.json', encoding='utf-8') as stream:
              result = json.load(stream)
          assert result['status'] == 'passed', result
          assert result['candidateSha'] == '${{ env.LEGEND_VALIDATION_CANDIDATE_SHA }}', result
          assert result['totalWallMilliseconds'] <= 1_200_000, result
          assert result['providerClientCount'] == 0, result
          assert result['providerHttpCallCount'] == 0, result
          assert result['productionWriteCommandCount'] == 0, result
          assert result['skippedCases'] == 0, result
          PY

name: Protect canonical config recovery

on:
  workflow_dispatch:
  push:
    branches: [legend/approved-changes]
    paths:
      - '.github/workflows/protect-canonical-config-recovery.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: protect-canonical-config-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      EXPECTED_PROTECT_SHA: 87eb0f87c487f29d804eaa853dfef50f288ef36b
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Synchronize canonical Founder UPN only
        shell: bash
        run: |
          set -euo pipefail
          portal=/tmp/portal-settings.json
          protect=/tmp/protect-settings.json
          az webapp config appsettings list -g masterapp-rg -n masterapp-portal -o json > "$portal"
          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect"

          read_value() {
            local file="$1"; shift
            local key value
            for key in "$@"; do
              value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | (.value // empty)' "$file" | head -n 1)"
              if [ -n "$value" ]; then printf '%s' "$value"; return 0; fi
            done
            return 1
          }

          founder_upn="$(read_value "$portal" Founder__Upn 'Founder:Upn')"
          [ -n "$founder_upn" ]
          echo "::add-mask::$founder_upn"

          protect_upn="$(read_value "$protect" Founder__Upn 'Founder:Upn' || true)"
          if [ "$protect_upn" != "$founder_upn" ]; then
            az webapp config appsettings set \
              -g masterapp-rg \
              -n masterapp-protect \
              --settings "Founder__Upn=$founder_upn" \
              --output none
            echo "Protect canonical Founder UPN synchronized from AgentPortal."
          else
            echo "Protect canonical Founder UPN already matched AgentPortal."
          fi

          az webapp config appsettings list -g masterapp-rg -n masterapp-protect -o json > "$protect"
          verified="$(read_value "$protect" Founder__Upn 'Founder:Upn')"
          [ "$verified" = "$founder_upn" ]

      - name: Verify existing Protect analytics release becomes healthy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          expected=os.environ['EXPECTED_PROTECT_SHA']
          url='https://masterapp-protect.azurewebsites.net/api/runtime-provenance?release='+expected
          end=time.monotonic()+600
          last=None
          while time.monotonic()<end:
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      payload=json.load(response)
                  actual=payload.get('sourceRevision')
                  print(json.dumps({'status':200,'sourceRevision':actual}))
                  if actual==expected:
                      raise SystemExit(0)
                  last='unexpected revision '+str(actual)
              except urllib.error.HTTPError as error:
                  last='HTTP '+str(error.code)
                  print(json.dumps({'status':error.code}))
              except Exception as error:
                  last=type(error).__name__
                  print(json.dumps({'error':last}))
              time.sleep(5)
          raise SystemExit('Protect did not recover the existing deployed revision: '+str(last))
          PY

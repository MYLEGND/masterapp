name: Build and deploy AgentPortal to Azure Web App - masterapp-portal

on:
  push:
    branches:
      - production
    paths:
      - 'AgentPortal/**'
      - 'Infrastructure/**'
      - 'Application/**'
      - 'Domain/**'
      - 'Shared/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.github/workflows/meta-authority-cleanup_masterapp-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'
  PROJECT_PATH: AgentPortal/AgentPortal.csproj
  EF_PROJECT: Infrastructure/Infrastructure.csproj
  EF_CONTEXT: MasterAppDbContext
  PUBLISH_DIR: ${{ github.workspace }}\\publish\\agentportal

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore AgentPortal
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build AgentPortal
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish AgentPortal
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Verify packaged FFmpeg runtime
        shell: pwsh
        run: |
          $ffmpeg = Join-Path '${{ env.PUBLISH_DIR }}' 'tools/ffmpeg/ffmpeg.exe'
          $ffprobe = Join-Path '${{ env.PUBLISH_DIR }}' 'tools/ffmpeg/ffprobe.exe'
          if (-not (Test-Path $ffmpeg)) { throw "Missing packaged ffmpeg.exe" }
          if (-not (Test-Path $ffprobe)) { throw "Missing packaged ffprobe.exe" }

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentportal-production
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  migrate:
    runs-on: windows-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Restore EF projects
        run: |
          dotnet restore "${{ env.EF_PROJECT }}"
          dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build EF startup project
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database connection securely
        shell: pwsh
        run: |
          $connection = ''

          $rawConnections = az webapp config connection-string list `
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' `
            --name '${{ env.AZURE_WEBAPP_NAME }}' `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read App Service connection strings.' }

          $connections = $rawConnections | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match -and -not [string]::IsNullOrWhiteSpace([string]$match.value)) {
            $connection = [string]$match.value
          }

          if ([string]::IsNullOrWhiteSpace($connection)) {
            $rawSettings = az webapp config appsettings list `
              --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' `
              --name '${{ env.AZURE_WEBAPP_NAME }}' `
              --output json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read App Service settings.' }

            $settings = @{}
            foreach ($item in ($rawSettings | ConvertFrom-Json)) {
              $settings[[string]$item.name] = [string]$item.value
            }

            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
                $connection = $settings[$name]
                break
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($connection)) {
            throw 'Production MasterAppDb connection string could not be resolved from Azure App Service configuration.'
          }

          if ($connection -notmatch '(?i)(server=tcp:|\.database\.windows\.net|initial catalog=)') {
            throw 'Resolved MasterAppDb is not recognized as the production SQL Server connection.'
          }

          Write-Output "::add-mask::$connection"
          "ConnectionStrings__MasterAppDb=$connection" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EF_FORCE_SQLSERVER=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOTNET_ENVIRONMENT=Development" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPNETCORE_ENVIRONMENT=Development" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply production EF migrations
        shell: pwsh
        run: |
          dotnet tool run dotnet-ef database update `
            --project '${{ env.EF_PROJECT }}' `
            --startup-project '${{ env.PROJECT_PATH }}' `
            --context '${{ env.EF_CONTEXT }}' `
            --configuration Release `
            --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Production EF migration update failed.' }

      - name: Verify zero pending production migrations
        shell: pwsh
        run: |
          $output = dotnet tool run dotnet-ef migrations list `
            --project '${{ env.EF_PROJECT }}' `
            --startup-project '${{ env.PROJECT_PATH }}' `
            --context '${{ env.EF_CONTEXT }}' `
            --configuration Release `
            --no-build 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw 'Unable to verify production migrations.' }
          $output | Write-Host
          if (($output -join "`n") -match '\(Pending\)') {
            throw 'Production database still has pending EF migrations after update.'
          }

  deploy:
    runs-on: windows-latest
    needs:
      - build
      - migrate
    environment:
      name: Production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: agentportal-production
          path: ./package

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./package

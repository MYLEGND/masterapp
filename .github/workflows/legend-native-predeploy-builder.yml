name: LEGEND native predeploy builder

on:
  push:
    branches:
      - fix/legend-native-context-reasoning-20260827
    paths:
      - .github/workflows/legend-native-predeploy-builder.yml

permissions:
  contents: write
  id-token: write

env:
  AZURE_WEBAPP_NAME: masterapp-portal
  AZURE_RESOURCE_GROUP: masterapp-rg
  DOTNET_VERSION: '10.x'

jobs:
  build-test-live-proof-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Production

    steps:
      - name: Checkout unpublished candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/legend-native-context-reasoning-20260827
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Apply canonical native-context reasoning advancement
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          curriculum = 'Infrastructure/Messaging/LegendConnectCurriculum.cs'
          replace_once(
              curriculum,
              '''    internal async Task<LegendSemanticTransitionInference> TryInferComposedSemanticTransitionAsync(\n        string sourceLanguageCode,\n        string input,\n        LegendConnectDiscourseStateSnapshot? discourseState,\n        CancellationToken cancellationToken = default)\n''',
              '''    internal async Task<LegendSemanticTransitionInference> TryInferComposedSemanticTransitionAsync(\n        string sourceLanguageCode,\n        string input,\n        IReadOnlyList<LegendConnectConversationContextItem> context,\n        LegendConnectDiscourseStateSnapshot? discourseState,\n        CancellationToken cancellationToken = default)\n''')
          replace_once(
              curriculum,
              '''            sourceLanguageCode,\n            input,\n            [],\n            discourseState,\n            requireComposedGraph: true,\n''',
              '''            sourceLanguageCode,\n            input,\n            context,\n            discourseState,\n            requireComposedGraph: true,\n''')
          replace_once(
              curriculum,
              '''            IReadOnlyList<GroundedContextFrame> contextFrames;\n            if (discourseState is not null)\n            {\n                contextFrames = ResolveGroundedContextFramesFromDiscourseState(\n                    discourseState, observations);\n            }\n            else\n            {\n                contextFrames = await ResolveGroundedContextFramesAsync(\n                    language, context, observations, cancellationToken);\n            }\n            candidates = BindCandidatesFromGroundedContext(partialCandidates, contextFrames);\n''',
              '''            // Durable discourse is the canonical persisted memory, while the\n            // request context is the canonical caller-supplied conversation window.\n            // They are complementary evidence views of the same conversation, not\n            // competing authorities. Merge both through the existing grounded-frame\n            // resolver so a missing/partial persisted turn cannot make LEGEND forget\n            // context that the serving request already supplied. Duplicate frames are\n            // harmless because BindCandidatesFromGroundedContext canonicalizes the\n            // resulting variable bindings before selecting a transition.\n            var contextFrames = new List<GroundedContextFrame>();\n            if (discourseState is not null)\n            {\n                contextFrames.AddRange(ResolveGroundedContextFramesFromDiscourseState(\n                    discourseState, observations));\n            }\n            contextFrames.AddRange(await ResolveGroundedContextFramesAsync(\n                language, context, observations, cancellationToken));\n            candidates = BindCandidatesFromGroundedContext(partialCandidates, contextFrames);\n''')

          operations = 'Infrastructure/Messaging/LegendConnectOperations.cs'
          replace_once(
              operations,
              '''        var composed = await Curriculum.TryInferComposedSemanticTransitionAsync(\n            "en", input ?? string.Empty, discourseState, cancellationToken);\n''',
              '''        var composed = await Curriculum.TryInferComposedSemanticTransitionAsync(\n            "en", input ?? string.Empty, context, discourseState, cancellationToken);\n''')

          deploy = '.github/workflows/agentportal-production-deploy.yml'
          replace_once(
              deploy,
              '''    timeout-minutes: 45\n    permissions:\n      contents: read\n\n    steps:\n''',
              '''    timeout-minutes: 45\n    environment:\n      name: Production\n    permissions:\n      contents: read\n      id-token: write\n\n    steps:\n''')
          replace_once(
              deploy,
              '''      - name: Database migration validation\n''',
              '''      - name: Login to Azure for unpublished LEGEND live proof\n        uses: azure/login@v2\n        with:\n          client-id: ${{ secrets.AZURE_CLIENT_ID }}\n          tenant-id: ${{ secrets.AZURE_TENANT_ID }}\n          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}\n\n      - name: Prove unpublished LEGEND candidate against live Founder data with OpenAI blocked\n        shell: pwsh\n        run: ./scripts/legend-production-native-proof.ps1\n\n      - name: Database migration validation\n''')
          '@ | python3

          @'
          param()
          $ErrorActionPreference = 'Stop'

          $webapp = if ($env:AZURE_WEBAPP_NAME) { $env:AZURE_WEBAPP_NAME } else { 'masterapp-portal' }
          $resourceGroup = if ($env:AZURE_RESOURCE_GROUP) { $env:AZURE_RESOURCE_GROUP } else { 'masterapp-rg' }

          $connection = ''
          $rawConnections = az webapp config connection-string list `
            --resource-group $resourceGroup `
            --name $webapp `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read production App Service connection strings.' }
          $connections = $rawConnections | ConvertFrom-Json
          $match = $connections | Where-Object { $_.name -eq 'MasterAppDb' } | Select-Object -First 1
          if ($null -ne $match -and -not [string]::IsNullOrWhiteSpace([string]$match.value)) {
            $connection = [string]$match.value
          }

          $rawSettings = az webapp config appsettings list `
            --resource-group $resourceGroup `
            --name $webapp `
            --output json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read production App Service settings.' }
          $settings = @{}
          foreach ($item in ($rawSettings | ConvertFrom-Json)) {
            $settings[[string]$item.name] = [string]$item.value
          }

          if ([string]::IsNullOrWhiteSpace($connection)) {
            foreach ($name in @('ConnectionStrings__MasterAppDb','MasterAppDb','SQLCONNSTR_MasterAppDb')) {
              if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
                $connection = $settings[$name]
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw 'Production MasterAppDb connection string could not be resolved.' }
          if ($connection -notmatch '(?i)(server=tcp:|\.database\.windows\.net|initial catalog=)') {
            throw 'Resolved MasterAppDb is not recognized as production SQL Server.'
          }

          $founderOid = ''
          foreach ($name in @('FOUNDER_OID','Founder__Oid','Founder:Oid')) {
            if ($settings.ContainsKey($name) -and -not [string]::IsNullOrWhiteSpace($settings[$name])) {
              $founderOid = $settings[$name]
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($founderOid)) { throw 'Production Founder OID could not be resolved.' }

          Write-Output "::add-mask::$connection"
          Write-Output "::add-mask::$founderOid"
          $env:LEGEND_PRODUCTION_READONLY_CONNECTION = $connection
          $env:LEGEND_PRODUCTION_READONLY_FOUNDER_OID = $founderOid
          $env:LEGEND_PRODUCTION_READONLY_EXPECT_NATIVE = 'true'
          $env:OPENAI_API_KEY = ''
          $env:OpenAI__ApiKey = ''

          New-Item -ItemType Directory -Force diagnostics | Out-Null
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build `
            --filter 'FullyQualifiedName~LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyEightPromptNativeDiagnostic' `
            --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath diagnostics/predeploy-native.txt
          if ($LASTEXITCODE -ne 0) { throw 'Live Founder native-only 8-prompt proof failed.' }

          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build `
            --filter 'FullyQualifiedName~LegendFounderCurriculumSqlServerE2ETests.ProductionReadOnlyV21ShadowRebuild_UsesLiveFounderEvidenceWithoutWrites' `
            --logger 'console;verbosity=detailed' 2>&1 | Tee-Object -FilePath diagnostics/predeploy-shadow.txt
          if ($LASTEXITCODE -ne 0) { throw 'Live Founder V21 read-only shadow proof failed.' }

          Write-Host 'LEGEND LIVE PREDEPLOY PROOF: PASS'
          Write-Host 'OPENAI: BLOCKED'
          Write-Host 'PRODUCTION WRITES: BLOCKED BY READ-ONLY CONNECTION + COMMAND INTERCEPTOR'
          '@ | Set-Content -Path scripts/legend-production-native-proof.ps1 -Encoding utf8

          git rm .github/workflows/legend-native-predeploy-builder.yml
          git diff --check

      - name: Restore
        run: dotnet restore MASTERAPP.sln

      - name: Build release with zero warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet build MASTERAPP.sln -c Release --no-restore 2>&1 | tee build.log
          grep -qE '^[[:space:]]*0 Warning\(s\)' build.log

      - name: Run full AgentPortal regression suite
        shell: bash
        run: |
          set -o pipefail
          dotnet test AgentPortal.Tests/AgentPortal.Tests.csproj -c Release --no-build 2>&1 | tee test.log
          if grep -qE 'Failed:[[:space:]]*[1-9][0-9]*' test.log; then exit 1; fi
          grep -Eq 'Passed![[:space:]]+-[[:space:]]+Failed:[[:space:]]+0,[[:space:]]+Passed:[[:space:]]+[1-9][0-9]*|Test Run Successful' test.log

      - name: Login to Azure for live Founder proof
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run live Founder database proof with OpenAI blocked
        shell: pwsh
        run: ./scripts/legend-production-native-proof.ps1

      - name: Commit only the proven canonical advancement
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Infrastructure/Messaging/LegendConnectCurriculum.cs \
                  Infrastructure/Messaging/LegendConnectOperations.cs \
                  .github/workflows/agentportal-production-deploy.yml \
                  scripts/legend-production-native-proof.ps1 \
                  .github/workflows/legend-native-predeploy-builder.yml
          git commit -m 'Advance LEGEND native contextual reasoning and predeploy proof'
          git push origin HEAD:fix/legend-native-context-reasoning-20260827

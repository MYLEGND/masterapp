name: Commerce migration snapshot validation
on:
  push:
    branches:
      - repair/commerce-migration-snapshot-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Build migration startup project
        run: dotnet build AgentPortal/AgentPortal.csproj -c Release --nologo -warnaserror
      - name: Restore EF tool
        run: dotnet tool restore
      - name: Verify EF model matches migration snapshot
        env:
          ConnectionStrings__MasterAppDb: Server=127.0.0.1;Database=masterapp_ef_design_time;Integrated Security=true;TrustServerCertificate=true;Encrypt=false
          EF_FORCE_SQLSERVER: "true"
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project Infrastructure/Infrastructure.csproj             --startup-project AgentPortal/AgentPortal.csproj             --context MasterAppDbContext             --configuration Release             --no-build
      - name: Generate idempotent migration script
        env:
          ConnectionStrings__MasterAppDb: Server=127.0.0.1;Database=masterapp_ef_design_time;Integrated Security=true;TrustServerCertificate=true;Encrypt=false
          EF_FORCE_SQLSERVER: "true"
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool run dotnet-ef migrations script --idempotent             --project Infrastructure/Infrastructure.csproj             --startup-project AgentPortal/AgentPortal.csproj             --context MasterAppDbContext             --configuration Release             --no-build             -o /tmp/commerce-migration.sql
          grep -q 'CommerceBusinessId' /tmp/commerce-migration.sql
